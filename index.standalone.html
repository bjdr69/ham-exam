<style>

* { margin: 0; padding: 0; box-sizing: border-box; }
body {

.header p { color: var(--text2); font-size: 0.85rem; margin-top: 4px; }

/* Stats */
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 12px 0; }
.stat-card {

/* Buttons */
.btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; padding: 16px; border: none; border-radius: var(--radius);
  font-size: 1rem; font-weight: 600; cursor: pointer;

}

.btn-primary { background: var(--primary); color: #fff; }
.btn-accent { background: var(--accent); color: #fff; }
.btn-outline { background: var(--surface); color: var(--text); border: 1.5px solid var(--border); }
.btn-danger { background: var(--wrong); color: #fff; }

.btn-group { display: flex; flex-direction: column; gap: 12px; margin-top: 16px; }

  background: var(--surface); border-bottom: 1px solid var(--border);

}
.exam-bar .back { font-size: 1.2rem; cursor: pointer; padding: 2px 6px; color: var(--text2); }
.exam-bar .progress-text { font-size: 0.8rem; color: var(--text2); flex: 1; }
.exam-bar .score { font-size: 0.85rem; font-weight: 600; color: var(--primary); }
.progress-track {
  height: 4px; background: var(--surface2); border-radius: 2px; overflow: hidden;

.progress-fill { height: 100%; background: var(--primary); transition: width 0.3s; }

.question-card {
  background: var(--surface); border-radius: var(--radius);

}

.question-meta { font-size: 0.7rem; color: var(--text2); margin-bottom: 8px; }

}
.option:active { transform: scale(0.98); }
.option.selected { border-color: var(--primary); background: var(--primary-light); }
.option.correct { border-color: var(--correct); background: var(--correct-bg); }

.option.wrong .letter { background: var(--wrong); color: #fff; }

  border-left: 3px solid var(--primary);

.explanation .exp-label { font-weight: 700; color: var(--primary); margin-right: 6px; }
.explanation.detail { margin-top: 8px; border-left-color: var(--text2); }
.explanation.detail .exp-label { color: var(--text2); }

/* Submit / Next */
.exam-actions { margin-top: 10px; display: flex; gap: 8px; }
.exam-actions .btn { flex: 1; padding: 10px; font-size: 0.9rem; }

/* Result */
.result-card {
  background: var(--surface); border-radius: var(--radius);
  padding: 24px; text-align: center; border: 1px solid var(--border);
}
.result-score { font-size: 3rem; font-weight: 800; }

.result-list { text-align: left; margin-top: 16px; }
.result-item {

/* Theme toggle */
.theme-toggle {
  position: fixed; top: calc(12px + var(--safe-top)); right: 12px; z-index: 100;

.modal-overlay {

/* Empty state */

.empty .icon { font-size: 3rem; margin-bottom: 12px; }

/* Scrollable area */
.scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
</style>

window.__HAM_EMBEDDED__ = {"questions":[{"id":"MC2-0001","category":"1.1.1","categoryName":"无线电管理法规","type":"MC2","selectCount":2,"question":"我国专门针对无线电管理的行政法规及其制定机构是：","options":{"A":"《中华人民共和国无线电管理条例》","B":"《中华人民共和国无线电管理办法》","C":"国务院和中央军委","D":"工业和信息化部"},"answer":"AC","explanation":"《中华人民共和国无线电管理条例》是我国专门管理无线电的行政法规，由国务院和中央军委联合制定，故选AC。B名称错（应为《条例》），D工信部只制定部门规章。记忆：条例=行政法规，国务院和中央军委联合发布。"},{"id":"MC2-0002","category":"1.1.1","categoryName":"无线电管理法规","type":"MC2","selectCount":2,"question":"我国专门针对业余无线电台的管理文件及其制定机构分别是：","options":{"A":"《业余无线电台管理办法》","B":"《业余无线电台管理暂行规定》","C":"工业和信息化部","D":"国务院"},"answer":"AC","explanation":"业余电台的专门管理文件是《业余无线电台管理办法》，属部门规章，由工业和信息化部制定，故AC。B《暂行规定》是早期旧名，D国务院不制定部门规章。记忆：办法=工信部定，条例=国务院定，名字对号入座。"},{"id":"MC1-0003","category":"1.1.1","categoryName":"无线电管理法规","type":"MC1","selectCount":1,"question":"我国依法负责对业余无线电台实施监督管理的机构是：","options":{"A":"国家无线电管理机构和省、自治区、直辖市无线电管理机构","B":"在国家或地方民政部门注册的业余无线电协会","C":"国家体育管理机构和地方体育管理机构","D":"国家和地方公安部门"},"answer":"A","explanation":"业余电台的监督管理由国家无线电管理机构和省、自治区、直辖市无线电管理机构负责，选A。协会、体育、公安都不是法定监管机构。记忆：谁发执照谁监管，国家和省两级无线电管理机构说了算。"},{"id":"MC1-0004","category":"1.1.1","categoryName":"无线电管理法规","type":"MC1","selectCount":1,"question":"我国对无线电管理术语“业余业务”、“卫星业余业务”和“业余电台”做出具体定义的 法规文件是：","options":{"A":"《中华人民共和国无线电频率划分规定》","B":"《中华人民共和国无线电管理条例》","C":"《中华人民共和国电信条例》","D":"《无线电台执照管理规定》"},"answer":"A","explanation":"“业余业务”“业余电台”等术语的具体定义出自《中华人民共和国无线电频率划分规定》，故选A。B《条例》讲管理原则，C《电信条例》管电信业务，D只管执照。记忆：术语定义跟着频率划分走。"},{"id":"MC1-0005","category":"1.1.1","categoryName":"无线电管理法规","type":"MC1","selectCount":1,"question":"最新发布的《业余无线电台管理办法》自何时开始施行：","options":{"A":"自2024 年3 月1 日起施行","B":"自2024 年12 月1 日起施行","C":"自2025 年3 月1 日起施行","D":"自2025 年12 月1 日起施行"},"answer":"A","explanation":"新版《业余无线电台管理办法》自2024年3月1日起施行，选A。其他选项的年份（2024年12月、2025年）都是混淆项。记忆口诀：2024年3月1日，新办法正式生效。"},{"id":"MC1-0006","category":"1.1.2","categoryName":"无线电管理术语","type":"MC1","selectCount":1,"question":"将某个特定的频段列入频率划分表，规定该频段可在指定的条件下供一种或多种地面或 空间无线电通信业务或射电天文业务使用，这个过程称为：","options":{"A":"划分","B":"分配","C":"指配","D":"授权"},"answer":"A","explanation":"把频段列入频率划分表、规定供某类业务使用叫“划分”，选A。分配是分给部门/地区，指配是批给具体电台。记忆：划分给业务、分配给部门、指配给电台，从大到小三级。"},{"id":"MC1-0007","category":"1.1.2","categoryName":"无线电管理术语","type":"MC1","selectCount":1,"question":"将无线电频率或频道规定由一个或多个部门，在指定的区域内供地面或空间无线电通信 业务在指定条件下使用，这个过程称为：","options":{"A":"分配","B":"划分","C":"指配","D":"授权"},"answer":"A","explanation":"把频率规定给一个或多个部门在指定区域内使用叫“分配”，选A。划分针对业务、指配针对具体电台，本题主语是“部门”。记忆：划分→业务，分配→部门，指配→电台。"},{"id":"MC1-0008","category":"1.1.2","categoryName":"无线电管理术语","type":"MC1","selectCount":1,"question":"将无线电频率或频道批准给无线电台在规定条件下使用，这个过程称为：","options":{"A":"指配","B":"划分","C":"分配","D":"授权"},"answer":"A","explanation":"把频率或频道批准给具体无线电台使用叫“指配”，选A。划分给业务、分配给部门、指配给电台，本题落在“台”这一层。记忆：指配的“指”字像点名，点名叫到具体哪台。"},{"id":"MC1-0009","category":"1.1.2","categoryName":"无线电管理术语","type":"MC1","selectCount":1,"question":"在频率划分表中，一个频段被标明划分给多种业务时，这些业务被分为下述类别：","options":{"A":"主要业务和次要业务","B":"业余业务和非业余业务","C":"民用业务和军用业务","D":"安全业务和一般业务"},"answer":"A","explanation":"同一频段划分给多种业务时，分为主要业务和次要业务，选A。次要业务不得干扰主要业务是国际通行规则。记忆：有主有次，主业务优先、次业务让路。"},{"id":"MC1-0010","category":"1.1.2","categoryName":"无线电管理术语","type":"MC1","selectCount":1,"question":"辐射（radiation）是指任何源的能量流以无线电波的形式向外发出。正确的说法是：","options":{"A":"闪电产生的电磁波干扰是一种辐射","B":"沿电源线窜入接收机的差模干扰是一种辐射","C":"射频电路中变压器内磁芯里的磁场是一种辐射","D":"射频电路中电容器内极板间的电场是一种辐射"},"answer":"A","explanation":"辐射是能量以无线电波形式在空间向外发出，闪电的电磁波确实向外辐射，选A。B差模干扰沿导线传导，C变压器磁场、D电容电场都是局域场没射出去。记忆：“射出去”才是辐射。"},{"id":"MC1-0011","category":"1.1.2","categoryName":"无线电管理术语","type":"MC1","selectCount":1,"question":"发射（emission）是指：由无线电发信电台产生的辐射或辐射产物。正确的说法是：","options":{"A":"业余电台向周围发送的杂散产物是一种发射","B":"无线电接收机本地振荡器辐射的能量是一种发射","C":"医用高频电疗机向周围发送的无线电波能量是一种发射","D":"闪电产生的电磁波干扰是一种发射"},"answer":"A","explanation":"发射特指无线电发信电台产生的辐射，业余电台的杂散产物虽是发信台发出的，也算发射，选A。B接收机本振、C医疗电疗机、D闪电都不是发信台。记忆：发射=发信台发出的，杂散也算。"},{"id":"MC4-0012","category":"1.1.2","categoryName":"无线电管理术语","type":"MC4","selectCount":4,"question":"下列关于无线电的一般术语，说法正确的是：","options":{"A":"无线电测定是指利用无线电波的传播特性测定目标的位置、速度和/或其他特性，或获得 与这些参数有关的信息","B":"无线电导航是指用于导航（包括障碍物告警）的无线电测定","C":"无线电定位是指用于除无线电导航以外的无线电测定","D":"无线电测向是指利用接收无线电波来确定一个电台或目标的方向的无线电测定"},"answer":"ABCD","explanation":"ABCD四个定义都对：测定是测位置等参数，导航是用于导航的测定，定位是导航以外的测定，测向是定方向。四个概念层层包含。记忆：测定是总称，导航、定位、测向是分支。"},{"id":"MC1-0013","category":"1.1.2","categoryName":"无线电管理术语","type":"MC1","selectCount":1,"question":"关于业余无线电台，下列说法正确的是：","options":{"A":"业余无线电台是指为开展业余业务（含卫星业余业务）使用的一个或者多个发信机、收 信机，或者发信机与收信机的组合（包括附属设备）","B":"一个业余无线电台只能包含一个发信机","C":"一个业余无线电台只能包含一个收信机","D":"一个业余无线电台只能包含一个发信机和一个收信机"},"answer":"A","explanation":"业余电台指为开展业余业务（含卫星业余业务）使用的一个或多个发信机、收信机或其组合，选A。B/C/D说“只能包含一个”都错，数量不限。记忆：业余电台=设备组合，一个或多个都行。"},{"id":"MC1-0014","category":"1.1.2","categoryName":"无线电管理术语","type":"MC1","selectCount":2,"question":"关于业余业务、卫星业余业务，下列说法正确的是：","options":{"A":"业余业务是指供业余无线电爱好者进行自我训练、相互通信和技术研究的无线电通信业 务","B":"卫星业余业务是指利用地球卫星上的空间电台开展与业余业务相同目的的无线电通信业 务","C":"业余无线电爱好者可以在业余业务、卫星业余业务以及其他的无线电业务相互通信","D":"业余无线电台可以在业余业务、卫星业余业务以及其他的无线电业务进行通信"},"answer":"AB","explanation":"AB正确：业余业务用于自我训练、相互通信和技术研究；卫星业余业务用卫星开展同样目的。C/D错在业余电台不得用于其他无线电业务通信。记忆：业余台只干业余的活，别的业务不掺和。"},{"id":"MC2-0015","category":"1.1.2","categoryName":"无线电管理术语","type":"MC2","selectCount":2,"question":"关于业余无线电爱好者的定义，下列说法正确的是：","options":{"A":"业余无线电爱好者系指经正式批准的、对无线电技术有兴趣的人","B":"其兴趣纯系个人爱好而不涉及谋取利润","C":"其兴趣纯系个人爱好可涉及谋取利润","D":"只有成年人能成为业余无线电爱好者"},"answer":"AB","explanation":"业余爱好者是经正式批准的、对无线电技术有兴趣且纯属个人爱好、不谋取利润的人，故AB。C“可谋取利润”违背业余原则，D“只有成年人”无此限制。记忆：正式批准+纯爱好+不赚钱。"},{"id":"MC1-0016","category":"1.1.2","categoryName":"无线电管理术语","type":"MC1","selectCount":2,"question":"关于发射类别，下列说法正确的是：","options":{"A":"是指用标准符号标示的某发射的一组特性","B":"标示的特性包含主载波调制方式，调制信号，被发送信息的类型以及其他适用的信号特 性","C":"一个业余无线电台只能包含一个收信机","D":"一个业余无线电台只能包含一个发信机和一个收信机"},"answer":"AB","explanation":"发射类别是用标准符号标示某发射的一组特性，含调制方式、被发送信息类型等，故AB。C/D讲电台设备组成，是无关干扰项。记忆：发射类别=给信号贴标签，说明怎么调制、发什么。"},{"id":"MC1-0017","category":"1.1.2","categoryName":"无线电管理术语","type":"MC1","selectCount":1,"question":"关于单边带发射，下列说法正确的是：","options":{"A":"单边带发射是只传送一个边带的调幅发射","B":"单边带发射是只传送一个边带的调频发射","C":"单边带发射是不传送载波的调幅发射","D":"单边带发射是不传送载波的调频发射"},"answer":"A","explanation":"单边带是只传送一个边带的调幅发射，选A。它本质仍是调幅而非调频（排除B/D），C“不传送载波”不是定义要点。记忆：SSB=只发半边，底子还是AM调幅。"},{"id":"MC3-0018","category":"1.1.2","categoryName":"无线电管理术语","type":"MC3","selectCount":3,"question":"关于干扰的定义，下列说法正确的是：","options":{"A":"由于一种或多种发射、辐射、感应或其组合所产生的无用能量对无线电通信系统的接收 产生的影响","B":"表现为性能下降、误解或信息丢失","C":"若不存在这种无用能量，则此后果可以避免","D":"不会对无线电通信系统的接收产生的影响"},"answer":"ABC","explanation":"ABC正确：干扰是发射、辐射、感应等产生的无用能量对接收的影响，表现为性能下降、误解或信息丢失，没这种能量后果可避免。D说“不会产生影响”与定义相反。记忆：干扰=无用能量捣乱。"},{"id":"MC2-0019","category":"1.1.2","categoryName":"无线电管理术语","type":"MC2","selectCount":2,"question":"关于有害干扰的定义，下列说法正确的是：","options":{"A":"危害无线电导航或其他安全业务的正常运行的干扰","B":"严重地损害、阻碍、或一再阻断按规定正常开展的无线电通信业务的干扰","C":"产生有害干扰不会受到处罚","D":"使用业余无线电台时，只要不对其他业余无线电台产生干扰即可"},"answer":"AB","explanation":"有害干扰指危害无线电导航或安全业务、或严重损害阻碍阻断正常通信的干扰，故AB。C说产生有害干扰不受处罚错，D只约束对业余台的干扰也错。记忆：害导航+害通信，必受处罚。"},{"id":"MC3-0020","category":"1.1.2","categoryName":"无线电管理术语","type":"MC3","selectCount":3,"question":"关于次要业务台站，下列说法正确的是：","options":{"A":"不得对业经指配或将来可能指配频率的主要业务电台产生有害干扰","B":"不得对来自业经指配或将来可能指配频率的主要业务电台的有害干扰提出保护要求","C":"可要求保护不受来自将来可能指配频率的同一业务或其他次要业务电台的有害干扰","D":"使用业余无线电台时，只要不对其他业余无线电台产生干扰即可"},"answer":"ABC","explanation":"ABC正确：次要业务台不得干扰主要业务台，也不能要求主要业务台保护，但可要求同业务或次要业务台间相互保护。D是多余干扰项。记忆：次要让主，同级互保。"},{"id":"MC1-0021","category":"1.1.2","categoryName":"无线电管理术语","type":"MC1","selectCount":1,"question":"协调国际无线电管理的国际组织是：","options":{"A":"国际电信联盟","B":"国际业余无线电联盟","C":"联合国大会","D":"联合国科教文组织"},"answer":"A","explanation":"国际电信联盟（ITU）负责协调全球无线电频率与管理，选A。B国际业余无线电联盟（IARU）是业余组织，C联合国大会、D教科文组织不管频率。记忆：全球无线电找ITU。"},{"id":"MC1-0022","category":"1.1.2","categoryName":"无线电管理术语","type":"MC1","selectCount":1,"question":"国际业余无线电联盟支持会员协会在发展业余无线电时把它看成一种：","options":{"A":"国家资源","B":"拉动经济的措施","C":"休闲娱乐手段","D":"国防后备队伍"},"answer":"A","explanation":"IARU主张把业余无线电看作“国家资源”，因其培养技术人才、服务应急通信，选A。B/C/D的赚钱、休闲、后备军都不是其定位。记忆：业余无线电是国家资源。"},{"id":"MC1-0023","category":"1.1.2","categoryName":"无线电管理术语","type":"MC1","selectCount":1,"question":"下述通信不属于电信（telecommunication）范畴：","options":{"A":"邮政通信","B":"有线通信","C":"无线电通信","D":"光通信"},"answer":"A","explanation":"电信是借助电磁手段（有线、无线、光）传输信息，邮政通信是实物投递，不属于电信，选A。有线、无线电、光通信都属电信。记忆：电信=电子传送，邮政=跑腿送信。"},{"id":"MC1-0024","category":"1.1.2","categoryName":"无线电管理术语","type":"MC1","selectCount":1,"question":"关于无线电通信的正确说法：","options":{"A":"无线电通信是指利用无线电波进行的符号、信号、文字、图像、声音或其他信息的传输、 发射或接收","B":"无线电通信包括利用光在内的所有电磁波所进行的各种通信","C":"利用无线电波进行的符号、信号、文字、图像、声音以外的信息传输不属于无线电通信","D":"产生无线电波并用其加热属于无线电通信的一种应用"},"answer":"A","explanation":"无线电通信指利用无线电波进行符号、信号、文字、图像、声音或其他信息的传输、发射或接收，选A。B把光算进来太宽，C排除“其他信息”太窄，D加热不是通信。记忆：无线电波+传信息。"},{"id":"MC1-0025","category":"1.1.2","categoryName":"无线电管理术语","type":"MC1","selectCount":1,"question":"关于地面无线电通信（terrestrial radio communication）的正确说法是：","options":{"A":"航空通信属于地面无线电通信","B":"水上通信不属于地面无线电通信","C":"业余电台之间所进行的任何无线电通信都属于地面无线电通信","D":"依靠电离层反射的天波所进行的通信不属于地面无线电通信"},"answer":"A","explanation":"地面无线电通信是空间通信以外的无线电通信，航空通信属之，选A。B水上通信也属地面通信，C业余卫星通信属空间通信，D电离层天波仍是地面通信。记忆：除了卫星，都是地面通信。"},{"id":"MC1-0026","category":"1.1.2","categoryName":"无线电管理术语","type":"MC1","selectCount":1,"question":"无线电波是指：","options":{"A":"频率为3,000GHz 以下的在空间传播的电磁波","B":"频率为3,000GHz 以下的所有电磁波","C":"频率为30Hz 至30GHz 的在空间传播的电磁波","D":"频率为3,000Hz 至3,000MHz 的电磁波"},"answer":"A","explanation":"无线电波是频率3000GHz以下、在空间传播的电磁波，选A。B漏掉“在空间传播”，C/D频率范围错误。记忆：3000GHz上限+必须辐射出去，两条缺一不可。"},{"id":"MC3-0027","category":"1.2.1","categoryName":"业余电台执照","type":"MC3","selectCount":3,"question":"个人设置、使用业余无线电台应当向无线电管理机构提交的材料为：","options":{"A":"一份申请表","B":"身份证明复印件；申请人为未成年人的，还应当提交其监护人身份证明复印件，以及申 请人与监护人关系的说明材料","C":"无线电发射设备相关说明材料","D":"本人写的申请书，操作证书的原件、复印件"},"answer":"ABC","explanation":"个人设台提交申请表、身份证明（未成年人加监护人材料）、设备说明材料，即ABC。D不需要本人申请书和操作证书原件。记忆：个人设台三件套——申请表+身份+设备说明。"},{"id":"MC3-0028","category":"1.2.1","categoryName":"业余电台执照","type":"MC3","selectCount":3,"question":"单位设置、使用业余无线电台应当向无线电管理机构提交的材料为：","options":{"A":"一份申请表","B":"无线电发射设备相关说明材料","C":"单位营业执照等复印件，以及业余无线电台技术负责人为本单位工作人员的说明材料","D":"业余无线电台技术负责人写的申请书，操作证书的原件、复印件"},"answer":"ABC","explanation":"单位设台提交申请表、设备说明材料、营业执照复印件及技术负责人为本单位人员的说明，即ABC。D的申请书、操作证书原件是多余项。记忆：单位设台三件套——申请表+设备说明+营业执照/负责人说明。"},{"id":"MC4-0029","category":"1.2.1","categoryName":"业余电台执照","type":"MC4","selectCount":4,"question":"设置、使用业余无线电台，下列哪些条件符合规定：","options":{"A":"使用的无线电发射设备依法取得型号核准","B":"型号核准证载明的频率范围包含业余业务频段","C":"使用的自制、改装、拼装等未取得型号核准的无线电发射设备符合国家标准和国家无线 电管理规定","D":"使用的自制、改装、拼装等未取得型号核准的无线电发射设备的无线电发射频率范围仅 限于业余业务频段"},"answer":"ABCD","explanation":"ABCD都符合：设备应依法型号核准且频率含业余频段；自制改装设备要符合国标且发射频率仅限业余频段。记忆：正规设备看型号核准，自制设备看国标+只限业余频段。"},{"id":"MC1-0030","category":"1.2.1","categoryName":"业余电台执照","type":"MC1","selectCount":1,"question":"设置、使用业余无线电台拟使用自制、改装、拼装等未取得型号核准的无线电发射设备 的，无线电管理机构开展对该设备进行技术检测时：","options":{"A":"不得收取任何费用","B":"收取技术检测费","C":"根据业余无线电台类型进行收费","D":"根据爱好者操作类别进行收费"},"answer":"A","explanation":"对自制、改装、拼装设备进行技术检测，无线电管理机构不得收取任何费用，选A。B/C/D各种收费说法都是错的。记忆：检测免费，分文不取。"},{"id":"MC2-0031","category":"1.2.1","categoryName":"业余电台执照","type":"MC2","selectCount":2,"question":"设置、使用15 瓦以上短波业余无线电台以及涉及国家主权、安全的其他重要业余无线电 台的，下列说法正确的是：","options":{"A":"由国家无线电管理机构作出许可决定","B":"可以委托电台所在地或者申请人住所地的省、自治区、直辖市无线电管理机构对业余无 线电台的使用方式、技术条件、安装环境等进行现场核查","C":"由省、自治区、直辖市无线电管理机构作出许可决定","D":"持有A 类业余无线电台操作技术能力验证证书即可申请"},"answer":"AB","explanation":"15瓦以上短波业余台及涉及国家主权安全的台，由国家无线电管理机构作出许可决定，并可委托省级机构现场核查，故AB。C省级决定错，D与A类证书无关。记忆：功率大、涉主权，国家亲自批。"},{"id":"MC4-0032","category":"1.2.1","categoryName":"业余电台执照","type":"MC4","selectCount":4,"question":"业余无线电台执照载明了哪些事项：","options":{"A":"电台设置、使用人，操作技术能力类别、编号","B":"电台呼号、台址/设置区域、使用频率、发射功率","C":"执照编号、颁发日期、有效期、发证机关，以及特别规定事项","D":"业余中继台、业余信标台执照还应当载明工作模式等事项"},"answer":"ABCD","explanation":"ABCD都是执照载明事项：使用人及操作类别、呼号台址频率功率、执照编号有效期发证机关，中继台信标台还要载明工作模式。记忆：执照=电台的身份证，信息齐全。"},{"id":"MC1-0033","category":"1.2.1","categoryName":"业余电台执照","type":"MC1","selectCount":1,"question":"业余无线电台执照的有效期不超过：","options":{"A":"5 年","B":"1 年","C":"2 年","D":"3 年"},"answer":"A","explanation":"业余无线电台执照有效期不超过5年，选A。1年、2年、3年都是干扰项。记忆：执照有效期5年，记住“5”这个数。"},{"id":"MC3-0034","category":"1.2.1","categoryName":"业余电台执照","type":"MC3","selectCount":3,"question":"关于业余无线电台执照，下列说法正确的是：","options":{"A":"业余无线电台执照可以采用纸质或者电子形式","B":"纸质或者电子业余无线电台执照具有同等法律效力","C":"执照样式由国家无线电管理机构统一规定","D":"业余无线电台执照终身有效"},"answer":"ABC","explanation":"ABC正确：执照可用纸质或电子形式且效力相同，样式由国家无线电管理机构统一规定。D“终身有效”错，有效期不超5年。记忆：电子照=纸质照，效力相同，寿命5年。"},{"id":"MC2-0035","category":"1.2.1","categoryName":"业余电台执照","type":"MC2","selectCount":2,"question":"关于新版《业余无线电台管理办法》，下列说法正确的是：","options":{"A":"新版《办法》施行前依法取得业余无线电台执照的，在执照有效期内可以按照执照载明 的参数使用业余无线电台","B":"2012 年11 月5 日公布的《业余无线电台管理办法》（工业和信息化部令第22 号）同时 废止","C":"新版《办法》自2025 年3 月1 日起施行","D":"新版《办法》施行前依法取得业余无线电台执照的，在执照有效期内需按照新版《办法》 使用业余无线电台"},"answer":"AB","explanation":"AB正确：新版办法施行前取得的执照在有效期内按原载明参数使用；2012年工信部令第22号同时废止。C施行日期错（应为2024年3月1日），D与A矛盾。记忆：老执照用到期满，新令2024年3月1日登场。"},{"id":"MC1-0036","category":"1.2.1","categoryName":"业余电台执照","type":"MC1","selectCount":1,"question":"独立操作具有发信功能业余无线电台的年龄条件是：","options":{"A":"具备《业余无线电台操作证书》者操作业余无线电台不受年龄限制","B":"年满十四周岁","C":"年满十六周岁","D":"年满十八周岁"},"answer":"A","explanation":"持有操作证书者操作业余电台不受年龄限制，选A。只要通过验证取得操作证书，老幼皆可独立操作，B/C/D的年龄限制都不成立。记忆：证书在手，年龄自由。"},{"id":"MC1-0037","category":"1.2.1","categoryName":"业余电台执照","type":"MC1","selectCount":1,"question":"个人申请设置、使用具有发信功能的业余无线电台的年龄条件是：","options":{"A":"未成年人可以申请设置、使用规定条件内的业余无线电台","B":"年满十四周岁","C":"年满十六周岁","D":"年满十八周岁"},"answer":"A","explanation":"未成年人也可以申请设置规定条件内的业余电台，选A。B/C/D“年满14/16/18岁”的限制都不存在。记忆：少年爱好者也能设台，年龄不设门槛。"},{"id":"MC1-0038","category":"1.2.1","categoryName":"业余电台执照","type":"MC1","selectCount":1,"question":"设置、使用有固定台址的业余无线电台，应当向哪个机构提出申请：","options":{"A":"电台所在地的省、自治区、直辖市无线电管理机构","B":"设台地的地方无线电民间机构","C":"中国无线电协会","D":"国家无线电管理机构"},"answer":"A","explanation":"设置固定台址的业余电台，向电台所在地的省、自治区、直辖市无线电管理机构申请，选A。记忆：台址在哪，就找哪里的省级无线电管理机构。"},{"id":"MC1-0039","category":"1.2.1","categoryName":"业余电台执照","type":"MC1","selectCount":1,"question":"设置、使用没有固定台址的业余无线电台，应当向哪个机构提出申请：","options":{"A":"申请人住所地的省、自治区、直辖市无线电管理机构","B":"申请人住所地的地方无线电民间机构","C":"中国无线电协会","D":"国家无线电管理机构"},"answer":"A","explanation":"没有固定台址的业余电台，向申请人住所地的省、自治区、直辖市无线电管理机构申请，选A。区别记忆：有台址看台址所在地，无台址看人的住所地。"},{"id":"MC3-0040","category":"1.2.1","categoryName":"业余电台执照","type":"MC3","selectCount":3,"question":"设置、使用业余无线电台，设置业余无线电台应当具备的条件有：","options":{"A":"熟悉无线电管理规定","B":"具有相应的操作技术能力，通过相应的操作技术能力验证","C":"使用的无线电发射设备依法取得型号核准，的自制、改装、拼装设备符合国家标准和国 家无线电管理规定","D":"加入指定协会、具备当地无线电管理机构规定的操作技术能力"},"answer":"ABC","explanation":"设台条件：熟悉无线电管理规定、通过相应操作技术能力验证、设备符合型号核准或国家规定，即ABC。D“加入指定协会”不是法定条件。记忆：懂规矩+有证书+设备合格，不强制入会。"},{"id":"MC1-0041","category":"1.2.2","categoryName":"业余电台操作证书","type":"MC1","selectCount":1,"question":"业余无线电台执照有效期届满后需要继续使用的，应当在下列期限内向作出许可决定的 无线电管理机构申请更换业余无线电台执照：","options":{"A":"期限届满30 个工作日前","B":"有效期届满半年之内","C":"有效期届满两个月之内","D":"有效期届满三个月之内"},"answer":"A","explanation":"执照期满需继续使用的，应在期限届满30个工作日前申请更换，选A。“30个工作日”是关键数字。记忆：提前30个工作日，别到期成了“黑台”。"},{"id":"MC1-0042","category":"1.2.2","categoryName":"业余电台操作证书","type":"MC1","selectCount":1,"question":"变更业余无线电台执照载明事项的，应当办理下列手续：","options":{"A":"及时向作出许可决定的无线电管理机构申请办理变更手续","B":"等执照有效期届满时向核发执照的无线电管理机构申请办理变更手续，换发业余无线电 台执照","C":"只要设备型号和产品序列号没有改变，不必申请办理变更手续","D":"只需向核发执照的无线电管理机构进行备案"},"answer":"A","explanation":"变更执照载明事项，应及时向作出许可决定的无线电管理机构申请变更，选A。B等期满才办、C设备没变不办、D只备案都不行。记忆：变了就改，及时找发证机关办变更。"},{"id":"MC1-0043","category":"1.2.2","categoryName":"业余电台操作证书","type":"MC1","selectCount":1,"question":"终止使用业余无线电台的，应向下列哪个机构办理业余无线电台执照注销手续：","options":{"A":"作出许可决定的无线电管理机构","B":"国家无线电管理机构","C":"中国无线电协会","D":"地方无线电管理机构所委托的其他单位"},"answer":"A","explanation":"终止使用业余电台的，向作出许可决定的无线电管理机构办理注销，选A。“谁许可、谁注销”。记忆：在哪办证就在哪注销，有始有终。"},{"id":"MC2-0044","category":"1.2.2","categoryName":"业余电台操作证书","type":"MC2","selectCount":2,"question":"关于终止使用业余无线电台的，下列说法正确的是：","options":{"A":"应当及时向作出许可决定的无线电管理机构办理业余无线电台执照注销手续","B":"交回执照并自执照注销之日起60 个工作日内拆除业余无线电台及天线等附属设备并妥 善处理","C":"交回执照并自执照注销之日起6 个月内拆除业余无线电台及天线等附属设备并妥善处理","D":"只需交回执照"},"answer":"AB","explanation":"终止使用电台要先向颁照机构办执照注销、交回执照，并自注销之日起60个工作日内拆除电台和天线。C的“6个月”期限错，D的“只交执照”不完整。记忆：注销后60个工作日拆完。"},{"id":"MC3-0047","category":"1.2.4","categoryName":"业余电台呼号","type":"MC3","selectCount":3,"question":"关于业余中继台的说法下列错误的是：","options":{"A":"通过对业余无线电信号接收和放大转发，扩大通联范围的业余无线电台","B":"通过发射信标信号，辅助验证电波传播条件的单发业余无线电台","C":"通过对业余无线电信号接收和衰减转发，缩小通联范围的业余无线电台","D":"通过接收信标信号，辅助验证电波传播条件的单发业余无线电台"},"answer":"BCD","explanation":"中继台是“接收并放大转发”以扩大通联范围的电台，A对。B说的是信标台，C“衰减转发缩小”方向反了，D是信标台说法。记忆：中继台=放大中转站，信标台=发信标探传播。"},{"id":"MC3-0048","category":"1.2.4","categoryName":"业余电台呼号","type":"MC3","selectCount":3,"question":"关于业余信标台的说法下列错误的是：","options":{"A":"通过发射信标信号，辅助验证电波传播条件的单发业余无线电台","B":"通过接收信标信号，辅助验证电波传播条件的单发业余无线电台","C":"通过对业余无线电信号接收和放大转发，扩大通联范围的业余无线电台","D":"通过对业余无线电信号接收和衰减转发，缩小通联范围的业余无线电台"},"answer":"BCD","explanation":"信标台是“发射信标信号”、帮助验证电波传播条件的单发电台，A对。B“接收信标”反了，C、D说的是中继台。记忆：信标台只发不收，中继台收转发。"},{"id":"MC2-0049","category":"1.2.4","categoryName":"业余电台呼号","type":"MC2","selectCount":2,"question":"关于业余中继台哪下列哪些选项正确：","options":{"A":"向其覆盖区域内的业余无线电台提供平等的服务","B":"台址布局应当符合资源共享、集约的要求","C":"仅设置申请人的团队成员优先使用，空闲时方供其他业余电台使用","D":"因中继台购买和维护需要成本，要求业余电台必须付费使用中继台"},"answer":"AB","explanation":"中继台要向覆盖区内所有业余电台平等提供服务，台址布局符合资源共享、集约要求，A、B对。C“团队优先”、D“收费”都违背公益共享原则。记忆：中继台是公共资源，平等免费。"},{"id":"MC4-0050","category":"1.2.4","categoryName":"业余电台呼号","type":"MC4","selectCount":4,"question":"关于设置业余中继台下列说法正确的是：","options":{"A":"台址布局应当符合资源共享、集约的要求","B":"应当向其覆盖区域内的业余无线电台提供平等的服务","C":"明确设台地点、使用频率、技术参数等设置、使用和运行维护要求并向社会公布","D":"业余中继台服务区域超出本行政区域的，应当与地方无线电管理机构做好协调"},"answer":"ABCD","explanation":"设置中继台四项都对：台址资源共享集约、服务平等、地点频率参数向社会公布、跨行政区与相关机构协调。记忆：平等、集约、公布、协调，四个关键词全选。"},{"id":"MC1-0051","category":"1.2.4","categoryName":"业余电台呼号","type":"MC1","selectCount":1,"question":"业余中继台的设置和技术参数等应满足下列关键条件：","options":{"A":"符合国家以及设台地的地方无线电管理机构的规定","B":"符合设台地的地方业余无线电民间组织的规划","C":"仅需符合设台地的地方无线电管理机构的规划及相关规定","D":"符合申请人关于设置中继台的客观需求和技术考虑"},"answer":"A","explanation":"中继台设置和技术参数须符合国家及设台地地方无线电管理机构的规定，A对。B“民间组织规划”、C“仅地方”、D“申请人需求”都不是法定依据。记忆：法定依据在国家与地方无线电管理机构。"},{"id":"MC1-0052","category":"1.3.1","categoryName":"业余电台频率","type":"MC1","selectCount":1,"question":"可以组织A 类和B 类业余无线电台操作技术能力验证的机构是：","options":{"A":"国家无线电管理机构和省、自治区、直辖市无线电管理机构","B":"省、自治区、直辖市无线电管理机构","C":"地方教育、体育机构及其相关民间组织","D":"地方业余无线电协会"},"answer":"A","explanation":"A类和B类验证由国家无线电管理机构和省、自治区、直辖市无线电管理机构组织，A对。C教育体育机构、D地方协会都无权组织。记忆：A、B类“省以上”就能办。"},{"id":"MC1-0053","category":"1.3.1","categoryName":"业余电台频率","type":"MC1","selectCount":1,"question":"负责组织C 类业余无线电台操作技术能力验证的机构是：","options":{"A":"国家无线电管理机构","B":"省、自治区、直辖市无线电管理机构","C":"国家无线电管理机构和省、自治区、直辖市无线电管理机构","D":"地方业余无线电协会"},"answer":"A","explanation":"C类验证只由国家无线电管理机构组织，A对。B仅省级不够格，C“国家加省级”和D协会都不对。记忆：级别越高，能组织的机构越少——C类只有国家。"},{"id":"MC1-0054","category":"1.3.1","categoryName":"业余电台频率","type":"MC1","selectCount":1,"question":"参加业余无线电台操作技术能力验证时，下列说法正确的是：","options":{"A":"不向参加验证的人员收取考试费用","B":"收取验证考试费","C":"根据爱好者操作类别进行收费","D":"根据业余无线电台类型进行收费"},"answer":"A","explanation":"参加操作技术能力验证不向考生收取费用，A对。B、C、D都是各种收费说法，与规定相悖。记忆：验证免费是硬性规定，见“收费”选项就排除。"},{"id":"MC1-0055","category":"1.3.1","categoryName":"业余电台频率","type":"MC1","selectCount":1,"question":"各类业余无线电台操作技术能力证明文件是：","options":{"A":"无线电管理机构颁发的“业余无线电台操作技术能力验证证书”","B":"中国无线电运动协会颁发的“业余无线电台操作证书”","C":"地方无线电协会或者其他业余无线电民间组织颁发的“业余无线电台操作证书”","D":"地方无线电协会或者其他业余无线电民间组织出具的盖有公章的证明信件"},"answer":"A","explanation":"证明文件是国家无线电管理机构颁发的“业余无线电台操作技术能力验证证书”，A对。B协会、C民间组织、D证明信都不是法定证书。记忆：认准“验证证书”四个字，国家机构颁发。"},{"id":"MC3-0056","category":"1.3.2","categoryName":"业余电台发射功率","type":"MC3","selectCount":3,"question":"国家无线电管理机构及其委托的机构可以组织实施如下类别的业余无线电台操作技术能 力验证：","options":{"A":"A 类业余无线电台操作技术能力验证","B":"B 类业余无线电台操作技术能力验证","C":"C 类业余无线电台操作技术能力验证","D":"一级个人业余电台操作证书"},"answer":"ABC","explanation":"国家无线电管理机构及其委托机构可组织实施A、B、C三类验证，A、B、C对。D“一级个人业余电台操作证书”是旧体系说法。记忆：国家能办A、B、C三类，没有“一级个人”。"},{"id":"MC3-0057","category":"1.3.2","categoryName":"业余电台发射功率","type":"MC3","selectCount":3,"question":"业余无线电台操作技术能力分为哪几类：","options":{"A":"A 类","B":"B 类","C":"C 类","D":"D 类"},"answer":"ABC","explanation":"操作技术能力只分A、B、C三类，A、B、C对。D类根本不存在。记忆：从A到C，类别逐级升高，记“没有D类”。"},{"id":"MC2-0058","category":"1.3.2","categoryName":"业余电台发射功率","type":"MC2","selectCount":2,"question":"不同类别业余无线电台的主要区别在于：","options":{"A":"允许工作的频率范围","B":"允许发射的最大发射功率","C":"所用业余无线电台设备的功能","D":"所用业余无线电台的天线高度和长度"},"answer":"AB","explanation":"各类别主要区别是允许工作的频率范围和最大发射功率，A、B对。C设备功能、D天线高度长度与类别无关。记忆：类别=“能上什么频段+能发多大功率”。"},{"id":"MC1-0059","category":"1.3.2","categoryName":"业余电台发射功率","type":"MC1","selectCount":1,"question":"A 类业余无线电台允许工作的频率范围和最大发射功率为：","options":{"A":"30-3000MHz 频段，不大于25 瓦","B":"各VHF 和UHF 频段，不大于50 瓦","C":"各业余业务和卫星业余业务频段，不大于15 瓦","D":"各VHF 和UHF 频段，不大于15 瓦"},"answer":"A","explanation":"A类可工作在30-3000MHz频段，最大发射功率不大于25瓦，A对。B“50瓦”、C/D“15瓦”或“HF频段”都不对。记忆：A类=VHF/UHF高频段、25瓦封顶。"},{"id":"MC1-0060","category":"1.3.2","categoryName":"业余电台发射功率","type":"MC1","selectCount":1,"question":"取得B 类业余无线电台操作技术能力验证证书的，可以申请设置、使用业余无线电台的 工作频段和最大发射功率为：","options":{"A":"30MHz 以下频段小于15 瓦，或30MHz 以上频段不大于25 瓦","B":"30MHz 以下频段不大于100 瓦，或30MHz 以上频段不大于25 瓦","C":"30MHz 以下频段不大于25 瓦，或30MHz 以上频段小于15 瓦","D":"30MHz 以下频段不大于25 瓦，或30MHz 以上频段不大于100 瓦"},"answer":"A","explanation":"B类：30MHz以下不大于15瓦，30MHz以上不大于25瓦，A对。B“100瓦”是老规定，C、D数字配反了。记忆：B类“上25、下15”——高频25瓦、短波15瓦。"},{"id":"MC1-0061","category":"1.3.2","categoryName":"业余电台发射功率","type":"MC1","selectCount":1,"question":"取得C 类业余无线电台操作技术能力验证证书的，可以申请设置、使用业余无线电台的 工作频段和最大发射功率为：","options":{"A":"30MHz 以下频段不大于1000 瓦，或30MHz 以上频段不大于25 瓦","B":"30MHz 以下频段不大于100 瓦，或30MHz 以上频段不大于25 瓦","C":"30MHz 以下频段不大于25 瓦，或30MHz 以上频段不大于15 瓦","D":"30MHz 以下频段不大于25 瓦，或30MHz 以上频段不大于1000 瓦"},"answer":"A","explanation":"C类：30MHz以下不大于1000瓦，30MHz以上不大于25瓦，A对。B“100瓦”配错，C、D数字颠倒。记忆：C类是顶配——短波可上1000瓦，VHF/UHF仍25瓦。"},{"id":"MC2-0062","category":"1.3.2","categoryName":"业余电台发射功率","type":"MC2","selectCount":2,"question":"参加A 类业余无线电台操作技术能力验证应当符合下列哪些要求：","options":{"A":"应当熟悉无线电管理规定","B":"具有一定的业余无线电台操作技术能力","C":"应当年满18 周岁","D":"应当年满16 周岁"},"answer":"AB","explanation":"参加A类验证要求熟悉无线电管理规定、具有一定操作技术能力，A、B对。C“年满18”、D“年满16”都不是参加验证的条件。记忆：A类只看“懂规定、会操作”，不卡年龄。"},{"id":"MC2-0063","category":"1.3.2","categoryName":"业余电台发射功率","type":"MC2","selectCount":2,"question":"参加B 类业余无线电台操作技术能力验证应当符合下列哪些要求：","options":{"A":"应当依法取得业余无线电台执照6 个月以上","B":"具有相应的实际操作经验","C":"应当年满18 周岁","D":"应当年满16 周岁"},"answer":"AB","explanation":"参加B类验证须已依法取得业余无线电台执照6个月以上，并有相应实际操作经验，A、B对。C、D的年龄要求不成立。记忆：B类要“持照满6个月+有实操经验”。"},{"id":"MC2-0064","category":"1.3.2","categoryName":"业余电台发射功率","type":"MC2","selectCount":2,"question":"参加C 类业余无线电台操作技术能力验证应当符合下列哪些要求：","options":{"A":"应当依法取得载明30MHz 以下频段的业余无线电台执照18 个月以上","B":"具有相应的实际操作经验","C":"应当依法取得载明30MHz 以下频段的业余无线电台执照6 个月以上","D":"应当依法取得载明30MHz 以下频段的业余无线电台执照12 个月以上"},"answer":"AB","explanation":"参加C类验证须已取得载明30MHz以下频段的执照18个月以上，并有实际操作经验，A、B对。C“6个月”、D“12个月”都不够。记忆：C类最严——HF执照满18个月。"},{"id":"MC2-0065","category":"1.3.2","categoryName":"业余电台发射功率","type":"MC2","selectCount":2,"question":"取得A 类业余无线电台操作技术能力验证证书的，可以申请设置、使用如下业余无线电 台:","options":{"A":"设置、使用最大发射功率不大于25 瓦VHF 频段业余无线电台","B":"设置、使用最大发射功率不大于25 瓦UHF 频段业余无线电台","C":"设置、使用最大发射功率不大于25 瓦HF 频段业余无线电台","D":"设置、使用最大发射功率不大于15 瓦HF 频段业余无线电台"},"answer":"AB","explanation":"A类证书可设置VHF、UHF频段不大于25瓦的电台，A、B对。C、D含HF频段都不行，A类只限30MHz以上。记忆：A类够不到短波，只能VHF/UHF 25瓦。"},{"id":"MC4-0066","category":"1.3.2","categoryName":"业余电台发射功率","type":"MC4","selectCount":4,"question":"取得B 类业余无线电台操作技术能力验证证书的，可以申请设置、使用如下业余无线电 台:","options":{"A":"设置、使用最大发射功率不大于25 瓦VHF 频段业余无线电台","B":"设置、使用最大发射功率不大于25 瓦UHF 频段业余无线电台","C":"设置、使用最大发射功率小于15 瓦HF 频段业余无线电台","D":"设置、使用最大发射功率小于1 瓦（e.i.r.p.）LF 频段业余无线电台"},"answer":"ABCD","explanation":"B类证书四种电台都可设：VHF、UHF各25瓦，HF小于15瓦，LF小于1瓦(e.i.r.p.)，A/B/C/D全对。记忆：B类“上到V/U各25瓦，下到短波15瓦、长波1瓦”。"},{"id":"MC4-0067","category":"1.3.2","categoryName":"业余电台发射功率","type":"MC4","selectCount":4,"question":"取得C 类业余无线电台操作技术能力验证证书的，可以申请设置、使用如下业余无线电 台:","options":{"A":"设置、使用最大发射功率不大于25 瓦VHF 频段业余无线电台","B":"设置、使用最大发射功率不大于25 瓦UHF 频段业余无线电台","C":"设置、使用最大发射功率不大于1000 瓦HF 频段业余无线电台","D":"因开展特殊技术试验、通联等活动确需设置、使用大于25 瓦VHF 频段业余无线电台"},"answer":"ABCD","explanation":"C类证书四种电台都可设：VHF、UHF各25瓦，HF不大于1000瓦，特殊技术试验确需也可超25瓦用VHF，A/B/C/D全对。记忆：C类顶配——短波1000瓦还享特殊试验特权。"},{"id":"MC2-0068","category":"1.3.2","categoryName":"业余电台发射功率","type":"MC2","selectCount":2,"question":"关于开展特殊技术试验、通联等活动，下列说法正确的是：","options":{"A":"开展特殊技术试验、通联等活动，确需超出业余无线电台执照载明的功率限值使用业余 无线电台的，需经颁发业余无线电台执照的无线电管理机构批准","B":"取得C 类业余无线电台操作技术能力验证证书且取得业余无线电台执照的人员，经批准 可临时在限定条件下开展电台操作","C":"取得B 类业余无线电台操作技术能力验证证书且取得业余无线电台执照的人员，经批准 可临时在限定条件下开展电台操作","D":"取得A 类业余无线电台操作技术能力验证证书且取得业余无线电台执照的人员，经批准 可临时在限定条件下开展电台操作"},"answer":"AB","explanation":"确需超出执照功率限值的，须经颁发执照的机构批准；且只有C类证书人员经批准可临时在限定条件下操作，A、B对。A类、B类人员无此特权。记忆：特殊操作是C类专属。"},{"id":"MC2-0069","category":"1.3.2","categoryName":"业余电台发射功率","type":"MC2","selectCount":2,"question":"关于未成年人设置、使用业余无线电台，下列哪些选项为正确：","options":{"A":"持有A 类验证证书的可以设置最大发射功率不大于25 瓦VHF 频段业余无线电台","B":"持有B 类验证证书的可以设置最大发射功率不大于25 瓦VHF 频段业余无线电台","C":"持有A 类验证证书的可以设置最大发射功率不大于15 瓦HF 频段业余无线电台","D":"持有B 类验证证书的可以设置最大发射功率不大于15 瓦HF 频段业余无线电台"},"answer":"AB","explanation":"未成年人持A类或B类证书，都可设置VHF/UHF不大于25瓦电台，A、B对。C、D涉HF(短波)15瓦，未成年人不许碰短波。记忆：未成年人只能玩VHF/UHF 25瓦，短波是禁区。"},{"id":"MC4-0070","category":"1.3.2","categoryName":"业余电台发射功率","type":"MC4","selectCount":4,"question":"关于业余无线电台操作技术能力验证，下列哪些选项为正确：","options":{"A":"业余无线电台操作技术能力验证题库以及验证标准由国家无线电管理机构制定","B":"无线电管理机构或者其委托的机构组织将提前向社会公布验证时间、验证要求等有关事 项","C":"参加业余无线电台操作技术能力验证成绩合格的，由无线电管理机构颁发业余无线电台 操作技术能力验证证书","D":"不得向参加验证的人员收取费用"},"answer":"ABCD","explanation":"题库和验证标准由国家制定、提前公布验证安排、成绩合格发证书、不收费，四项都对，A/B/C/D全选。记忆：验证“国家出题、免费、提前公告、合格发证”。"},{"id":"MC2-0071","category":"1.3.2","categoryName":"业余电台发射功率","type":"MC2","selectCount":2,"question":"关于新版《办法》施行前，依法取得B 类业余无线电台操作技术能力验证证书的，下列 哪些选项为正确：","options":{"A":"可以按照规定的许可权限申请设置、使用工作在30MHz 以下频段且最大发射功率不大于 100 瓦","B":"可以按照规定的许可权限申请设置、使用工作在30MHz 以上频段且最大发射功率不大于 25 瓦的业余无线电台","C":"应按照新版《办法》中B 类业余无线电台操作技术能力验证规定的范围设置、使用电台","D":"新版《办法》施行前取得的B 类业余无线电台操作技术能力验证证书不再有效"},"answer":"AB","explanation":"新版办法施行前取得的B类证书，仍可按原规定申请30MHz以下不大于100瓦、30MHz以上不大于25瓦的电台，A、B对。C“按新版范围”、D“证书失效”都错。记忆：老B类待遇保留——短波仍100瓦。"},{"id":"MC3-0072","category":"1.4.1","categoryName":"业余电台通信方式","type":"MC3","selectCount":3,"question":"《业余无线电台管理办法》规定正确使用业余无线电台呼号的方法是：","options":{"A":"使用业余无线电台的单位或者个人应当在每次通信建立及结束时发送本业余无线电台呼 号","B":"在通信过程中不定期（间隔不超过10 分钟）发送本业余无线电台呼号","C":"鼓励业余无线电台在通联期间通过技术手段自动发送电台呼号","D":"使用业余无线电台的单位或者个人在通信中可以用姓名、代号、适当的别名或者法规定 呼号的部分数字和字母代替完整的业余电台呼号作为电台的标识"},"answer":"ABC","explanation":"每次通信建立及结束时都要报本台呼号，过程中间隔不超过10分钟发送，还鼓励自动发送呼号，A、B、C对。D用姓名、代号、别名代替完整呼号是禁止的。记忆：呼号“建联报、结束报、十分钟一报”。"},{"id":"MC1-0073","category":"1.4.1","categoryName":"业余电台通信方式","type":"MC1","selectCount":1,"question":"业余无线电台呼号的核发流程是：","options":{"A":"无线电管理机构颁发业余无线电台执照，应当同时向申请人核发业余无线电台呼号","B":"在向无线电管理机构委托的受理服务机构提交设台申请窗口后，由服务机构核发呼号","C":"无线电管理机构核发业余无线电台执照后，由申请人再向其申请核发呼号","D":"业余无线电台设台人在提交设台申请的同时提出所要求指配的呼号，经服务机构同意后， 报无线电管理机构正式核发"},"answer":"A","explanation":"无线电管理机构颁发执照时，应当同时核发业余无线电台呼号，一证一号一并发，A对。B由服务机构核发、C分两步办、D自己指定呼号都不对。记忆：执照+呼号“一揽子”同时核发。"},{"id":"MC1-0074","category":"1.4.1","categoryName":"业余电台通信方式","type":"MC1","selectCount":1,"question":"无线电管理机构颁发业余无线电台执照时，若申请人已取得业余中继台、业余信标台呼 号以外的其他业余无线电台呼号，无线电管理机构将：","options":{"A":"无线电管理机构不再核发新的业余无线电台呼号","B":"由申请人再向其申请核发呼号，无线电管理机构将核发新的业余无线电台呼号","C":"无线电管理机构向其更换业余无线电台呼号","D":"业余无线电台设台人在提交设台申请的同时提出所要求指配的呼号，经服务机构同意后， 报无线电管理机构正式核发"},"answer":"A","explanation":"已取得中继台、信标台呼号以外其他业余电台呼号的，不再核发新呼号，A对。B“再申请”、C“更换”、D“自己指定”都不对。记忆：一人一号，呼号一经核发不再另发。"},{"id":"MC2-0075","category":"1.4.1","categoryName":"业余电台通信方式","type":"MC2","selectCount":2,"question":"业余无线电台呼号停止使用的，下列说法正确的是：","options":{"A":"业余无线电台呼号停止使用的，应当依法予以注销","B":"除业余中继台、业余信标台呼号外，其他业余无线电台呼号注销1 年后，无线电管理机 构可以将相关电台呼号重新投入分配","C":"业余无线电台呼号停止使用的，不用申请注销","D":"除业余中继台、业余信标台呼号外，其他业余无线电台呼号注销后，无线电管理机构可 立即将相关电台呼号重新投入分配"},"answer":"AB","explanation":"呼号停止使用应依法注销；除中继台、信标台外，其他呼号注销满1年才能重新投入分配，A、B对。C“不用注销”、D“立即重新分配”都错。记忆：注销1年“冷冻期”，期满才重新放号。"},{"id":"MC1-0076","category":"1.4.1","categoryName":"业余电台通信方式","type":"MC1","selectCount":1,"question":"注销的电台呼号重新投入分配前，申请人再次申请设置、使用业余无线电台，下列说法 正确的是：","options":{"A":"无线电管理机构经审查决定颁发业余无线电台执照的，应当同时核发申请人已注销的电 台呼号","B":"无线电管理机构经审查决定颁发业余无线电台执照的，应当同时核发新的的电台呼号","C":"电台呼号注销后，将不再向申请人核发电台呼号","D":"电台呼号注销后，申请人不能再次申请设置、使用业余无线电台"},"answer":"A","explanation":"注销的呼号重新投入分配前，申请人再次设台经审查获颁执照的，应同时核发其已注销的电台呼号，A对。B“新呼号”、C“不再核发”、D“不能申请”都错。记忆：重入分配前，原号物归原主。"},{"id":"MC2-0077","category":"1.4.1","categoryName":"业余电台通信方式","type":"MC2","selectCount":2,"question":"在他人依法设置的业余无线电台上进行发射操作的，下列说法正确的是：","options":{"A":"应当使用所操作业余无线电台的呼号或者实际操作人员取得的呼号","B":"使用实际操作人员取得的呼号的，业余无线电台通联期间发送呼号的格式应当符合国内 国际相关要求","C":"不可在他人依法设置的业余无线电台上进行发射操作","D":"业余无线电爱好者只能在自己设置的业余无线电台上进行发射操作"},"answer":"AB","explanation":"可在他人合法电台上发射操作，应使用该台呼号或实际操作人员取得的呼号，用自己呼号须符合国内国际格式，A、B对。C、D说“不能在他台操作”都错。记忆：他台可用，报“台号或操作员号”均可。"},{"id":"MC3-0078","category":"1.4.1","categoryName":"业余电台通信方式","type":"MC3","selectCount":3,"question":"满足下列哪些条件，可以临时使用其他业余无线电台呼号？","options":{"A":"参加或者举办业余无线电通联比赛以及其他重大业余无线电活动","B":"经比赛（活动）主办方（牵头单位）报国家无线电管理机构批准","C":"其他业余无线电台呼号符合国际规则","D":"何时何地都不能临时使用其他业余无线电台呼号"},"answer":"ABC","explanation":"参加或举办通联比赛等重大活动，经主办方报国家无线电管理机构批准，且所用呼号符合国际规则，即可临时使用其他呼号，A、B、C对。D“任何时候都不能”太绝对。记忆：重大活动+国家批准=可临时借号。"},{"id":"MC4-0079","category":"1.4.1","categoryName":"业余电台通信方式","type":"MC4","selectCount":4,"question":"关于业余无线电台呼号，下列说法正确的是：","options":{"A":"呼号第一部分为呼号前缀","B":"呼号第二部分为电台种类","C":"呼号第三部分为分区编号","D":"呼号第四部分为呼号后缀"},"answer":"ABCD","explanation":"呼号由呼号前缀、电台种类、分区编号、呼号后缀四部分组成，A/B/C/D全对。记忆：呼号四段“前缀—种类—分区—后缀”，如BG3ABC。"},{"id":"MC2-0080","category":"1.4.1","categoryName":"业余电台通信方式","type":"MC2","selectCount":2,"question":"关于业余无线电台呼号前缀，下列说法正确的是：","options":{"A":"呼号前缀（呼号第一部分）由一位字母组成","B":"为国际电信联盟分配的呼号前缀字母B","C":"为国际电信联盟分配的呼号前缀字母BA","D":"为国际电信联盟分配的呼号前缀字母A"},"answer":"AB","explanation":"呼号前缀由一位字母组成，是国际电信联盟分配给中国的呼号前缀字母B，A、B对。C“BA”是前缀B加种类A，D“字母A”不是中国前缀。记忆：中国前缀就是字母B。"},{"id":"MC4-0081","category":"1.4.1","categoryName":"业余电台通信方式","type":"MC4","selectCount":4,"question":"关于电台种类（呼号第二部分），下列说法正确的是：","options":{"A":"字母G、H、I、D、A、B、C、E、F、K、L 用于一般业余无线电台呼号","B":"字母J 用于空间业余无线电台呼号","C":"字母R 用于业余中继台和业余信标台呼号","D":"字母S、T、Y、Z 以及其他字母序列的业余无线电台呼号由国家无线电管理机构保留"},"answer":"ABCD","explanation":"电台种类：G、H、I、D、A、B、C、E、F、K、L用于一般电台，J用于空间电台，R用于中继台和信标台，S、T、Y、Z等由国家保留，A/B/C/D全对。记忆：“J上天、R当中继、STYZ国家留”。"},{"id":"MC3-0082","category":"1.4.1","categoryName":"业余电台通信方式","type":"MC3","selectCount":3,"question":"关于分区编号（呼号第三部分），下列说法正确的是：","options":{"A":"由一位数字组成","B":"用于表示业余无线电台分区号","C":"空间业余无线电台分区号为1","D":"空间业余无线电台分区号为2"},"answer":"ABC","explanation":"分区编号由一位数字组成，用于表示电台分区号，空间业余电台分区号为1，A、B、C对。D“分区号为2”错误。记忆：空间电台“飞在天上，排号第1”。"},{"id":"MC3-0083","category":"1.4.1","categoryName":"业余电台通信方式","type":"MC3","selectCount":3,"question":"关于呼号后缀（呼号第四部分），下列说法正确的是：","options":{"A":"由1～4 位的字母或者字母和数字的组合组成","B":"1 位、4 位呼号后缀，以及带有数字的呼号后缀由国家无线电管理机构保留","C":"QOA～QUZ 及SOS、XXX、TTT 等可能与遇险信号或类似性质的其他信号混淆的字母组 合不用作呼号后缀","D":"呼号后缀由1～4 位数字组成"},"answer":"ABC","explanation":"后缀由1～4位字母或字母数字组成，1位、4位及带数字的后缀由国家保留，QOA～QUZ、SOS、XXX等易与遇险信号混淆的组合禁用，A、B、C对。D“全数字”错。记忆：后缀避开SOS求救信号。"},{"id":"MC3-0084","category":"1.4.1","categoryName":"业余电台通信方式","type":"MC3","selectCount":3,"question":"各省、自治区、直辖市无线电管理机构核发一般业余无线电台呼号时，下列说法正确的 是：","options":{"A":"呼号第二部分按照G、H、I、D、A、B、C、E、F、K、L 顺序","B":"第四部分按照双字母、三字母组合顺序依次编制并核发业余无线电台呼号","C":"各省、自治区、直辖市无线电管理机构核发的业余无线电台呼号前缀都相同","D":"各省、自治区、直辖市无线电管理机构核发的业余无线电台呼号的分区号都相同"},"answer":"ABC","explanation":"各省核发一般呼号：第二部分按G、H、I、D、A、B、C、E、F、K、L顺序，第四部分按双字母、三字母顺序编制，前缀全国相同，A、B、C对。D“分区号都相同”错。记忆：前缀统一B，分区各不同。"},{"id":"MC1-0085","category":"1.4.1","categoryName":"业余电台通信方式","type":"MC1","selectCount":1,"question":"业余无线电爱好者对已核发给自己的电台呼号不满意，是否可以申请另行核发业余无线 电台呼号？","options":{"A":"不可以。颁发业余无线电台执照的无线电管理机构已经为申请人核发业余无线电台呼号 的，不另行核发其他业余无线电台呼号","B":"更新所设置的业余无线电台类别时可以申请另行核发业余无线电台呼号","C":"可以申请另行核发业余无线电台呼号，但须缴纳额外的费用","D":"业余无线电台执照有效期届满、设台人向核发执照的无线电管理机构申请办理延续手续 时可以申请另行核发业余无线电台呼号"},"answer":"A","explanation":"对已核发的呼号不满意，不可以申请另行核发，A对。B换设备类别、C缴费另发、D延续时另发都不是另行核发呼号的途径。记忆：呼号一经核发，不再另行换号。"},{"id":"MC1-0086","category":"1.4.1","categoryName":"业余电台通信方式","type":"MC1","selectCount":1,"question":"各地业余无线电台呼号前缀字母和后缀字符的可用范围的确定方法是：","options":{"A":"由国家无线电管理机构编制和分配","B":"地方无线电管理机构根据当地呼号资源的使用情况自行分配","C":"地方无线电民间组织提出建议，当地无线电管理机构批准","D":"由业余无线电爱好者根据需求提出建议，当地无线电管理机构批准"},"answer":"A","explanation":"呼号前缀字母和后缀字符的可用范围，由国家无线电管理机构编制和分配，A对。B地方自定、C民间组织建议、D爱好者自荐都无权决定。记忆：呼号资源全国一盘棋，国家统一分配。"},{"id":"MC3-0087","category":"1.4.1","categoryName":"业余电台通信方式","type":"MC3","selectCount":3,"question":"关于使用业余无线电台呼号正确的是：","options":{"A":"应当在每次通信建立时主动发送（报出）本台业余无线电台呼号","B":"应当在每次通信结束时主动发送（报出）本台业余无线电台呼号","C":"应当在每次通信过程中每十分钟发送（报出）本台业余无线电台呼号","D":"应当在每次通信过程中主动发送（报出）自造的呼号作为本台业余无线电台呼号的补充"},"answer":"ABC","explanation":"通信建立时、结束时都要主动报本台呼号，过程中每10分钟报一次，A、B、C对。D自造呼号冒充本台呼号是禁止的。记忆：呼号“建联报、结束报、十分钟报一次”，绝不报自造号。"},{"id":"MC4-0088","category":"1.4.1","categoryName":"业余电台通信方式","type":"MC4","selectCount":4,"question":"业余无线电台呼号由下列哪些部分组成：","options":{"A":"呼号前缀","B":"电台种类","C":"分区编号","D":"呼号后缀"},"answer":"ABCD","explanation":"业余无线电台呼号由呼号前缀、电台种类、分区编号、呼号后缀四部分组成，A/B/C/D全对。记忆：呼号四段式“前缀—种类—分区—后缀”。"},{"id":"MC1-0089","category":"1.4.1","categoryName":"业余电台通信方式","type":"MC1","selectCount":1,"question":"《业余无线电台管理办法》要求业余电台在建立和结束通信时主动发送本台呼号。允许 使用呼号的一部分（比如后缀）替代完整呼号的情况包括：","options":{"A":"在任何情况下都必须使用完整的呼号","B":"联络相识的友台时可将呼号的后缀用作电台标识","C":"在VHF/UHF 等本地频段建立通信时可将呼号的后缀用作电台标识","D":"在HF 频段联络国内电台时可将呼号的后缀用作电台标识，但是DX 联络不可以"},"answer":"A","explanation":"《业余无线电台管理办法》要求建立和结束通信时主动发送完整本台呼号，任何情况都不得只用后缀替代。B/C/D分别以相识友台、本地频段、国内通联为由省略，均无例外。记住：呼号是唯一标识，全程完整。"},{"id":"MC1-0090","category":"1.4.1","categoryName":"业余电台通信方式","type":"MC1","selectCount":1,"question":"在业余无线电通联中，是否可将本台或对方电台呼号之中的地区码加后缀视作《业余无 线电台管理办法》中的“电台呼号”？","options":{"A":"不可以。这是对呼号的不完整表述。其不具标识意义，不能视作电台呼号","B":"与熟悉的友台通联就可以使用这种不完整呼号。这就如同将对方称为OM","C":"在VHF/UHF 等频段进行通联可以使用这种不完整呼号。这会增加亲切感","D":"在HF 进行国内通联可以使用这种不完整呼号。但是如遇DX 电台则不可以"},"answer":"A","explanation":"地区码加后缀只是呼号的不完整表述，不具备标识意义，不能视作电台呼号。B/C/D试图为不完整呼号开绿灯，都违反规定。记住：对友台称呼可用昵称（如OM），但正式标识必须用完整呼号。"},{"id":"MC1-0091","category":"1.4.2","categoryName":"业余电台通信内容","type":"MC1","selectCount":1,"question":"关于我国业余无线电台分区号，业余分区号为1 的省（自治区、直辖市）为：","options":{"A":"北京","B":"黑龙江","C":"河北","D":"上海"},"answer":"A","explanation":"我国业余无线电台分区1区为北京。可以结合呼号第二位数字记忆：1区北京最靠北。B黑龙江为2区、C河北为3区、D上海为4区。记住：1区=北京。"},{"id":"MC3-0092","category":"1.4.2","categoryName":"业余电台通信内容","type":"MC3","selectCount":3,"question":"关于我国业余无线电台分区号，业余分区号为2 的省（自治区、直辖市）为：","options":{"A":"黑龙江","B":"吉林","C":"辽宁","D":"广东"},"answer":"ABC","explanation":"分区2为东北三省：黑龙江、吉林、辽宁，ABC全对。D广东属7区，排除。记住：2区=东三省，东北地区电台呼号第二位多为2。"},{"id":"MC4-0093","category":"1.4.2","categoryName":"业余电台通信内容","type":"MC4","selectCount":4,"question":"关于我国业余无线电台分区号，业余分区号为3 的省（自治区、直辖市）为：","options":{"A":"天津","B":"内蒙古","C":"河北","D":"山西"},"answer":"ABCD","explanation":"分区3为华北四地：天津、内蒙古、河北、山西，ABCD全选。记忆口诀：3区=华北四省市区（京津冀晋蒙）。这些都在华北平原周边，可整体记忆。"},{"id":"MC3-0094","category":"1.4.2","categoryName":"业余电台通信内容","type":"MC3","selectCount":3,"question":"关于我国业余无线电台分区号，业余分区号为4 的省（自治区、直辖市）为：","options":{"A":"上海","B":"山东","C":"江苏","D":"海南"},"answer":"ABC","explanation":"分区4为上海、山东、江苏，ABC对。D海南属7区，排除。记住：4区=鲁苏沪（华东沿海三地），呼号第二位4常见于华东电台。"},{"id":"MC3-0095","category":"1.4.2","categoryName":"业余电台通信内容","type":"MC3","selectCount":3,"question":"关于我国业余无线电台分区号，业余分区号为5 的省（自治区、直辖市）为：","options":{"A":"浙江","B":"江西","C":"福建","D":"广西"},"answer":"ABC","explanation":"分区5为浙江、江西、福建，ABC对。D广西属7区，排除。记住：5区=浙赣闽。福建、江西、浙江三省相连，可一起记。"},{"id":"MC3-0096","category":"1.4.2","categoryName":"业余电台通信内容","type":"MC3","selectCount":3,"question":"关于我国业余无线电台分区号，业余分区号为6 的省（自治区、直辖市）为：","options":{"A":"安徽","B":"河南","C":"湖北","D":"四川"},"answer":"ABC","explanation":"分区6为安徽、河南、湖北，ABC对。D四川属8区，排除。记住：6区=皖豫鄂（中部三省），四川已划入大西南8区。"},{"id":"MC4-0097","category":"1.4.2","categoryName":"业余电台通信内容","type":"MC4","selectCount":4,"question":"关于我国业余无线电台分区号，业余分区号为7 的省（自治区、直辖市）为：","options":{"A":"湖南","B":"广东","C":"广西","D":"海南"},"answer":"ABCD","explanation":"分区7为湖南、广东、广西、海南，ABCD全选。记住：7区=湘粤桂琼，中南地区四省区一体。海南、广西虽靠海，但都属7区。"},{"id":"MC4-0098","category":"1.4.2","categoryName":"业余电台通信内容","type":"MC4","selectCount":4,"question":"关于我国业余无线电台分区号，业余分区号为8 的省（自治区、直辖市）为：","options":{"A":"四川","B":"重庆","C":"贵州","D":"云南"},"answer":"ABCD","explanation":"分区8为四川、重庆、贵州、云南，ABCD全选。记住：8区=川渝黔滇=大西南。呼号第二位为8的电台多来自西南地区。"},{"id":"MC4-0099","category":"1.4.2","categoryName":"业余电台通信内容","type":"MC4","selectCount":4,"question":"关于我国业余无线电台分区号，业余分区号为9 的省（自治区、直辖市）为：","options":{"A":"陕西","B":"甘肃","C":"宁夏","D":"青海"},"answer":"ABCD","explanation":"分区9为陕西、甘肃、宁夏、青海，ABCD全选。记住：9区=陕甘宁青=大西北。西北四省区齐全，无一遗漏。"},{"id":"MC2-0100","category":"1.4.2","categoryName":"业余电台通信内容","type":"MC2","selectCount":2,"question":"关于我国业余无线电台分区号，业余分区号为0 的省（自治区、直辖市）为：","options":{"A":"新疆","B":"西藏","C":"上海","D":"重庆"},"answer":"AB","explanation":"分区0为新疆、西藏，AB对。C上海属4区、D重庆属8区，排除。记住：0区=新藏，是地广人稀的大西陲，特殊划为0区。"},{"id":"MC1-0105","category":"1.5.1","categoryName":"业余电台干扰处理","type":"MC1","selectCount":1,"question":"合法设置、使用业余电台的必要步骤是：","options":{"A":"按照《业余无线电台管理办法》的规定向无线电管理机构提出申请，取得业余无线电台 执照","B":"加入指定的业余无线电民间组织，并按其章程规定的办法办理申请手续","C":"经过业余无线电协会或无线电运动协会同意","D":"经过所在单位或居委会批准"},"answer":"A","explanation":"合法设台必须按《业余无线电台管理办法》向无线电管理机构申请，取得业余无线电台执照（A）。B加入协会、C协会同意、D单位批准都不具有行政许可效力。记住：执照才是合法凭证，协会不是门槛。"},{"id":"MC1-0106","category":"1.5.1","categoryName":"业余电台干扰处理","type":"MC1","selectCount":1,"question":"业余无线电台的法定用途为：","options":{"A":"用于相互通信、技术研究和自我训练","B":"供公民在业余时间进行与个人生活事务有关的通信","C":"供公民在业余时间进行休闲娱乐","D":"供私家车主或者相应组织作为行车安全保障和途中消遣工具"},"answer":"A","explanation":"业余电台的法定用途为相互通信、技术研究和自我训练（A）。B个人事务通信、C休闲娱乐、D行车安全保障都不是业余业务用途。记住：业余台=通信+研究+训练，仅此三用。"},{"id":"MC1-0107","category":"1.5.1","categoryName":"业余电台干扰处理","type":"MC1","selectCount":1,"question":"申请设置使用配备有多台业余无线电发射设备的业余无线电台，应该：","options":{"A":"视为一个业余电台，指配一个电台呼号，但所有设备均应经过核定并将参数载入电台执 照","B":"视为一个业余电台，指配一个电台呼号，其中只需有一台设备加以核定并将参数载入电 台执照","C":"每台设备视为一个业余电台，各指配一个电台呼号，并都应经过核定并将参数载入电台 执照","D":"视为一个业余电台，指配一个电台呼号，每个频段选择一台设备加以核定并将参数载入 电台执照"},"answer":"A","explanation":"多台发射设备视为一个业余电台，指配一个呼号，但所有设备都要核定并将参数载入执照（A）。B只核一台、C每台一呼号、D每频段一台都错。记住：一个台一个呼号，设备全登记。"},{"id":"MC1-0108","category":"1.5.1","categoryName":"业余电台干扰处理","type":"MC1","selectCount":1,"question":"业余中继台必备的技术措施为：","options":{"A":"设专人负责监控和管理工作，配备有效的遥控手段，保证造成有害干扰时及时停止发射","B":"技术加密措施，防止未经设台人允许的业余无线电台启用中继","C":"尽量提高发射功率，以便压制覆盖区内的其他强信号干扰","D":"设热备份系统，保证不间断工作"},"answer":"A","explanation":"业余中继台必备技术措施：设专人监控管理、配备有效遥控手段，保证造成有害干扰时及时停止发射（A）。B加密、C加大功率压制、D热备份都不是必备要求。记住：中继必配遥控停机手段。"},{"id":"MC1-0109","category":"1.5.1","categoryName":"业余电台干扰处理","type":"MC1","selectCount":1,"question":"某团体依法设置了一部业余中继台。其正确做法是：","options":{"A":"向其覆盖区域内的所有业余无线电台提供平等的服务，并将使用业余中继台所需的各项 技术参数公开","B":"中继台是设台者出资建设和维护的，因此仅供经设置者允许的业余电台使用","C":"中继台是设台者出资建设和维护的，因此仅供本团体成员优先使用，空闲时方供其他业 余电台使用","D":"为保证中继台正常运行，要求覆盖区内所有业余电台缴纳维护成本，否则不准使用"},"answer":"A","explanation":"中继台应向其覆盖区内所有业余电台提供平等服务，并公开使用所需技术参数（A）。B仅供部分人用、C团体优先、D收费使用都违背中继公益共享原则。记住：中继是公共设施，服务平等、参数公开。"},{"id":"MC1-0110","category":"1.5.1","categoryName":"业余电台干扰处理","type":"MC1","selectCount":1,"question":"选择144MHz 或430MHz 业余模拟调频中继台同频段收发频差的原则是：","options":{"A":"采用业余无线电标准频差，即144MHz 频段600kHz，430MHz 频段5MHz","B":"尽量采用非标准频差以阻止一般业余无线电台占用","C":"采用经常变换频差的办法减少占用度","D":"可以在国家《无线电频率划分规定》所规定业余频率范围内任意选择"},"answer":"A","explanation":"标准频差：144MHz段为600kHz，430MHz段为5MHz（A）。B非标频差、C频繁变换频差、D任意选择都阻碍统一使用。记住：144=0.6MHz，430=5MHz。"},{"id":"MC2-0111","category":"1.5.1","categoryName":"业余电台干扰处理","type":"MC2","selectCount":2,"question":"业余无线电台使用的无线电发射设备必须符合下列条件：","options":{"A":"商品设备应依法取得型号核准，型号核准证载明的频率范围包含业余业务频段","B":"自制、改装、拼装设备应符合国家标准和国家无线电管理规定，且无线电发射频率范围 仅限于业余业务频段","C":"自制、改装、拼装设备不受限制","D":"国外商品设备符合国际流行技术标准即可"},"answer":"AB","explanation":"商品设备须取得型号核准且载明频率含业余频段（A）；自制改装设备须符合国标和规定，频率限于业余频段（B）。C不受限制、D符合国际标准即可，都错。记住：商品要核准，自制定国标，都限业余。"},{"id":"MC1-0112","category":"1.5.1","categoryName":"业余电台干扰处理","type":"MC1","selectCount":1,"question":"“我不是业余无线电爱好者，申请设置业余电台只是为了行车方便，不需要遵守业余无 线电的规范”。这种说法：","options":{"A":"是错误的，也是不具备“熟悉无线电管理规定”设台条件的表现","B":"有一定道理，既然行车通信有需求，法规管理应该迎合个人需求","C":"有一定道理，只要是遵守规定，业余电台也可以为非业余无线电爱好者所用","D":"很难说对错，业余电台的定义可以因人而异"},"answer":"A","explanation":"该说法错误，也是不具备“熟悉无线电管理规定”设台条件的表现（A）。B/C/D想把业余电台变成个人通信、行车工具，都违背法规。记住：想设台，先懂规矩，业余台不是免费对讲机。"},{"id":"MC1-0113","category":"1.5.2","categoryName":"业余电台禁止行为","type":"MC1","selectCount":1,"question":"某业余电台操作者听到业余专用频率上出现某种显然出自非业余电台的人为干扰发射， 于是按下话筒向该发射者宣传无线电管理法规知识。对这种做法的评论应该是：","options":{"A":"错误；违反“业余无线电台只能用于相互通信、技术研究和自我训练”规定","B":"正确；但有干扰，不予提倡","C":"正确；抓机遇宣传法规，应该提倡","D":"正确；但需注意态度耐心、用语文明"},"answer":"A","explanation":"主动向非法干扰者宣传法规属超范围发射，违反“业余电台只能用于相互通信、技术研究和自我训练”规定（A）。正确做法是记录并举报干扰，而不是自己发射交涉。记住：遇干扰要举报，别自己开台讲法。"},{"id":"MC1-0114","category":"1.5.2","categoryName":"业余电台禁止行为","type":"MC1","selectCount":1,"question":"在业余无线电台中转发广播电台、互联网聊天、电话通话、其他电台的联络信号，这类 行为的性质是：","options":{"A":"错误行为；违反“业余无线电台只能用于相互通信、技术研究和自我训练”规定，因为 通信中产生信息的一方不是业余无线电台","B":"正确行为；既然可以联络，不必要限制向话筒送什么内容","C":"如果转发的目的是进行技术调试、用转发信号作为测试信号的话，就是正常行为","D":"不算错误但也不值得提倡"},"answer":"A","explanation":"转发广播、互联网、电话、其他台信号都违反“只能用于相互通信、技术研究和自我训练”规定，因为信息产生方不是业余电台（A）。B不限制内容、C测试借口、D不置可否都错。记住：业余台不当二传手。"},{"id":"MC1-0115","category":"1.5.2","categoryName":"业余电台禁止行为","type":"MC1","selectCount":1,"question":"业余电台在通信中为其他人或者单位、组织转达信息。对这种做法的评论应该是：","options":{"A":"违法行为；违反“业余无线电台只能用于相互通信、技术研究和自我训练”的规定","B":"只要所转达的信息在内容上不违反《业余电台管理法规》的禁止规定就是合法行为","C":"只要转达信息是无偿的，就是合法行为","D":"只要所转达的信息是有利于社会的公益信息，就是合法行为"},"answer":"A","explanation":"为他人或单位转达信息，违反“业余电台只能用于相互通信、技术研究和自我训练”规定，属违法行为（A）。B内容合法、C无偿、D公益性质都不能免责。记住：业余台不当传话筒。"},{"id":"MC1-0116","category":"1.5.2","categoryName":"业余电台禁止行为","type":"MC1","selectCount":1,"question":"某业余无线电协会在发射操作中向其会员播发公益性通知和技术训练讲座，但未得到相 应无线电管理机构的批准。对这种做法的评论应该是：","options":{"A":"违法行为；违反“未经批准，业余无线电台不得以任何方式进行广播或者发射通播性质 的信号”的规定","B":"只要所播发的通知或讲座有利于当地业余无线电爱好者技术水平的提高，不能算违法行 为","C":"只要所播发的通知或讲座有利于当地业余无线电应急通信训练，不能算违法行为","D":"只要所播发的通知或讲座是涉及宣传业余电台管理知识的，不能算违法行为"},"answer":"A","explanation":"未经批准向会员播发通知和讲座，违反“未经批准，业余电台不得以任何方式进行广播或者发射通播性质信号”的规定（A）。B/C/D以内容有益为由开脱都不成立。记住：通播性质发射，必须事先获批。"},{"id":"MC1-0117","category":"1.5.2","categoryName":"业余电台禁止行为","type":"MC1","selectCount":1,"question":"关于业余无线电台在通信过程中使用的语言，正确的做法为：","options":{"A":"任何时候都应当使用明语或者业余无线电领域公认的缩略语、简语","B":"可以使用虽然不是所有火腿通用、但在某些火腿圈子内部有一定可懂度的新编缩略语或 暗语","C":"语言要创新，可以使用自创的特殊缩略语，虽开始时象是暗语，用多了就会变明语","D":"可提倡使用稀有语言或方言，尽量使特定通信对象以外的业余无线电台听不懂，以减少 他台呼叫和插入的机会"},"answer":"A","explanation":"通信语言任何时候都应使用明语或业余界公认的缩略语、简语（A）。B小圈子暗语、C自创缩略语、D稀有语言方言加密都禁止。记住：明语公开通联，严禁暗语密码。"},{"id":"MC1-0118","category":"1.5.2","categoryName":"业余电台禁止行为","type":"MC1","selectCount":1,"question":"具备国家无线电管理机构规定的操作技术能力并具有法律规定有效证明文件、但还没有 获准设置自己的业余电台的人是否可以到业余电台进行发射操作？答案是：","options":{"A":"可以。使用所操作业余电台的呼号，由该业余电台的设台人对操作不妥而造成的有害干 扰负责","B":"可以。因为自己没有呼号，只能在通信中使用临时自编的呼号，或用姓名代替呼号","C":"不可以","D":"青少年可以，成人不可以"},"answer":"A","explanation":"具备操作技术能力证明但未设台者，可以到他台发射，使用该台呼号，由设台人对有害干扰负责（A）。B自编呼号、用姓名代替呼号都错。记住：借台操作用台主呼号，责任台主担。"},{"id":"MC3-0119","category":"1.5.2","categoryName":"业余电台禁止行为","type":"MC3","selectCount":3,"question":"未取得相应业余无线电台执照或者相应操作技术能力的人员，为提高业余无线电台操作 技术能力的需要，可以在他人依法设置的业余无线电台上进行发射操作实习。应遵守的条件 是什么？","options":{"A":"发射操作实习应当由业余无线电台设置、使用人或者其技术负责人现场监督指导","B":"使用的频率范围和发射功率应当在B 类业余无线电台操作技术能力验证证书确定的范围 内","C":"使用的频率范围和发射功率不得超过现场监督指导人员依法取得的业余无线电台操作技 术能力验证证书确定的范围","D":"尚未取得关于具备操作技术能力有效证明文件的人任何情况下都不可以进行发射操作"},"answer":"ABC","explanation":"实习三条件：设台人或技术负责人现场监督指导（A）；频率功率在B类证书确定的范围内（B）；且不得超过监督人员证书确定范围（C）。D说任何情况都不行是错的，实习正是例外。记住：实习要有人盯、限频率限功率。"},{"id":"MC1-0120","category":"1.5.2","categoryName":"业余电台禁止行为","type":"MC1","selectCount":1,"question":"业余无线电台设置人应对其无线电发射设备担负的法定责任为：","options":{"A":"应当确保其无线电发射设备处于正常工作状态，避免对其他无线电业务造成有害干扰","B":"应当确保其无线电发射设备随最先进型号更新，为其他业余电台树立求新的榜样","C":"应当确保其无线电发射设备达到最大发射功率，以克服其他无线电业务的干扰","D":"应当确保其无线电发射设备经常处于工作状态，以提高业余频率的实际占用度"},"answer":"A","explanation":"设台人对发射设备的法定责任是确保设备处于正常工作状态，避免对其他无线电业务造成有害干扰（A）。B追求新型号、C最大功率、D常开占用频率都不是责任。记住：设台责任=设备正常、不干扰别人。"},{"id":"MC1-0121","category":"1.5.2","categoryName":"业余电台禁止行为","type":"MC1","selectCount":1,"question":"业余无线电爱好者使用业余无线电收信设备应遵守的规定为：","options":{"A":"不得接收与业余业务和卫星业余业务无关的信号","B":"只要不造成对其他业务的无线电干扰，接收无线电信号没有限制","C":"只要不被查出来，可以接收任何无线电信号","D":"只要出于个人对信息的兴趣而不涉及赢利，可以接收任何无线电信号"},"answer":"A","explanation":"业余收信设备不得接收与业余业务和卫星业余业务无关的信号（A）。B只要不干扰就随意、C查不到就行、D兴趣非赢利就可，都错。记住：只收业余信号，别的频率别去听。"},{"id":"MC1-0122","category":"1.5.2","categoryName":"业余电台禁止行为","type":"MC1","selectCount":1,"question":"业余无线电爱好者无意接收到非业余业务和卫星业余业务的信息时，应遵守的规则为：","options":{"A":"不得传播、公布","B":"只可以在业余无线电台间共享，不得在其他场合公开","C":"只可以用非无线电方式在业余无线电爱好者之间交流，不得以无线电方式转发","D":"既然自己可以收到，别人也一定可以收到，当然可以传播、公布或者利用"},"answer":"A","explanation":"无意收到非业余业务信息时，不得传播、公布（A）。B在业余台间共享、C私下交流、D既然能收到就能用，都违反规定。记住：无意听到的，不外传、不利用。"},{"id":"MC1-0123","category":"1.5.2","categoryName":"业余电台禁止行为","type":"MC1","selectCount":1,"question":"业余无线电台是否可以发射从广播电台收到的信号、音像节目的录音，或者故意转送电 台周围的声音？","options":{"A":"不可以，不得发送与业余业务和卫星业余业务无关的信号","B":"可以，因为该类信息没有保密性","C":"可以，用于显示自己发射设备的信号质量","D":"可以，用于提起其他有业余无线电台操作员精神，防止乏困"},"answer":"A","explanation":"不得发射广播节目、音像录音或故意转送周围声音，因为这些是与业余业务无关的信号（A）。B无保密性、C测信号质量、D提精神为由都错。记住：话筒前只发自己该说的话。"},{"id":"MC1-0124","category":"1.5.2","categoryName":"业余电台禁止行为","type":"MC1","selectCount":1,"question":"国家对于利用业余无线电台从事发布、传播违反法律或者公共道德的信息的行为的态度 是：","options":{"A":"禁止","B":"不提倡","C":"容忍","D":"不可以发布传播违法信息。但违反公共道德的信息属于道德问题，不鼓励就是了"},"answer":"A","explanation":"国家禁止利用业余电台发布、传播违反法律或公共道德的信息（A）。B不提倡、C容忍、D违法禁但违德可不鼓励，都弱化了“禁止”。记住：违法违德信息，一律禁止发布传播。"},{"id":"MC1-0125","category":"1.5.2","categoryName":"业余电台禁止行为","type":"MC1","selectCount":1,"question":"出租车安装业余电台并用来传递有关载客的信息，这种行为的性质是：","options":{"A":"违法行为，违反了严禁利用业余无线电台谋取商业利益的规定","B":"不太好，因为占用了其他业余电台通信的频率","C":"只要不影响其他业余电台的正常通信就可以","D":"只要管理部门不来查处就可以"},"answer":"A","explanation":"出租车用业余电台传递载客信息，属利用业余电台谋取商业利益的违法行为（A）。B占频率不道德、C不影响他人就行、D不被查处就行，都淡化违法性质。记住：业余台不能跑生意。"},{"id":"MC1-0126","category":"1.5.2","categoryName":"业余电台禁止行为","type":"MC1","selectCount":1,"question":"利用业余无线电台通信来促销业余无线电产品或者推动与业余无线电活动有关的其他商 业性活动，对这类行为的态度应该是：","options":{"A":"禁止","B":"不提倡但也不禁止，毕竟有利于业余无线电活动发展","C":"只要是业余无线电民间组织是获利方，即使从事商业或其他营利活动，应支持","D":"如果设台人或者设台单位本身是以这类经营为生的，应适当理解和容忍"},"answer":"A","explanation":"利用业余电台促销产品、推动商业性活动是明确禁止的（A）。B/C/D以利于业余发展、组织获利、营生为借口都不成立。记住：业余电台不搞促销，不为商业服务。"},{"id":"MC1-0127","category":"1.5.2","categoryName":"业余电台禁止行为","type":"MC1","selectCount":1,"question":"利用自己的业余电台强信号故意压制其他业余电台的正常通信，或者在业余无线电频率 上转播音乐或广播节目，这些行为的性质属于：","options":{"A":"违法行为，违反了严禁阻碍其他无线电台通信的规定","B":"不妥行为，没有考虑到他人的乐趣","C":"正常现象，社会上一些人素质就是如此，应该谅解","D":"不文明行为，对其他业余电台不够礼貌"},"answer":"A","explanation":"用强信号故意压制他人通信、转播音乐或广播节目，属阻碍其他无线电台通信的违法行为（A）。B不妥行为、C素质现象、D不文明都低估了违法性。记住：压制和转播=违法，不是小事。"},{"id":"MC1-0128","category":"1.5.2","categoryName":"业余电台禁止行为","type":"MC1","selectCount":1,"question":"业余无线电活动是否有序开展，会影响整个社会的无线电通信的安全和有效，使用不当 甚至会导致生命财产损失。业余无线电爱好者在这方的责任是：","options":{"A":"业余无线电台设置、使用人应当加强自律","B":"个人没有责任，只能依靠管理部门的监督检查和违法查处","C":"个人没有责任，只能依靠业余无线电民间组织充当“协管”","D":"有了电台执照，日常一切言行当然可以带到电台通信中，无责任可言"},"answer":"A","explanation":"业余活动有序与否影响整个社会无线电通信安全，业余爱好者应加强自律（A）。B/C/D把责任推给管理部门、协会或认为有执照无责任，都错。记住：先自律，再谈管理。"},{"id":"MC1-0129","category":"1.5.2","categoryName":"业余电台禁止行为","type":"MC1","selectCount":1,"question":"业余无线电台可用于下列用途：","options":{"A":"相互通信、技术研究和自我训练","B":"救灾抢险、车队联络和广播通信","C":"娱乐休闲、报告路况和公益服务","D":"技术教学、民兵训练和公益服务"},"answer":"A","explanation":"业余电台可用于相互通信、技术研究和自我训练（A）。B救灾车队广播、C娱乐路况、D民兵训练都不属法定用途。记住：业余台三用=通信、研究、训练。"},{"id":"MC1-0130","category":"1.5.2","categoryName":"业余电台禁止行为","type":"MC1","selectCount":1,"question":"符合业余无线电爱好者基本条件的人群是：","options":{"A":"对无线电技术有兴趣并经无线电管理机构批准设置使用业余无线电台的人","B":"任何对无线电技术有兴趣的公民","C":"对无线电技术有兴趣并加入业余无线电协会的人","D":"拥有较高无线电技术水平并加入业余无线电协会的人"},"answer":"A","explanation":"业余无线电爱好者=对无线电技术有兴趣并经无线电管理机构批准设置使用业余电台的人（A）。B有兴趣即可、C加入协会、D高技术且入会都缺“批准设台”这个硬条件。记住：有兴趣+有执照，才叫火腿。"},{"id":"MC4-0131","category":"1.5.2","categoryName":"业余电台禁止行为","type":"MC4","selectCount":4,"question":"业余无线电台禁止从事下列活动：","options":{"A":"在我国境内进行电波参数测试或者电波监测","B":"向境外组织或者个人提供涉及国家安全的境内电波参数资料","C":"故意收发无线电台执照许可事项之外的无线电信号","D":"传播、公布或者利用无意接收的信息"},"answer":"ABCD","explanation":"四禁全选：境内进行电波参数测试或电波监测（A）、向境外提供涉国家安全电波参数（B）、故意收发执照许可之外信号（C）、传播公布或利用无意接收的信息（D）。记住：禁监测、禁泄密、禁越权收、禁乱传。"},{"id":"MC4-0132","category":"1.5.2","categoryName":"业余电台禁止行为","type":"MC4","selectCount":4,"question":"业余无线电台应当遵守下列哪些规定：","options":{"A":"在业余业务或者卫星业余业务频段内收发信号","B":"不得擅自使用无线电频率","C":"不得对依法开展的无线电业务造成有害干扰","D":"不得利用无线电台(站)进行违法犯罪活动"},"answer":"ABCD","explanation":"四规定全选：在业余或卫星业余频段内收发（A）、不得擅自使用频率（B）、不得对依法开展的无线电业务造成有害干扰（C）、不得利用电台进行违法犯罪活动（D）。记住：守频段、不擅用、不干扰、不违法。"},{"id":"MC3-0133","category":"1.5.2","categoryName":"业余电台禁止行为","type":"MC3","selectCount":3,"question":"以下哪些使用业余无线电台的行为超越了在业余业务频率范围内收发信号的规定：","options":{"A":"利用业余无线电台收听民用航空器电台通联","B":"利用业余无线电台收听铁路机车电台通联","C":"利用业余无线电台收听渔船海事电台通联","D":"利用业余无线电台收听国际空间站业余无线电台"},"answer":"ABC","explanation":"收听民航（A）、铁路机车（B）、渔船海事（C）电台通联，超出“在业余业务频率范围内收发信号”的规定；D国际空间站业余电台属业余业务，可以收听。记住：业余台只听业余台，航机船台不能听。"},{"id":"MC3-0134","category":"1.5.2","categoryName":"业余电台禁止行为","type":"MC3","selectCount":3,"question":"下列哪些未取得型号核准的无线电发射设备不可以作为自制、改装、拼装的业余无线电 台设置、使用：","options":{"A":"相关企业批量生产的未取得型号核准证的无线电发射设备","B":"已取得型号核准证，但型号核准证载明的频率范围不含业余业务的无线电发射设备","C":"已取得型号核准证，但自行更换设备操作软件将频率范围扩展到业余业务频段的无线电 发射设备","D":"依法改装的取得型号核准证载明的频率范围包含业余业务频段的无线电发射设备"},"answer":"ABC","explanation":"不可作自制改装台使用：批量生产无核准证（A）、核准证不含业余频段（B）、改软件把频率扩到业余段（C）。D依法改装且载明业余频段的设备可用。记住：无证、不含业余、软件越权，三种不能用。"},{"id":"MC4-0135","category":"1.5.2","categoryName":"业余电台禁止行为","type":"MC4","selectCount":4,"question":"使用业余无线电台不得从事下列活动:","options":{"A":"发布、传播法律、行政法规禁止发布、传播的信息","B":"用于谋取商业利益等超出业余无线电台使用属性之外的目的","C":"故意干扰、阻碍其他无线电台（站）通信","D":"故意收发业余无线电台执照载明事项之外的无线电信号"},"answer":"ABCD","explanation":"四不准全选：发布传播法律行政法规禁止的信息（A）、谋取商业利益等超出业余使用属性的目的（B）、故意干扰阻碍他台通信（C）、故意收发执照载明事项之外信号（D）。记住：违禁信息、商业、干扰、越权，四不准。"},{"id":"MC4-0136","category":"1.5.2","categoryName":"业余电台禁止行为","type":"MC4","selectCount":4,"question":"使用业余无线电台不得从事下列活动:","options":{"A":"传播、公布或者利用无意接收的信息","B":"擅自编制、使用业余无线电台呼号","C":"涂改、倒卖、出租或者出借业余无线电台执照","D":"向境外组织或者个人提供涉及国家安全的境内电波参数资料"},"answer":"ABCD","explanation":"这四条都是《业余无线电台管理办法》明令禁止：传播利用无意接收的信息、擅自编制使用呼号、涂改倒卖出租出借执照、向境外提供涉国家安全的电波参数。记忆：'无意不传播、呼号不自编、执照不买卖、参数不给境外'。"},{"id":"MC4-0137","category":"1.5.2","categoryName":"业余电台禁止行为","type":"MC4","selectCount":4,"question":"使用业余无线电台应当符合如下规定：","options":{"A":"定期维护业余无线电台","B":"保证其性能指标符合国家标准","C":"保证其性能指标符合国家无线电管理的有关规定","D":"避免对其他依法设置、使用的无线电台（站）产生有害干扰"},"answer":"ABCD","explanation":"使用业余电台应定期维护，保证性能指标符合国家标准和国家无线电管理规定，并避免对其他合法电台产生有害干扰，四条全对。核心是'自己的设备自己管好、不能干扰别人'，这是设台使用的基本义务。"},{"id":"MC3-0138","category":"1.5.2","categoryName":"业余电台禁止行为","type":"MC3","selectCount":3,"question":"关于业余无线电台在通信过程中使用的语言，正确的做法为:","options":{"A":"在通信过程中使用明语","B":"在通信过程中使用业余无线电领域公认的缩略语、简语","C":"在通信过程中使用公开的技术体制和通信协议","D":"在通信过程中使用自创的特殊缩略语"},"answer":"ABC","explanation":"通信中应使用明语、公认的缩略语简语以及公开的技术体制和通信协议，目的是保证通信公开透明、他人可懂可查。D 自创特殊缩略语被禁止，因为自创暗语等于变相加密，业余通信必须透明。记忆：'公开透明，禁暗语'。"},{"id":"MC1-0139","category":"1.5.3","categoryName":"业余电台应急通信","type":"MC1","selectCount":1,"question":"关于业余无线电台的应急通信，正确的叙述是：","options":{"A":"在突发重大自然灾害等紧急情况下，业余无线电台才可以和非业余无线电台进行规定内 容的通信","B":"在日常应急通信训练中，业余无线电台可以和各种非业余无线电台进行通信","C":"在日常应急通信训练中，业余无线电台可以和地方公益性救援团体的非业余无线电台进 行通信","D":"在日常应急通信训练中，业余无线电台可以和地方公益性救援团体的非业余无线电台进 行通信，但须经当地业余无线电协会同意"},"answer":"A","explanation":"业余电台日常只能与业余电台通信，只有突发重大自然灾害等紧急情况下才可与非业余电台进行规定内容的通信。B、C、D 说日常应急训练中可与非业余电台通信都是错误的。记忆：'平时只碰业余台，紧急才破例'。"},{"id":"MC1-0140","category":"1.5.3","categoryName":"业余电台应急通信","type":"MC1","selectCount":1,"question":"业余无线电台允许与非业余无线电台通信的条件是：","options":{"A":"在突发重大自然灾害等紧急情况下，内容限于与抢险救灾直接相关的紧急事务或者应急 救援相关部门交办的任务","B":"在当地政府或非盈利机构组织的公益活动中，内容限于与公益事务或者相关的活动组织 机构交办的任务","C":"在青少年科技教育活动中，仅可与青少年非业余无线电台通信，内容限于与青少年科技 教育直接有关的事务","D":"在无线电技术研究中，仅可与具备其他业务电台执照的对象通信，内容限于技术实验所 需的信号"},"answer":"A","explanation":"允许与非业余电台通信的唯一条件是突发重大自然灾害等紧急情况，内容限于与抢险救灾直接相关的紧急事务或应急部门交办任务。B 公益、C 青少年教育、D 技术研究都不是合法依据。记忆：'只有救灾事务能越界'。"},{"id":"MC1-0141","category":"1.5.3","categoryName":"业余电台应急通信","type":"MC1","selectCount":1,"question":"关于业余无线电台的应急通信，正确的叙述是：","options":{"A":"在突发重大自然灾害等紧急情况下，业余无线电台的通信内容可以涉及应急救援相关部 门交办的任务","B":"在平时的任何时侯，业余无线电台的通信内容可以涉及任何政府组织和非盈利机构交办 的任务","C":"平时在专门的应急通信训练活动中，业余无线电台的通信内容可以涉及应急救援相关部 门和组织机构交办的任务","D":"在日常公益性社会活动中，业余无线电台的通信内容可以涉及各种公益机构交办的任务"},"answer":"A","explanation":"紧急情况下业余电台的通信内容可涉及应急救援部门交办的任务。B 平时任何时候、C 训练中、D 公益活动中都可涉及政府或公益机构交办任务，都是把紧急通信范围任意扩大。记忆：'内容必须与紧急事务直接相关'。"},{"id":"MC4-0142","category":"1.5.3","categoryName":"业余电台应急通信","type":"MC4","selectCount":4,"question":"业余无线电爱好者在应对突发事件应急处置应当遵守下列规定：","options":{"A":"为突发事件应急处置的需要，业余无线电台可以与非业余无线电台通信","B":"通信内容应当限于与突发事件应急处置直接相关的紧急事务","C":"遇有危及国家安全、公共安全、生命财产安全等紧急情况，可以不经批准临时设置、使 用业余无线电台，但应当在48 小时内向电台所在地的无线电管理机构报告","D":"遇有危及国家安全、公共安全、生命财产安全等紧急情况，未经批准临时设置、使用业 余无线电台应在紧急情况消除后及时关闭"},"answer":"ABCD","explanation":"应急处置四条全对：可为处置需要与非业余电台通信、内容限于直接相关的紧急事务、紧急情况可先设台但应48小时内向电台所在地无线电管理机构报告、紧急情况消除后及时关闭。记忆：'先办后报48小时、事了即关'。"},{"id":"MC1-0143","category":"1.6.1","categoryName":"无线电发射设备","type":"MC1","selectCount":1,"question":"业余无线电台设置、使用人应当接受下列机构对业余无线电台及其使用情况的监督检查：","options":{"A":"无线电管理机构的监督检查","B":"业余无线电民间组织的独立监督检查","C":"单位或所在居委会、村民委员会、物主委员会的监督检查","D":"国家计量监督部门的监督检查"},"answer":"A","explanation":"业余电台应当接受无线电管理机构的监督检查，它是唯一的法定监督机关。B 民间组织、C 居委会村委会、D 计量监督部门都没有监督业余电台的权力。记忆：'管无线电台的就是无线电管理机构'。"},{"id":"MC4-0144","category":"1.6.1","categoryName":"无线电发射设备","type":"MC4","selectCount":4,"question":"关于无线电频谱资源，下列说法正确的是：","options":{"A":"无线电频谱资源属于国家所有","B":"国家对无线电频谱资源实行统一规划、合理开发、有偿使用的原则","C":"国家鼓励、支持对无线电频谱资源的科学技术研究和先进技术的推广应用，提高无线电 频谱资源的利用效率","D":"根据维护国家安全、保障国家重大任务、处置重大突发事件等需要，国家可以实施无线 电管制"},"answer":"ABCD","explanation":"频谱资源归国家所有，国家统一规划、合理开发、有偿使用，鼓励科研与先进技术应用提高利用率，必要时可实施无线电管制，四条全对。这是《无线电管理条例》开篇总原则。记忆：'国家所有、统一管、有偿用、可管制'。"},{"id":"MC4-0145","category":"1.6.1","categoryName":"无线电发射设备","type":"MC4","selectCount":4,"question":"关于无线电频率、业务、台（站），下列说法正确的是：","options":{"A":"任何单位或者个人不得擅自使用无线电频率","B":"任何单位或者个人不得对依法开展的无线电业务造成有害干扰","C":"任何单位或者个人不得利用无线电台（站）进行违法犯罪活动","D":"设置、使用业余无线电台需要遵守《中华人民共和国无线电管理条例》"},"answer":"ABCD","explanation":"不得擅自使用频率、不得对依法开展的无线电业务造成有害干扰、不得利用无线电台违法犯罪、设台使用须遵守《无线电管理条例》，四条全对。记忆：'频须审批、害扰禁止、违法必究'。"},{"id":"MC1-0146","category":"1.6.1","categoryName":"无线电发射设备","type":"MC1","selectCount":1,"question":"违反国家规定，擅自设置、使用无线电台（站），或者擅自使用无线电频率，干扰无线电 通讯秩序，情节严重的，处三年以下有期徒刑、拘役或者管制，并处或者单处罚金；情节特 别严重的，处三年以上七年以下有期徒刑，并处罚金。单位犯前款罪的，对单位判处罚金， 并对其直接负责的主管人员和其他直接责任人员，依照前款的规定处罚。这个规定出自于下 列法规律：","options":{"A":"中华人民共和国刑法","B":"中华人民共和国民法通则","C":"中华人民共和国无线电管理条例","D":"中华人民共和国电信法"},"answer":"A","explanation":"这段文字出自《刑法》第288条'扰乱无线电通讯管理秩序罪'，情节严重最高处七年有期徒刑。民法通则不管刑事犯罪，我国也没有《电信法》。记忆：'干扰通讯秩序、情节严重——找刑法288'。"},{"id":"MC1-0147","category":"1.6.1","categoryName":"无线电发射设备","type":"MC1","selectCount":1,"question":"无线电频率的使用必须得到无线电管理机构的批准，基本依据是“无线电频谱资源属于 国家所有”，出自于下列法律的第二百五十二条：","options":{"A":"中华人民共和国民法典","B":"中华人民共和国宪法","C":"中华人民共和国刑法","D":"中华人民共和国电信法"},"answer":"A","explanation":"'无线电频谱资源属于国家所有'出自《民法典》第252条，这正是频率使用必须经批准的根本依据。宪法是根本大法但无此具体条文，刑法管犯罪，我国并无《电信法》。记忆：'频谱归国有，看民法典252条'。"},{"id":"MC1-0148","category":"1.6.1","categoryName":"无线电发射设备","type":"MC1","selectCount":1,"question":"无线电管制是指在下列范围内依法采取的对无线电波的发射、辐射和传播实施的强制性 管理：","options":{"A":"在特定时间和特定区域内","B":"在全国范围、所有时间内","C":"在特定范围、所有时间内","D":"在例行范围和例行时间内"},"answer":"A","explanation":"无线电管制是在'特定时间和特定区域内'依法实施的强制性管理，不是全国全天候无差别管理。B、C、D 分别扩大了范围。记忆：'管制讲特定，特定时间+特定区域'。"},{"id":"MC1-0149","category":"1.6.1","categoryName":"无线电发射设备","type":"MC1","selectCount":1,"question":"无线电管制是指在特定时间和特定区域内，依法采取的下列性质的管理：","options":{"A":"对无线电波的发射、辐射和传播实施的强制性管理","B":"对无线电波的发射、辐射实施的指导和行业自律性管理","C":"对无线电发射设备的生产、销售实施的强制性管理","D":"对无线电发射设备的生产、销售实施的指导和行业自律性管理"},"answer":"A","explanation":"无线电管制管的是'无线电波的发射、辐射和传播'，性质是强制性管理。B 把强制换成了指导自律，C、D 换成对设备生产销售的管理，都错。记忆：'管制=在特定时空强制管电波'。"},{"id":"MC1-0150","category":"1.6.1","categoryName":"无线电发射设备","type":"MC1","selectCount":1,"question":"在特定时间和特定区域内实施无线电管制时，与业余无线电有关的管理措施包括：","options":{"A":"限制或者禁止业余无线电台（站）的使用，以及对特定的无线电频率实施技术阻断等","B":"限制或者禁止业余无线电台设备的生产和销售","C":"限制、但不会禁止业余无线电台（站）的使用","D":"依法设置的业余电台不在管制范围之内"},"answer":"A","explanation":"实施无线电管制时，对业余电台的措施是限制或者禁止其使用，并可对特定频率实施技术阻断。B 限制设备生产销售不在此列，C 不会禁止、D 业余台不在管制范围，都错。记忆：'管制来了，业余台要么受限要么停用'。"},{"id":"MC2-0151","category":"1.6.1","categoryName":"无线电发射设备","type":"MC2","selectCount":2,"question":"决定实施无线电管制的机构为：","options":{"A":"在全国范围内或者跨省、自治区、直辖市实施，由国务院和中央军事委员会决定","B":"在省、自治区、直辖市范围内实施，由省、自治区、直辖市人民政府和相关军区决定","C":"在全国范围内或者跨省、自治区、直辖市实施，由国家无线电管理机构决定","D":"在省、自治区、直辖市范围内实施，由相关地方无线电管理机构决定"},"answer":"AB","explanation":"全国或跨省实施管制由国务院和中央军事委员会决定；省内由省级人民政府和相关军区决定。C、D 把决定权给了管理机构，错——决定权在政府和军队。记忆：'国家层国务院+军委，省里政府+军区'。"},{"id":"MC2-0152","category":"1.6.1","categoryName":"无线电发射设备","type":"MC2","selectCount":2,"question":"违反无线电管制命令和无线电管制指令的，由下列机构依法进行处罚：","options":{"A":"国家无线电管理机构或者省、自治区、直辖市无线电管理机构","B":"违反治安管理规定者由公安机关处罚","C":"当地业余无线电协会","D":"所在军区派出的专门机构"},"answer":"AB","explanation":"违反无线电管制命令和指令的，由无线电管理机构处罚；其中违反治安管理规定的由公安机关处罚。C 业余协会无权处罚，D 军区不派专门机构管此事。记忆：'行政找无线电管理机构，治安找公安'。"},{"id":"MC3-0153","category":"1.6.2","categoryName":"无线电接收设备","type":"MC3","selectCount":3,"question":"业余电台违反无线电管制命令和无线电管制指令的，可以依法规受到下列处罚：","options":{"A":"责令改正；拒不改正的，关闭、查封、暂扣或者拆除相关设备","B":"情节严重的，吊销电台执照","C":"违反治安管理规定的，由公安机关处罚","D":"处警告或者三万元以下的罚款"},"answer":"ABC","explanation":"业余电台违反管制命令可责令改正，拒不改正的关闭、查封、暂扣或拆除设备；情节严重吊销执照；违反治安管理的由公安处罚，ABC 都对。D 的'警告或三万元以下罚款'是其他罚则。记忆：'改、扣、吊、公安'。"},{"id":"MC2-0154","category":"1.6.2","categoryName":"无线电接收设备","type":"MC2","selectCount":2,"question":"对未经许可擅自使用无线电频率的，无线电管理机构可以根据其具体情况给予下列处罚：","options":{"A":"由无线电管理机构责令改正，没收从事违法活动的设备和违法所得，可以并处5 万元以 下的罚款","B":"拒不改正的，并处5 万元以上20 万元以下的罚款","C":"劝告拆除非法设置的电台；情节严重的，可以并处警告、查封或者没收设备","D":"责令停止使用非法设置的电台并作出书面检查；情节严重的，可以并处一千元以下的罚 款"},"answer":"AB","explanation":"未经许可擅自使用频率：责令改正、没收从事违法活动的设备和违法所得，可并处5万元以下；拒不改正的并处5万至20万。C、D 是旧办法时代的罚则。记忆：'初犯罚5万，不改罚5到20万'。"},{"id":"MC2-0155","category":"1.6.2","categoryName":"无线电接收设备","type":"MC2","selectCount":2,"question":"对擅自设置、使用业余无线电台的，无线电管理机构可以根据其具体情况给予下列处罚：","options":{"A":"由无线电管理机构责令改正，没收从事违法活动的设备和违法所得，可以并处5 万元以 下的罚款","B":"拒不改正的，并处5 万元以上20 万元以下的罚款","C":"劝告拆除非法设置的电台；情节严重的，可以并处警告、查封或者没收设备","D":"责令停止使用非法设置的电台并作出书面检查；情节严重的，可以并处一千元以下的罚 款"},"answer":"AB","explanation":"擅自设置、使用业余电台的罚则与擅自使用频率相同：没收设备违法所得，可并处5万以下；拒不改正并处5万至20万。C、D 是过时罚则。记忆：'擅自设台=擅自用频，从罚5万起'。"},{"id":"MC1-0156","category":"1.6.2","categoryName":"无线电接收设备","type":"MC1","selectCount":1,"question":"擅自设置、使用无线电台（站）从事诈骗等违法活动，可以根据其具体情况给予下列处 罚：","options":{"A":"尚不构成犯罪的，并处20 万元以上50 万元以下的罚款","B":"拒不改正的，处5 万元以上20 万元以下的罚款","C":"劝告拆除非法设置的电台；情节严重的，可以并处警告、查封或者没收设备","D":"责令停止使用非法设置的电台并作出书面检查；情节严重的，可以并处一千元以下的罚 款"},"answer":"A","explanation":"擅自设置使用电台从事诈骗等违法活动，尚不构成犯罪的处20万至50万罚款，是最重的一档。B 的5至20万是'拒不改正'档，C、D 是过时罚则。记忆：'碰违法犯罪活动，档次最高——20万到50万'。"},{"id":"MC2-0157","category":"1.6.2","categoryName":"无线电接收设备","type":"MC2","selectCount":2,"question":"不按照业余无线电台执照规定的许可事项和要求设置、使用业余无线电台的，无线电管 理机构可以根据其具体情况给予下列处罚：","options":{"A":"由无线电管理机构责令改正，没收违法所得，可以并处3 万元以下的罚款","B":"造成严重后果的，吊销无线电台执照，并处3 万元以上10 万元以下的罚款","C":"责令停止使用非法设置的电台；情节严重的，可以并处警告、查封或者没收设备","D":"责令停止使用非法设置的电台并作出书面检查；情节严重的，可以并处一千元以下的罚 款"},"answer":"AB","explanation":"不按执照规定的许可事项和要求设台使用：责令改正、没收违法所得，可并处3万以下；造成严重后果的吊销执照并处3万至10万。C、D 是过时罚则。记忆：'违规用台罚3万，后果严重吊执照'。"},{"id":"MC2-0158","category":"1.6.2","categoryName":"无线电接收设备","type":"MC2","selectCount":2,"question":"故意收发业余无线电台执照许可事项之外的无线电信号，传播、公布或者利用无意接收 的信息，无线电管理机构可以根据其具体情况给予下列处罚：","options":{"A":"由无线电管理机构责令改正，没收违法所得，可以并处3 万元以下的罚款","B":"造成严重后果的，吊销无线电台执照，并处3 万元以上10 万元以下的罚款","C":"责令停止使用非法设置的电台；情节严重的，可以并处警告、查封或者没收设备","D":"责令停止使用非法设置的电台并作出书面检查；情节严重的，可以并处一千元以下的罚 款"},"answer":"AB","explanation":"故意收发执照许可事项之外的信号、传播公布或利用无意接收的信息：责令改正、没收违法所得，可并处3万以下；造成严重后果的吊销执照并处3万至10万。记忆：'偷听偷传别人的信号——罚3万起，严重吊照'。"},{"id":"MC2-0159","category":"1.6.2","categoryName":"无线电接收设备","type":"MC2","selectCount":2,"question":"擅自编制、使用业余无线电台呼号，无线电管理机构可以根据其具体情况给予下列处罚：","options":{"A":"由无线电管理机构责令改正，没收违法所得，可以并处3 万元以下的罚款","B":"造成严重后果的，吊销无线电台执照，并处3 万元以上10 万元以下的罚款","C":"责令停止使用非法设置的电台；情节严重的，可以并处警告、查封或者没收设备","D":"责令停止使用非法设置的电台并作出书面检查；情节严重的，可以并处一千元以下的罚 款"},"answer":"AB","explanation":"擅自编制、使用业余电台呼号：责令改正、没收违法所得，可并处3万以下；造成严重后果的吊销执照并处3万至10万。呼号由国家核配，不能自己造。记忆：'呼号不能自编——罚3万起，严重吊照'。"},{"id":"MC1-0160","category":"1.6.2","categoryName":"无线电接收设备","type":"MC1","selectCount":1,"question":"业余电台干扰无线电业务正常进行的，无线电管理机构可以根据其具体情况给予下列处 罚：","options":{"A":"由无线电管理机构责令改正，拒不改正的，没收产生有害干扰的设备，并处5 万元以上 20 万元以下的罚款，吊销无线电台执照","B":"劝告拆除非法设置的电台；情节严重的，可以并处警告、查封或者没收设备","C":"责令停止使用非法设置的电台；情节严重的，可以并处警告、查封或者没收设备","D":"责令停止使用非法设置的电台并作出书面检查；情节严重的，可以并处一千元以下的罚 款"},"answer":"A","explanation":"业余电台干扰无线电业务正常进行：责令改正，拒不改正的没收产生有害干扰的设备、并处5万至20万罚款、吊销执照。B、C、D 都是针对'非法设置电台'的罚则。记忆：'干扰业务——没收设备+罚款+吊照'。"},{"id":"MC1-0161","category":"1.6.2","categoryName":"无线电接收设备","type":"MC1","selectCount":1,"question":"业余电台对船舶、航天器、航空器、铁路机车专用无线电导航、遇险救助和安全通信等 涉及人身安全的无线电频率产生有害干扰的，无线电管理机构可以根据其具体情况给予下列 处罚：","options":{"A":"处20 万元以上50 万元以下的罚款","B":"劝告拆除非法设置的电台；情节严重的，可以并处警告、查封或者没收设备","C":"责令停止使用非法设置的电台；情节严重的，可以并处警告、查封或者没收设备","D":"责令停止使用非法设置的电台并作出书面检查；情节严重的，可以并处一千元以下的罚 款"},"answer":"A","explanation":"对船舶、航天器、航空器、铁路机车专用无线电导航、遇险救助和安全通信等涉人身安全频率产生有害干扰，直接处20万至50万罚款，不给改正机会。记忆：'碰人身安全频率，20万到50万'。"},{"id":"MC2-0162","category":"1.6.2","categoryName":"无线电接收设备","type":"MC2","selectCount":2,"question":"研制、生产、销售和维修大功率无线电发射设备，未采取有效措施抑制电波发射的，无 线电管理机构可以根据其具体情况给予下列处罚：","options":{"A":"由无线电管理机构责令改正；拒不改正的，没收从事违法活动的设备，并处3 万元以上 10 万元以下的罚款","B":"造成严重后果的，并处10 万元以上30 万元以下的罚款","C":"责令停止使用非法设置的电台；情节严重的，可以并处警告、查封或者没收设备","D":"责令停止使用非法设置的电台并作出书面检查；情节严重的，可以并处一千元以下的罚 款"},"answer":"AB","explanation":"研制、生产、销售、维修大功率无线电发射设备未采取有效措施抑制电波发射：责令改正，拒不改正的没收设备并处3万至10万；造成严重后果的并处10万至30万。记忆：'大功率不屏蔽，3到10万，严重30万'。"},{"id":"MC2-0163","category":"1.6.2","categoryName":"无线电接收设备","type":"MC2","selectCount":2,"question":"境外组织或者个人在我国境内进行电波参数测试或者电波监测的，无线电管理机构可以 根据其具体情况给予下列处罚：","options":{"A":"由无线电管理机构责令改正；拒不改正的，没收从事违法活动的设备，并处3 万元以上 10 万元以下的罚款","B":"造成严重后果的，并处10 万元以上30 万元以下的罚款","C":"责令停止使用非法设置的电台；情节严重的，可以并处警告、查封或者没收设备","D":"责令停止使用非法设置的电台并作出书面检查；情节严重的，可以并处一千元以下的罚 款"},"answer":"AB","explanation":"境外组织或个人在我国境内进行电波参数测试或电波监测：责令改正，拒不改正的没收设备并处3万至10万；造成严重后果的并处10万至30万。C、D 是过时罚则。记忆：'境外来测波——同样3到30万'。"},{"id":"MC2-0164","category":"1.6.2","categoryName":"无线电接收设备","type":"MC2","selectCount":2,"question":"向境外组织或者个人提供涉及国家安全的境内电波参数资料的，无线电管理机构可以根 据其具体情况给予下列处罚：","options":{"A":"由无线电管理机构责令改正；拒不改正的，没收从事违法活动的设备，并处3 万元以上 10 万元以下的罚款","B":"造成严重后果的，并处10 万元以上30 万元以下的罚款","C":"责令停止使用非法设置的电台；情节严重的，可以并处警告、查封或者没收设备","D":"责令停止使用非法设置的电台并作出书面检查；情节严重的，可以并处一千元以下的罚 款"},"answer":"AB","explanation":"向境外组织或个人提供涉及国家安全的境内电波参数资料：责令改正，拒不改正的没收设备并处3万至10万；造成严重后果的并处10万至30万，属泄露国家安全信息。记忆：'电波参数不给境外，给就3万到30万'。"},{"id":"MC2-0165","category":"1.6.2","categoryName":"无线电接收设备","type":"MC2","selectCount":2,"question":"生产或者进口在国内销售、使用的无线电发射设备未取得型号核准的，无线电管理机构 可以根据其具体情况给予下列处罚：","options":{"A":"由无线电管理机构责令改正，处5 万元以上20 万元以下的罚款","B":"拒不改正的，没收未取得型号核准的无线电发射设备，并处20 万元以上100 万元以下的 罚款","C":"责令停止使用非法设置的电台；情节严重的，可以并处警告、查封或者没收设备","D":"责令停止使用非法设置的电台并作出书面检查；情节严重的，可以并处一千元以下的罚 款"},"answer":"AB","explanation":"生产或进口在国内销售、使用的无线电发射设备未取得型号核准：责令改正、处5万至20万；拒不改正的没收设备并处20万至100万。C、D 是过时罚则。记忆：'无核准就生产，5到20万，不改罚到100万'。"},{"id":"MC2-0166","category":"1.6.2","categoryName":"无线电接收设备","type":"MC2","selectCount":2,"question":"销售依照本条例第四十四条的规定应当取得型号核准的无线电发射设备未向无线电管理 机构办理销售备案的，无线电管理机构可以根据其具体情况给予下列处罚：","options":{"A":"由无线电管理机构责令改正","B":"拒不改正的，处1 万元以上3 万元以下的罚款","C":"责令停止使用非法设置的电台；情节严重的，可以并处警告、查封或者没收设备","D":"责令停止使用非法设置的电台并作出书面检查；情节严重的，可以并处一千元以下的罚 款"},"answer":"AB","explanation":"销售应取得型号核准的设备未向无线电管理机构办理销售备案：责令改正，拒不改正的处1万至3万，是所有罚则中最轻的一档。C、D 是过时罚则。记忆：'漏办备案最轻——1万到3万'。"},{"id":"MC2-0167","category":"1.6.2","categoryName":"无线电接收设备","type":"MC2","selectCount":2,"question":"关于违反《中华人民共和国无线电管理条例》规定，下列说法正确的是：","options":{"A":"构成违反治安管理行为的，依法给予治安管理处罚","B":"构成犯罪的，依法追究刑事责任","C":"进口无线电发射设备，携带、寄递或者以其他方式运输无线电发射设备入境，违反海关 监管法律法规的，由海关依法处罚","D":"违反《条例》规定，只需被无线电管理机构处罚"},"answer":"AB","explanation":"按官方答案选 AB：违反《条例》构成治安违法的给予治安管理处罚，构成犯罪的追究刑事责任。C 讲海关监管属另一范畴；D'只需无线电管理机构处罚'明显错误。记忆：'治安归公安，犯罪归法院'。"},{"id":"MC1-0168","category":"1.6.2","categoryName":"无线电接收设备","type":"MC1","selectCount":1,"question":"隐瞒有关情况、提供虚假材料或者虚假承诺申请业余无线电台设置、使用许可，无线电 管理机构可以给予下列处罚：","options":{"A":"无线电管理机构不予许可，并给予警告","B":"责令限期改正，可以处警告或者一千元以上，五千元以下的罚款","C":"责令限期改正，可以处警告或者一千元以下的罚款","D":"责令限期改正，情节严重的，可以并处警告、查封或者没收设备"},"answer":"A","explanation":"申请许可时隐瞒情况、提供虚假材料或虚假承诺的，无线电管理机构不予许可并给予警告，依据《行政许可法》第78条。B、C 的'责令改正、罚款'和 D 的没收设备都不适用申请阶段。记忆：'骗许可，不给办+警告'。"},{"id":"MC2-0169","category":"1.6.2","categoryName":"无线电接收设备","type":"MC2","selectCount":2,"question":"以欺骗、贿赂等不正当手段取得业余无线电台执照的，可以给予下列处罚：","options":{"A":"无线电管理机构依法给予行政处罚","B":"构成犯罪的，依法追究刑事责任","C":"责令限期改正，可以处警告或者一千元以下的罚款","D":"责令限期改正，情节严重的，可以并处警告、查封或者没收设备"},"answer":"AB","explanation":"以欺骗、贿赂等不正当手段取得业余电台执照的，无线电管理机构依法给予行政处罚；构成犯罪的追究刑事责任，依据《行政许可法》第79条。C、D 是过时或无关罚则。记忆：'骗来的执照——行政处罚+可能坐牢'。"},{"id":"MC1-0170","category":"1.6.2","categoryName":"无线电接收设备","type":"MC1","selectCount":1,"question":"在《中华人民共和国治安管理处罚法》中，无线电有关说法正确的是：","options":{"A":"违反国家规定，故意干扰无线电业务正常进行的，或者对正常运行的无线电台（站）产 生有害干扰，经有关主管部门指出后，拒不采取有效措施消除的，处五日以上十日以下拘留； 情节严重的，处十日以上十五日以下拘留","B":"违反国家规定，故意干扰无线电业务正常进行，或者对正常运行的无线电台（站）产生 有害干扰，经有关主管部门指出后，拒不采取有效措施消除的，不会采取拘留手段进行处理","C":"产生有害干扰不会受到处罚","D":"使用业余无线电台时，只要不对其他业余无线电台产生干扰即可"},"answer":"A","explanation":"《治安管理处罚法》第28条：故意干扰无线电业务或对正常运行电台产生有害干扰，经指出后拒不改正的，处五日以上十日以下拘留，情节严重处十日以上十五日以下。B 不会拘留、C 不受罚、D 只对业余台负责，都错。记忆：'干扰他人电台，5天起拘留'。"},{"id":"MC4-0171","category":"1.6.3","categoryName":"天线与馈线","type":"MC4","selectCount":4,"question":"关于《中华人民共和国网络安全法》，下列说法正确的是：","options":{"A":"任何个人和组织使用网络应当遵守宪法法律，遵守公共秩序，尊重社会公德，不得危害 网络安全","B":"不得利用网络从事危害国家安全、荣誉和利益的活动","C":"不得利用网络编造、传播虚假信息扰乱经济秩序和社会秩序","D":"不得利用网络侵害他人名誉、隐私、知识产权和其他合法权益"},"answer":"ABCD","explanation":"《网络安全法》要求用网遵守宪法法律和公序良俗，不得危害网络安全、危害国家安全荣誉利益、编造传播虚假信息扰乱经济和社会秩序、侵害他人名誉隐私知识产权，四条全对。记忆：'害国、造谣、侵权都不行'。"},{"id":"MC1-0172","category":"1.6.3","categoryName":"天线与馈线","type":"MC1","selectCount":1,"question":"《中华人民共和国国家安全法》中提到，国家安全工作应当坚持总体国家安全观，以人 民安全为（），以政治安全为（），以经济安全为（），以军事、文化、社会安全为（），以促 进国际安全为依托，维护各领域国家安全，构建国家安全体系，走中国特色国家安全道路。","options":{"A":"宗旨、根本、基础、保障","B":"宗旨、基础、保障、根本","C":"根本、基础、保障、宗旨","D":"基础、保障、宗旨、根本"},"answer":"A","explanation":"总体国家安全观：以人民安全为宗旨，以政治安全为根本，以经济安全为基础，以军事、文化、社会安全为保障。顺序要记牢'宗旨—根本—基础—保障'。记忆：'人民宗旨、政治根本、经济基础、军事文化社会保障'。"},{"id":"MC4-0173","category":"1.6.3","categoryName":"天线与馈线","type":"MC4","selectCount":4,"question":"以下哪些是《中华人民共和国国家安全法》中规定的公民和组织应当履行的义务？","options":{"A":"遵守宪法、法律法规关于国家安全的有关规定","B":"及时报告危害国家安全活动的线索","C":"如实提供所知悉的涉及危害国家安全活动的证据","D":"为国家安全工作提供便利条件或者其他协助"},"answer":"ABCD","explanation":"《国家安全法》规定的公民和组织义务：遵守国家安全法律法规、及时报告危害国家安全活动线索、如实提供相关证据、为国家安全工作提供便利或协助，四条全对。记忆：'守法、报告、举证、协助'四件事。"},{"id":"MC1-0174","category":"1.7.1","categoryName":"电磁兼容","type":"MC1","selectCount":1,"question":"业余无线电台在业余业务、卫星业余业务作为次要业务使用的频率或者与其他主要业务 共同使用的频率上发射操作时，应当注意：","options":{"A":"遵守无线电管理机构对该频率的使用规定","B":"首先守听频率是否已由其他业务电台占用，如听不到，即可按照先来先用的原则放心使 用","C":"只要遵守了《中华人民共和国无线电频率划分规定》的有关规定即可放心使用","D":"可以任意使用，但在遇到其他业务电台使用时要主动避让"},"answer":"A","explanation":"业余作为次要业务使用时，应当遵守无线电管理机构对该频率的使用规定。B 听不到就可'先来先用'放心使用是错的，次要业务必须避让主要业务；C 只看频率划分规定也不够。记忆：'次要业务——守规矩、让主要'。"},{"id":"MC1-0175","category":"1.7.1","categoryName":"电磁兼容","type":"MC1","selectCount":1,"question":"关于业余频率的使用，正确的叙述是：","options":{"A":"业余无线电台在无线电管理机构核准其使用的频段内，享有平等的频率使用权","B":"任何业余无线电台在任何频段都享有平等的频率使用权","C":"业余无线电台在无线电管理机构核准其使用的频段内，不同类别的业余电台享有不同优 先程度的频率使用权","D":"依法成立的地方业余无线电民间组织的业余电台，在其常用的台网频率上享有比其他个 人设置的业余电台优先的使用权"},"answer":"A","explanation":"在无线电管理机构核准的频段内，业余电台享有平等的频率使用权。B 任何频段都平等、C 不同类别优先程度不同、D 协会台网频率优先，都错，前提是'核准频段内'。记忆：'核准频段内人人平等'。"},{"id":"MC1-0176","category":"1.7.1","categoryName":"电磁兼容","type":"MC1","selectCount":1,"question":"在频率划分表中，当一个频段划分给业余业务或卫星业余业务和多个其他业务，并且业 余业务和卫星业余业务作为次要业务时，业余无线电台应该遵循的规则是：","options":{"A":"不得对主要业务电台产生有害干扰","B":"可要求保护不受来自主要业务电台的有害干扰","C":"不得对来自同一业务或其他次要业务电台的有害干扰提出保护要求","D":"容许因设备技术问题对主要业务电台产生短时间有害干扰"},"answer":"A","explanation":"作为次要业务，业余电台不得对主要业务电台产生有害干扰，这是第一铁律。B 可要求主要业务保护（次要无权）、C 不能要求次要业务间保护（实际可以）、D 技术问题可短时干扰，都错。记忆：'次要不干扰主要'。"},{"id":"MC1-0177","category":"1.7.1","categoryName":"电磁兼容","type":"MC1","selectCount":1,"question":"在频率划分表中，当一个频段划分给业余业务或卫星业余业务和多个其他业务，并且业 余业务和卫星业余业务作为次要业务时，业余无线电台遵循的规则是：","options":{"A":"不得对来自主要业务电台的有害干扰提出保护要求","B":"可要求保护不受来自主要业务电台的有害干扰","C":"不得对来自同一业务或其他次要业务电台的有害干扰提出保护要求","D":"容许因设备技术问题对主要业务电台产生短时间有害干扰"},"answer":"A","explanation":"作为次要业务，业余电台不得对来自主要业务电台的有害干扰提出保护要求，即不能要求主要业务让着自己。B 相反，C 错在次要业务之间其实可要求保护，D 可短时干扰主要业务，都错。记忆：'次要不找主要要保护'。"},{"id":"MC1-0178","category":"1.7.1","categoryName":"电磁兼容","type":"MC1","selectCount":1,"question":"在频率划分表中，当一个频段划分给业余业务或卫星业余业务和多个其他业务，并且业 余业务和卫星业余业务作为次要业务时，业余无线电台遵循的规则是：","options":{"A":"可要求保护不受来自同一业务或其他次要业务电台的有害干扰","B":"可要求保护不受来自主要业务电台的有害干扰","C":"不得对来自同一业务或其他次要业务电台的有害干扰提出保护要求","D":"容许因设备技术问题对主要业务电台产生短时间有害干扰"},"answer":"A","explanation":"作为次要业务，业余电台可要求保护不受来自同一业务或其他次要业务电台的有害干扰。B 要求主要业务保护、C 不能要求次要业务间保护、D 可短时干扰主要业务，都错。记忆：'次要之间可求保护，对主要只能避让'。"},{"id":"MC1-0179","category":"1.7.1","categoryName":"电磁兼容","type":"MC1","selectCount":1,"question":"我国分配给业余业务和卫星业余业务专用的频段有：","options":{"A":"7MHz、14MHz、21MHz、28MHz、47GHz 频段","B":"7MHz、14MHz、21MHz、28MHz、144MHz 频段","C":"3.5MHz、14MHz、21MHz、28MHz、10GHz 频段","D":"7MHz、14MHz、28MHz、144MHz、430MHz 频段"},"answer":"A","explanation":"我国业余专用（业余为唯一主要业务）频段为7、14、21、28MHz和47GHz。144MHz只是部分唯一主要、430MHz是次要业务，均非专用。记：专用认7/14/21/28，微波只认47GHz。"},{"id":"MC1-0180","category":"1.7.1","categoryName":"电磁兼容","type":"MC1","selectCount":1,"question":"我国分配给业余业务和卫星业余业务与其他业务共用、并且业余业务和卫星业余业务作 为主要业务之一的30MHz 以下频段有：","options":{"A":"1.8MHz、3.5MHz、14.25MHz、18.068MHz、24.89MHz 频段","B":"3.5MHz、7MHz、14.25MHz、21MHz、24.89MHz 频段","C":"3.5MHz、10.1MHz、14.25MHz、18.068MHz、29.7MHz 频段","D":"1.8MHz、10.1MHz、14.25MHz、18.068MHz、21.45MHz 频段"},"answer":"A","explanation":"30MHz以下业余与别业务共用且为主要业务之一的是1.8、3.5、14.25、18.068、24.89MHz；7/21/28是专用。记：主要共用认1.8、3.5、14.25、18.068、24.89。"},{"id":"MC1-0181","category":"1.7.1","categoryName":"电磁兼容","type":"MC1","selectCount":1,"question":"我国在VHF 和UHF 范围内分配给业余业务和卫星业余业务与其他业务共用并设业务类 别为主要业务与次要业务，以下那些频率分配给业余业务和卫星业余业务与其他业务共用并 且业余业务和卫星业余业务作为主要业务：","options":{"A":"50MHz、144MHz","B":"144MHz、430MHz","C":"50MHz、430MHz","D":"220MHz、430MHz"},"answer":"A","explanation":"VHF/UHF里业余作为主要业务（与其他业务共用）的是50MHz和144MHz。430MHz是次要业务、220MHz业余不使用。记：6米2米当主要，0.7米靠边站。"},{"id":"MC1-0182","category":"1.7.1","categoryName":"电磁兼容","type":"MC1","selectCount":1,"question":"我国分配给业余业务和卫星业余业务与其他业务共用、并且业余业务和卫星业余业务作 为唯一主要业务的频段的个数以及在3GHz 以下的该类频段分别为：","options":{"A":"3 个，144-146MHz","B":"4 个，7.0-7.2MHz","C":"5 个，50-54MHz","D":"5 个，28-29.7MHz"},"answer":"A","explanation":"业余作为唯一主要业务（可与次要业务共用）的频段共3个，其中3GHz以下的为144-146MHz。7/14/21/28MHz属专用频段，不在“唯一主要”之列。记：唯一主要找2米144-146MHz。"},{"id":"MC1-0183","category":"1.7.1","categoryName":"电磁兼容","type":"MC1","selectCount":1,"question":"我国分配给业余业务和卫星业余业务与其他业务共用、并且业余业务和卫星业余业务作 为次要业务的1200MHz 以下频段有：","options":{"A":"135.7kHz、5351.5KHz、10.1MHz、430MHz","B":"3.5MHz、7MHz、50MHz","C":"3.5MHz、18.068MHz、144MHz","D":"10.1MHz、24.89MHz、430MHz"},"answer":"A","explanation":"业余作为次要业务的有135.7kHz、5351.5kHz、10.1MHz和430MHz；3.5、7、50、144是主要或专用。记：次要业务=135.7k、5351.5k、10.1M、430M。"},{"id":"MC1-0184","category":"1.7.1","categoryName":"电磁兼容","type":"MC1","selectCount":1,"question":"我国分配给业余业务和卫星业余业务的频率最高的频段及其共用类别是：","options":{"A":"248-250GHz，唯一主要业务","B":"134-136GHz，唯一主要业务","C":"47-47.2GHz，专用业务","D":"77.5-78GHz，主要业务"},"answer":"A","explanation":"我国分配业余业务频率最高的频段是248-250GHz，共用类别为唯一主要业务。47-47.2GHz虽专用但频率较低。记：业余最高频段是248-250GHz。"},{"id":"MC1-0185","category":"1.7.1","categoryName":"电磁兼容","type":"MC1","selectCount":1,"question":"国际业余无线电界把WARC-76 增加分配给业余业务和卫星业余业务的三个HF 频段俗 称为WARC 频段，它们的频率范围是：","options":{"A":"10.1-10.15MHz、18.068-18.168MHz、24.89-24.99MHz","B":"10.068-10.168MHz、18.1-18.15MHz、24.89-24.99MHz","C":"10.1-10.15MHz、18.89-18.99MHz、24.068-24.168MHz","D":"10.89-10.88MHz、18.1-18.15MHz、24.068-24.168MHz"},"answer":"A","explanation":"WARC-76增加的三个HF业余频段是10.1-10.15、18.068-18.168、24.89-24.99MHz，干扰项把数值错位。记：WARC三兄弟=10.1、18.068、24.89。"},{"id":"MC1-0186","category":"1.7.1","categoryName":"电磁兼容","type":"MC1","selectCount":1,"question":"俗称的40 米业余波段，其在ITU1、2、3 区的频率范围以及业余业务和卫星业余业务的 使用状态分别为：","options":{"A":"7.0-7.2MHz、7.0-7.3MHz、7.0-7.2MHz，专用","B":"7.0-7.3MHz、7.0-7.3MHz、7.0-7.3MHz，专用","C":"7.0-7.3MHz、7.0-7.3MHz、7.0-7.2MHz，专用","D":"7.0-7.1MHz、7.0-7.2MHz、7.0-7.3MHz，专用"},"answer":"A","explanation":"40米波段范围：ITU1区7.0-7.2、2区7.0-7.3、3区7.0-7.2MHz，均作专用。只有2区多到7.3。记：2区大一圈，1、3区都是7.0-7.2。"},{"id":"MC1-0187","category":"1.7.1","categoryName":"电磁兼容","type":"MC1","selectCount":1,"question":"俗称的160 米业余波段的频率范围以及业余业务和卫星业余业务的使用状态分别为：","options":{"A":"1800-2000kHz，主要业务","B":"1800-1900kHz，次要业务","C":"1900-2000kHz，主要业务","D":"1700-1900kHz，专用业务"},"answer":"A","explanation":"160米业余波段为1800-2000kHz，业余为主要业务。1800-1900范围砍半、1900-2000起点错、1700-1900越界。记：160米=1.8-2.0MHz，主要业务。"},{"id":"MC1-0188","category":"1.7.1","categoryName":"电磁兼容","type":"MC1","selectCount":1,"question":"俗称的80 米业余波段的频率范围以及业余业务和卫星业余业务的使用状态分别为：","options":{"A":"3.5-3.9MHz，主要业务","B":"3.5-3.9MHz，次要业务","C":"3.5-4.0MHz，主要业务","D":"3.5-3.6MHz，专用业务"},"answer":"A","explanation":"80米业余波段为3.5-3.9MHz，业余为主要业务。到3.9为止（不到4.0），3.6截断太窄。记：80米=3.5-3.9MHz，主要业务。"},{"id":"MC1-0189","category":"1.7.1","categoryName":"电磁兼容","type":"MC1","selectCount":1,"question":"俗称的20 米业余波段的频率范围以及业余业务和卫星业余业务的使用状态分别为：","options":{"A":"14-14.25MHz 为专用，14.25-14.35 为主要业务","B":"14-14.15MHz 为专用，14.15-14.25 为主要业务","C":"14-14.35MHz 为专用，14.35-14.45 为主要业务","D":"14-14.35MHz，专用"},"answer":"A","explanation":"20米波段：14-14.25MHz业余专用，14.25-14.35MHz为主要业务与其他业务共用。14.35以上越界。记：20米前半专用，后半共用。"},{"id":"MC1-0190","category":"1.7.1","categoryName":"电磁兼容","type":"MC1","selectCount":1,"question":"俗称的15 米业余波段的频率范围以及业余业务和卫星业余业务的使用状态分别为：","options":{"A":"21-21.45MHz，专用","B":"21-21.45MHz，主要业务","C":"21-21.35MHz，专用","D":"21-21.45MHz，次要业务"},"answer":"A","explanation":"15米业余波段为21-21.45MHz，我国业余作专用（唯一主要业务）。21-21.35范围错，“主要业务”“次要业务”类别错。记：15米=21-21.45MHz，专用。"},{"id":"MC1-0191","category":"1.7.1","categoryName":"电磁兼容","type":"MC1","selectCount":1,"question":"俗称的10 米业余波段的频率范围以及业余业务和卫星业余业务的使用状态分别为：","options":{"A":"28-29.7MHz，专用","B":"28-29.7MHz，主要业务","C":"28-29.6MHz，专用","D":"28-30MHz，次要业务"},"answer":"A","explanation":"10米业余波段为28-29.7MHz，我国业余作专用。28-29.6、28-30都范围错，次要业务类别错。记：10米=28-29.7MHz，专用。"},{"id":"MC1-0192","category":"1.7.1","categoryName":"电磁兼容","type":"MC1","selectCount":1,"question":"俗称的6 米业余波段的频率范围以及业余业务和卫星业余业务的使用状态分别为：","options":{"A":"50-54MHz，主要业务","B":"50-52MHz，次要业务","C":"51-54MHz，专用","D":"52-56MHz，次要业务"},"answer":"A","explanation":"6米业余波段为50-54MHz，我国业余为主要业务。50-52、51-54、52-56都范围错。记：6米=50-54MHz，主要业务。"},{"id":"MC1-0193","category":"1.7.1","categoryName":"电磁兼容","type":"MC1","selectCount":1,"question":"俗称的2 米业余波段的频率范围以及我国业余业务和卫星业余业务的使用状态分别为：","options":{"A":"144-148MHz；其中144-146MHz 为唯一主要业务，146-148MHz 为与其他业务共同作 为主要业务","B":"144-146MHz；专用","C":"144-148MHz；其中144-146MHz 为专用，146-148MHz 为次要业务","D":"144-148MHz；次要业务"},"answer":"A","explanation":"2米波段144-148MHz：144-146MHz业余为唯一主要业务，146-148MHz与固定/移动等共同作为主要业务。“专用”“次要”表述均错。记：2米144-146独占，146-148共享。"},{"id":"MC1-0194","category":"1.7.1","categoryName":"电磁兼容","type":"MC1","selectCount":1,"question":"俗称的0.7 米业余波段的频率范围以及业余业务和卫星业余业务的使用状态分别为：","options":{"A":"430-440MHz，次要业务","B":"430-440MHz，主要业务","C":"430-440MHz，专用","D":"420-470MHz，次要业务"},"answer":"A","explanation":"0.7米业余波段为430-440MHz，我国业余为次要业务（主要业务是无线电定位）。“主要”“专用”都错。记：0.7米业余是次要业务。"},{"id":"MC1-0195","category":"1.7.1","categoryName":"电磁兼容","type":"MC1","selectCount":1,"question":"在我国和多数其他国家的频率分配中，业余业务在430-440MHz 频段中作为次要业务与 其他业务共用。这个频段中我国分配的主要业务是：","options":{"A":"无线电定位和航空无线电导航","B":"固定业务","C":"移动业务","D":"水上移动和航空移动"},"answer":"A","explanation":"430-440MHz我国主要业务是无线电定位和航空无线电导航，业余为次要业务不得干扰。固定、移动业务不是主要。记：0.7米主要业务是雷达定位和航导。"},{"id":"MC1-0196","category":"1.7.1","categoryName":"电磁兼容","type":"MC1","selectCount":1,"question":"我国分配给业余业务和卫星业余业务的属于低频（LF）范围的频段为：","options":{"A":"135.7-137.8kHz","B":"137.8-138.6kHz","C":"134.7-135.8kHz","D":"472-479kHz"},"answer":"A","explanation":"我国业余最低频段135.7-137.8kHz属低频LF（30-300kHz）即长波。137.8-138.6等边界错，472-479kHz是中波。记：业余最低段=长波LF。"},{"id":"MC1-0197","category":"1.7.1","categoryName":"电磁兼容","type":"MC1","selectCount":1,"question":"短波业余电台应避免在IARU 信标工作频率±500Hz 的范围内发射电波。这些频率是：","options":{"A":"14.100MHz、18.110MHz、21.150MHz、24.930MHz、28.200MHz","B":"7.100MHz、10.070MHz、14.100MHz、21.100MHz、28.200MHz","C":"7.150MHz、14.110MHz、18.150MHz、21.150MHz、28.150MHz","D":"14.150MHz、18.100MHz、21.200MHz、24.930MHz、28.200MHz"},"answer":"A","explanation":"应避开的IARU信标频率为14.100、18.110、21.150、24.930、28.200MHz，±500Hz内禁发，干扰项混入错值。记：信标看.100/.110/.150/.930/.200。"},{"id":"MC1-0198","category":"1.7.1","categoryName":"电磁兼容","type":"MC1","selectCount":1,"question":"我国短波业余电台在7MHz 频段进行LSB 通话时可以实际占用的频率为：","options":{"A":"7.030-7.200MHz","B":"7.000-7.100MHz","C":"7.023-7.200MHz","D":"7.000-7.200MHz"},"answer":"A","explanation":"7MHz波段LSB话务实际占用7.030-7.200MHz，7.000-7.030留给CW/RTTY。从7.000起或到7.100都错。记：7MHz话务从7.030起，低端留电报。"},{"id":"MC1-0199","category":"1.7.1","categoryName":"电磁兼容","type":"MC1","selectCount":1,"question":"短波业余电台在14MHz 频段进行USB 通话时可以实际占用的频率为：","options":{"A":"14.100-14.350MHz","B":"14.030-14.350MHz","C":"14.000-14.250MHz","D":"14.070-14.250MHz"},"answer":"A","explanation":"14MHz波段USB话务实际占用14.100-14.350MHz，14.000-14.100留给CW/RTTY。记：14MHz话务从14.100起，低端留给电报。"},{"id":"MC1-0200","category":"1.7.1","categoryName":"电磁兼容","type":"MC1","selectCount":1,"question":"短波业余电台在18MHz 频段进行USB 通话时可以实际占用的频率为：","options":{"A":"18.1105-18.168MHz","B":"18.110-18.170MHz","C":"18.068-18.186MHz","D":"18.1005-18.180MHz"},"answer":"A","explanation":"18MHz波段USB话务实际占用18.1105-18.168MHz，低端18.068-18.1105留给CW/RTTY，干扰项边界错。记：18MHz话务18.1105起，贴着信标18.110。"},{"id":"MC1-0201","category":"1.7.1","categoryName":"电磁兼容","type":"MC1","selectCount":1,"question":"短波业余电台在21MHz 频段进行USB
