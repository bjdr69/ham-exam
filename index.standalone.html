","C":"可以耐受的电压过载能力强","D":"可以耐受的电压过载能力弱"},"answer":"A","explanation":"每伏欧姆数=电压表内阻/量程档位，数值越大内阻越高、分走的电流越小，对被测电路影响越小，A对。B把影响说反，C/D与内阻无关。记忆：Ω/V越大表越'轻'。"},{"id":"MC1-1305","category":"4.6.1","categoryName":"常用测试仪器","type":"MC1","selectCount":1,"question":"用数字万用表的直流电压档测量电路两点间某个等幅音频信号的电压，发现读数不为零。 交换两支表笔之后再测，所得读数的极性反转。正确的推论是：","options":{"A":"音频信号上叠加有直流成分","B":"音频信号含有丰富的谐波","C":"万用表的频率响应太差","D":"表笔导线间的分布电容影响了测量"},"answer":"A","explanation":"直流电压档只显示平均直流分量。等幅音频是交流，平均值应为零；读数非零且换笔极性反转，说明信号上叠加了直流成分。谐波、频响、分布电容都改变不了均值为零。"},{"id":"MC1-1345","category":"5.1.1","categoryName":"用电安全","type":"MC1","selectCount":1,"question":"业余无线电发射设备的下列指标必须符合国家的相关规定：","options":{"A":"频率容限和杂散域发射功率","B":"频率调制频偏和调制度","C":"频率容限和带外发射","D":"指配频段和必要带宽"},"answer":"A","explanation":"国家规定业余发射设备必须符合两大指标：频率容限（频率准不准）和杂散域发射功率（带外乱发多强），A对。调制度、带宽属正常工作参数，非强制检验项。"},{"id":"MC1-1346","category":"5.1.1","categoryName":"用电安全","type":"MC1","selectCount":1,"question":"业余电台的无线电发射设备应符国家规定的下列主要技术指标：","options":{"A":"符合频率容限、符合杂散发射最大允许功率电平","B":"杂散发射不低于最大允许功率电平、电源电压及频率符合国家电网标准、采用标准天线 阻抗","C":"杂散发射不低于最大允许功率电平、频率漂移不低于频率容限、电源利用效率满足节能 要求","D":"工作频率范围足够宽、杂散发射不低于最大允许功率电平、带宽大于允许最低值"},"answer":"A","explanation":"法规要求频率容限合格、杂散发射不超过最大允许功率电平，A正确。B/C/D的'不低于''足够宽''带宽大于'都是反向错误表述，杂散电平本应越低越好。"},{"id":"MC2-1347","category":"5.1.1","categoryName":"用电安全","type":"MC2","selectCount":2,"question":"频率容限是指：","options":{"A":"发射所占频段的中心频率偏离指配频率的最大容许偏差","B":"发射的特征频率偏离参考频率的最大容许偏差","C":"发射所占频段的中心频率偏离最高频率的最大容许偏差","D":"发射的特征频率偏离必要频率的最大容许偏差"},"answer":"AB","explanation":"频率容限=允许偏多少。ITU定义包括：发射所占频段中心频率偏离指配频率的最大容许偏差(A)，以及特征频率偏离参考频率的最大容许偏差(B)。C/D把参照换成'最高''必要'频率，定义就错了。"},{"id":"MC2-1348","category":"5.1.1","categoryName":"用电安全","type":"MC2","selectCount":2,"question":"频率容限是发射设备的重要指标，通常用下述单位来表示：","options":{"A":"百万分之几","B":"赫兹","C":"百分之几","D":"兆赫"},"answer":"AB","explanation":"频率容限常用百万分之几(ppm)表示相对偏差，也直接用赫兹(Hz)表示绝对偏差，AB正确。百分之几、兆赫不是这类偏差的常用单位，排除。"},{"id":"MC3-1349","category":"5.1.1","categoryName":"用电安全","type":"MC3","selectCount":3,"question":"杂散域发射功率是发射设备的重要指标，通常用下述单位来表示：","options":{"A":"绝对功率dBm","B":"低于载波发射功率的分贝值dBc","C":"低于PEP 发射功率的相对值dB","D":"绝对功率（瓦）"},"answer":"ABC","explanation":"杂散域发射功率可用绝对电平dBm(A)、相对载波的dBc(B)、相对PEP的dB(C)表示，三种都对。D用'瓦'作单位不匹配，排除。"},{"id":"MC3-1350","category":"5.1.1","categoryName":"用电安全","type":"MC3","selectCount":3,"question":"杂散发射是指：","options":{"A":"必要带宽之外的一个或多个频率的发射，其发射电平可降低而不致影响相应信息的传输","B":"杂散发射包括谐波发射、寄生发射","C":"杂散发射包括互调产物、变频产物","D":"杂散发射包括谐波发射、带外发射"},"answer":"ABC","explanation":"杂散发射=必要带宽之外的发射，包括谐波、寄生、互调、变频产物，ABC对。带外发射是调制过程固有的相邻频谱，不属于杂散，D排除。口诀：杂散不带'带外'。"},{"id":"MC1-1351","category":"5.1.1","categoryName":"用电安全","type":"MC1","selectCount":1,"question":"业余无线电专用发射设备必须满足的主要技术指标要求包括：","options":{"A":"频率容限和杂散辐射不超过限值，发射频率不超出国家规定的业余业务和卫星业余业务 频率","B":"频率容限不低于限值，杂散辐射不超过限值，发射频率不超出国家规定的业余业务和卫 星业余业务频率","C":"频率容限和杂散辐射不超过限值，发射频率包括业余业务和卫星业余业务频率","D":"发射功率不低于功率限值，输出阻抗符合工业标准"},"answer":"A","explanation":"专业业余发射设备须满足：频率容限、杂散辐射均不超过限值，发射频率不超出业余业务和卫星业余业务频段，A全对。B'不低于'、C'包括'、D'功率不低于'都是反向陷阱。"},{"id":"MC1-1352","category":"5.1.1","categoryName":"用电安全","type":"MC1","selectCount":1,"question":"下列情况会产生减幅波辐射：","options":{"A":"电路接触点打火","B":"对讲机按键发射","C":"电视机本振泄漏","D":"医用高频加热器泄漏"},"answer":"A","explanation":"减幅波即振幅逐渐衰减的阻尼振荡。触点打火是火花放电，产生一串减幅波，A对。对讲机发射、本振泄漏、加热器泄漏都是连续等幅波。"},{"id":"MC2-1353","category":"5.1.2","categoryName":"防雷措施","type":"MC2","selectCount":2,"question":"按照国家标准GB8702-2014《电磁环境控制限值》，从电磁环境保护管理角度，向没有 屏蔽空间发射电磁场可以免于管理的有：","options":{"A":"频率范围为0.1-3MHz，等效辐射功率小于300 瓦的无线电通信设施（设备）","B":"频率范围为3MHz-300GHz，等效辐射功率小于100 瓦的无线电通信设施（设备）","C":"发射频率在30MHz 以下的所有业余电台","D":"发射频率在30MHz 以上的所有业余电台"},"answer":"AB","explanation":"GB8702-2014规定：0.1-3MHz、等效辐射功率<300W，3MHz-300GHz、<100W的无线电通信设施可免于管理，AB对。C/D按业余与否、30MHz分界，与国标不符。"},{"id":"MC1-1354","category":"5.1.2","categoryName":"防雷措施","type":"MC1","selectCount":1,"question":"根据国家标准GB8702-2014《电磁环境控制限值》，公众曝露是指：","options":{"A":"公众所受的全部电场、磁场、电磁场照射","B":"职业照射","C":"医疗照射","D":"医学诊断或治疗所受到的辐射照射"},"answer":"A","explanation":"公众曝露指公众所受的全部电场、磁场、电磁场照射，A对。职业照射、医疗照射是与公众曝露并列的其他类别，B/C/D都不构成定义。"},{"id":"MC1-1355","category":"5.1.2","categoryName":"防雷措施","type":"MC1","selectCount":1,"question":"为什么我国《电磁环境控制限值》标准中的照射限值伴随频率有所不同？","options":{"A":"人体对某些特定波长的电磁波有更多的吸收","B":"较低频率的无线电波不会穿透人体","C":"因为自然界中频率较高电磁波并不常见","D":"较低频率的无线电波较更高频率的无线电波拥有更高的能量"},"answer":"A","explanation":"人体对某些频段的电磁波吸收更多，吸收率高、限值就严，故限值随频率变化，A对。频率高低与穿透力、单光子能量都不是限值随频率变化的主因。"},{"id":"MC3-1356","category":"5.1.2","categoryName":"防雷措施","type":"MC3","selectCount":3,"question":"关于自制、改装、拼装无线电发射设备，下列说法正确的是：","options":{"A":"自制、改装、拼装的无线电发射设备，应符合《业余无线电设备射频技术要求及测试方 法》（GB/T 32658-2016）所列技术要求","B":"自制、改装、拼装的无线电发射设备，应符合《短波单边带通信设备通用规范》（GB/T 16946-2017）所列技术要求","C":"无线电管理机构可根据相关标准规范免费开展有关技术检测","D":"自制、改装、拼装无线电发射设备可不受无线电管理机构的监督管理"},"answer":"ABC","explanation":"自制/改装/拼装设备须符合GB/T 32658-2016（业余设备射频技术要求）或GB/T 16946-2017（短波单边带规范），管理机构可免费检测，ABC对。D'不受监管'违法，排除。"},{"id":"MC1-1357","category":"5.1.2","categoryName":"防雷措施","type":"MC1","selectCount":1,"question":"空中的VHF 和UHF 信号属于下面哪一类辐射？","options":{"A":"非电离辐射","B":"电离辐射","C":"阿尔法辐射","D":"伽玛辐射"},"answer":"A","explanation":"VHF/UHF射频能量不足以电离原子，属非电离辐射，A对。电离辐射（α、γ等）才具剥离电子的能力，与无线电信号无关。"},{"id":"MC1-1358","category":"5.1.3","categoryName":"防雷装置","type":"MC1","selectCount":1,"question":"业余电台安装防雷装置是为了防止雷电危害。传统防雷装置的主要组成部分包括：","options":{"A":"接闪器（避雷针）、引下线、接地体","B":"天线、断路器、地线","C":"避雷针、氖灯、自复保险丝","D":"避雷针、氧化锌过压保护器、断路器"},"answer":"A","explanation":"传统防雷装置=接闪器(避雷针)+引下线+接地体，三段缺一不可，A对。断路器、熔丝、氖灯、氧化锌压敏属过流过压保护器件，不是防雷装置三大件。"},{"id":"MC1-1359","category":"5.1.3","categoryName":"防雷装置","type":"MC1","selectCount":1,"question":"防雷接地的作用是：","options":{"A":"把接闪器引入的雷击电流有效地泄入大地","B":"用接闪器感应到的雷电高压启动过压保护电路","C":"有效地阻断接闪器引入的雷击电流使其不致流入大地","D":"当接闪器引入雷击电流时迅速烧断熔丝，阻断其流动"},"answer":"A","explanation":"防雷接地的作用是把接闪器接住的雷电流快速泄入大地，A对。B'感应启动保护'、C'阻断电流'、D'烧断熔丝'都违背泄放原理。"},{"id":"MC1-1360","category":"5.1.3","categoryName":"防雷装置","type":"MC1","selectCount":1,"question":"关于防雷装置的接地，最基本要求为：","options":{"A":"要有单独的接地体，接地电阻要小，接闪器到接地体之间的引下线应尽量短而粗","B":"可以利用自来水管作为接地体，如果这种管线有相当长的一段是埋入地下的","C":"交流电网的“零线”在配电系统中已经接地。这可代替防雷接地体及其引下线","D":"接闪器到接地体之间的引下线平时没有电流流过，采用直径0.5 毫米的导线足矣"},"answer":"A","explanation":"防雷接地最基本要求：独立接地体、接地电阻小、引下线短而粗，A对。自来水管、交流零线不能代替专用防雷地；0.5mm细引线泄雷必烧毁，B/C/D皆错。"},{"id":"MC1-1361","category":"5.1.3","categoryName":"防雷装置","type":"MC1","selectCount":1,"question":"对于一般建筑物，单支避雷针的保护范围至多能有多大：","options":{"A":"在避雷针顶点至地面之间，由60 米半径滚球曲线所构成的空间","B":"在任何情况下，避雷针都可以保护其周边低于避雷针高度的空间","C":"在任何情况下，避雷针都可以保护其周边半径30 米之内的物体","D":"从避雷针顶点起、以避雷针高度为半径所做半球体以内的空间"},"answer":"A","explanation":"一般建筑物按滚球法，单支避雷针保护范围由60米半径滚球曲线围成，A对。'半径30米''半球体''低于针高全保护'都是想当然，需按高度用滚球法计算。"},{"id":"MC1-1362","category":"5.1.3","categoryName":"防雷装置","type":"MC1","selectCount":1,"question":"下列哪种导电材料最适宜连接天线、塔架和入室馈线等处的各个接地部件？","options":{"A":"镀银软铜丝编织扁带","B":"圆形铜包钢单股导线","C":"以太网双绞线","D":"50-3 同轴电缆"},"answer":"A","explanation":"镀银软铜丝编织扁带表面积大、柔软、接触可靠，最适合连接天线塔与入室馈线各接地部件，A对。铜包钢单股、双绞线、同轴电缆都不是专用接地连接件。"},{"id":"MC1-1363","category":"5.1.3","categoryName":"防雷装置","type":"MC1","selectCount":1,"question":"在为同轴馈线安装避雷器时应当注意什么？","options":{"A":"将所有避雷器的地线接到同一个金属条带上，然后将条带可靠连到室外的接地处","B":"在每个避雷器的地线连接处安装开关以在发信时断开，防止射频电流损伤避雷器","C":"将每个避雷器的接地连线都单独引出，然后将它们与电台的地线连在一起","D":"可用廉价的氖灯或气体放电管自制避雷器。这样的DIY 可谓经济实用，效果卓著"},"answer":"A","explanation":"多个避雷器的地线应共接同一金属条带，再可靠引到室外接地处，单点汇总最规范，A对。发信时断开地线、各线单独接电台地、氖灯自制都不对或危险。"},{"id":"MC1-1364","category":"5.1.3","categoryName":"防雷装置","type":"MC1","selectCount":1,"question":"以下哪一项是天线铁塔防雷接地的有效措施？","options":{"A":"接地连接要尽可能地短而直","B":"确保需要弯折的地线已做干净漂亮的直角弯","C":"为接地系统做好防水处理","D":"打入地下的接地装置应当尽量远离天线塔"},"answer":"A","explanation":"接地连接越短越直、电感越小、泄流越快，是防雷接地有效性的关键，A对。直角弯增大电感，B错；防水是次要；接地体应靠近塔基，C/D错。"},{"id":"MC1-1365","category":"5.1.4","categoryName":"带电作业安全","type":"MC1","selectCount":1,"question":"考虑实际工作环境必然存在一定的湿度，则根据GB/T 3805－2008《特低电压ELV 限值》 在潮湿条件下的限值，当人体握紧某个带电零件时，零件与人体间的电压不可高于：","options":{"A":"交流16V（r.m.s.），直流33V","B":"交流24V（r.m.s.），直流36V","C":"交流36V（r.m.s.），直流24V","D":"交流6.3V（r.m.s.），直流13.8V"},"answer":"A","explanation":"GB/T 3805-2008潮湿条件下手握带电零件，限值为交流16V(r.m.s.)、直流33V，A对。干燥条件才放宽到交流33V/直流70V，B/C/D数值或搭配不对。"},{"id":"MC1-1366","category":"5.1.4","categoryName":"带电作业安全","type":"MC1","selectCount":1,"question":"假如接触电压相同，则触及带有射频电压（例如，频率不低于LF）的裸露导线与触及带 有直流或交流50Hz 电压的裸露导线相比，人体所受的安全威胁有什么不同？","options":{"A":"致死风险有所下降，但是灼伤皮肤或深层皮下组织的风险显著上升","B":"更容易导致神经系统损伤或使心肺功能紊乱，存在更高的致死风险","C":"射频交流电从不威胁人身安全，所以发射机的天线都可以随意触摸","D":"触及不同频率但电压相同的交流电，人体当然面临相同的安全威胁"},"answer":"A","explanation":"射频电流有集肤效应，主要在体表流过，不易引发心室纤颤，致死风险下降；但能量集中易灼伤皮肤和皮下组织，灼伤风险上升，A对。"},{"id":"MC1-1367","category":"5.1.4","categoryName":"带电作业安全","type":"MC1","selectCount":1,"question":"如果用两手分别接触电压有效值相同但频率不同的电路的两个端点，则所受安全威胁由 大到小可以排序为：","options":{"A":"工频交流电、HF 射频交流电、UHF 射频交流电","B":"UHF 射频交流电、HF 射频交流电、工频交流电","C":"HF 射频交流电、工频交流电、UHF 射频交流电","D":"HF 射频交流电、UHF 射频交流电、工频交流电"},"answer":"A","explanation":"工频50Hz最易引发心室纤颤，致死威胁最大；HF射频次之，UHF射频电流更集中于表面，威胁最小。频率越高流经心脏的电流越弱，排序为A。"},{"id":"MC1-1368","category":"5.1.4","categoryName":"带电作业安全","type":"MC1","selectCount":1,"question":"如果不得已，必须带电检修由市电供电的无线电设备，则应做到：","options":{"A":"双脚与地绝缘，单手操作，另一只手不触摸机壳等任何与电路或接地有关的金属件","B":"双脚与地绝缘，单手操作，另一只手通过触摸机壳或水管等接地物件探测是否有电","C":"只要设备外壳良好接地，双脚是否与地绝缘、双手是否同时操作都不存在安全风险","D":"只要设备外壳与地绝缘，双脚是否与地绝缘、双手是否同时操作都不存在安全关系"},"answer":"A","explanation":"带电检修铁律：双脚与地绝缘以防形成电流回路，单手操作，另一只手绝不触摸机壳、水管等接地金属件，A对。用手试电正是大忌。"},{"id":"MC3-1369","category":"5.1.4","categoryName":"带电作业安全","type":"MC3","selectCount":3,"question":"设备的外壳带电可能危及人身安全。相关预防措施包括：","options":{"A":"对于使用交流市电供电的设备，应将其金属机箱与某个可靠的公共地线相连","B":"应在供电线路中安装漏电保护器，以在发生漏电时迅速切断供电","C":"如果某设备使用了带有单独保护地线的三线插头，则必须确认接地是有效的","D":"公共地线应具有较低的接地电阻，与自来水管道相连是个一劳永逸的好主意"},"answer":"ABC","explanation":"防外壳带电：机箱接可靠公共地线、装漏电保护器迅速断电、三线插头确认接地有效，ABC对。自来水管接地不可靠还殃及他人，D排除。"},{"id":"MC1-1370","category":"5.1.4","categoryName":"带电作业安全","type":"MC1","selectCount":1,"question":"即使设备的电源线已经拔掉，检修时仍可能遇到什么安全风险？","options":{"A":"充满高电压的电容器可能让维修者遭遇电击风险","B":"地磁活动可在变压器中激起高压，电到维修人员","C":"打开电源设备或电子管线性放大器的机箱，其内置保险丝就会烧断","D":"如果打开机箱，静电放电就可能损坏设备的接地系统"},"answer":"A","explanation":"拔掉电源线不等于没电：滤波电容可能存有高压电荷，直接触碰会遭电击，A对。检修前应先放电。B/C/D均属无稽之谈。"},{"id":"MC1-1371","category":"5.1.4","categoryName":"带电作业安全","type":"MC1","sele // --- State ---
let questions = [];
let categories = [];
let state = { answered: {}, wrong: {}, score: 0, seqIndex: 0, catProgress: {} };
let exam = { questions: [], index: 0, score: 0, results: [], mode: '', category: '', selected: new Set() };

// --- Storage ---
const STORAGE_KEY = 'ham_exam_state';
function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (s) state = { answered: {}, wrong: {}, score: 0, seqIndex: 0, catProgress: {}, ...s };
  } catch(e) {}
}
function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

// --- Init ---
// 内嵌数据兜底：单文件版（index.standalone.html）会把题库直接写进页面，
// 保证无网络 / Service Worker 失效时应用仍能启动。
const EMBEDDED = (typeof window.__HAM_EMBEDDED__ !== 'undefined' && window.__HAM_EMBEDDED__)
  ? window.__HAM_EMBEDDED__ : null;

// 首次启动：尝试从网络拉最新题库，4 秒内无响应则放弃，
// 回退到内嵌数据，保证界面绝不卡在加载。
const BOOT_TIMEOUT = 4000;
function bootData() {
  return new Promise((resolve, reject) => {
    const timer = setTimeout(() => reject(new Error('网络超时')), BOOT_TIMEOUT);
    fetch('data/questions.json')
      .then(r => r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)))
      .then(data => {
        if (!Array.isArray(data) || data.length === 0) throw new Error('题库为空');
        clearTimeout(timer);
        resolve(true);
      })
      .catch(err => { clearTimeout(timer); reject(err); });
  });
}
async function init() {
  // 内嵌数据已在页面里，网络只是"尝鲜"，永远不阻塞使用
  if (EMBEDDED) {
    questions = EMBEDDED.questions || [];
    categories = EMBEDDED.categories || [];
    try { await bootData(); } catch (e) { /* 网络不可用，已用内嵌数据 */ }
    return;
  }
  // 无内嵌数据（在线版）：必须靠网络，但也加超时，失败显示提示而非永久卡住
  try {
    const [qRes, cRes] = await Promise.race([
      Promise.all([fetch('data/questions.json'), fetch('data/categories.json')]),
      new Promise((_, reject) => setTimeout(() => reject(new Error('网络超时')), BOOT_TIMEOUT))
    ]);
    if (qRes.ok && cRes.ok) {
      const q = await qRes.json();
      const c = await cRes.json();
      if (Array.isArray(q) && q.length > 0) { questions = q; categories = c; return; }
    }
    throw new Error('题库拉取失败');
  } catch (e) {
    console.warn('[HAM] 题库加载失败:', e && e.message);
  }
}
function finishBoot() {
  if (questions.length === 0) {
    document.getElementById('totalCount').textContent = '加载失败';
    document.getElementById('statScore').textContent = '!';
    return;
  }
  loadState();
  updateHomeStats();
  initTheme();
}


// --- Theme ---
function initTheme() {
  const saved = localStorage.getItem('ham_theme');
  const toggle = document.getElementById('themeToggle');
  if (saved === 'light') {
    document.documentElement.style.setProperty('color-scheme', 'light');
    toggle.textContent = '☀️';
  } else if (saved === 'dark') {
    document.documentElement.style.setProperty('color-scheme', 'dark');
    toggle.textContent = '🌙';
  } else {
    const dark = matchMedia('(prefers-color-scheme: dark)').matches;
    toggle.textContent = dark ? '🌙' : '☀️';
  }
}
document.getElementById('themeToggle').onclick = function() {
  const cur = getComputedStyle(document.documentElement).colorScheme;
  const dark = cur === 'dark' || matchMedia('(prefers-color-scheme: dark)').matches;
  const next = dark ? 'light' : 'dark';
  document.documentElement.style.setProperty('color-scheme', next);
  localStorage.setItem('ham_theme', next);
  this.textContent = next === 'dark' ? '🌙' : '☀️';
};

// --- Navigation ---
function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function goHome() { updateHomeStats(); showPage('pageHome'); }

// --- Home Stats ---
function updateHomeStats() {
  const answered = Object.keys(state.answered).length;
  const wrong = Object.keys(state.wrong).length;
  document.getElementById('totalCount').textContent = questions.length;
  document.getElementById('statAnswered').textContent = answered;
  document.getElementById('statCorrect').textContent = answered - wrong;
  document.getElementById('statWrong').textContent = wrong;
  document.getElementById('statScore').textContent = state.score;
  document.getElementById('wrongCount').textContent = wrong;
}

// --- Exam: Sequential ---
function startSequential() {
  const start = state.seqIndex;
  const end = Math.min(start + 25, questions.length);
  if (start >= questions.length) { alert('已做完所有题目！'); return; }
  exam = { questions: questions.slice(start, end), index: 0, score: 0, results: [], mode: 'sequential', category: '' };
  showExam();
}

// --- Exam: Random ---
function startRandom(cat) {
  let pool = cat ? questions.filter(q => q.category === cat) : [...questions];
  if (pool.length === 0) return;

  // Weighted: wrong questions get 2x chance
  const wrongIds = new Set(Object.keys(state.wrong));
  const weighted = [];
  pool.forEach(q => {
    weighted.push(q);
    if (wrongIds.has(q.id)) weighted.push(q); // double entry for wrong
  });

  // Shuffle and pick 25
  const shuffled = weighted.sort(() => Math.random() - 0.5);
  const picked = [];
  const seen = new Set();
  for (const q of shuffled) {
    if (!seen.has(q.id)) { seen.add(q.id); picked.push(q); }
    if (picked.length >= 25) break;
  }
  // If not enough, fill from remaining
  if (picked.length < 25) {
    pool.filter(q => !seen.has(q.id)).slice(0, 25 - picked.length).forEach(q => picked.push(q));
  }

  exam = { questions: picked, index: 0, score: 0, results: [], mode: cat ? 'category' : 'random', category: cat || '' };
  showExam();
}

// --- Exam: Wrong Practice ---
function startWrongPractice() {
  const wrongIds = Object.keys(state.wrong);
  if (wrongIds.length === 0) return;
  const pool = questions.filter(q => wrongIds.includes(q.id));
  const shuffled = pool.sort(() => Math.random() - 0.5).slice(0, 25);
  exam = { questions: shuffled, index: 0, score: 0, results: [], mode: 'wrong', category: '' };
  showExam();
}

// --- Show Exam ---
function showExam() {
  showPage('pageExam');
  renderQuestion();
}

function renderQuestion() {
  const q = exam.questions[exam.index];
  if (!q) { showResult(); return; }

  const total = exam.questions.length;
  const idx = exam.index + 1;
  document.getElementById('examProgress').textContent = `${idx}/${total}`;
  document.getElementById('examScore').textContent = `${exam.score}分`;
  document.getElementById('examFill').style.width = `${(idx / total) * 100}%`;
  document.getElementById('questionText').innerHTML = q.question;
  document.getElementById('questionMeta').innerHTML =
    `${q.categoryName}` + (q.selectCount > 1 ? `<span class="multi-hint">多选</span>` : '');

  const container = document.getElementById('optionsContainer');
  container.innerHTML = '';
  container.dataset.submitted = '';
  const exp = document.getElementById('examExplanation');
  if (exp) { exp.style.display = 'none'; exp.innerHTML = ''; }
  const letters = ['A', 'B', 'C', 'D'];
  exam.selected = new Set();

  letters.forEach(letter => {
    const opt = document.createElement('div');
    opt.className = 'option';
    opt.dataset.letter = letter;
    opt.innerHTML = `<div class="letter">${letter}</div><div class="text">${q.options[letter]}</div>`;
    opt.onclick = () => handleOptionClick(opt, letter, q);
    container.appendChild(opt);
  });

  // Multi-select: show submit button
  const actions = document.getElementById('examActions');
  if (q.selectCount > 1) {
    const btn = document.createElement('button');
    btn.className = 'btn btn-primary';
    btn.id = 'submitBtn';
    btn.disabled = true;
    btn.textContent = '确认提交';
    btn.onclick = () => doSubmitMulti(exam.selected, q);
    actions.innerHTML = '';
    actions.appendChild(btn);
  } else {
    actions.innerHTML = '';
  }
}

function handleOptionClick(opt, letter, q) {
  // If already submitted, ignore
  if (opt.closest('.options').dataset.submitted) return;

  if (q.selectCount === 1) {
    // Single select: immediate submit
    submitSingle(letter, q);
    return;
  }

  // Multi-select: toggle
  if (exam.selected.has(letter)) {
    exam.selected.delete(letter);
    opt.classList.remove('selected');
  } else {
    exam.selected.add(letter);
    opt.classList.add('selected');
  }

  const btn = document.getElementById('submitBtn');
  if (btn) btn.disabled = exam.selected.size === 0;
}

function showExplanation(q) {
  const exp = document.getElementById('examExplanation');
  if (!exp) return;
  if (q && q.explanation) {
    exp.innerHTML = `<span class="exp-label">答案解释</span>${q.explanation}`;
    exp.style.display = 'block';
  } else {
    exp.style.display = 'none';
  }
}

function submitSingle(letter, q) {
  const correct = letter === q.answer;
  const container = document.getElementById('optionsContainer');
  container.dataset.submitted = '1';

  container.querySelectorAll('.option').forEach(opt => {
    const l = opt.dataset.letter;
    opt.onclick = null;
    if (l === q.answer) opt.classList.add(correct ? 'correct' : 'show-correct');
    if (l === letter && !correct) opt.classList.add('wrong');
  });

  recordAnswer(q, correct);
  showExplanation(q);
  showNextButton();
}

function doSubmitMulti(selected, q) {
  const userAnswer = [...selected].sort().join('');
  const correct = userAnswer === q.answer;
  const container = document.getElementById('optionsContainer');
  container.dataset.submitted = '1';

  container.querySelectorAll('.option').forEach(opt => {
    const l = opt.dataset.letter;
    opt.onclick = null;
    if (q.answer.includes(l)) opt.classList.add(correct ? 'correct' : 'show-correct');
    if (selected.has(l) && !q.answer.includes(l)) opt.classList.add('wrong');
  });

  recordAnswer(q, correct);
  showExplanation(q);
  showNextButton();
}

// --- Record Answer ---
function recordAnswer(q, correct) {
  exam.results.push({ id: q.id, correct });

  if (correct) {
    exam.score++;
    state.score++;
    // Remove from wrong book if present
    delete state.wrong[q.id];
  } else {
    // Add to wrong book
    state.wrong[q.id] = { category: q.category, time: Date.now() };
  }
  state.answered[q.id] = { correct, time: Date.now() };
  saveState();
}

function showNextButton() {
  const actions = document.getElementById('examActions');
  const isLast = exam.index >= exam.questions.length - 1;
  actions.innerHTML = `<button class="btn btn-primary" onclick="nextQuestion()">${isLast ? '查看结果' : '下一题 ›'}</button>`;
}

function nextQuestion() {
  exam.index++;
  renderQuestion();
}

// --- Result ---
function showResult() {
  // Update seq index
  if (exam.mode === 'sequential') {
    state.seqIndex = Math.min(state.seqIndex + exam.questions.length, questions.length);
    saveState();
  }

  const total = exam.results.length;
  const correct = exam.results.filter(r => r.correct).length;
  const rate = total > 0 ? Math.round((correct / total) * 100) : 0;
  const pass = rate >= 70;

  document.getElementById('resultScore').textContent = `${correct}/${total}`;
  document.getElementById('resultScore').className = `result-score ${pass ? 'pass' : 'fail'}`;
  document.getElementById('resultDetail').textContent = `正确率 ${rate}% · ${pass ? '通过！' : '继续加油'}`;

  const list = document.getElementById('resultList');
  list.innerHTML = '';
  exam.results.forEach((r, i) => {
    const q = exam.questions[i];
    const item = document.createElement('div');
    item.className = 'result-item';
    item.innerHTML = `<span class="icon ${r.correct ? 'ok' : 'fail'}">${r.correct ? '✓' : '✗'}</span>
      <span style="flex:1">${q.question.slice(0, 40)}${q.question.length > 40 ? '…' : ''}</span>
      <span style="color:var(--text2);font-size:0.75rem">${q.id}</span>`;
    item.onclick = () => showQuestionDetail(q, r.correct);
    list.appendChild(item);
  });

  // Next button text
  const nextBtn = document.getElementById('resultNextBtn');
  if (exam.mode === 'sequential') {
    nextBtn.textContent = state.seqIndex >= questions.length ? '已完成全部' : '继续下一组';
    nextBtn.disabled = state.seqIndex >= questions.length;
  } else if (exam.mode === 'wrong') {
    nextBtn.textContent = Object.keys(state.wrong).length > 0 ? '继续错题练习' : '错题已清空';
    nextBtn.disabled = Object.keys(state.wrong).length === 0;
  } else {
    nextBtn.textContent = '再来一组';
  }

  showPage('pageResult');
}

function nextGroup() {
  if (exam.mode === 'sequential') startSequential();
  else if (exam.mode === 'wrong') startWrongPractice();
  else if (exam.mode === 'category') startRandom(exam.category);
  else startRandom();
}

function showQuestionDetail(q, correct) {
  const letters = ['A','B','C','D'];
  const lines = [q.question, ''];
  letters.forEach(l => {
    const marker = q.answer.includes(l) ? '✓' : ' ';
    lines.push(`${marker} ${l}. ${q.options[l]}`);
  });
  if (q.explanation) {
    lines.push('', `—— 答案解释 ——`, q.explanation);
  }
  alert(lines.join('\n'));
}

// --- Exit Exam ---
function exitExam() {
  if (exam.results.length > 0 && exam.index < exam.questions.length) {
    if (!confirm('答题未完成，确定退出？')) return;
  }
  goHome();
}

// --- Wrong Book ---
function showWrongBook() {
  const wrongIds = Object.keys(state.wrong);
  const count = wrongIds.length;
  document.getElementById('wrongBookCount').textContent = `${count} 题`;
  document.getElementById('wrongEmpty').style.display = count === 0 ? 'block' : 'none';

  const list = document.getElementById('wrongBookList');
  list.innerHTML = '';
  const wrongQs = questions.filter(q => wrongIds.includes(q.id));
  wrongQs.forEach(q => {
    const item = document.createElement('div');
    item.className = 'wrong-item';
    item.innerHTML = `<div class="cat">${q.categoryName} · ${q.id}</div><div>${q.question.slice(0, 60)}${q.question.length > 60 ? '…' : ''}</div>`;
    item.onclick = () => showQuestionDetail(q, false);
    list.appendChild(item);
  });

  showPage('pageWrong');
}

// --- Categories ---
function showCategories() {
  const list = document.getElementById('catList');
  list.innerHTML = '';

  // Group by major category
  const groups = {};
  categories.forEach(c => {
    const major = c.id.split('.').slice(0, 1).join('.');
    if (!groups[major]) groups[major] = [];
    groups[major].push(c);
  });

  const majorNames = { '1': '法规与常识', '2': '无线电技术', '3': '电波与频率', '4': '设备与操作', '5': '安全防护' };

  Object.keys(groups).sort().forEach(major => {
    const header = document.createElement('div');
    header.style.cssText = 'font-weight:700;font-size:0.9rem;padding:12px 0 6px;color:var(--primary)';
    header.textContent = `${major}. ${majorNames[major] || ''}`;
    list.appendChild(header);

    groups[major].forEach(cat => {
      const answered = questions.filter(q => q.category === cat.id && state.answered[q.id]).length;
      const item = document.createElement('div');
      item.className = 'cat-item';
      item.innerHTML = `<div><div class="name">${cat.id} ${cat.name}</div></div>
        <div><span class="done">${answered}/</span><span class="count">${cat.count}</span></div>`;
      item.onclick = () => startRandom(cat.id);
      list.appendChild(item);
    });
  });

  showPage('pageCategories');
}

// --- Reset ---
function confirmReset() { document.getElementById('resetModal').classList.add('active'); }
function closeReset() { document.getElementById('resetModal').classList.remove('active'); }
function doReset() {
  state = { answered: {}, wrong: {}, score: 0, seqIndex: 0, catProgress: {} };
  saveState();
  closeReset();
  goHome();
}

// --- Boot ---
// Register Service Worker for offline / PWA
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(err => {
      console.error('SW registration failed:', err);
    });
  });
}
init().then(finishBoot);
</script>
