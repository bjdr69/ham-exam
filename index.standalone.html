话筒增益或语音压缩调得过高，把环境噪声和本底噪声也“抬”起来。正确做法是调低话筒增益、调低压缩深度。降功率、调天线匹配、调ALC都治不了底噪。记：噪声在间隙响，说明“增益过头”。"},{"id":"MC1-0613","category":"3.1.3","categoryName":"电离层传播","type":"MC1","selectCount":1,"question":"即使打开了发射机的ALC，将话筒的增益调得过高仍可能导致：","options":{"A":"发出的信号失真","B":"发射机的功率提升","C":"发射机的频率漂移变大","D":"天线的驻波比增加"},"answer":"A","explanation":"ALC只能限制峰值功率，救不了早已发生的失真：话筒增益过高时信号先在前面被削波（限幅）产生失真，后级的ALC无法消除。它不会提升功率、增大频漂或增加驻波。记：前级已削波，ALC“亡羊补牢”来不及。"},{"id":"MC1-0614","category":"3.1.3","categoryName":"电离层传播","type":"MC1","selectCount":1,"question":"为什么使用单边带收发信机发送AFSK 信号时需要关闭ALC？","options":{"A":"ALC 增加AFSK 信号的失真，抬升误码率","B":"ALC 使发射功率失控，导致发射机故障","C":"ALC 使信号的极性反转，致使无法解码","D":"ALC 影响AFSK 信号的频响，使音色变差"},"answer":"A","explanation":"AFSK靠音频移频承载数据，波形幅度信息很关键。ALC会随信号幅度“压一压”，使包络畸变，数字信号解码误码率上升。它不会让功率失控（B）、极性反转（C）或只是音色变差（D）。记：数字信号怕“动幅度”，发数据须关ALC。"},{"id":"MC1-0615","category":"3.1.3","categoryName":"电离层传播","type":"MC1","selectCount":1,"question":"单边带发信机的语音压缩功能有什么作用？","options":{"A":"压低较强语音信号的幅度、提升较弱信号的幅度，改善较弱的语音在接收端的信噪比","B":"压低较弱语音信号的幅度、提升较强信号的幅度，增加语音的动态范围和抑扬顿挫感","C":"压低语音信号的低频分量，提升高频分量，增加信号的带宽，使高音更加细腻","D":"压缩信号所占用的频谱宽度，提高无线电频谱的利用率"},"answer":"A","explanation":"语音压缩把大声音压低、小声音抬高，使平均调制深度提高，较弱语音在接收端的信噪比得到改善。它不压缩频宽（D）、不做高低频均衡（C），更不是增加动态范围（B）。记：压缩是“音量拉平”，让小声也够响、传得远。"},{"id":"MC1-0616","category":"3.1.3","categoryName":"电离层传播","type":"MC1","selectCount":1,"question":"收发信机面板上的符号PROC 代表什么功能？","options":{"A":"发信语音压缩，对音频输入电平进行检测并反馈控制，以使包络幅度较小语音获得提升","B":"收信机前置放大器，在接收微弱信号时接入（此时某些技术指标可能低于额定值）","C":"自动天线调谐，对天线电路的电压驻波比进行检测并进行自动补偿，以维持最小驻波比","D":"发信自动电平控制，对射频输出电平进行检测并反馈控制，以维持其在适当限度之内"},"answer":"A","explanation":"PROC即Speech Processor语音压缩处理器，检测音频输入电平，把包络幅度较小的语音提升，让小信号也够“劲”。B是接收前置放大、C是自动天调、D是自动电平控制（ALC），都与PROC不同。记：PROC管“语音压缩”，processing之意。"},{"id":"MC1-0617","category":"3.1.3","categoryName":"电离层传播","type":"MC1","selectCount":1,"question":"发信时，若话音压缩调整不当可能带来什么问题?","options":{"A":"可能产生很多互调成分，影响对方收信时的辨识度","B":"可能使话音严重失真，但是不影响对方电台的收信","C":"可能发射很大的交流声","D":"可能使话筒过载损坏"},"answer":"A","explanation":"语音压缩调得太狠，波形被剧烈整形，产生大量互调成分（额外杂散频率），占用频谱、让对方难分辨。它不只是“自己失真不影响别人”（B错），也不会发射交流声（C）或损坏话筒（D）。记：压得越狠，“杂散分身”越多，适度才好。"},{"id":"MC1-0618","category":"3.1.3","categoryName":"电离层传播","type":"MC1","selectCount":1,"question":"为什么用单边带收发信机发送AFSK 信号时应关闭语音压缩功能？","options":{"A":"语音压缩可能导致信号的包络畸变，破坏基带特征，抬升误码率","B":"经语音压缩处理的信号，其相位变化已不存在，本质上无法解码","C":"经语音压缩处理的信号，其幅度变化已不存在，本质上无法解码","D":"语音压缩提升信号的峰均比，易导致发射机功率放大器过热损坏"},"answer":"A","explanation":"语音压缩会改变信号包络，而AFSK等数字信号的基带特征就藏在包络变化中，包络畸变后解码误码率上升。它不会“消除相位/幅度变化”（B、C错），也不是功放过热问题（D错）。记：数字信号怕包络变形，发数据时关掉压缩。"},{"id":"MC1-0619","category":"3.1.3","categoryName":"电离层传播","type":"MC1","selectCount":1,"question":"业余电台以发射的方法测量发射功率和天线驻波比时必须留意并做到的是：","options":{"A":"先将频率设置到无人使用的空闲频率、偏离常用的热点频率","B":"先将天线的发射方向指向正北","C":"先将收发信机的语音压缩功能打开","D":"话筒离嘴距离在2 公分以上，电键按键时间不短于5 秒钟"},"answer":"A","explanation":"测量功率和驻波需要发射测试信号，属临时占用频率，必须先用无人使用的空闲频率、避开常用热点，免得打扰他人通联。天线方向、语音压缩、话筒距离都与测量规范无关。记：测试先“找空频”，文明守矩不扰台。"},{"id":"MC1-0620","category":"3.1.3","categoryName":"电离层传播","type":"MC1","selectCount":1,"question":"单边带业余电台测试检查天线驻波比需要发射平稳的连续信号。文明的作法是：","options":{"A":"将电台设为CW 方式并按下电键。或者，将电台设为AM 或FM 方式并按下PTT 键（不 对话筒说话）以产生连续载波。测试结束后设回SSB 方式","B":"将电台设为SSB 方式，用平稳的气流对话筒吹口哨","C":"将电台设为SSB 方式，深呼吸后用平稳的气流对话筒发长音“啊”","D":"将电台设为SSB 方式，深呼吸后用平稳的气流对话筒发长音“嘻”"},"answer":"A","explanation":"测驻波需要平稳的连续载波，文明做法是设CW方式按电键，或用AM/FM方式按PTT但不对话筒说话，测完设回SSB。用SSB吹口哨、发“啊”“嘻”都是人为制造不稳定信号，不文明也不准。记：测SWR发CW，干净平稳不扰邻。"},{"id":"MC1-0621","category":"3.1.3","categoryName":"电离层传播","type":"MC1","selectCount":1,"question":"收发信机面板上的符号AT 或者TUNE 代表什么功能？","options":{"A":"自动天线调谐，对天线电路的电压驻波比进行检测并进行自动补偿，以维持最小驻波比","B":"发信自动音量控制，对音频输入电平进行检测并反馈控制，以维持其在适当限度之内","C":"发信自动电平控制，对射频输出电平进行检测并反馈控制，以维持其在适当限度之内","D":"自动频率控制，对发射频率的漂移进行检测并反馈控制，以维持准确的工作频率"},"answer":"A","explanation":"AT即Automatic Tuner自动天线调谐器，检测天线电路的电压驻波比并自动补偿，维持最小驻波比。它管“天线匹配”，与音量（B）、电平（C）、频率（D）控制无关。记：AT管“天调”，驻波大就找它，VSWR能显示。"},{"id":"MC1-0622","category":"3.1.3","categoryName":"电离层传播","type":"MC1","selectCount":1,"question":"使用射频/中频增益和音频增益分开控制的通信接收机进行收听时，可以这样设置：","options":{"A":"信号特弱时尽量把射频/中频增益开到最大，信号特强时尽量把音频增益开到最大，然后 从低到高调整另一个增益以得到适当的音量","B":"信号特弱时尽量把音频增益开到最大，信号特强时尽量把射频/中频增益开到最大，然后 从低到高调整另一个增益以得到适当的音量","C":"任何情况下都应将射频/中频增益放在中间位置，然后从低到高调整音频增益以得到适当 的音量","D":"任何情况下都应将音频增益放在中间位置，然后从低到高调整射频/中频增益以得到适当 的音量"},"answer":"A","explanation":"信号特弱时把射频/中频增益开足，让微弱信号先充分放大；信号特强时把射频/中频增益收小防止过载，靠音频增益调音量，另一个增益从低到高微调。B把两者弄反。记：射频增益管“信号大小”，音频增益管“耳朵音量”。"},{"id":"MC1-0623","category":"3.1.3","categoryName":"电离层传播","type":"MC1","selectCount":1,"question":"HF 通信与VHF 或UHF 通信相比，最大的不同是什么？","options":{"A":"HF 通信依靠电离层的反射","B":"HF 传播更为稳定，衰落小","C":"HF 天线体积小","D":"HF 更适合远距离宽带通信"},"answer":"A","explanation":"HF频段最大的特点就是靠电离层反射实现超视距通信，而VHF/UHF多是视距直线传播。HF传播其实衰落更大（B错）、天线也不小（C错）、不适合宽带高速数据（D错）。记：HF靠“天镜”电离层反射，V/UHF靠“视线”。"},{"id":"MC1-0624","category":"3.1.3","categoryName":"电离层传播","type":"MC1","selectCount":1,"question":"下面哪种方法可以减小话筒或耳机用音频电缆可能感生的射频电流？","options":{"A":"在电缆外面穿套铁氧体磁环","B":"在电缆芯线中串联低通滤波器","C":"在电缆前端添置话筒放大器","D":"在电缆芯线中串联带通滤波器"},"answer":"A","explanation":"音频电缆感生的射频电流主要是共模电流，在电缆外套上铁氧体磁环（扼流圈）能有效吸收抑制它。芯线串联低通/带通会破坏音频信号（B、D错），话筒放大器只会放大问题（C错）。记：铁氧体“吃”共模射频，套个圈就好。"},{"id":"MC1-0649","category":"3.3.1","categoryName":"频率与波长","type":"MC1","selectCount":1,"question":"发射天线的作用是：","options":{"A":"把发射机输出的射频信号转化为无线电波","B":"利用天线的增益放大发射机的输出功率","C":"将发射机输出的射频信号转化为音频信号","D":"将发射机输出的射频信号转化为红外线"},"answer":"A","explanation":"发射天线是把发射机输出的射频信号转化为无线电波的“换能器”，本身不放大功率（B错）、不转成音频（C错）或红外（D错），增益只是方向性集中。记：天线是“喇叭”，把电能喊成电磁波。"},{"id":"MC1-0650","category":"3.3.1","categoryName":"频率与波长","type":"MC1","selectCount":1,"question":"接收天线的作用是：","options":{"A":"把空间的无线电波转化为接收机中的射频电信号","B":"利用天线的增益放大空间的无线电波并将之传向接收机","C":"将空间的无线电波转化为接收机中的音频信号","D":"将空间的无线电波转化为红外线"},"answer":"A","explanation":"接收天线把空间的无线电波感应成接收机中的射频电信号，之后才由检波解调变成音频。它不放大无线电波（B错）、不直接输出音频（C错）、也不转红外（D错）。记：收发天线互逆，收是“话筒”把波变电。"},{"id":"MC2-0651","category":"3.3.1","categoryName":"频率与波长","type":"MC2","selectCount":2,"question":"关于天线的增益，以下说法正确的是：","options":{"A":"待测天线最大辐射方向上的辐射功率密度与基准天线对应值的比值","B":"与参考天线相比，被测天线在某个方向上使信号增强的程度","C":"天线辐射的电波功率与输入到天线的射频功率之比","D":"天线发热耗散的功率与输入到天线的射频功率之比"},"answer":"AB","explanation":"天线增益是比较量：A说最大辐射方向的辐射密度与基准天线的比值，B说比参考天线在某个方向上增强的程度，二者都对。C是辐射效率、D是发热损耗比，与增益无关。记：增益是“和基准比强多少”，不是效率。"},{"id":"MC1-0652","category":"3.3.1","categoryName":"频率与波长","type":"MC1","selectCount":1,"question":"以dBi 为单位的天线增益是指：","options":{"A":"待测天线最大辐射方向上的辐射功率密度与理想点源天线对应值之比的dB 值","B":"待测天线最大辐射方向上的辐射功率密度与半波长偶极天线对应值之比的dB 值","C":"待测天线最大辐射方向上的辐射功率密度与1/4 波长地网天线对应值之比的dB 值","D":"待测天线最大辐射方向及其（180°）反方向的辐射功率密度测量值之比的dB 值"},"answer":"A","explanation":"dBi是相对“理想点源（各向同性）天线”的增益，半波偶极才是dBd的基准。B是dBd定义、C是1/4波长地网天线、D是前后比，都不对。记：dBi里的“i”=isotropic各向同性点源。"},{"id":"MC1-0653","category":"3.3.1","categoryName":"频率与波长","type":"MC1","selectCount":1,"question":"什么是“理想点源天线”？对业余无线电又有什么意义？","options":{"A":"存在于理论中的一种小到一个点，可将发射机输出的全部射频能量都转化为各向同性且 均匀辐射的电磁波的假想天线；用作比较实际天线辐射性能的一种全向基准天线","B":"一种用于专业通信的增益极高的专用天线，在业余无线电中没有应用价值","C":"仅用于无线电测试的一种标准接收天线，发射效果不佳，对业余无线电无用","D":"一种带宽近乎无限的高级天线的专利名称，业余无线电业务不需要宽带天线"},"answer":"A","explanation":"理想点源天线是理论假想天线：小到一个点，把所有射频能量各向同性地均匀辐射、没有方向性，用作比较实际天线辐射性能的全向基准。它不是高增益专用天线（B）、不是测试专用（C）、也不是专利（D）。记：点源是“标准尺”，全向均匀当基准。"},{"id":"MC1-0654","category":"3.3.1","categoryName":"频率与波长","type":"MC1","selectCount":1,"question":"以dBd 为单位的天线增益是指：","options":{"A":"待测天线最大辐射方向上的辐射功率密度与半波长偶极天线对应值之比的dB 值","B":"待测天线最大辐射方向上的辐射功率密度与理想点源天线对应值之比的dB 值","C":"待测天线最大辐射方向上的辐射功率密度与1/4 波长垂直天线对应值之比的dB 值","D":"待测天线最大辐射方向及其（180°）反方向的辐射功率密度测量值之比的dB 值"},"answer":"A","explanation":"dBd是相对“半波长偶极天线”的增益，半波偶极本身规定为0dBd。B是dBi（点源基准）、C是1/4波长垂直天线、D是前后比。记：dBd里的“d”=dipole偶极，偶极是它的零起点。"},{"id":"MC1-0655","category":"3.3.1","categoryName":"频率与波长","type":"MC1","selectCount":1,"question":"半波振子是能够辐射电波的一种实用天线。为了获得最低输入阻抗，人们通常从中点为 这种振子馈电。这就构成了具有两个1/4 波长不同电极性区域的谐振偶极天线，亦称半波长 偶极天线。这种天线的增益规定为0dBd。那么相比理想点源天线，其增益为：","options":{"A":"2.15dBi","B":"6dBi","C":"3dBi","D":"1.64dBi"},"answer":"A","explanation":"半波偶极天线增益规定为0dBd，因偶极有方向性（辐射压扁成环）比各向同性点源更强，换算为2.15dBi。B的6dBi、C的3dBi都不对，D的1.64是功率倍数而非dB值。记：偶极比点源强“2.15dB”，口诀“偶极2.15”。"},{"id":"MC1-0656","category":"3.3.1","categoryName":"频率与波长","type":"MC1","selectCount":1,"question":"某商品天线说明书给出的天线增益指标以dB 为单位。其意义为：","options":{"A":"该指标未指明计算方法和所用基准，缺乏参考价值","B":"待测天线最大辐射方向上的辐射功率密度与理想点源天线对应值之比的dB 值","C":"待测天线最大辐射方向上的辐射功率密度与1/4 波长垂直天线对应值之比的dB 值","D":"待测天线最大辐射方向及其（180°）反方向的辐射功率密度测量值之比的dB 值"},"answer":"A","explanation":"天线增益只说“dB”却不注明基准（是dBi还是dBd）和计算方法，这个指标缺乏参考价值、无法与他人比较。B、C、D都是带具体基准的增益定义，题干缺的正是这个。记：写dB不写i或d，等于“没标准尺”。"},{"id":"MC1-0657","category":"3.3.1","categoryName":"频率与波长","type":"MC1","selectCount":1,"question":"我们之所以称垂直接地天线为“全向天线”，是因为：","options":{"A":"这种天线在水平方向上没有指向性","B":"这种天线在垂直方向上没有指向性","C":"这种天线的E 面和H 面方向图均为正圆","D":"这种天线辐射各向同性的球面波"},"answer":"A","explanation":"垂直接地天线在水平面上各方向辐射相同，即水平方向没有指向性，所以叫“全向天线”。它垂直方向其实有方向性（低仰角辐射，B错），不是各向同性球面波（D错），E、H面也不会都是正圆（C错）。记：全向指“水平一圈”都辐射。"},{"id":"MC1-0658","category":"3.3.1","categoryName":"频率与波长","type":"MC1","selectCount":1,"question":"如需垂直接地天线在大体为零仰角的水平发射方向上具有主辐射瓣并可以与同轴电缆直 接耦合，则振子长度应选为：","options":{"A":"1/4 波长","B":"1/2 波长","C":"1/8 波长","D":"3/2 波长"},"answer":"A","explanation":"1/4波长垂直振子配地网构成“镜像”，谐振阻抗约50欧可直接配同轴电缆，主辐射瓣在低仰角的水平方向。1/2波长阻抗太高（B错）、1/8波长太短不谐振（C错）。记：GP标配“四分之一波长”，低仰角大范围通联。"},{"id":"MC2-0659","category":"3.3.1","categoryName":"频率与波长","type":"MC2","selectCount":2,"question":"关于振子长度为1/4 波长的垂直接地天线的最大辐射方向，以下描述正确的是：","options":{"A":"在水平方向上是全向的","B":"在垂直方向上有指向性，且辐射仰角稍大于0°","C":"其E 面方向图为“8”字形","D":"其H 面方向图为“8”字形"},"answer":"AB","explanation":"1/4波长垂直接地天线水平方向全向（A对），垂直方向有指向性且辐射仰角略大于0°（B对）。E面（垂直面）方向图是压扁的环不是标准“8”字形（C错），H面（水平面）是圆不是“8”字形（D错）。记：GP“横着全向、仰角不高”。"},{"id":"MC2-0660","category":"3.3.1","categoryName":"频率与波长","type":"MC2","selectCount":2,"question":"关于大多数手持电台随附的“橡胶天线”，以下说法正确的是：","options":{"A":"就电台的一般持握方式而言，电波的垂直极化分量要强一些","B":"相对于全尺寸天线，“橡胶天线”的发射与接收增益都低一些","C":"如果橡胶护套内的天线是螺旋加感的，则电波是旋转极化的","D":"如果橡胶护套某处开裂，则振子会迅速解体，天线随即报废"},"answer":"AB","explanation":"手持机橡胶天线按正常持握方式主要辐射垂直极化分量（A对）；因振子缩短、有效口径小，发射接收增益都比全尺寸天线低（B对）。螺旋加感并不产生旋转极化（C错），护套开裂不影响振子本体、不会立刻报废（D错）。记：橡胶天线“短而亏”，垂直极化低增益。"},{"id":"MC1-0661","category":"3.3.1","categoryName":"频率与波长","type":"MC1","selectCount":1,"question":"在车内使用手持电台和俗称“橡胶天线”的柔性天线进行通信可能遇到什么问题？","options":{"A":"车体的屏蔽作用影响信号强度","B":"大量电波反射回天线，抬升SWR","C":"影响电台散热","D":"行车噪声影响通话质量"},"answer":"A","explanation":"车内金属车体像“法拉第笼”，对电波有明显屏蔽作用，橡胶天线在车内收发的信号显著变弱，尤其影响远距离通信。反射抬SWR（B）、散热（C）、行车噪声（D）都不是主要问题。记：车厢是“铁笼子”，天线要装车外。"},{"id":"MC1-0662","category":"3.3.1","categoryName":"频率与波长","type":"MC1","selectCount":1,"question":"如果架设天线时发现场地附近有电线等市电供电装置，你该怎么办？","options":{"A":"应确保在风雨中意外掉落的天线部件不落入供电装置的安全距离内。例如，35 千伏及以 下电压时至少1 米","B":"应确保供电装置带来的电源噪声不会影响电台接收弱信号的能力。通常，这个距离应至 少10 倍于工作波长","C":"必须防止通信和供电两套系统之间发生打火拉弧事故。经验上讲，按照每千伏1 毫米算 出的间距是足够的","D":"应确保天线转动到平行于供电系统的电线时，电线不会成为反射单元，即，应至少保持 1/4 波长以上距离"},"answer":"A","explanation":"天线靠近市电供电装置，安全第一：要确保风雨中意外掉落的天线部件不落入供电装置的安全距离内，35千伏及以下电压至少保持1米。考虑电源噪声（B）、打火间距（C）、反射（D）都不对。记：电力线旁“留一米”，防掉落带电出事故。"},{"id":"MC1-0663","category":"3.3.1","categoryName":"频率与波长","type":"MC1","selectCount":1,"question":"垂直接地天线（GP）由电气长度为1/4 波长的垂直振子加上一个“镜像地平面”构成， 因十分简洁而被大量应用于手持和车载业余通信。但是，这种天线的工作有效性往往不如理 论预计的那么完美，特别是在波长较长的波段。造成这种情况的原因及改善方法是：","options":{"A":"缺乏有效接地镜像；GP 天线必须有足够大的导电平面以形成振子镜像，否则谐振频率和 阻抗都与理论值有出入。为此，应尽量用大面积金属导体与天线/馈线的接地端相连","B":"1/4 波长垂直振子显然是太短了。改成1/2 波长即可解决问题","C":"1/4 波长垂直振子显然是太短了。在振子当中串联加感线圈即可解决问题","D":"天线与电缆直接相连，匹配不佳。在天线和电缆之间加接“巴伦”即可解决问题"},"answer":"A","explanation":"GP天线靠“地面镜像”工作，缺乏有效接地镜像时谐振频率和阻抗都偏离理论值，效率大打折扣，长波段更明显。改善办法是用大面积金属导体与天线/馈线接地端相连做地网。加长振子（B）、串联加感（C）、加巴伦（D）都不对症。记：GP关键是“地”，没地就趴窝。"},{"id":"MC1-0664","category":"3.3.1","categoryName":"频率与波长","type":"MC1","selectCount":1,"question":"关于天线的加载，以下描述正确的是","options":{"A":"为天线振子串联电感线圈，延长振子的电气长度","B":"为车载天线增添弹簧减震器","C":"为柔性不足的天线基座增加螺旋式延长器","D":"为八木天线的拉纤加接弹性张力器"},"answer":"A","explanation":"天线加载指为振子串联电感线圈，用电感补偿缩短后失去的感抗，把电气长度“拉长”到谐振频率。加弹簧减震（B）、螺旋延长器（C）、弹性张力器（D）都不是加载。记：加感＝串电感“延长电气长度”，物理尺寸不用变长。"},{"id":"MC1-0665","category":"3.3.1","categoryName":"频率与波长","type":"MC1","selectCount":1,"question":"谐振的垂直接地天线的振子长度最短也要1/4 波长。如果架设天线时因条件受限而不得 不将振子缩短，那么在振子之中串入电感可以补偿失去的感抗，使天线谐振在所需频率上。 为了提高发射效率，应在振子的什么位置串入电感需根据架设条件择优确定。下图给出三种 加感方案。假设振子（灰色部分）均等长，则A、B、C 三种方案按发射效率可排列为：","options":{"A":"C-顶部加感，B-中部加感，A-底部加感","B":"A-底部加感，B-中部加感，C-顶部加感","C":"A-底部加感，C-顶部加感，B-中部加感","D":"B-中部加感，A-底部加感，C-顶部加感 [F]LK0944.jpg"},"answer":"A","explanation":"同样缩短长度的加感天线，电流分布越均匀效率越高：顶部加感（C）电流在整根振子分布最均匀、辐射电阻最大，效率最高；中部（B）次之；底部（A）电流集中在底部，效率最低。记：加感“越高越高效”，顶部最佳、底部最差。"},{"id":"MC1-0666","category":"3.3.1","categoryName":"频率与波长","type":"MC1","selectCount":1,"question":"甲天线增益6.15dBi，乙天线增益1dBd。若两副天线按同样条件架设并用同样功率来驱 动，则在它们最大发射方向的同一远方地点接收时，两天线给出的信号功率关系为：","options":{"A":"甲天线的信号功率为乙天线的两倍","B":"甲天线的信号功率为乙天线的1/2","C":"甲天线的信号功率为乙天线的5.15 倍","D":"甲天线的信号功率为乙天线的6.15 倍"},"answer":"A","explanation":"先统一基准：乙1dBd换算成dBi要加2.15，即乙为3.15dBi。甲6.15dBi比乙高3dB，而3dB正好是2倍功率，所以甲信号为乙的两倍。B的1/2、C的5.15、D的6.15都不对。记：dBi与dBd差2.15，“3dB=2倍”。"},{"id":"MC1-0667","category":"3.3.1","categoryName":"频率与波长","type":"MC1","selectCount":1,"question":"甲天线增益0dBd，乙天线增益2dBi。若两副天线按同样条件架设用用同样功率来驱动， 则在它们最大发射方向的同一远方地点接收时，两天线给出的信号功率关系为：","options":{"A":"甲天线的效果与半波长偶极天线相当，乙天线比甲天线略差","B":"甲天线效果为零，不能工作，乙天线效果比甲天线好2 倍","C":"甲天线的效果与半波长偶极天线相当，乙天线发射的信号强度比甲天线好2dB","D":"甲、乙天线的效果实际相同"},"answer":"A","explanation":"甲0dBd就是与半波偶极天线效果相当；乙2dBi换算成dBd为2-2.15=-0.15dBd，比甲略差约0.15dB。说甲“效果为零”（B）、乙好2倍或2dB（C）、二者相同（D）都不对。记：dBi转dBd要减2.15，2dBi略逊偶极。"},{"id":"MC1-0668","category":"3.3.1","categoryName":"频率与波长","type":"MC1","selectCount":1,"question":"有两款VHF 垂直全向天线作发射之用。甲天线增益为4.5dBd，而乙天线的是5.85dBi。 它们在远处某接收天线中产生的信号功率有什么不同？","options":{"A":"来自甲天线的信号比乙天线的强0.8dB","B":"来自乙天线的信号比甲天线的强1.35dB","C":"来自甲天线的信号比乙天线的强1.35dB","D":"来自乙天线的信号比甲天线的强3.5dB"},"answer":"A","explanation":"统一基准后比较：乙5.85dBi换算成dBd为5.85-2.15=3.7dBd。甲4.5dBd比乙3.7dBd强0.8dB，所以甲信号更强。B、C的1.35dB和D的3.5dB都不对。记：先把dBi减2.15换成dBd，再比大小。"},{"id":"MC1-0669","category":"3.3.1","categoryName":"频率与波长","type":"MC1","selectCount":1,"question":"有两款VHF 垂直全向天线作发射之用。甲天线增益为2.9dBd，而乙天线的是5.85dBi。 它们在远处某接收天线中产生的信号功率有什么不同？","options":{"A":"来自乙天线的信号比甲天线的强0.8dB","B":"来自乙天线的信号比甲天线的强2.95dB","C":"来自甲天线的信号比乙天线的强2.95dB","D":"来自乙天线的信号比甲天线的强7.1dB"},"answer":"A","explanation":"统一基准后比较：乙5.85dBi换算成dBd为5.85-2.15=3.7dBd，比甲2.9dBd强0.8dB，所以乙信号更强。B的2.95dB、C的甲强、D的7.1dB都不对。记：dBi减2.15变dBd，3.7比2.9多0.8。"},{"id":"MC3-0670","category":"3.3.2","categoryName":"业余频段划分","type":"MC3","selectCount":3,"question":"业余无线电爱好者讨论天线系统时常会提及术语“驻波比（SWR）”。其含义为：","options":{"A":"连接到传输线终端的负载阻抗与传输线自身的特性阻抗相匹配的程度","B":"负载与传输线完美匹配时，传输线之中没有驻波，因此驻波比为1:1","C":"如果负载与传输线不匹配，传向负载的部分能量会沿传输线返回始端","D":"如果传输线中出现驻波，则调整传输线始端的信源阻抗可使驻波归零"},"answer":"ABC","explanation":"驻波比描述负载阻抗与传输线特性阻抗的匹配程度（A对）；完全匹配时线上没有驻波，SWR=1:1（B对）；不匹配时部分能量沿传输线返回始端形成反射（C对）。D错在：驻波取决于负载与传输线，调信源阻抗并不能使驻波归零。记：SWR是“匹配尺”，反射成驻波。"},{"id":"MC1-0671","category":"3.3.2","categoryName":"业余频段划分","type":"MC1","selectCount":1,"question":"通联时，如果收发信机的SWR 表显示读数4:1，则意味着：","options":{"A":"从发射机的输出端口来看，天线系统的整体匹配情况不佳","B":"从发射机的输出端口来看，天线系统的整体阻抗为200 欧或12.5 欧","C":"天线系统的辐射效率仅为25%","D":"天线系统的整体增益仅为4dB"},"answer":"A","explanation":"SWR=4:1说明从发射机输出端口看，天线系统的整体匹配情况不佳、反射较大。它并不锁定为200欧或12.5欧（B错，具体阻抗多样），也不等于辐射效率25%（C）或增益4dB（D）。记：SWR只讲“匹配好坏”，不能直接当效率或增益换算。"},{"id":"MC2-0672","category":"3.3.2","categoryName":"业余频段划分","type":"MC2","selectCount":2,"question":"小强用长度不短于1/4 波长的50 欧馈线连接收发信机和天线。发信时，他发现SWR 表 的指示为3:1。该值意味着：","options":{"A":"馈线中任意位置上的最大峰值电压与最小峰值电压之比为3:1","B":"馈线中任意位置上的最大峰值电流与最小峰值电流之比为3:1","C":"馈线中的驻波致使平均射频电压高于常值，这降低了导体损耗","D":"馈线中的驻波致使平均射频电流高于常值，这降低了介质损耗"},"answer":"AB","explanation":"驻波比定义为传输线上最大电压与最小电压之比，也是最大电流与最小电流之比，所以3:1即两者都相差3倍（A、B对）。驻波会增加导体和介质损耗，不会“降低损耗”（C、D错）。记：SWR是“波峰比波谷”，3:1就是三倍差。"},{"id":"MC1-0673","category":"3.3.2","categoryName":"业余频段划分","type":"MC1","selectCount":1,"question":"多数发射机都在SWR 超过一定值时降低输出功率。这是为了：","options":{"A":"保护发射机中的功率半导体器件","B":"防止烧断供电线路中的保险丝","C":"防止传输线上的驻波超过限值","D":"防止发射出去的无线电波带有过大的驻波"},"answer":"A","explanation":"SWR过高时反射功率大，末级功率放大半导体器件承受过高电压电流应力，容易过热损坏，所以发射机自动降功率保护功放管。它不是防保险丝熔断（B）、也不是保护驻波本身（C、D）。记：SWR高“烧管子”，降功率是保护末级。"},{"id":"MC1-0674","category":"3.3.2","categoryName":"业余频段划分","type":"MC1","selectCount":1,"question":"用同轴电缆连接天线时，为什么驻波比趋于1:1 为好？","options":{"A":"降低电缆的损耗，使射频能量更有效地传输","B":"防止屏蔽层的外层辐射能量，导致射频干扰（RFI）","C":"延长天线的使用寿命","D":"延长发信机的使用寿命"},"answer":"A","explanation":"驻波比越接近1:1，射频能量越有效地传输到天线，电缆损耗越低。SWR高时驻波增大馈线损耗、功率在线上发热浪费。屏蔽层外辐射主要靠良好接地解决（B错），与天线或发信机寿命无直接关系（C、D错）。记：SWR=1:1，能量“一趟直送”不返工。"},{"id":"MC1-0675","category":"3.3.2","categoryName":"业余频段划分","type":"MC1","selectCount":1,"question":"以下哪种情况可能导致业余发信机显示的驻波比不稳定？","options":{"A":"发信机、馈线或天线某处接触不良","B":"发信机采用相位调制","C":"发信机过调制","D":"馈线温度过高"},"answer":"A","explanation":"SWR读数忽高忽低，最常见原因是发信机、馈线或天线某处接触不良、接头松动，反射随之波动。相位调制（B）、过调制（C）、馈线过热（D）一般不会让驻波读数大幅抖动。记：SWR不稳先查“接触点”，拧紧接头多半就好。"},{"id":"MC1-0676","category":"3.3.2","categoryName":"业余频段划分","type":"MC1","selectCount":1,"question":"SSB 通联时，即使天馈系统没有故障，有时候SWR 显示也不稳定。这是因为：","options":{"A":"SSB 话音的幅度变化本质上影响测量的稳定性。改用CW 方式进行测量效果更好","B":"SSB 话音包含幅度与相位两种信息，并非所有天线均能同时给出稳定的响应","C":"出现这种情况是因为发信机过调制，应调整话筒增益以解决","D":"出现这种情况说明发信机出了故障，应停机检修"},"answer":"A","explanation":"SSB话音幅度随时变化，发射功率包络起伏，SWR表针跟着摆动属正常现象，不是故障。改用CW方式发射稳定连续信号来测驻波，读数更准。过调制（C）、机器故障（D）都不对。记：SSB测SWR“表针跳舞”，换CW测才稳。"},{"id":"MC1-0677","category":"3.3.2","categoryName":"业余频段划分","type":"MC1","selectCount":1,"question":"我们都知道发射机与天线间的馈线应当与天线阻抗匹配。否则，馈线中的驻波会使沿线 各处的电压和电流周期性起伏。然而，业余电台所用的发射机与电网中的发电机同属交流电 源，我们却从未在连到电网的电线中观察到驻波现象。这是为什么？","options":{"A":"电网供电的频率很低，导线长度与波长相比微不足道，驻波现象不明显而已","B":"业余电台所用的馈线和电网中的电线工作原理不同，所以现象不尽相同","C":"适用于供电技术和业余无线电的电学理论本质不同，所以现象自然不同","D":"电网的供电能力远超发射机所能提供的电功率，这就迫使线路各处电压趋同"},"answer":"A","explanation":"电网50Hz波长约6000千米，家用电线才几米到几百米，远小于波长，沿线电压电流几乎处处一致，看不出驻波；馈线工作在射频、波长很短，才会形成驻波。记住“驻波要波长够短，低频电线看不见”。"},{"id":"MC1-0678","category":"3.3.3","categoryName":"频段使用规划","type":"MC1","selectCount":1,"question":"对于业余无线电通信，最适合的同轴电缆特性阻抗为：","options":{"A":"50 欧姆","B":"75 欧姆","C":"93 欧姆","D":"300 欧姆"},"answer":"A","explanation":"业余收发信机和天线普遍按50欧设计，选50欧馈线阻抗一致、功率传输最佳。75欧同轴用于电视/视频，93欧、300欧不是业余主流。记住“业余50，电视75”。"},{"id":"MC1-0679","category":"3.3.3","categoryName":"频段使用规划","type":"MC1","selectCount":1,"question":"传输线具有多种类型，但是为什么架设业余电台通常选用同轴电缆？","options":{"A":"因为它易于使用，与架设环境之中其他物体间的互耦也很低","B":"因为它的损耗比其他任何种类的馈线都低","C":"因为相比其他馈线，它可以传输更大的功率","D":"因为很明显，它比其他任何馈线都便宜"},"answer":"A","explanation":"同轴电缆外导体屏蔽使电磁场封闭在内外导体之间，与周围金属、人体、其他天线互耦很低，布设方便。它并非损耗最低（空气介质硬电缆更低），也非最便宜，B、C、D都是误解。"},{"id":"MC2-0680","category":"3.3.3","categoryName":"频段使用规划","type":"MC2","selectCount":2,"question":"在为业余电台选购用作天线馈线的同轴电缆时应关注什么电气参数？","options":{"A":"特性阻抗","B":"指定频率下每百米的传输损耗","C":"芯线的截面积和最大额定电流","D":"电介质的耐压和最高允许温升"},"answer":"AB","explanation":"选馈线看两个参数：特性阻抗要与收发信机/天线匹配（业余用50欧）；指定频率下每百米损耗越低越好。C是电力线载流指标，D是电力电缆绝缘指标，均与射频馈线无关，故只选AB。"},{"id":"MC2-0681","category":"3.3.3","categoryName":"频段使用规划","type":"MC2","selectCount":2,"question":"我们都知道要为业余电台选配损耗较低的馈线。但是，馈线的损耗会导致什么问题？","options":{"A":"发信功率降低","B":"收信信噪比下降","C":"驻波比的测量值永远高于1:1","D":"发出的信号失真"},"answer":"AB","explanation":"馈线损耗既吃掉发射功率（A），又衰减微弱接收信号、降低信噪比（B）。C错：高损耗馈线反而会“掩盖”驻波，使SWR读数偏低；D错：线性衰减不产生失真。"},{"id":"MC2-0682","category":"3.3.3","categoryName":"频段使用规划","type":"MC2","selectCount":2,"question":"受潮是同轴电缆失效损坏的主要原因。湿气渗透会导致：","options":{"A":"介质损耗变大","B":"屏蔽层或芯线氧化、锈蚀，甚至断路","C":"速度因子逐渐大于1","D":"驻波比越来越小于1"},"answer":"AB","explanation":"水汽进入介质使介质损耗大增，还氧化芯线、腐蚀屏蔽层，久则断路，故选AB。速度因子只可能小于等于1（真空才等于1），不可能大于1；驻波比最小为1，不可能“越来越小于1”。"},{"id":"MC1-0683","category":"3.3.3","categoryName":"频段使用规划","type":"MC1","selectCount":1,"question":"将同轴电缆装于室外时，为什么要求电缆外皮（护套）能够耐受紫外线？","options":{"A":"如果电缆护套被紫外线破坏，电缆就会受潮损坏","B":"紫外线会激励非线性导行模式，导致互调和谐波发射","C":"紫外线会与射频信号相互混频，导致相当复杂的宽带干扰","D":"紫外线会促使电缆升温，并因此增加电缆的功率损耗"},"answer":"A","explanation":"护套被紫外线晒裂后，雨水潮气沿裂缝渗入电缆，绝缘恶化、损耗加大直至损坏，故室外护套必须抗紫外线。B、C、D把紫外线当成射频信号来谈混频、升温，均不成立。"},{"id":"MC1-0684","category":"3.3.3","categoryName":"频段使用规划","type":"MC1","selectCount":1,"question":"相比填充有机介质的同轴电缆，空气介质同轴电缆的劣势是什么？","options":{"A":"空气介质同轴电缆需要特别措施来防止湿气渗透","B":"空气介质同轴电缆只能用于30MHz 以下业余频段","C":"空气介质同轴电缆的每百米损耗太大","D":"空气介质同轴电缆不能在冰点以下工作"},"answer":"A","explanation":"空气介质损耗虽低，但空气会流动，水汽极易进入电缆内部凝结、破坏绝缘，必须加压充气或用密封防潮措施，这是它最大的劣势。损耗大、不能低温工作等说法不成立。"},{"id":"MC1-0685","category":"3.3.3","categoryName":"频段使用规划","type":"MC1","selectCount":1,"question":"如果通过同轴电缆的信号频率升高，则同轴电缆的","options":{"A":"传输损耗增加","B":"反射功率升高","C":"特性阻抗变高","D":"输入驻波比变大"},"answer":"A","explanation":"频率越高，趋肤效应使导体有效截面变小、介质损耗加大，每百米传输损耗增加。特性阻抗由结构尺寸决定与频率无关；反射功率和驻波比取决于负载匹配，不随频率升高而变。"},{"id":"MC1-0686","category":"3.3.3","categoryName":"频段使用规划","type":"MC1","selectCount":1,"question":"以下给出了一些同等外径的馈线。其中哪一种在VHF/UHF 频段损耗更低？","options":{"A":"空气介质同轴硬电缆","B":"独立屏蔽分组双绞线","C":"50 欧姆同轴软电缆","D":"75 欧姆同轴软电缆"},"answer":"A","explanation":"同等外径下，空气介质损耗角正切最小，空气介质同轴硬电缆在VHF/UHF损耗最低。双绞线、软电缆的介质和结构损耗都更大。"},{"id":"MC1-0687","category":"3.3.3","categoryName":"频段使用规划","type":"MC1","selectCount":1,"question":"对于400MHz 或更高频率的信号，应当优先选用的同轴电缆连接器是：","options":{"A":"N 型连接器","B":"M 型连接器","C":"RS-213 型连接器","D":"DB-23 型连接器"},"answer":"A","explanation":"N型连接器为50欧、螺纹锁紧、密封防水、电性能稳定，可在400MHz以上可靠工作。M型（PL-259/UHF型）高频损耗大，不适用于此频段。"},{"id":"MC1-0688","category":"3.3.3","categoryName":"频段使用规划","type":"MC1","selectCount":1,"question":"关于M 型同轴电缆连接器，以下说法正确的是：","options":{"A":"这种连接器广泛应用于HF 和VHF 通信系统","B":"这种连接器使用了先进的螺纹式锁紧技术，防水防盗","C":"这种连接器使用了卡式锁紧技术，便于快拔快插","D":"这种连接器制造成本很高，通常用于微波通信系统"},"answer":"A","explanation":"M型连接器即UHF型/PL-259，卡口插接、结构简单，广泛用于HF和VHF通信系统。它并非螺纹锁紧防水防盗，也不用于微波，更谈不上高成本，B、C、D均错。"},{"id":"MC2-0689","category":"3.3.4","categoryName":"频率容限","type":"MC2","selectCount":2,"question":"关于垂直天线，以下说法正确的是：","options":{"A":"该天线发射垂直极化波，电场与地面垂直","B":"垂直天线是全向天线，其H 面方向图是全向的","C":"该天线发射垂直极化波，磁场与地面垂直","D":"垂直天线是全向天线，其E 面方向图是全向的"},"answer":"AB","explanation":"垂直天线振子垂直于地面，电场沿振子方向即垂直地面，是垂直极化；它在水平面（H面）各向等强，是全向天线，故选AB。C把磁场说成垂直地面错，D把E面当全向错（E面为“8”字形）。"},{"id":"MC2-0690","category":"3.3.4","categoryName":"频率容限","type":"MC2","selectCount":2,"question":"关于水平极化偶极天线，以下描述正确的是：","options":{"A":"通过该天线发射的电磁波，电场平行于地面","B":"该天线水平面上的（E 面）方向图呈“8”字展开","C":"通过该天线发射的电磁波，电场垂直于地面","D":"该天线垂直面上的（H 面）方向图呈“8”字展开"},"answer":"AB","explanation":"水平偶极振子水平放置，电场平行于地面即水平极化；水平面（E面）方向图呈“8”字，两端最大、侧面为零，故选AB。C、D把极化方向和平面关系说反了。"},{"id":"MC1-0691","category":"3.3.4","categoryName":"频率容限","type":"MC1","selectCount":1,"question":"甲、乙业余电台相距10 千米，均使用1/2 波长水平偶极天线进行UHF 通联。现其中一 方改用1/2 波长垂直偶极天线，则改变前后的通信效果有什么不同？","options":{"A":"通信效果变差","B":"通信效果不变","C":"通信效果变好","D":"通信效果的变化不确定"},"answer":"A","explanation":"原双方同为水平极化、匹配良好，一方改成垂直后极化正交（十字交叉），UHF视距传播极化保持不变，接收损失巨大，效果变差。记住“极化要一致，交叉就完蛋”。"},{"id":"MC1-0692","category":"3.3.4","categoryName":"频率容限","type":"MC1","selectCount":1,"question":"甲、乙业余电台相距10 千米，分别使用1/2 波长水平和垂直偶极天线进行UHF 通联。 现双方都改用1/2 波长垂直偶极天线，则改变前后的通信效果有什么不同？","options":{"A":"通信效果变好","B":"通信效果不变","C":"通信效果变差","D":"通信效果的变化不确定"},"answer":"A","explanation":"原来水平对垂直极化正交失配，双方都改垂直后极化一致，从失配变匹配，通信效果变好。极化一致才是通联的王道。"},{"id":"MC1-0693","category":"3.3.4","categoryName":"频率容限","type":"MC1","selectCount":1,"question":"甲、乙业余电台相距10 千米，分别使用1/2 波长水平和垂直偶极天线进行UHF 通联。 现双方都改用1/2 波长水平偶极天线，则改变前后的通信效果有什么不同？","options":{"A":"通信效果变好","B":"通信效果不变","C":"通信效果变差","D":"通信效果的变化不确定"},"answer":"A","explanation":"原来水平对垂直失配，双方都改水平后极化一致、完全匹配，效果由差变好。关键在收发极化必须相同。"},{"id":"MC1-0694","category":"3.3.4","categoryName":"频率容限","type":"MC1","selectCount":1,"question":"甲、乙业余电台相距10 千米，分别使用左旋圆极化和右旋圆极化天线彼此对指进行UHF 通联。现双方都改用左旋圆极化天线，则改变前后的通信效果有什么不同？","options":{"A":"通信效果变好","B":"通信效果不变","C":"通信效果变差","D":"通信效果的变化不确定"},"answer":"A","explanation":"左旋对右旋旋向相反、圆极化完全失配；双方都改左旋后旋向一致、完全匹配，效果变好。"},{"id":"MC1-0695","category":"3.3.4","categoryName":"频率容限","type":"MC1","selectCount":1,"question":"甲、乙业余电台相距10 千米，分别使用左旋圆极化和右旋圆极化天线彼此对指进行UHF 通联。现双方都改用右旋圆极化天线，则改变前后的通信效果有什么不同？","options":{"A":"通信效果变好","B":"通信效果不变","C":"通信效果变差","D":"通信效果的变化不确定"},"answer":"A","explanation":"左旋对右旋旋向相反、完全失配，双方都改右旋后旋向一致、完全匹配，通信效果由差变好。记住圆极化通联必须收发旋向相同。"},{"id":"MC1-0696","category":"3.3.4","categoryName":"频率容限","type":"MC1","selectCount":1,"question":"甲、乙业余电台相距10 千米，分别使用左旋圆极化和半波长水平偶极天线彼此对指进行 UHF 通联。现乙台改用半波长垂直极化天线，则改变前后的通信效果有什么不同？","options":{"A":"通信效果不变","B":"通信效果变差","C":"通信效果变好","D":"通信效果的变化不确定"},"answer":"A","explanation":"圆极化天线与线极化天线互收总有约3dB损耗，与线极化是水平还是垂直无关，故乙台把水平偶极换成垂直极化后效果不变。"},{"id":"MC1-0697","category":"3.3.4","categoryName":"频率容限","type":"MC1","selectCount":1,"question":"甲、乙业余电台相距10 千米，分别使用左旋圆极化和半波长水平偶极天线彼此对指进行 UHF 通联。现甲台改用右旋圆极化天线，则改变前后的通信效果有什么不同？","options":{"A":"通信效果不变","B":"通信效果变差","C":"通信效果变好","D":"通信效果的变化不确定"},"answer":"A","explanation":"甲台从左旋换成右旋，仍是圆极化对线极化，损耗仍为约3dB，与旋向无关，故效果不变。"},{"id":"MC1-0698","category":"3.3.4","categoryName":"频率容限","type":"MC1","selectCount":1,"question":"甲、乙业余电台相距10 千米，分别使用左旋圆极化和半波长水平偶极天线彼此对指进行 UHF 通联。现乙台改用右旋圆极化天线，则改变前后的通信效果有什么不同？","options":{"A":"通信效果变差","B":"通信效果变好","C":"通信效果不变","D":"通信效果的变化不确定"},"answer":"A","explanation":"乙台由水平偶极改成右旋圆极化后，与甲台的左旋圆极化旋向相反，圆极化完全失配，通信效果变差。圆极化必须收发同旋。"},{"id":"MC1-0699","category":"3.3.4","categoryName":"频率容限","type":"MC1","selectCount":1,"question":"甲、乙业余电台相距10 千米，分别使用左旋圆极化和半波长水平偶极天线彼此对指进行 UHF 通联。现乙台改用左旋圆极化天线，则改变前后的通信效果有什么不同？","options":{"A":"通信效果变好","B":"通信效果变差","C":"通信效果不变","D":"通信效果的变化不确定"},"answer":"A","explanation":"乙台改成左旋圆极化后与甲台旋向一致，圆极化完全匹配，由原来的失配变为匹配，效果变好。"},{"id":"MC1-0700","category":"3.3.4","categoryName":"频率容限","type":"MC1","selectCount":1,"question":"甲、乙业余电台相距10 千米，分别使用左旋圆极化和右旋圆极化天线彼此对指进行UHF 通联。现双方均改用半波长水平偶极天线，则改变前后的通信效果有什么不同？","options":{"A":"通信效果变好","B":"通信效果不变","C":"通信效果变差","D":"通信效果的变化不确定"},"answer":"A","explanation":"原来左旋对右旋失配、损耗极大，双方均改半波水平偶极后极化一致、完全匹配，通信效果变好。核心是收发极化必须保持一致。"},{"id":"MC1-0701","category":"3.3.4","categoryName":"频率容限","type":"MC1","selectCount":1,"question":"假设接收和发射天线均使用半波长偶极天线，则在地面台站间的近距离通联中，接收和 发射天线的最佳极化方式应当安排为：","options":{"A":"接收和发射天线均位于垂直于两台站连线的平面内，极化保持一致","B":"接收和发射天线均位于垂直于两台站连线的平面内，极化彼此正交","C":"接收和发射天线的极化应当平行于两台站之间的连线","D":"发射天线垂直极化，接收天线的极化应当平行于两台站之间的连线"},"answer":"A","explanation":"半波偶极最大辐射在垂直于振子的方向上，故两站天线都应位于垂直于两台站连线的平面内（振子垂直于连线），且收发极化保持一致，信号最强。"},{"id":"MC1-0702","category":"3.3.4","categoryName":"频率容限","type":"MC1","selectCount":1,"question":"右旋极化波是指在垂直于传播方向的任意平面上，沿传播方向观察时，电场矢量为随时 间向右（顺时针）旋转的椭圆或圆极化波。如果地面上某业余电台在观测业余卫星时发现从 卫星到达该台的无线电波的电场是顺时针旋转的，则该信号的极化方式为：","options":{"A":"左旋椭圆极化或圆极化","B":"右旋椭圆极化或圆极化","C":"垂直极化","D":"水平极化"},"answer":"A","explanation":"右旋是“沿传播方向看顺时针”。地面台看卫星来波是逆着传播方向观察，看到顺时针相当于沿传播方向看是逆时针，故该信号为左旋。记住“背向看顺，迎面看逆”。"},{"id":"MC1-0703","category":"3.3.4","categoryName":"频率容限","type":"MC1","selectCount":1,"question":"在视距通联中，已知发射天线为指向接收点的左旋圆极化天线，接收天线的最佳极化方 式为：","options":{"A":"指向发射点的左旋圆极化","B":"指向发射点的右旋圆极化","C":"垂直极化","D":"水平极化"},"answer":"A","explanation":"圆极化天线对指互收时，旋向相同才匹配：发射为左旋，接收天线对准发射点也采用左旋圆极化，极化一致信号最好。"},{"id":"MC1-0704","category":"3.3.4","categoryName":"频率容限","type":"MC1","selectCount":1,"question":"某卫星下行链路采用右旋圆极化天线，从北向南飞行，天线始终指向地球的南极。如果 地面上某业余电台采用圆极化天线自动跟踪该卫星，则该台所用天线的最佳极化方式应当为：","options":{"A":"卫星过顶前为右旋圆极化，过顶后为左旋圆极化","B":"卫星过顶后为右旋圆极化，过顶前为左旋圆极化","C":"最佳方向始终为右旋圆极化","D":"最佳方向始终为左旋圆极化"},"answer":"A","explanation":"卫星从北向南飞、天线始终指向南极，地面台相对卫星看到的旋向在过顶前后发生翻转，故过顶前用右旋、过顶后用左旋，才能始终匹配。始终同一旋向会有一半时间失配。"},{"id":"MC1-0705","category":"3.3.4","categoryName":"频率容限","type":"MC1","selectCount":1,"question":"已知某卫星下行信号的发射天线是指向地面的偶极天线。由于卫星不断旋转，地面台站 所收电波的极化方向就会不断变化。为了不至极化问题致使接收中断，接收天线可以是：","options":{"A":"指向卫星的右旋或左旋圆极化天线","B":"垂直极化天线","C":"水平极化天线","D":"极化方向平行于卫星与地面电台之间连线的天线"},"answer":"A","explanation":"卫星旋转使线极化方向不断摆动，用圆极化天线接收任意线极化方向都只损失约3dB，不会中断。垂直或水平单一线极化可能在某时刻完全失配。"},{"id":"MC1-0706","category":"3.3.4","categoryName":"频率容限","type":"MC1","selectCount":1,"question":"某业余电台使用半波垂直偶极天线通联时，对方所收信号的强度为S4。现发射功率不变， 发信方改用增益为8.15dBi 的八木天线（最大辐射方向和极化均不变），则对方所收信号的 强度变为：【提示：收信机信号强度指示从S1 至S9 每档增加6dB】","options":{"A":"S5","B":"S6","C":"S7","D":"S8"},"answer":"A","explanation":"半波偶极增益为2.15dBi，换8.15dBi八木提高了6dB，正对应S表一格（每档6dB），S4升一格为S5。"},{"id":"MC1-0707","category":"3.3.4","categoryName":"频率容限","type":"MC1","selectCount":1,"question":"某业余电台使用半波长垂直偶极天线发射时，对方所收信号的强度为S4。现发射功率不 变，发信方改用增益为12dBd 的八木天线（最大辐射方向和极化均不变），则对方所收信号 的强度变为：【提示：收信机信号强度指示从S1 至S9 每档增加6dB】","options":{"A":"S6","B":"S5","C":"S7","D":"S8"},"answer":"A","explanation":"12dBd即相对半波偶极增益高12dB，S表每档6dB，正好提高两格，S4连升两档为S6。记住1档=6dB，dBd基准就是半波偶极。"},{"id":"MC1-0708","category":"3.3.4","categoryName":"频率容限","type":"MC1","selectCount":1,"question":"两位业余爱好者使用半波长垂直偶极天线相互通联，双方所收信号的强度均为S4。现双 方发射功率不变，都改用增益为8.15dBi 的八木天线（最大辐射方向和极化均不变）再次联 络，则双方信号的强度变为：【提示：收信机信号强度指示S1 至S9 每档增加6dB】","options":{"A":"S6","B":"S4","C":"S5","D":"S7"},"answer":"A","explanation":"双方都换天线各提高6dB，收发合计提高12dB，S4升两档为S6。单端换天线只升一格，双方都换则翻倍。"},{"id":"MC1-0709","category":"3.3.5","categoryName":"杂散发射","type":"MC1","selectCount":1,"question":"即便是在辽阔的平原或广袤的戈壁，我们所收本地VHF/UHF 信号的强度也会伴随设备的 移动而发生周期性的变化。主要原因是：","options":{"A":"来自直射和地面反射等多个路径的无线电波相互干涉，相消或相长（多径效应）","B":"发信和收信地点间的气流导致电波传播路径弯曲，发生频率漂移（多普勒效应）","C":"无论收信发信，地面各处的电导率不尽相同会导致设备移动时的接地电阻变化","D":"发信过程中，设备与大地间分布电容的改变导致天线失谐，发射功率随之改变"},"answer":"A","explanation":"直射波与地面反射等各路径电波相位不同，移动时相对相位随之变化，干涉相长相消，信号周期性起伏。多径效应是本地VHF/UHF信号摆动的主因。"},{"id":"MC1-0710","category":"3.3.5","categoryName":"杂散发射","type":"MC1","selectCount":1,"question":"在VHF/UHF 频段通联时的一个现象，如果远方电台给出的信号报告很差，则仅需移动几 步或将工作频率改变数十千赫就可能显著改善通信效果。这是因为：","options":{"A":"多径传播。经不同路径达到天线的电波存在相位和幅度差异，相互干涉，相消或相长","B":"发射机与接收机之间的距离，以及工作频率的变化都会显著改变路径损耗","C":"大气扰动影响","D":"地磁活动影响"},"answer":"A","explanation":"多径干涉在某个位置恰好相消使信号变差，移几步或改频几十千赫即改变各路径相对相位、脱离零点，故改善显著。这是多径干涉所致，而非路径损耗或大气扰动。"},{"id":"MC1-0711","category":"3.3.5","categoryName":"杂散发射","type":"MC1","selectCount":1,"question":"多径传播对UHF 或VHF 波段数据通信的影响是：","options":{"A":"可能使误码率上升","B":"如果是FM 通联，则影响微不足道，不可察觉","C":"随着传播路径的增加，数据通信速率线性减小","D":"随着传播路径的增加，数据通信速率线性增加"},"answer":"A","explanation":"多径引起符号间干扰和衰落，使数据解调错误增多、误码率上升。FM同样受影响；数据速率不随传播路径长度线性增减，C、D错。"},{"id":"MC2-0712","category":"3.3.5","categoryName":"杂散发射","type":"MC2","selectCount":2,"question":"使用VSB 方式进行ATV 通信时，即使信号相对较强，有时所收图像的边缘也有重影。 这是因为：","options":{"A":"多径传播。来自不同路径的信号到达接收天线的时延不同，造成重影","B":"发射天线的VSWR 过高。如果信号在馈线中多次往返于发射机和天线，会造成重影","C":"天线的极化配置出错。极化不同的信号同时到达天线，导致重影","D":"遭遇了重放干扰。或许是某中继台也转发了这个信号，其到达接收天线，导致重影"},"answer":"AB","explanation":"重影是同一图像沿不同时延路径到达，先后成像（A）；馈线VSWR过高时信号在发射机与天线间往返，也会形成二次影像（B），故选AB。极化配置和中继转发都不是ATV重影的原因。"},{"id":"MC1-0713","category":"3.3.6","categoryName":"发射带宽","type":"MC1","selectCount":1,"question":"决定超短波视距传播距离极限的主要因素是：","options":{"A":"发射天线和接收天线距地面的相对高度","B":"发射天线和接收天线距海平面的绝对高度","C":"发射天线和接收天线的挂高波长比，即，离地高度除以波长","D":"发射天线和接收天线的增益"},"answer":"A","explanation":"视距传播受地球曲率阻挡，天线离地越高看得越远，决定因素是收发天线相对地面的高度。与海平面绝对高度、挂高波长比、天线增益无关。"},{"id":"MC1-0714","category":"3.3.6","categoryName":"发射带宽","type":"MC1","selectCount":1,"question":"有时，相隔数百千米的业余电台可以实现VHF/UHF 超视距直接联络。可能的原因是：","options":{"A":"信号的传播路径中出现了大气波导现象","B":"有飞行器在空中反射了电波","C":"降雨增加了大地电导率，增强了电波传播","D":"每当冬季，植被的减少都有利于电波传播"},"answer":"A","explanation":"对流层大气波导把VHF/UHF电波反复折射“弯”回地面，可沿波导跳传数百千米。飞行器反射、降雨电导率、植被减少都解释不了这种稳定的超视距联络。"},{"id":"MC1-0715","category":"3.3.6","categoryName":"发射带宽","type":"MC1","selectCount":1,"question":"有时，我们可以在6 米或2 米业余波段中收到上千千米外的“超视距传播”信号。这与 下列哪种现象密切相关？","options":{"A":"突发E 层的传播","B":"流星余迹反向散射","C":"D 层的吸收所致","D":"灰线传播"},"answer":"A","explanation":"突发E层是薄而高电离的片状层，能把50MHz（6米）和144MHz（2米）电波反射回地面，实现上千千米跳传。流星余迹散射时延极短，D层只会吸收。"},{"id":"MC1-0716","category":"3.3.6","categoryName":"发射带宽","type":"MC1","selectCount":1,"question":"是什么导致了对流层的大气波导现象？","options":{"A":"大气高空逆温","B":"太阳黑子和/或太阳耀斑","C":"飓风或龙卷风所致的上升气流","D":"雷暴时大量闪电所产生的等离子体"},"answer":"A","explanation":"高空逆温使大气折射率随高度反常分布，电波在上、下界面间反复折射形成波导。太阳活动、飓风上升气流、雷电等离子体都与对流层波导无关。"},{"id":"MC1-0717","category":"3.3.6","categoryName":"发射带宽","type":"MC1","selectCount":1,"question":"如果你收到了一个上千千米外的VHF 信号，最可能的原因是：","options":{"A":"信号经电离层的突发E 层反射而来","B":"信号由微波接力电台合力QSP 过来","C":"信号被附近的雷雨区反射而来","D":"信号经宇宙射线的电离路径传导过来"},"answer":"A","explanation":"上千千米的VHF信号只能靠电离层突发E层反射实现。微波接力是人为转发、雷雨反射和宇宙射线电离路径都不是公认的传播机制。"},{"id":"MC1-0718","category":"3.3.6","categoryName":"发射带宽","type":"MC1","selectCount":1,"question":"有时，VHF/UHF 业余波段中可能出现远达500 千米的“超视距传播”信号。这与下列哪 种现象密切相关？","options":{"A":"对流层散射","B":"D 层折射","C":"F2 层折射","D":"法拉第旋转"},"answer":"A","explanation":"500千米级超视距是典型的对流层散射，靠对流层湍流区把电波散射到远方。D层、F2层折射是HF波段机制，法拉第旋转是极化旋向变化而非传播机制。"},{"id":"MC1-0819","category":"3.6.1","categoryName":"安全电压","type":"MC1","selectCount":1,"question":"自制业余无线电发射设备，在经无线电检测机构检验合格并取得电台执照之前，应在调 测时在设备的天线端口连接（或在串联必要的仪表之后连接）：","options":{"A":"假负载","B":"VSWR 严格等于1:1 的驻波天线","C":"VSWR 严格等于1:1 的行波天线","D":"专门用于测试的标准环形天线"},"answer":"A","explanation":"未取得电台执照前不允许对空发射，调测必须接假负载，把功率消耗在负载电阻上、不产生辐射。天线（含驻波/行波天线）都会向外发射，违规也不安全。"},{"id":"MC1-0820","category":"3.6.1","categoryName":"安全电压","type":"MC1","selectCount":1,"question":"在无线电发射机中，调制器的作用是：","options":{"A":"以原始调制信号控制射频载波的幅度、频率和相位参数","B":"以电能转换效率最高的方式控制线性射频放大器的工作点","C":"调整天馈系统的参数，实现阻抗匹配","D":"自动控制发射信号的频谱，将其保持在核准的必要带宽内"},"answer":"A","explanation":"调制器的作用是以原始调制信号（语音）控制射频载波的幅度、频率、相位参数，把信息“装载”到载波上。B 讲功放工作点、C 讲天馈匹配、D 讲频谱控制，都与调制无关。记忆：调制=把信息装进载波。"},{"id":"MC4-0821","category":"3.6.1","categoryName":"安全电压","type":"MC4","selectCount":4,"question":"保证业余无线电通信接收机优良接收能力的主要因素是：","options":{"A":"良好的抗干扰能力","B":"足够高的整机增益","C":"尽量低的本机噪声","D":"尽量小的信号失真"},"answer":"ABCD","explanation":"优良接收能力=良好的抗干扰能力+足够高的增益+尽量低的本机噪声+尽量小的失真，四项缺一不可，故选 ABCD。噪声大、失真大，再高的增益也白搭。记忆：灵敏靠低噪高增益，好听靠抗扰低失真。"},{"id":"MC1-0822","category":"3.6.1","categoryName":"安全电压","type":"MC1","selectCount":1,"question":"接收机解调器的作用是：","options":{"A":"从接收到的已调射频信号中分离出原始调制信号","B":"对接收到的射频信号进行宽带线性放大","C":"对接收到的射频信号进行与必要带宽相匹配的选频放大","D":"从接收到的已调制射频信号中提取出载波分量"},"answer":"A","explanation":"解调器的作用是从已调射频信号中分离出原始调制信号，把信息“取回来”。B 是放大、C 是选频放大、D 是提载波，均属解调之前的处理。记忆：调制是装进去，解调是取出来。"},{"id":"MC1-0823","category":"3.6.1","categoryName":"安全电压","type":"MC1","selectCount":1,"question":"选用解调器的主要应考因素是：","options":{"A":"尽量忠实地还原原始调制信号","B":"尽量对已调射频信号加以放大","C":"尽量提升已调射频信号中的载频分量","D":"尽量补偿接所收射频信号的频率偏移"},"answer":"A","explanation":"选用解调器最看重“尽量忠实地还原原始调制信号”，还原度越高越保真。B 关注放大、C 关注载波分量、D 关注频偏补偿，都不是解调器的本职。记忆：解调核心在还原保真。"},{"id":"MC1-0824","category":"3.6.1","categoryName":"安全电压","type":"MC1","selectCount":1,"question":"亚音频静噪系统（CTCSS）所用的声调大体位于音频中的什么范围？","options":{"A":"67-250.3Hz","B":"16Hz-20kHz","C":"16kHz-20kHz","D":"220Hz-2503Hz"},"answer":"A","explanation":"CTCSS 亚音频静噪声调在 67~250.3Hz，处于可听声低频以下，故名“亚音频”。B 是完整音频、C 是超声、D 的 220~2503Hz 偏高。记忆：亚音频 67Hz 起 250Hz 止，低到听不见。"},{"id":"MC1-0825","category":"3.6.1","categoryName":"安全电压","type":"MC1","selectCount":1,"question":"对于比较考究的接收机，其说明书中常常列出一项“通带矩形系数”或“通带形状系数” 指标，是用来描述：","options":{"A":"带通滤波器频率特性曲线两侧斜坡的陡峭程度","B":"矩形波信号通过滤波器后波形两侧的陡峭程度","C":"矩形波信号通过滤波器后谐波成分的损失程度","D":"带通晶体滤波器中石英晶体的切割方向和形状"},"answer":"A","explanation":"通带矩形系数描述带通滤波器频率特性曲线两侧斜坡的陡峭程度，数值越接近 1 说明过渡带越窄、选择性越好。B/C 讲的是矩形波信号、D 讲晶体切割，均张冠李戴。记忆：矩形系数=滤波器曲线的“陡不陡”。"},{"id":"MC1-0826","category":"3.6.1","categoryName":"安全电压","type":"MC1","selectCount":1,"question":"根据说明书给出的技术指标，两台业余无线电接收机在USB 方式下选择带宽为2.7kHz 的滤波器时具有不同的“通带矩形系数”。接收机A 的“60dB 带宽对6dB 带宽的矩形系数” 为3.8，接收机B 的为5。由此可得出结论：","options":{"A":"A 机对邻近频道干扰的抑制能力比B 机强","B":"A 机对邻近频道干扰的抑制能力比B 机差","C":"A 机对镜像频率干扰的抑制能力比B 机强","D":"A 机对偏离工作频率±10kHz 以外的干扰信号的抑制能力比B 机强"},"answer":"A","explanation":"矩形系数=60dB 带宽÷6dB 带宽，数值越小滤波裙边越陡，抗邻近频道干扰越强。A 机 3.8 小于 B 机 5，所以 A 机抑制能力更强。记忆：矩形系数越小越“利落”。"},{"id":"MC1-0827","category":"3.6.1","categoryName":"安全电压","type":"MC1","selectCount":1,"question":"接收机前置放大器的主要作用是：","options":{"A":"降低接收机内部噪声的影响","B":"提高接收机最终的音频输出功率电平","C":"提高接收机音频输出的保真度","D":"提高接收机的动态范围"},"answer":"A","explanation":"前置放大器位于接收前端，负责低噪声放大，以压低机内噪声的影响、提高信噪比。B 讲音频功率、C 讲保真度、D 讲动态范围，均非其本职。记忆：前置放大=先把弱信号“提纯”再加增益。"},{"id":"MC1-0828","category":"3.6.1","categoryName":"安全电压","type":"MC1","selectCount":1,"question":"进行FM 话音通联时，我们能否单凭接收机中传出的对方的声音大小来准确判断对方的 信号有多强？","options":{"A":"不能。鉴频器所解调的声音，其大小仅取决于中频信号的频偏，与中频信号的幅度无关。 况且，中频信号在进入鉴频器之前早已被限幅电路切齐，已无法鉴别强弱","B":"不能。信号越强，自动增益控制的起控程度就越深。增益的急剧下降反而会压低音量","C":"能。最终的信号就是经过放大处理的原始射频信号，当然是信号越强声音越大","D":"能。调频信号的特点是信号越强频偏越大，解调之后的声音当然也越大"},"answer":"A","explanation":"FM 信息在频率偏移里，鉴频器解调的声音大小只取决于中频频偏，与幅度无关；且入鉴频器前信号已被限幅切齐，幅度信息已丢失。B 的 AGC 起控说法与 FM 原理不符。记忆：FM 信息在“频偏”不在“幅度”。"},{"id":"MC1-0829","category":"3.6.1","categoryName":"安全电压","type":"MC1","selectCount":1,"question":"用设置在NFM 方式的对讲机接收WFM 信号，效果为：","options":{"A":"可以听到信号。如果调制信号幅度较大或音调较高，会听到明显的非线性失真","B":"听不到信号。但是一旦接收到了信号，调频方式所特有的强烈噪声仍然会消失","C":"可以正常听到信号。但是声音的高音频部分衰减较大，缺乏高音","D":"可以正常听到信号，只是声音比较小"},"answer":"A","explanation":"NFM 带宽窄，收 WFM 时带宽不够，频偏大的高音部分被切掉，产生明显的非线性失真。B 说“听不到信号”不对，C/D 也不是正确效果。记忆：窄带装宽带=装不下就失真。"},{"id":"MC1-0830","category":"3.6.1","categoryName":"安全电压","type":"MC1","selectCount":1,"question":"用设置在WFM 方式的对讲机接收NFM 信号，效果为：","options":{"A":"可以正常听到信号，只是声音比较小","B":"可以听到信号。如果调制信号幅度较大或音调较高，会听到明显的非线性失真","C":"听不到信号。但是一旦接收到了信号，调频方式所特有的强烈噪声仍然会消失","D":"可以正常听到信号。但是声音的高音频部分衰减较大，缺乏高音"},"answer":"A","explanation":"WFM 带宽宽，收 NFM 时带宽绰绰有余，能正常解调，只是窄带信号能量集中、占用带宽小，解调出来声音比较小。B 的失真发生在“窄带收宽带”时。记忆：宽带装窄带=声音小，窄带装宽带=失真。"},{"id":"MC1-0831","category":"3.6.1","categoryName":"安全电压","type":"MC1","selectCount":1,"question":"没有信号时，调频接收机会输出一种强烈的沙沙声。关于这种噪声，以下描述正确的是：","options":{"A":"天线收到的QRN 与机内电路的固有噪声共同构成一种随机信号。该信号的随机相位变化 经鉴频形成强烈的沙沙声。只是，该信号的随机幅度变化与沙沙声没有关系","B":"由天线收到的QRN 的随机幅度变化经放大形成，其大小与QRN 的电压成正比","C":"由天线收到的QRN 的随机幅度变化经放大形成，其大小与QRN 的电压的平方成正比","D":"由天线收到的QRN 的随机幅度变化经放大形成，其大小与QRN 的电压的平方根成正比"},"answer":"A","explanation":"无信号时，QRN 与机内固有噪声构成随机信号，其随机相位变化经鉴频形成强烈沙沙声；幅度变化已被限幅削掉，与沙沙声无关。B/C/D 错在把沙沙声归于幅度。记忆：FM 沙沙声源于“相位乱跳”。"},{"id":"MC1-0832","category":"3.6.1","categoryName":"安全电压","type":"MC1","selectCount":1,"question":"下列哪种电路可以解调FM 信号？","options":{"A":"鉴频器","B":"限幅器","C":"乘积检波器","D":"混频器"},"answer":"A","explanation":"鉴频器专门解调 FM 信号，把频率变化还原为幅度变化。限幅器只切齐幅度，乘积检波器解 SSB/DSB，混频器做变频。记忆：鉴频=FM 专用，检波=AM 专用，别混。"},{"id":"MC1-0833","category":"3.6.1","categoryName":"安全电压","type":"MC1","selectCount":1,"question":"什么是“鉴频”？","options":{"A":"对调频信号进行解调的过程称为鉴频","B":"判断信号的频率是否超过允许的频率范围的过程称为鉴频","C":"判断信号的频率是否发生了不应有的偏离或者漂移的过程称为鉴频","D":"对调幅信号进行解调的过程称为鉴频"},"answer":"A","explanation":"鉴频就是对调频信号进行解调的过程，把频率变化还原为原始信号。B/C 讲的是监测频率超限或漂移，D 说对“调幅”解调则是张冠李戴。记忆：“鉴频”=鉴定频率变化=解调 FM。"},{"id":"MC1-0834","category":"3.6.1","categoryName":"安全电压","type":"MC1","selectCount":1,"question":"下列哪一项可以解调AM 信号？","options":{"A":"检波器","B":"限幅器","C":"鉴频器","D":"反相器"},"answer":"A","explanation":"检波器（二极管包络检波）专门解调 AM 信号，还原幅度包络。限幅器和鉴频器用于 FM 通道，反相器只翻转相位。记忆：AM 用“检波”，FM 用“鉴频”。"},{"id":"MC1-0835","category":"3.6.1","categoryName":"安全电压","type":"MC1","selectCount":1,"question":"什么是“检波”？","options":{"A":"对调幅信号进行解调的过程称为检波","B":"检查信号的波形是否超过了允许的幅度范围的过程称为检波","C":"检查信号的频率是否发生了不应有的偏离或者漂移的过程称为检波","D":"对调频信号进行解调的过程称为检波"},"answer":"A","explanation":"检波就是对调幅信号进行解调的过程，把幅度包络还原成原始信号。B/C 讲监测幅度、频率，D 说对“调频”解调则张冠李戴。记忆：“检波”=检幅度包络=解调 AM。"},{"id":"MC2-0836","category":"3.6.1","categoryName":"安全电压","type":"MC2","selectCount":2,"question":"关于收发信机的AGC 功能，以下说法正确的有：","options":{"A":"AGC 实现收信机自动增益控制，对中频信号进行检测并反馈控制，防止电路过载","B":"进行基于FSK 或PSK 的数据通信时，关闭AGC 功能有可能提高弱信号的解码效果","C":"进行太阳噪声测试的时候，需要关闭AGC 功能","D":"AGC 实现收信机自动音量控制，对音频电平进行检测并反馈控制，防止扬声器损坏"},"answer":"AB","explanation":"A 对：AGC 检测中频反馈控制增益防过载；B 对：数据模式关 AGC 利于弱信号解码；C 错：S 表由 AGC 驱动，测太阳噪声不能关；D 错：AGC 管增益，音量控制是 AVC。记忆：AGC 管增益不管音量。"},{"id":"MC1-0837","category":"3.6.1","categoryName":"安全电压","type":"MC1","selectCount":1,"question":"学习现代通信技术或制作业余无线电作品时，我们经常遇到一种工作原理不同于超外差 式收信机的“DC 式收信机”。其中，缩写DC 是指：","options":{"A":"直接变换（Direct-Conversion），即接收到的射频信号在解调之前不做频率变换","B":"直流（Direct Current），指直流电源供电的收信机","C":"介质电容（Dielectric Capacitor），指收信机中用于调谐的电容器所用的特定介质","D":"数字变频（Digital-Conversion），指接收到的射频信号经过了数字化的变频处理"},"answer":"A","explanation":"DC 即 Direct-Conversion 直接变换，射频信号解调前不做频率变换，原理不同于超外差式。B 直流、C 介质电容、D 数字变频均为附会。记忆：DC 收信机=零中频直变机。"},{"id":"MC1-0838","category":"3.6.1","categoryName":"安全电压","type":"MC1","selectCount":1,"question":"接收机和发射机中常见的混频器有什么作用？","options":{"A":"频率变换。将信号的原始频率变换成另一个频率","B":"混合式调音。将两个信号相互叠加，送往扬声器","C":"变频调速。把直流电变成变频交流电以驱动天调","D":"多频放大器。同时放大具有不同频率的多个信号"},"answer":"A","explanation":"混频器的核心作用就是频率变换，利用非线性把信号从原频率搬到另一个频率（产生和频与差频）。B 是调音、C 是变频调速、D 是多频放大，均不搭界。记忆：混频=“搬家”，换频率不换信息。"},{"id":"MC1-0839","category":"3.6.1","categoryName":"安全电压","type":"MC1","selectCount":1,"question":"在超外差式收发信机中，混频器的工作方式可分为“上变频”和“下变频”两种，具体 指：","options":{"A":"中频频率高于输入频率的为上变频方式，中频频率低于输入频率的为下变频方式","B":"输入频率高于中频频率的为上变频方式，输入频率低于中频频率的为下变频方式","C":"本振频率高于输入频率的为上变频方式，本振频率低于输入频率的为下变频方式","D":"输入频率高于本振频率的为上变频方式，输入频率低于本振频率的为下变频方式"},"answer":"A","explanation":"判断依据是中频与输入频率的高低关系：中频高于输入频率是上变频（往高搬），中频低于输入频率是下变频（往低搬）。B/C/D 用输入与本振关系表述，均不对。记忆：往上搬叫上变频，往下搬叫下变频。"},{"id":"MC1-0840","category":"3.6.1","categoryName":"安全电压","type":"MC1","selectCount":1,"question":"超外差式业余收发信机的面板上经常设有选择中频滤波器带宽的控制部件。这些中频滤 波器所抑制的干扰可以分类为：","options":{"A":"邻近频率干扰","B":"镜像频率干扰","C":"中频频率干扰","D":"突发脉冲干扰"},"answer":"A","explanation":"中频滤波器带宽窄、边沿陡，专门抑制离工作频率较近的邻近频率干扰。镜像干扰由变频前的滤波器抑制，中频干扰另有对策，脉冲干扰靠去噪电路。记忆：中频滤波器=守门员，专拦邻频道。"},{"id":"MC1-0841","category":"3.6.1","categoryName":"安全电压","type":"MC1","selectCount":1,"question":"在超外差式业余收发信机中，负责抑制镜像频率干扰的部件是：","options":{"A":"变频级之前的波段预选滤波器","B":"变频级之后的中频滤波器","C":"中频放大级中的限幅电路","D":"带有音调控制的音频输出电路"},"answer":"A","explanation":"镜像频率在变频之前就已混入，必须在变频级之前的波段预选滤波器把它滤掉；等进了中频再用滤波器已经来不及。记忆：镜频要“前置”拦，进了中频就晚了。"},{"id":"MC1-0842","category":"3.6.1","categoryName":"安全电压","type":"MC1","selectCount":1,"question":"超外差式收信机所收信号的频率要比本振频率低（或高）一个中频。然而，比本振频率 高（或低）一个中频的另一个遥相对应的信号也可能经混频窜入中频通道，形成“镜像频率 干扰”或“镜频干扰”。如果某对讲机的技术规格书给出的VHF 接收机第一中频为45.05MHz， 那么在145.00MHz 收到的镜频干扰可能来自：","options":{"A":"235.10MHz 或54.90MHz","B":"190.05MHz 或99.95MHz","C":"45.05MHz 或90.10MHz","D":"90.10MHz 或180.20MHz"},"answer":"A","explanation":"镜频=信号频率±2×中频。145±2×45.05：145+90.10=235.10MHz，145-90.10=54.90MHz，故选 A。记忆：镜频是工作频率上下各偏“两倍中频”的那两个点。"},{"id":"MC1-0843","category":"3.6.1","categoryName":"安全电压","type":"MC1","selectCount":1,"question":"超外差式收信机所收信号的频率要比本振频率低（或高）一个中频。然而，比本振频率 高（或低）一个中频的另一个遥相对应的信号也可能经混频窜入中频通道，形成“镜像频率 干扰”或“镜频干扰”。如果某对讲机的技术规格书给出NFM 方式时的第一中频为47.25MHz， 那么在145.00MHz 收到的镜频干扰可能来自：","options":{"A":"239.50MHz 或50.50MHz","B":"192.25MHz 或97.75MHz","C":"50.50MHz 或101.00MHz","D":"151.50MHz 或.202.00MHz"},"answer":"A","explanation":"镜频=信号频率±2×中频。145±2×47.25，即 145±94.50=239.50 与 50.50MHz，故选 A。记忆：145MHz 上下各偏 94.50MHz 即镜频。"},{"id":"MC1-0844","category":"3.6.1","categoryName":"安全电压","type":"MC1","selectCount":1,"question":"超外差式收信机所收信号的频率要比本振频率低（或高）一个中频。然而，比本振频率 高（或低）一个中频的另一个遥相对应的信号也可能经混频窜入中频通道，形成“镜像频率 干扰”或“镜频干扰”。如果某对讲机的技术规格书给出NFM 接收所用的第一中频为 47.25MHz，那么在435.00MHz 收到的镜频干扰可能来自：","options":{"A":"340.50MHz 或529.50MHz","B":"387.75MHz 或482.25MHz","C":"47.25MHz 或94.50MHz","D":"141.70MHz 或.236.25MHz"},"answer":"A","explanation":"镜频=信号频率±2×中频。435±2×47.25，即 435±94.50=340.50 与 529.50MHz，故选 A。记忆：435MHz 上下各偏 94.50MHz 即镜频。"},{"id":"MC1-0845","category":"3.6.1","categoryName":"安全电压","type":"MC1","selectCount":1,"question":"超外差式收信机所收信号的频率要比本振频率低（或高）一个中频。然而，比本振频率 高（或低）一个中频的另一个遥相对应的信号也可能经混频窜入中频通道，形成“镜像频率 干扰”或“镜频干扰”。如果某对讲机的技术规格书给出的UHF接收机第一中频为58.525MHz， 那么在435.00MHz 收到的镜频干扰可能来自：","options":{"A":"317.95MHz 或552.05MHz","B":"376.475MHz 或493.525MHz","C":"58.525MHz 或117.05MHz","D":"234.10.05MHz 或.468.20MHz"},"answer":"A","explanation":"镜频=信号频率±2×中频。435±2×58.525，即 435±117.05=317.95 与 552.05MHz，故选 A。记忆：两倍中频=117.05MHz，435±117.05 即镜频。"},{"id":"MC1-0846","category":"3.6.1","categoryName":"安全电压","type":"MC1","selectCount":1,"question":"业余无线电发射机的效率是指：","options":{"A":"输出到天线系统的信号功率与发射机所消耗的电源功率之比","B":"通信对象的接收天线得到的信号功率与发射机所消耗的电源功率之比","C":"通信对象的接收天线得到的信号功率与发射机输出到天线系统的信号功率之比","D":"输出到天线系统的有用信号功率与到达天线的包含杂散等无用信号的总功率之比"},"answer":"A","explanation":"发射机效率=输出到天线系统的信号功率÷发射机消耗的电源功率。B/C 引入“接收天线得到功率”概念错误，D 用杂散混淆定义。记忆：效率=“送出去的÷吃进去的”，只看发射机本身。"},{"id":"MC1-0847","category":"3.6.1","categoryName":"安全电压","type":"MC1","selectCount":1,"question":"业余无线电发射机的效率总是明显低于1。所损耗的那部分能量：","options":{"A":"绝大部分转化为热量，极小一部分转化为杂散等无用信号","B":"绝大部分转化为杂散等无用信号并对外辐射","C":"绝大部分因阻抗失配而返回电源，极小一部分转化为热量对外散发","D":"损耗的能量在电容、电感、开关器件等零部件中消失了"},"answer":"A","explanation":"效率低于 1 的损耗能量绝大部分变成热量散发，极小部分变成杂散等无用信号。B 说“绝大部分变杂散”、C 说“返回电源”、D 说“消失”，都违背能量守恒。记忆：能量不消失，多数变热、少数变杂散。"},{"id":"MC1-0848","category":"3.6.1","categoryName":"安全电压","type":"MC1","selectCount":1,"question":"若一部业余无线电台的工作电压为直流13.8 伏，FM 方式的射频输出功率为N 瓦，电源 效率约为80%，则发射时的工作电流约为：","options":{"A":"0.091×Ｎ（安）","B":"13.8×Ｎ（安）","C":"13.8/Ｎ×80%（安）","D":"0.058×Ｎ（安）"},"answer":"A","explanation":"电源输入功率=射频输出÷效率=N/0.8=1.25N 瓦；电流=功率÷电压=1.25N/13.8≈0.091N 安。故选 A。记忆：13.8V 供电时电流约“0.09 安×N 瓦”。"},{"id":"MC1-0849","category":"3.6.1","categoryName":"安全电压","type":"MC1","selectCount":1,"question":"若一部业余无线电台的工作电压为交流220 伏，FM 方式的射频输出功率为N 瓦，电源 效率约为80%，则发射时的工作电流约为：","options":{"A":"0.0057×Ｎ（安）","B":"220×Ｎ（安）","C":"200/Ｎ×80%（安）","D":"0.0036×Ｎ（安）"},"answer":"A","explanation":"电源输入功率=N/0.8=1.25N 瓦；电流=功率÷电压=1.25N/220≈0.0057N 安。故选 A。记忆：220V 市电供电时电流约“0.0057 安×N 瓦”。"},{"id":"MC1-0850","category":"3.6.1","categoryName":"安全电压","type":"MC1","selectCount":1,"question":"若一部业余无线电台以FM 方式发射时的射频输出功率为N 瓦，电源效率约为80%，则 每发射10 秒钟所消耗的电能约为：","options":{"A":"0.0000035×Ｎ（千瓦小时）","B":"0.0768 /Ｎ（千瓦小时）","C":"0.0022×Ｎ（千瓦小时）","D":"220 / Ｎ（千瓦小时）"},"answer":"A","explanation":"输入功率=N/0.8=1.25N 瓦，发射 10 秒耗能=1.25N×10÷3600÷1000≈3.5×10⁻⁶ N 千瓦时，故选 A。记忆：1 千瓦时=3600 秒×1000 瓦，10 秒耗电极小。"},{"id":"MC1-0851","category":"3.6.1","categoryName":"安全电压","type":"MC1","selectCount":1,"question":"无线电发信机在无调制情况下，在一个射频周期内供给天线馈线的平均功率称为：","options":{"A":"载波功率","B":"无用功率","C":"平均功率","D":"峰包功率"},"answer":"A","explanation":"无调制时在一个射频周期内供给天线馈线的平均功率称为“载波功率”。峰包功率指调制峰值功率，平均功率含调制变化。记忆：无调制时的平均功率=载波功率。"},{"id":"MC1-0852","category":"3.6.1","categoryName":"安全电压","type":"MC1","selectCount":1,"question":"如果某话音发射机在不同调制方式下的峰值输出功率相同，则在无语音输入时，实际射 频输出功率由大到小可以排序为：","options":{"A":"FM，AM，SSB","B":"AM，SSB，FM","C":"SSB，FM，AM","D":"SSB，AM，FM"},"answer":"A","explanation":"峰值功率相同时，无语音输入：FM 满功率输出载波，AM 输出载波功率，SSB 无语音时几乎无输出，故排序为 FM>AM>SSB。记忆：FM 常开灯，SSB 不说话就没功率。"},{"id":"MC1-0859","category":"3.6.3","categoryName":"防雷与接地","type":"MC1","selectCount":1,"question":"下列哪项技术指标描述了接收机抗拒邻近频率干扰的能力？","options":{"A":"中频选择性","B":"整机灵敏度","C":"频道扫描速率","D":"本底噪声"},"answer":"A","explanation":"抗拒邻近频率干扰的能力用“中频选择性”表示，即中频滤波器的选频能力。整机灵敏度管微弱信号、本底噪声管底噪、扫描速率无关。记忆：邻频干扰→中频滤波器把关。"},{"id":"MC1-0860","category":"3.6.3","categoryName":"防雷与接地","type":"MC1","selectCount":1,"question":"接收机抗拒工作频率附近干扰信号的能力可以用选择性指标来表示，分别为：","options":{"A":"信道带宽、信道选择性和信道滤波器的矩形系数","B":"带内波动和信道带宽","C":"镜像抑制比","D":"前端带宽"},"answer":"A","explanation":"抗拒工作频率附近干扰用“信道带宽、信道选择性和信道滤波器的矩形系数”表示。镜像抑制比对应镜频、前端带宽对应远处强信号。记忆：邻近干扰三件套=带宽+选择性+矩形系数。"},{"id":"MC1-0861","category":"3.6.3","categoryName":"防雷与接地","type":"MC1","selectCount":1,"question":"接收机接收SSB 话音信号时的频响均匀程度可以用选择性指标来表示，分别为：","options":{"A":"带内波动和信道带宽","B":"信道带宽、信道选择性和信道滤波器的矩形系数","C":"镜像抑制比","D":"前端带宽"},"answer":"A","explanation":"SSB 话音的频响均匀程度用“带内波动和信道带宽”表示，带内波动越小、带宽合适，音质越均匀。记忆：音质平不平，看“带内波动”。"},{"id":"MC1-0862","category":"3.6.3","categoryName":"防雷与接地","type":"MC1","selectCount":1,"question":"接收机抗拒相距工作频率较远的强干扰信号的能力可以用选择性指标来表示，分别为：","options":{"A":"前端带宽","B":"带内波动和信道带宽","C":"信道带宽、信道选择性和信道滤波器的矩形系数","D":"镜像抑制比"},"answer":"A","explanation":"抗拒相距工作频率较远的强干扰靠“前端带宽”，前端越窄越能把远处强信号挡在门外。镜像抑制比对付的是镜频。记忆：远处强干扰→前端带宽先拦。"},{"id":"MC1-0863","category":"3.6.3","categoryName":"防雷与接地","type":"MC1","selectCount":1,"question":"接收机抗拒相距工作频率两倍于中频的强干扰信号的能力可以用选择性指标来表示，分 别为：","options":{"A":"镜像抑制比","B":"前端带宽","C":"带内波动和信道带宽","D":"信道带宽、信道选择性和信道滤波器的矩形系数"},"answer":"A","explanation":"镜频距工作频率恰好“两倍中频”，抗拒镜频干扰的能力用“镜像抑制比”表示，比值越高抑制越强。记忆：两倍中频=镜频，用镜像抑制比衡量。"},{"id":"MC1-0864","category":"3.6.3","categoryName":"防雷与接地","type":"MC1","selectCount":1,"question":"接收机灵敏度指标的数值大小具有什么意义？","options":{"A":"灵敏度指标的数值越小，接收微弱信号的能力越强","B":"灵敏度指标的数值越大，接收微弱信号的能力越强","C":"灵敏度指标的数值越小，对与有用信号同时出现的干扰信号的响应越灵敏","D":"灵敏度指标的数值越大，对与有用信号同时出现的干扰信号的响应越灵敏"},"answer":"A","explanation":"灵敏度数值表示能接收的最小信号电平，数值越小说明能接收的信号越微弱，能力越强。B 说反了，C/D 张冠李戴。记忆：灵敏度数字越小越“灵敏”。"},{"id":"MC1-0865","category":"3.6.3","categoryName":"防雷与接地","type":"MC1","selectCount":1,"question":"用功率电平表示接收机的灵敏度具有什么意义？常用单位是什么？","options":{"A":"输出信号达到一定质量标准时输入信号的最小功率电平。单位是dBm 或dBμW","B":"输出信号达到一定质量标准时输出信号与输入信号的功率电平之比。单位是dB","C":"输出信号达到一定质量标准时输入信号与输出信号的功率电平之比。单位是dB","D":"输出信号维持一定质量标准时输入信号的最小和最大功率电平之比。单位是dB"},"answer":"A","explanation":"灵敏度用功率电平表示=输出达到质量标准时输入信号的最小功率电平，常用单位 dBm 或 dBμW。B/C 讲的是功率比、D 讲动态范围，均不对。记忆：dBm=毫瓦分贝，灵敏度=最小输入功率电平。"},{"id":"MC1-0866","category":"3.6.3","categoryName":"防雷与接地","type":"MC1","selectCount":1,"question":"用电压电平表示接收机的灵敏度具有什么意义？常用单位是什么？","options":{"A":"输出信号达到一定质量标准时输入信号的最小电动势。单位是μV、dBμV 或dBmV","B":"输出信号达到一定质量标准时输入信号的最小电压。单位是μV、dBμV 或dBmV","C":"输出信号达到一定质量标准时输入信号的最大电动势。单位是μV 或mV","D":"输出信号达到一定质量标准时输出信号与输入信号的电压之比。单位是dB"},"answer":"A","explanation":"灵敏度用电压电平表示=输出达到质量标准时输入信号的最小电动势，常用单位 μV、dBμV 或 dBmV。B 把电动势说成电压、C 说“最大”、D 讲比值，均不对。记忆：灵敏度=最小输入电动势，微伏起步。"},{"id":"MC1-0867","category":"3.6.3","categoryName":"防雷与接地","type":"MC1","selectCount":1,"question":"业余无线电接收机大多具备信号强度指示功能。在VHF/UHF 频段，信号强度的最小刻度 S1 与输入信号功率电平-141dBm（50Ω上的电压电平0.02μV）相一致；而在HF 频段， S1 则与-121dBm 的输入信号（50Ω上的0.2μV）相对应。这是因为：","options":{"A":"HF 频段的背景噪声较VHF/UHF 频段为高，使得可感知最小信号电平相应高出约20dB","B":"由于技术原因，HF 接收机的灵敏度都比VHF/UHF 频段的低大约20dB","C":"HF 业余电台功率大一些，而VHF/UHF 的相对较小，这导致信号强度的刻度标准差异","D":"HF 业余电台主要用于DX 通信，而VHF/UHF 的面向本地通信，刻度可以更随意一些"},"answer":"A","explanation":"HF 频段天电噪声比 VHF/UHF 高，可感知最小信号电平相应高约 20dB（-121 对 -141dBm），故 S1 刻度上移。B/C/D 均非原因。记忆：HF 天电噪声大，S 刻度抬 20dB。"},{"id":"MC1-0868","category":"3.6.3","categoryName":"防雷与接地","type":"MC1","selectCount":1,"question":"甲乙两种型号的业余无线电收发信机在技术规格中给出的接收机灵敏度指标分别为0.1 μV 和0.15μV。关于该指标，正确的推论是：","options":{"A":"无法比较二者接收微弱信号的能力，测量灵敏度时所用的输出信号质量标准未知","B":"可以推断甲机接收微弱信号的能力比乙机的差，因为灵敏度指标的数值较小","C":"可以推断甲机接收微弱信号的能力比乙机的高，因为可以接收的信号更微弱","D":"可以推断甲机承受强信号的能力比乙机的低，因为其灵敏度数值比较小"},"answer":"A","explanation":"灵敏度数值须配套测量标准（如 12dB SINAD）才有意义，两机标准未知，故无法比较。B 说反、C 妄断、D 讲的是承受强信号能力。记忆：没写测量标准，灵敏度数字就是“裸数”。"},{"id":"MC1-0869","category":"3.6.3","categoryName":"防雷与接地","type":"MC1","selectCount":1,"question":"当输出信号满足规定质量标准时，在输入阻抗为50 欧的某接收机天线输入端口处测得的 输入信号最小电压为1μV。如果用电压电平μV 表示该机的灵敏度，则为：","options":{"A":"2μV","B":"1μV","C":"50μV","D":"0.5μV"},"answer":"A","explanation":"灵敏度用μV表示时按电动势（开路电压）计。阻抗匹配时输入端电压为电动势的一半，测得端电压1μV对应灵敏度2μV。记忆：50Ω匹配下\"半压加倍\"。"},{"id":"MC1-0870","category":"3.6.3","categoryName":"防雷与接地","type":"MC1","selectCount":1,"question":"当输出信号满足规定质量标准时，在输入阻抗为50 欧的某接收机天线输入端口处测得的 输入信号最小电压为1μV。如果用功率电平dBm 表示该机的灵敏度，则为：","options":{"A":"-107dBm","B":"-103dBm","C":"-73dBm","D":"-113dBm"},"answer":"A","explanation":"功率P=(1μV)²/50Ω≈2×10⁻¹⁴W，换算dBm：10lg(2×10⁻¹⁴/1mW)≈-107dBm。记忆：1μV端电压@50Ω≈-107dBm，是灵敏度换算常用常数；0dBm=1mW。"},{"id":"MC1-0871","category":"3.6.3","categoryName":"防雷与接地","type":"MC1","selectCount":1,"question":"当输出信号满足规定质量标准时，在输入阻抗为50 欧的某接收机天线输入端口处测得的 输入信号最小电压为1μV。如果用电压电平dBμV 表示该机的灵敏度，则为：","options":{"A":"6dBμV","B":"-2dBμV","C":"3dBμV","D":"0dBμV"},"answer":"A","explanation":"dBμV以1μV为基准，按电动势计为2μV：20lg(2μV/1μV)=20×0.3≈6dBμV。记忆：电压翻一倍即+6dBμV。"},{"id":"MC1-0872","category":"3.6.3","categoryName":"防雷与接地","type":"MC1","selectCount":1,"question":"当输出信号满足规定质量标准时，在输入阻抗为50 欧的某接收机天线输入端口处测得的 输入信号最小电压为0.5μV。如果用电压电平μV 表示该机的灵敏度，则为：","options":{"A":"1μV","B":"0.5μV","C":"50μV","D":"2.5μV"},"answer":"A","explanation":"灵敏度按电动势计为端电压的两倍，测得端电压0.5μV对应灵敏度1μV。50Ω匹配下\"半压加倍\"，答案即为1μV。"},{"id":"MC1-0873","category":"3.6.3","categoryName":"防雷与接地","type":"MC1","selectCount":1,"question":"当输出信号满足规定质量标准时，在输入阻抗为50 欧的某接收机天线输入端口处测得的 输入信号最小电压为0.5μV。如果用功率电平dBm 表示该机的灵敏度，则为：","options":{"A":"-113 dBm","B":"-107dBm","C":"-103 dBm","D":"-73 dBm"},"answer":"A","explanation":"功率P=(0.5μV)²/50Ω=5×10⁻¹⁵W，dBm=10lg(5×10⁻¹⁵/1mW)≈-113dBm。记忆：0.5μV@50Ω≈-113dBm，比1μV正好低6dB。"},{"id":"MC1-0874","category":"3.6.3","categoryName":"防雷与接地","type":"MC1","selectCount":1,"question":"当输出信号满足规定质量标准时，在输入阻抗为50 欧的某接收机天线输入端口处测得的 输入信号最小电压为0.5μV。如果用电压电平dBμV 表示该机的灵敏度，则为：","options":{"A":"0dBμV","B":"-2dBμV","C":"3dBμV","D":"6dBμV"},"answer":"A","explanation":"端电压0.5μV按电动势计为1μV，dBμV=20lg(1μV/1μV)=0dBμV。记忆：1μV就是dBμV的0基准点。"},{"id":"MC1-0875","category":"3.6.3","categoryName":"防雷与接地","type":"MC1","selectCount":1,"question":"已知某接收机的天线输入阻抗为50Ω，灵敏度指标为2μV，则功率电平相应为：","options":{"A":"-107dBm","B":"0.02dBm","C":"-103dBm","D":"-113dBm"},"answer":"A","explanation":"灵敏度2μV为电动势，匹配时端电压折半为1μV，功率(1μV)²/50Ω≈2×10⁻¹⁴W即-107dBm。记忆：2μV灵敏度对应-107dBm。"},{"id":"MC1-0876","category":"3.6.3","categoryName":"防雷与接地","type":"MC1","selectCount":1,"question":"已知某接收机的天线输入阻抗为50Ω，灵敏度指标为1μV，则功率电平相应为：","options":{"A":"-113dBm","B":"-107dBm","C":"0.01dBm","D":"-103dBm"},"answer":"A","explanation":"灵敏度1μV为电动势，匹配时端电压折半为0.5μV，功率(0.5μV)²/50Ω≈5×10⁻¹⁵W即-113dBm。记忆：1μV灵敏度对应-113dBm。"},{"id":"MC1-0877","category":"3.6.3","categoryName":"防雷与接地","type":"MC1","selectCount":1,"question":"制约现代无线电接收机灵敏度的主要因素是：","options":{"A":"机内噪声","B":"放大电路的增益","C":"放大电路的稳定性","D":"电源噪声"},"answer":"A","explanation":"灵敏度受机内噪声限制：信号再弱也会被机内噪声淹没，增益再高也提不出低于底噪的信号。记忆：\"灵敏度卡在底噪上\"。"},{"id":"MC1-0878","category":"3.6.3","categoryName":"防雷与接地","type":"MC1","selectCount":1,"question":"术语“信噪比（SNR）”在业余无线电领域广为使用。它是指：","options":{"A":"有用信号功率对噪声功率的比值","B":"有用信号峰值电压对噪声峰值电压的比值","C":"有用信号功率对有用信号功率及噪声功率之和的比值","D":"有用信号峰值电压对有用信号峰值电压及噪声峰值电压之和的比值"},"answer":"A","explanation":"信噪比SNR=有用信号功率/噪声功率。B、D用峰值电压比不对，C是有用信号占总功率之比（那是另一回事）。记忆：\"信噪比=信号比噪声\"。"},{"id":"MC1-0879","category":"3.6.3","categoryName":"防雷与接地","type":"MC1","selectCount":1,"question":"对于需要接收微弱信号的业余通信，例如EME 通联，接收机的噪声系数Fn（以比值的 形式表示）是一项重要技术指标。它是指：","options":{"A":"接收机输入端信噪比Si/Ni 对输出端信噪比So/No 的比值","B":"接收机输入端无信号时，输出端的噪声功率电平","C":"接收机输出端噪声功率电平与输入端噪声功率电平的比值","D":"接收机输入端噪声功率电平与输出端噪声功率电平的比值"},"answer":"A","explanation":"噪声系数Fn=输入端信噪比Si/Ni÷输出端信噪比So/No，即接收机使信噪比劣化的倍数。记忆：\"进去的信噪比 比 出来的信噪比\"。"},{"id":"MC1-0880","category":"3.6.3","categoryName":"防雷与接地","type":"MC1","selectCount":1,"question":"接收机的静噪灵敏度是指：","options":{"A":"能够使静噪电路退出静噪状态的射频信号最小输入电平","B":"关闭静噪功能之后所能接收到的射频信号最小输入电平","C":"带有静噪功能的接收机开启静噪功能后，按照灵敏度定义测得的灵敏度","D":"带有静噪功能的接收机关闭静噪功能后，按照灵敏度定义测得的灵敏度"},"answer":"A","explanation":"静噪灵敏度指使静噪电路刚好退出静噪（打开）的最小射频输入电平。B、C、D都在讲关闭静噪后测灵敏度，与定义不符。记忆：\"压开静噪的门槛\"。"},{"id":"MC1-0881","category":"3.6.3","categoryName":"防雷与接地","type":"MC1","selectCount":1,"question":"对于需要接收微弱信号的业余通信，例如EME 通联，接收机的噪声系数Fn（以比值的 形式表示）是一项重要技术指标。关于Fn 的一些基本常识是：","options":{"A":"Fn 一定大于1；在同样的灵敏度下，Fn 越接近1 越好","B":"Fn 一定小于1；在同样的灵敏度下，Fn 越接近0 越好","C":"Fn 一定大于1；在同样的灵敏度下，Fn 越大越好","D":"Fn 一定小于1；在同样的灵敏度下，Fn 越接近1 越好"},"answer":"A","explanation":"接收机必然引入额外噪声，故Fn>1；理想机Fn=1。Fn越接近1，额外噪声越少越好。记忆：\"Fn大于1，越近1越纯\"。"},{"id":"MC1-0882","category":"3.6.3","categoryName":"防雷与接地","type":"MC1","selectCount":1,"question":"对于需要接收微弱信号的业余通信，例如EME 通联，接收机的噪声指数NF（以对数表 示）是一项重要技术指标。它是指：","options":{"A":"接收机输入端信噪比Si/Ni 对输出端信噪比So/No 的比值的对数形式","B":"接收机输入端无信号时，输出端的噪声功率电平的对数形式","C":"接收机输出端噪声功率电平与输入端噪声功率电平的比值的对数形式","D":"接收机输入端噪声功率电平与输出端噪声功率电平的比值的对数形式"},"answer":"A","explanation":"噪声指数NF=10lgFn，即输入端信噪比对输出端信噪比之比取对数，把倍数化成dB数。记忆：\"Fn是倍数，NF是dB\"。"},{"id":"MC1-0883","category":"3.6.3","categoryName":"防雷与接地","type":"MC1","selectCount":1,"question":"对于需要接收微弱信号的业余通信，例如EME 通联，接收机的噪声指数NF（以对数表 示）是一项重要技术指标。关于NF 的一些基本常识是：","options":{"A":"NF 一定大于0；在同样的灵敏度下，NF 越接近0 越好","B":"NF 一定小于0；在同样的灵敏度下，NF 越接近0 越好","C":"NF 一定大于1；在同样的灵敏度下，NF 越大越好","D":"NF 一定处于0 和1 之间；在同样的灵敏度下，NF 越接近1 越好"},"answer":"A","explanation":"Fn>1，则NF=10lgFn>0dB；NF越接近0表示越接近无噪声的理想机。记忆：\"NF大于0，越近0越纯\"。"},{"id":"MC1-0884","category":"3.6.3","categoryName":"防雷与接地","type":"MC1","selectCount":1,"question":"在无线电通信领域中，描述信号源、放大器或接收机等设备或系统组件的内部噪声大小 时常用“噪声温度”指标。以接收机为例，等效噪声温度Te 的意义是：","options":{"A":"接收机的内部噪声功率等于一个接在天线输入端的优质匹配电阻在产生相同的热噪声功 率时该电阻所具有的绝对温度","B":"接收机内部噪声在输出端的功率可以使一个接在输出端上的匹配电阻发热的相对温度","C":"接收机内部噪声在输出端的功率可以使一个接在输出端上的匹配电阻升温的绝对温度","D":"接收机信噪比符合技术指标时所要求的设备工作环境的温度"},"answer":"A","explanation":"等效噪声温度Te把接收机内部噪声折合成接在天线输入端匹配电阻产生相同热噪声功率时的绝对温度，温度越高噪声越大。记忆：\"内噪折算成电阻温度\"。"},{"id":"MC1-0885","category":"3.6.3","categoryName":"防雷与接地","type":"MC1","selectCount":1,"question":"不产生任何内部噪声的理想放大器或接收机的噪声系数Fn、噪声指数NF 和噪声温度Te 分别为：","options":{"A":"1，0dB，0°K","B":"0，0dB，-273°K","C":"0，1dB，17°K","D":"0，0dB，-275°K"},"answer":"A","explanation":"理想放大器无内部噪声：Fn=1（不劣化信噪比），NF=10lg1=0dB，Te=0°K。记忆：\"理想三零：系数1、指数0dB、温度0K\"。"},{"id":"MC1-0886","category":"3.6.3","categoryName":"防雷与接地","type":"MC1","selectCount":1,"question":"假设一个用于卫星业余业务的天线放大器工作在标准温度（17℃）下，其输入端已连接 良好匹配的天线。如果放大器所产生的内部噪声与输入的热噪声等效，则该放大器的噪声系 数Fn、噪声指数NF 和噪声温度Te 分别为：","options":{"A":"2，3dB，290°K","B":"1，1dB，0°K","C":"2，0dB，17°K","D":"1，0dB，-273°K"},"answer":"A","explanation":"标准温度17℃=290K；放大器内噪与输入热噪声等效，总噪声翻倍，故Fn=2、NF=10lg2≈3dB、Te=290°K。记忆：\"内噪等效一倍→2倍/3dB/290K\"。"},{"id":"MC1-0908","category":"3.8.1","categoryName":"电磁辐射防护","type":"MC1","selectCount":1,"question":"在业余无线电领域中，缩写AMSAT 是指：","options":{"A":"美国的业余无线电卫星公司，是一个专注于实验卫星的设计、制造、运行和推进空间教 育的非营利性志愿者组织","B":"所有业余无线电卫星的总称","C":"某一系列业余无线电卫星的总称","D":"某一颗业余无线电卫星的名称"},"answer":"A","explanation":"AMSAT指美国的业余无线电卫星公司（Radio Amateur Satellite Corporation），是专注实验卫星设计、制造、运行和空间教育的非营利志愿者组织。记忆：\"AMSAT=造卫星的业余组织\"。"},{"id":"MC1-0909","category":"3.8.1","categoryName":"电磁辐射防护","type":"MC1","selectCount":1,"question":"在描述业余无线电卫星时经常用到缩写OSCAR（奥斯卡），这个名称的由来是：","options":{"A":"“搭载有业余无线电装置的地球轨道卫星”的英文缩写","B":"按照发明者奥斯卡的方案设计制造的业余卫星","C":"纪念业余无线电技术先驱者奥斯卡","D":"电影奥斯卡金奖的基金所赞助的业余卫星活动"},"answer":"A","explanation":"OSCAR是\"Orbiting Satellite Carrying Amateur Radio\"（搭载业余无线电装置的地球轨道卫星）的英文缩写，与发明者、电影奖无关。记忆：\"OSCAR=轨道上带业余电台的卫星\"。"},{"id":"MC1-0910","category":"3.8.1","categoryName":"电磁辐射防护","type":"MC1","selectCount":1,"question":"我国发射的第一颗业余卫星的发射年份、名称、国际OSCAR 系列号和转发器模式分别 为：","options":{"A":"2009 年，希望一号（XW-1），HO68，V/U（J）","B":"2008 年，希望一号（XW-1），HO68，V/U（J）","C":"2010 年，希望一号（XW-1），HO68，V/U（J）","D":"2008 年，希望一号（XW-1），无OSCAR 编号，B"},"answer":"A","explanation":"我国首颗业余卫星希望一号（XW-1）于2009年12月发射，OSCAR编号HO68，转发器为V/U（J）模式（上行V、下行U）。记忆：\"09年、希望一号、HO68、J模式\"。"},{"id":"MC1-0911","category":"3.8.1","categoryName":"电磁辐射防护","type":"MC1","selectCount":1,"question":"开展EME 通信试验的最佳时机是：","options":{"A":"月亮处于近地点","B":"满月","C":"通信两端天气都好","D":"太阳黑子数高"},"answer":"A","explanation":"月亮处于近地点时离地球最近，路径损耗最小、信号最强，是EME通联最佳时机。满月虽好看但月距不是最小。记忆：\"EME看距离，近地月最好\"。"},{"id":"MC1-0912","category":"3.8.1","categoryName":"电磁辐射防护","type":"MC1","selectCount":1,"question":"在EME 通信等需要接收极微弱信号的场合，安装前置放大器时应做到：","options":{"A":"尽量安装在靠近天线的地方，信号特别微弱时对放大器进行冷却以降低热噪声","B":"尽量安装在靠近接收机的地方，放大器最好加热以防止元器件温度过低","C":"尽量安装在靠近接收机的地方，放大器尽量采用较高的电源电压以求更高的增益","D":"尽量安装在远离天线的地方，放大器采用射频正反馈电路以提高增益"},"answer":"A","explanation":"前置放大器越靠近天线，馈线固有噪声混入越少，越能提高整机信噪比；信号极弱时制冷可降低放大器热噪声。记忆：\"低噪放贴天线，制冷更安静\"。"},{"id":"MC1-0913","category":"3.8.1","categoryName":"电磁辐射防护","type":"MC1","selectCount":1,"question":"对于需要接收VHF/UHF 微弱信号的通信场景，比如月面反射实验，爱好者们时常需要在 所用八木天线的馈电端处就近加装低噪声前置放大器。相比之下，HF 通信爱好者却很少将 他们所用的前置放大器装在八木天线或其他收信天线的馈电点处。这是因为：","options":{"A":"VHF/UHF 频段的背景噪声较HF 频段为低。将放大器置于接收天线处可降低传输线固有 噪声的影响，提高收信信噪比。而对于HF 频段，是否这样做，差别并不明显","B":"电缆的固有噪声在VHF/UHF 频段更高","C":"HF 频段的放大器体积太大，不适合安装于天线端","D":"HF 频段的八木天线体积较大，把放大器装得太近容易引发自激"},"answer":"A","explanation":"VHF/UHF背景噪声比HF低，馈线噪声会显著拉低信噪比，所以低噪放要装天线馈电点；HF频段背景噪声本来就大，装哪差别不明显。记忆：\"V/U底噪低要前置，HF噪声大无所谓\"。"},{"id":"MC1-0914","category":"3.8.1","categoryName":"电磁辐射防护","type":"MC1","selectCount":1,"question":"下列哪个业余波段最适合流星余迹散射通信？","options":{"A":"6 米","B":"10 米","C":"2 米","D":"70 厘米"},"answer":"A","explanation":"6米波段（50MHz）最适合流星余迹散射，电离余迹与频率匹配，一次余迹可通数百公里。记忆：\"流星余迹找6米\"。"},{"id":"MC1-0915","category":"3.8.1","categoryName":"电磁辐射防护","type":"MC1","selectCount":1,"question":"下列哪些通信方式可用于流星余迹和对流层散射通信实验？","options":{"A":"FT4","B":"APRS","C":"QPSK31","D":"MT63"},"answer":"A","explanation":"FT4是专为弱信号设计的数字模式，突发时间短、适合快衰落，可用于流星余迹和对流层散射实验。记忆：\"弱信号快通联选FT4\"。"},{"id":"MC2-0916","category":"4.1.1","categoryName":"业余电台组成","type":"MC2","selectCount":2,"question":"导体是易于传导电流的物质或材料。以下关于导体的正确描述是：","options":{"A":"导体中存在大量的可自由移动的电子或离子，施加电压可产生电流","B":"多数金属都是导电性能优良的导体，比如银、铜和铝","C":"有些金属在高温下呈现零电阻特性，成为超导体","D":"某些金属具有压电效应，可用来制作电声元件"},"answer":"AB","explanation":"选AB：导体存在大量可自由移动的电子或离子（A对），银铜铝等多数金属是良导体（B对）。C错：超导发生在低温而非高温。D错：压电效应是晶体特性，与金属无关。"},{"id":"MC3-0917","category":"4.1.1","categoryName":"业余电台组成","type":"MC3","selectCount":3,"question":"关于导体，以下说法正确的是：","options":{"A":"霓虹灯中电离发光的气体是导体","B":"酸、碱、盐的水溶液是导体","C":"石墨是导体","D":"云母是导体"},"answer":"ABC","explanation":"选ABC：电离发光的气体（霓虹灯）、酸碱盐的水溶液、石墨都能导电。D错：云母是典型绝缘体。记忆：\"气体、溶液、石墨都导电，云母绝缘\"。"},{"id":"MC4-0918","category":"4.1.1","categoryName":"业余电台组成","type":"MC4","selectCount":4,"question":"绝缘体是不易传导电流的物质或材料。以下关于绝缘体的正确描述是：","options":{"A":"分子中正负电荷紧密束缚，可自由移动的带电粒子极少，呈现很大的电阻","B":"绝缘体也称电介质。有些电介质可用来制作电容器，比如陶瓷和聚苯乙烯","C":"随着所加电场的增强，绝缘体会突然导电而成为导体。这种现象称为击穿","D":"随着温度的升高，绝缘体的绝缘程度下降。使用绝缘体应当关注工作温度"},"answer":"ABCD","explanation":"ABCD全对：绝缘体正负电荷束缚紧密、可自由移动粒子极少（A）；也称电介质，陶瓷、聚苯乙烯可做电容（B）；电场过强会击穿变导体（C）；温度升高绝缘性下降（D）。四条构成绝缘体完整画像。"},{"id":"MC3-0919","category":"4.1.1","categoryName":"业余电台组成","type":"MC3","selectCount":3,"question":"以下哪些可以用作绝缘材料？","options":{"A":"工程塑料","B":"酚醛树脂","C":"二氧化硅","D":"二氧化锡"},"answer":"ABC","explanation":"选ABC：工程塑料、酚醛树脂、二氧化硅（SiO2）都是常用绝缘材料。D错：二氧化锡是透明导电材料（做电极、加热膜等），不是绝缘体。记忆：\"含锡的那一个导电\"。"},{"id":"MC3-0920","category":"4.1.1","categoryName":"业余电台组成","type":"MC3","selectCount":3,"question":"“击穿”是指施加于绝缘介质上的电压高于一定值时，部分介质突然变成导体，导致介 质的电阻陡然下降的一种现象。以下哪些是对击穿现象的描述？","options":{"A":"电路中的电容在工作电压显著超过标称耐压后变成导体，造成电路短路","B":"天线调谐器工作时，可变电容的极板间出现电弧，导致发射机告警保护","C":"验电笔中的氖灯发光","D":"台灯里的卤钨灯发光"},"answer":"ABC","explanation":"选ABC：电容超压击穿短路、可变电容极板间拉弧、验电笔氖灯气体放电（辉光）都是介质击穿现象。D错：卤钨灯是热发光，与击穿无关。记忆：\"击穿=介质变导体\"。"},{"id":"MC1-0921","category":"4.1.1","categoryName":"业余电台组成","type":"MC1","selectCount":1,"question":"业余无线电设备中的射频部件积灰或受潮后，即使没有击穿或漏电，也可能因绝缘体的 物理性质发生改变而意外产生：","options":{"A":"介质损耗","B":"涡流损耗","C":"磁滞损耗","D":"磁阻损耗"},"answer":"A","explanation":"积灰受潮改变绝缘体的介电特性，在高频电场下介质极化跟不上产生滞后损耗即介质损耗，即使没击穿漏电也有此损耗。记忆：\"脏潮→介质损耗\"。"},{"id":"MC4-0922","category":"4.1.1","categoryName":"业余电台组成","type":"MC4","selectCount":4,"question":"半导体是导电能力介于导体与绝缘体之间的一类物质或材料。对半导体的正确描述是：","options":{"A":"导电特性易于控制。例如，温度、光照或电场的少许变化可显著改变材料的导电性","B":"半导体可分为本征半导体和杂质半导体。后者又有P 型和N 型之分","C":"P 型和N 型半导体的交界面称为PN 结，具有内建电动势和单向导电性","D":"硅、锗等半导体材料可用来制作晶体管或集成电路"},"answer":"ABCD","explanation":"ABCD全对：半导体导电性易受温度、光照、电场控制（A）；分本征与杂质半导体，后者有P、N型（B）；PN结有内建电动势和单向导电性（C）；硅锗可做晶体管、集成电路（D）。全是半导体基础常识。"},{"id":"MC3-0923","category":"4.1.1","categoryName":"业余电台组成","type":"MC3","selectCount":3,"question":"下列哪些器件由半导体材料制成？","options":{"A":"双极型三极管","B":"氮化镓三极管","C":"LDMOS 三极管","D":"电真空三极管"},"answer":"ABC","explanation":"选ABC：双极型三极管（BJT）、氮化镓（GaN）、LDMOS都是半导体器件。D错：电真空三极管是真空管，靠热阴极电子发射工作，不是半导体。记忆：\"器件分半导体管和电真空管\"。"},{"id":"MC3-0924","category":"4.1.2","categoryName":"收发信机操作","type":"MC3","selectCount":3,"question":"静电放电是一种常见电磁现象，时刻伴随日常生活。但是，较强的静电放电却足以损坏 电子设备甚至危及人身，需要预防。以下所述与静电有关的是：","options":{"A":"刮风时，斜拉天线上出现的直流高压","B":"雷雨时，云层中积蓄的巨大能量","C":"收信时，接收机收到的各种QRN","D":"发话时，电台馈送到天线的射频能量"},"answer":"ABC","explanation":"选ABC：刮风时斜拉天线的直流高压（风尘摩擦起电）、雷雨云积蓄的能量、收信时的QRN（天电/静电噪声）都与静电有关。D错：馈送天线的射频能量是电磁波，不是静电。记忆：\"QRN就是静电噪声\"。"},{"id":"MC2-0925","category":"4.1.2","categoryName":"收发信机操作","type":"MC2","selectCount":2,"question":"如果将导体置于静电场中，导体将呈现如下特点：","options":{"A":"静电平衡后，导体是等势体，内部场强为零，外表面出现电荷","B":"外表面曲率很小时，导体表面的电荷会高度聚集。这可能形成尖端放电","C":"静电平衡后，导体是等势体，内部电荷与外表面电荷极性相反","D":"外表面曲率很大时，导体表面的电荷会高度聚集。这可能形成尖端放电"},"answer":"AB","explanation":"按题库答案选AB：静电平衡后导体是等势体、内部场强为零、电荷分布在外表面（A对）。提示：B、D关于尖端放电的表述在物理上其实反了——电荷聚集发生在曲率\"很大\"（尖锐）处，正确的应是D；但本题官方答案给出AB，考试时请按AB作答。C错在\"内部出现电荷\"（应在外表面）。"},{"id":"MC2-0926","category":"4.1.2","categoryName":"收发信机操作","type":"MC2","selectCount":2,"question":"直流电（DC）是以电荷的运动方向始终不变来定义的。关于直流电，以下描述正确的是：","options":{"A":"直流电源的输出端有正负极之分","B":"电池提供的是直流电","C":"直流电压通常为13.8 伏。这样的低压即使短路也没什么危害","D":"脉动直流电不含交流成分，因为电荷的运动方向始终不变"},"answer":"AB","explanation":"选AB：直流电源输出端有正负极之分（A对），电池提供直流电（B对）。C错：13.8V短路照样大电流发热，有危险。D错：脉动直流含有交流成分。记忆：\"直流方向不变，正负要分清\"。"},{"id":"MC1-0927","category":"4.1.2","categoryName":"收发信机操作","type":"MC1","selectCount":1,"question":"交流电（AC）是以电荷的运动方向随时间交替变化来定义的。关于交流电，以下描述正 确的是：","options":{"A":"交流电源的输出端没有正负极之分，因为极性总在交替变化","B":"220V 市电是一种交流电。由于不需区分正负极，所以火线和零线可以混用","C":"交流电均为纯正弦波，仅包含单一频率成分","D":"业余电台所接收的信号不是交流电。那是复杂波形信号，也就是“复信号”"},"answer":"A","explanation":"交流电极性随时间交替，输出端不分正负极（A对）。B错：市电火线零线绝不能混用。C错：交流波形不限纯正弦。D错：接收信号本质就是射频交流信号。记忆：\"交流变极性，火零不能混\"。"},{"id":"MC1-0928","category":"4.1.2","categoryName":"收发信机操作","type":"MC1","selectCount":1,"question":"以下哪一个术语可以用来描述交流电每秒改变极性的次数？","options":{"A":"频率","B":"速率","C":"波长","D":"脉率"},"answer":"A","explanation":"频率即每秒完成周期变化的次数，交流电每秒改变极性的次数就是频率。记忆：\"每秒变极性几次=频率（Hz）\"。"},{"id":"MC1-0929","category":"4.1.2","categoryName":"收发信机操作","type":"MC1","selectCount":1,"question":"业余无线电爱好者经常提及的“波长”与无线电波的频率有什么关系？","options":{"A":"波长为光速与频率之比；频率越高，波长越短","B":"波长与真空有些关联，但是在现实生活中无用","C":"很明显，波长为频率的1/4。这个常数应当牢记","D":"很明显，波长为频率的4 倍。这个常数应当牢记"},"answer":"A","explanation":"波长λ=c/f，为光速与频率之比，频率越高波长越短。例：50MHz对应6米。记忆：\"波长=光速÷频率，越高越短\"。"},{"id":"MC1-0930","category":"4.1.2","categoryName":"收发信机操作","type":"MC1","selectCount":1,"question":"物理量“电动势”描述的是：","options":{"A":"电子器件或装置将某种形式的能量转化为电能的能力","B":"加在电路两端的电源驱动电子流动的力量大小","C":"单位时间内流过电路的电子数量","D":"电源所能供应的电子数量最大值"},"answer":"A","explanation":"电动势描述电源把化学、机械等其他形式能量转化为电能的能力，是\"源头\"指标；电压则是驱动电子的力量。记忆：\"电动势管转化，电压管推力\"。"},{"id":"MC1-0931","category":"4.1.2","categoryName":"收发信机操作","type":"MC1","selectCount":1,"question":"物理量“电压”描述的是：","options":{"A":"加在电路两端的电源驱动电子流动的力量大小","B":"电子器件或装置将其它形式的能量转化为电能的能力","C":"单位时间内流过电路的电子数量","D":"电源所能供应的电子数量最大值"},"answer":"A","explanation":"电压是加在电路两端驱动电子流动的力量大小（电势差）。B说的是电动势（能量转化能力），C是电流，D无意义。记忆：\"电压是推力，电动势是转化力\"。"},{"id":"MC1-0932","category":"4.1.2","categoryName":"收发信机操作","type":"MC1","selectCount":1,"question":"正弦交流电压或电流的峰值（peak value）是指：（“x＾m”表示“x 的m 次方”）","options":{"A":"从零点算起的最大值","B":"一个周期内瞬时值的平均值乘以2＾(1/2)","C":"负半周最大幅度与正半周最大幅度的平均值","D":"负半周最大幅度与正半周最大幅度的差值的二次方"},"answer":"A","explanation":"峰值指从零点（零轴）算起的最大瞬时值，即正弦波的振幅。B说法把有效值关系记混，C、D无意义。记忆：\"峰值=零轴到顶\"。"},{"id":"MC1-0933","category":"4.1.2","categoryName":"收发信机操作","type":"MC1","selectCount":1,"question":"正弦交流电压或电流的峰-峰值（peak-to-peak value）是指：","options":{"A":"从负半周峰值到正半周峰值之间的差值","B":"从零点算起的最大值","C":"负半周最大幅度与正半周最大幅度的差值的二次方","D":"负半周最大幅度与正半周最大幅度的差值的平方根"},"answer":"A","explanation":"峰-峰值指波形正峰到负峰之间的总摆幅，即正峰峰值与负峰峰值之差，等于峰值的两倍。B 说的是从零点算起的峰值，C、D 的\"差值二次方/平方根\"纯属凑数。记：峰峰就是\"正峰到负峰的全程距离\"。"},{"id":"MC1-0934","category":"4.1.2","categoryName":"收发信机操作","type":"MC1","selectCount":1,"question":"任意交流电压的有效值（RMS voltage）是指：（“x＾m”表示“x 的m 次方”）","options":{"A":"在同一电阻上可以转换出与该交流电压效果相同的热量的直流电压","B":"最终转换成在应用场景中真正发挥作用的有效能量的那部分电压值","C":"电压的平均值乘以2＾(1/2)","D":"电压的峰值除以2＾(1/2)"},"answer":"A","explanation":"有效值就是让交流电与某个直流电压在同一电阻上产生相同热量的那个直流电压值，A 对。C 平均值乘√2 不符合定义，D 峰值除√2 只对正弦波成立，B 说法含糊。记：有效值=发热等效的直流电压。"},{"id":"MC1-0935","category":"4.1.2","categoryName":"收发信机操作","type":"MC1","selectCount":1,"question":"物理量“电流”描述的是：","options":{"A":"单位时间内流过电路的电子数量","B":"电源所能供应的电子数量最大值","C":"通电后流过电路的电子数量","D":"电子在导体中的运动速度"},"answer":"A","explanation":"电流定义是单位时间内流过导体的电荷量（电子数量），即电荷流动的快慢，A 对。B 讲的是电源容量、D 讲的是电子速度，C 漏了\"单位时间\"。记：电流像水管每秒流过的水量。"},{"id":"MC1-0936","category":"4.1.2","categoryName":"收发信机操作","type":"MC1","selectCount":1,"question":"物理量“电阻”描述的是：","options":{"A":"电路从一点到另一点阻碍电流通过的能力大小","B":"电子克服电路阻力所需的能量大小","C":"电路阻碍电流通过所消耗的能量大小","D":"电路阻断电流所需的过渡时间"},"answer":"A","explanation":"电阻描述的是电路对电流阻碍作用的能力大小，A 对。B、C 讲的是克服阻力所需或消耗的能量，D 讲的是阻断时间，都不是电阻。记：电阻=挡电流的能力，单位欧姆。"},{"id":"MC1-0937","category":"4.1.2","categoryName":"收发信机操作","type":"MC1","selectCount":1,"question":"物理量“功率”描述的是：","options":{"A":"电流在单位时间内所做的功","B":"电子通过电路所获得的能量大小","C":"负载总共消耗的能量","D":"电源所能供应的电子数量最大值"},"answer":"A","explanation":"功率是单位时间内所做的功，即做功的快慢，A 对。B、C 说的是能量（做功总量），D 是电源容量，都不对。记：功率=每秒做多少功，如\"每秒 10 焦耳\"。"},{"id":"MC2-0938","category":"4.1.2","categoryName":"收发信机操作","type":"MC2","selectCount":2,"question":"直流电路欧姆定律是说：","options":{"A":"流过电阻的电流I 与电阻两端的电压U 成正比，与阻值R 成反比","B":"电阻两端的电压U 与流过电阻的电流I 成正比，与阻值R 成正比","C":"流过电阻的电流I 与电阻两端的电压U 成正比，与阻值R 成正比","D":"电阻两端的电压U 与流过电阻的电流I 成正比，与阻值R 成反比"},"answer":"AB","explanation":"欧姆定律 U=IR：A 的 I 与 U 成正比、与 R 成反比即 I=U/R 对；B 的 U 与 I、R 都成正比即 U=IR 对。C、D 把反比关系说反。记：U=IR，谁在分母谁反比。"},{"id":"MC1-0939","category":"4.1.2","categoryName":"收发信机操作","type":"MC1","selectCount":1,"question":"在电路中不受电阻阻碍的电流，种类如下：","options":{"A":"不存在","B":"射频电流","C":"音频电流","D":"直流电流"},"answer":"A","explanation":"任何电流都要流过有电阻的导体和电路，不存在完全不受电阻阻碍的电流，A 对。射频、音频、直流电流全都受电阻影响。记：\"天下没有白走的电流\"，处处有电阻。"},{"id":"MC1-0940","category":"4.1.2","categoryName":"收发信机操作","type":"MC1","selectCount":1,"question":"术语“阻抗”描述的是：","options":{"A":"电路从一点到另一点对交流电流阻碍作用的统称","B":"电路从一点到另一点阻断直流电流，通过交流电流的能力大小","C":"电路从一点到另一点阻断交流电流，通过直流电流的能力大小","D":"电路从一点到另一点阻断特定频率交流电流的能力大小"},"answer":"A","explanation":"阻抗是电路对交流电流阻碍作用的统称，包含电阻与电抗，A 对。B、C 说\"阻断\"不对，阻抗是阻碍而非完全阻断；D 只提特定频率，范围太窄。记：阻抗=交流版的\"电阻\"。"},{"id":"MC1-0941","category":"4.1.3","categoryName":"天线系统","type":"MC1","selectCount":1,"question":"电动势的单位是：","options":{"A":"伏（特）","B":"安（培）","C":"瓦（特）","D":"欧（姆）"},"answer":"A","explanation":"电动势和电压的单位都是伏特（V），A 对。安培是电流单位，瓦特是功率单位，欧姆是电阻单位。记：与电压有关的量都以\"伏\"为单位。"},{"id":"MC1-0942","category":"4.1.3","categoryName":"天线系统","type":"MC1","selectCount":1,"question":"电压的单位是：","options":{"A":"伏（特）","B":"安（培）","C":"瓦（特）","D":"欧（姆）"},"answer":"A","explanation":"电压的单位是伏特（V），A 对。安培是电流、瓦特是功率、欧姆是电阻。记：看伏特表（电压表）上的字母 V 就是伏。"},{"id":"MC1-0943","category":"4.1.3","categoryName":"天线系统","type":"MC1","selectCount":1,"question":"电流的单位是：","options":{"A":"安（培）","B":"伏（特）","C":"瓦（特）","D":"欧（姆）"},"answer":"A","explanation":"电流的单位是安培（A），A 对。伏特是电压、瓦特是功率、欧姆是电阻。记：电流表上标着 A（安培）。"},{"id":"MC1-0944","category":"4.1.3","categoryName":"天线系统","type":"MC1","selectCount":1,"question":"电阻的单位是：","options":{"A":"欧（姆）","B":"安（培）","C":"伏（特）","D":"瓦（特）"},"answer":"A","explanation":"电阻的单位是欧姆（Ω），A 对。安培、伏特、瓦特分别是电流、电压、功率单位。记：欧姆定律里的 R 就是欧。"},{"id":"MC1-0945","category":"4.1.3","categoryName":"天线系统","type":"MC1","selectCount":1,"question":"阻抗的单位是：","options":{"A":"欧（姆）","B":"安（培）","C":"伏（特）","D":"瓦（特）"},"answer":"A","explanation":"阻抗的单位与电阻一样，都是欧姆（Ω），A 对。安培、伏特、瓦特分别是电流、电压、功率单位。记：阻抗也是\"欧\"，和电阻同单位。"},{"id":"MC1-0946","category":"4.1.3","categoryName":"天线系统","type":"MC1","selectCount":1,"question":"功率的单位是：","options":{"A":"瓦（特）","B":"安（培）","C":"伏（特）","D":"欧（姆）"},"answer":"A","explanation":"功率的单位是瓦特（W），A 对。安培、伏特、欧姆分别是电流、电压、电阻单位。记：灯泡标多少瓦就是功率。"},{"id":"MC1-0947","category":"4.1.3","categoryName":"天线系统","type":"MC1","selectCount":1,"question":"频率的单位是：","options":{"A":"赫（兹）","B":"亨（利）","C":"法（拉）","D":"库（伦）"},"answer":"A","explanation":"频率的单位是赫兹（Hz），A 对。亨利是电感单位，法拉是电容单位，库仑是电荷量单位。记：每秒变化几次用\"赫\"。"},{"id":"MC1-0948","category":"4.1.3","categoryName":"天线系统","type":"MC1","selectCount":1,"question":"在法定计量单位中，词头k 的数学意义和文字含义分别为： （“x＾m”表示“x 的m 次方”）","options":{"A":"10＾3，千","B":"10＾(-3)，毫","C":"10＾6，兆","D":"10＾(-6)，微"},"answer":"A","explanation":"词头 k 表示 10^3，即\"千\"，1kHz=1000Hz，A 对。毫是 10^-3、兆是 10^6、微是 10^-6。记：k=千，千米 km 就是 1000 米。"},{"id":"MC1-0949","category":"4.1.3","categoryName":"天线系统","type":"MC1","selectCount":1,"question":"在法定计量单位中，词头m 的数学意义和文字含义分别为：（“x＾m”表示“x 的m 次 方”）","options":{"A":"10＾(-3)，毫","B":"10＾3，千","C":"10＾6，兆","D":"10＾(-6)，微"},"answer":"A","explanation":"词头 m 表示 10^-3，即\"毫\"，1mA=0.001A，A 对。千是 10^3、兆是 10^6、微是 10^-6。记：m=毫，毫米 mm 就是千分之一米。"},{"id":"MC1-0950","category":"4.1.3","categoryName":"天线系统","type":"MC1","selectCount":1,"question":"在法定计量单位中，词头M 的数学意义和文字含义分别为：（“x＾m”表示“x 的m 次 方”）","options":{"A":"10＾6，兆","B":"10＾(-6)，微","C":"10＾3，千","D":"10＾(-3)，毫"},"answer":"A","explanation":"词头 M 表示 10^6，即\"兆\"，1MHz=100 万 Hz，A 对。注意大小写：大写 M 是兆，小写 m 才是毫。记：M=兆，兆赫就是每秒百万次。"},{"id":"MC1-0951","category":"4.1.3","categoryName":"天线系统","type":"MC1","selectCount":1,"question":"在法定计量单位中，词头μ的数学意义和文字含义分别为：（“x＾m”表示“x 的m 次方”）","options":{"A":"10＾(-6)，微","B":"10＾6，兆","C":"10＾(-3)，毫","D":"10＾3，千"},"answer":"A","explanation":"词头 μ 表示 10^-6，即\"微\"，1μA=0.000001A，A 对。兆是 10^6、毫是 10^-3、千是 10^3。记：μ=微，微米是千分之一毫米。"},{"id":"MC1-0952","category":"4.1.3","categoryName":"天线系统","type":"MC1","selectCount":1,"question":"在法定计量单位中，词头G 的数学意义和文字含义分别为： （“x＾m”表示“x 的m 次方”）","options":{"A":"10＾9，吉","B":"10＾6，兆","C":"10＾12，太","D":"10＾(-12)，皮"},"answer":"A","explanation":"词头 G 表示 10^9，即\"吉\"，1GHz=10 亿 Hz，A 对。兆是 10^6、太是 10^12、皮是 10^-12。记：G=吉=十亿，手机 GHz 就是这个。"},{"id":"MC1-0953","category":"4.1.3","categoryName":"天线系统","type":"MC1","selectCount":1,"question":"在法定计量单位中，词头n 的数学意义和文字含义分别为： （“x＾m”表示“x 的m 次方”）","options":{"A":"10＾(-9)，纳","B":"10＾9，吉","C":"10＾12，太","D":"10＾(-12)，皮"},"answer":"A","explanation":"词头 n 表示 10^-9，即\"纳\"，1ns=0.000000001s，A 对。吉(10^9)、太(10^12)、皮(10^-12)都不是。记：n=纳=十亿分之一，纳秒极短。"},{"id":"MC1-0954","category":"4.1.3","categoryName":"天线系统","type":"MC1","selectCount":1,"question":"在法定计量单位中，词头T 的数学意义和文字含义分别为： （“x＾m”表示“x 的m 次方”）","options":{"A":"10＾12，太","B":"10＾-12，皮","C":"10＾9，吉","D":"10＾(-9)，纳"},"answer":"A","explanation":"词头 T 表示 10^12，即\"太\"，1THz=万亿 Hz，A 对。皮是 10^-12、吉是 10^9、纳是 10^-9。记：T=太=万亿，比兆还大三档。"},{"id":"MC1-0955","category":"4.1.3","categoryName":"天线系统","type":"MC1","selectCount":1,"question":"在法定计量单位中，词头p 的数学意义和文字含义分别为： （“x＾m”表示“x 的m 次方”）","options":{"A":"10＾(-12)，皮","B":"10＾12，太","C":"10＾(-9)，纳","D":"10＾9，吉"},"answer":"A","explanation":"词头 p 表示 10^-12，即\"皮\"，1pF=10^-12F，A 对。太(10^12)、纳(10^-9)、吉(10^9)都不对。记：p=皮=万亿分之一，电容常以皮法计。"},{"id":"MC1-0956","category":"4.1.3","categoryName":"天线系统","type":"MC1","selectCount":1,"question":"以下哪个业余无线电通信缩语可以表述术语“射频”或特指无线电用途的某个频率？","options":{"A":"RF","B":"HF","C":"AF","D":"MF"},"answer":"A","explanation":"RF=Radio Frequency，意为\"射频\"，指无线电频率，A 对。HF 短波、MF 中波、AF 音频都是具体频段或信号。记：Radio 开头的是 RF，其余是频段名。"},{"id":"MC1-0957","category":"4.1.3","categoryName":"天线系统","type":"MC1","selectCount":1,"question":"术语“音频”是指人们可以普遍听到的声音的频率。以下描述正确的是：","options":{"A":"音频的频率范围大致为16Hz-20kHz","B":"音频位于VLF 至MF 多个频带内","C":"音频的频率范围大致为16kHz-20kHz","D":"音频位于VHF 频带内"},"answer":"A","explanation":"人耳普遍可听范围约 16Hz-20kHz，A 对。C 下限写 16kHz 错（应为 Hz）；音频属声学频带，不在 VLF-MF、VHF 频带内。记：人耳 20Hz~20kHz。"},{"id":"MC1-0958","category":"4.1.3","categoryName":"天线系统","type":"MC1","selectCount":1,"question":"无线电通信及相关测试设备、电视设备和音频设备常用的传输接口标称阻抗分别为：","options":{"A":"50 欧、75 欧和600 欧","B":"50 欧、600 欧和75 欧","C":"50 欧、50 欧和75 欧","D":"75 欧、50 欧和16 欧"},"answer":"A","explanation":"常用标称阻抗：无线电通信及测试设备 50 欧，电视设备 75 欧，音频设备 600 欧，按此顺序选 A。顺序是考点，不能颠倒。记：通信 50、电视 75、音频 600。"},{"id":"MC1-0959","category":"4.1.3","categoryName":"天线系统","type":"MC1","selectCount":1,"question":"1,805,000Hz 可以表述为：","options":{"A":"1.805MHz","B":"1.805kHz","C":"1.805mHz","D":"1.805GHz"},"answer":"A","explanation":"1,805,000Hz=1.805×10^6Hz=1.805MHz，A 对。kHz 是 10^3 级太小，mHz、GHz 更不对。记：百万级频率用兆赫，180 万赫就是 1.805 兆。"},{"id":"MC1-0960","category":"4.1.3","categoryName":"天线系统","type":"MC1","selectCount":1,"question":"2430MHz 可以表示为：","options":{"A":"2.43GHz","B":"243GHz","C":"0.00243nHz","D":"24.3kHz"},"answer":"A","explanation":"2430MHz=2430×10^6Hz=2.43×10^9Hz=2.43GHz，A 对。B 把数位算错成 243GHz，kHz 量级太小。记：GHz 是十亿级，2430 兆移成十亿位即 2.43。"},{"id":"MC1-0961","category":"4.1.3","categoryName":"天线系统","type":"MC1","selectCount":1,"question":"将阻值为1 欧的电阻与13.8 伏电源并联，电阻所耗散的功率大约为：","options":{"A":"190 瓦","B":"13.8 伏","C":"13.8 安","D":"190 伏安"},"answer":"A","explanation":"P=U²/R=13.8²/1≈190W，A 对。B 写伏、D 写伏安是单位不对，C 写 13.8 安是电流而非功率。记：1 欧电阻直接算 U 平方，13.8×13.8≈190 瓦。"},{"id":"MC1-0962","category":"4.1.3","categoryName":"天线系统","type":"MC1","selectCount":1,"question":"5W 可以表示为：","options":{"A":"37dBm","B":"5dBW","C":"17dBm","D":"35dBμ"},"answer":"A","explanation":"5W 换 dBm：10lg(5/0.001)=10lg5000≈37dBm，A 对。B 5dBW≈3.2W、C 17dBm≈50mW 都不对。记：1W=30dBm，5W 约 37dBm。"},{"id":"MC1-0963","category":"4.1.3","categoryName":"天线系统","type":"MC1","selectCount":1,"question":"0.25W 可以表示为：","options":{"A":"54dBμ","B":"6dBW","C":"36dBm","D":"25dBm"},"answer":"A","explanation":"0.25W=250mW，对 1μW 取 10lg 约 54dBμ，A 对。B 6dBW≈4W、C 36dBm≈4W、D 25dBm≈0.3W 都不对。记：0.25W 约合 54dBμ。"},{"id":"MC1-0964","category":"4.1.3","categoryName":"天线系统","type":"MC1","selectCount":1,"question":"0.4kW 可以表示为：","options":{"A":"86dBμ","B":"400dBm","C":"6000dBm","D":"34dBm"},"answer":"A","explanation":"0.4kW=400W=4×10^8μW，对 1μW 取 10lg 约 86dBμ，A 对。B、C 数值离谱，D 34dBm 仅 2.5W。记：0.4kW 对 86dBμ。"},{"id":"MC4-0965","category":"4.1.4","categoryName":"电台安装调试","type":"MC4","selectCount":4,"question":"电源是业余无线电爱好者常用的一种供电装置。我们对电源的理解是：","options":{"A":"电源是一种将某种形式的能量转化为电能的供电装置","B":"电池是一种电源，其将化学能转化为电能，也称化学电源","C":"直流电源是将输入交流电或直流电转换成电压和电流符合要求的另一直流电的装置","D":"变压器可将交流电压和电流转换成交流的另一种电压和电流，可用来制作交流电源"},"answer":"ABCD","explanation":"全选。A 电源是把某种形式能量转化为电能的装置；B 电池将化学能转电能，称化学电源；C 直流电源输出符合要求的直流电；D 变压器变换交流电压电流，可组成交流电源。四种说法都正确。"},{"id":"MC1-0966","category":"4.1.4","categoryName":"电台安装调试","type":"MC1","selectCount":1,"question":"电源两端电动势的方向为：","options":{"A":"从电源的负极到正极","B":"从电源的正极到负极","C":"取决于负载电阻和电源内阻的相对大小","D":"与电源的电压方向相同"},"answer":"A","explanation":"电动势方向定义为电源内部从负极指向正极（\"泵\"出电的方向），A 对。外部电路才是正极到负极，那是电压方向（B、D 混淆）。记：内部负→正，外部正→负。"},{"id":"MC1-0967","category":"4.1.4","categoryName":"电台安装调试","type":"MC1","selectCount":1,"question":"电源两端电压的方向为：","options":{"A":"从电源的正极到负极","B":"从电源的负极到正极","C":"取决于负载电阻和电源内阻的相对大小","D":"与电源的电动势方向相同"},"answer":"A","explanation":"电压方向指电场方向，在电源外部从正极到负极，A 对。电源内部才是负极到正极，那是电动势方向。记：外部正→负，内部负→正，两方向正好相反。"},{"id":"MC3-0968","category":"4.1.4","categoryName":"电台安装调试","type":"MC3","selectCount":3,"question":"为业余无线电设备供电的外置电源具有多种类型。常见的有：","options":{"A":"开关电源","B":"线性电源","C":"蓄电池","D":"标准电池"},"answer":"ABC","explanation":"常见外置供电电源有开关电源、线性电源和蓄电池，选 ABC。D 标准电池是提供标准电压做校准基准的，不能作供电电源。记：开关、线性、电池三兄弟，标准电池只\"校准\"不\"供电\"。"},{"id":"MC3-0969","category":"4.1.4","categoryName":"电台安装调试","type":"MC3","selectCount":3,"question":"下列哪一种电池可以充电？","options":{"A":"锂离子电池","B":"钠离子电池","C":"铅酸电池","D":"碱性干电池"},"answer":"ABC","explanation":"可充电电池有锂离子、钠离子和铅酸电池，选 ABC。D 碱性干电池一般一次性使用，强行充电易漏液甚至爆炸。记：锂、钠、铅都能充，碱性干电池别充。"},{"id":"MC1-0970","category":"4.1.4","categoryName":"电台安装调试","type":"MC1","selectCount":1,"question":"如何在电网停电的情况下给一个12 伏的铅酸蓄电池充电？","options":{"A":"用适当的连线将待充电蓄电池与汽车的蓄电池并联，然后发动车辆","B":"往蓄电池里加一些酸","C":"将蓄电池放在冰里冷却一会儿","D":"将蓄电池串联一个电灯泡作为限流装置，然后连接到220 伏市电上"},"answer":"A","explanation":"停电时可借汽车发电机充电：把待充蓄电池与汽车蓄电池并联后发动车辆，用发电机充电，A 对。加酸、冷冻都不是充电；串灯泡接 220V 市电既错又危险。记：并联车电瓶、发动车充电。"},{"id":"MC1-0971","category":"4.1.4","categoryName":"电台安装调试","type":"MC1","selectCount":1,"question":"使用蓄电池为电台供电时，应如何估算电池供电的时长？","options":{"A":"用电池的标称安时数除以收发信机的平均工作电流","B":"用电池的标称瓦时数除以收发信机的发射功率","C":"用电池的标称电压除以收发信机的平均工作电流","D":"用收发信机的发射功率除以电池的标称电压"},"answer":"A","explanation":"供电时长=电池标称安时数÷收发信机平均工作电流，A 对。用瓦时除发射功率、电压除电流、功率除电压都不对。记：安时数除以电流=小时数，如 7Ah÷3.5A=2 小时。"},{"id":"MC1-0972","category":"4.1.4","categoryName":"电台安装调试","type":"MC1","selectCount":1,"question":"电源的内阻对电路的影响是：","options":{"A":"使电源的实际输出电压降低","B":"使电源的电动势降低","C":"使电源的输出功率增加","D":"使电源的自身的能耗降低"},"answer":"A","explanation":"电源内阻会分走一部分电压，使实际输出电压降低，A 对。内阻不改变电动势本身（B 错），还会使输出功率和效率下降（C、D 错）。记：内阻\"偷吃\"电压，输出打折扣。"},{"id":"MC1-0973","category":"4.1.4","categoryName":"电台安装调试","type":"MC1","selectCount":1,"question":"有些收发信机会在直流13.8V 供电线路中串联一个熔断器，并在其后反向并联一个额定 电流很大的二极管作保护之用。该电路利用了二极管的什么特性？是如何工作的？","options":{"A":"利用二极管中PN 结的单向导电性；若电源极性接反，近乎短路的电流烧断熔丝，切断供 电","B":"在电源过压时利用二极管的击穿特性吸收电流以稳定供电电压","C":"在电源过流时利用二极管的击穿特性吸收电流以稳定供电电压","D":"若设备过热时利用二极管的热失控特性短路电源，烧断熔丝，切断供电"},"answer":"A","explanation":"利用 PN 结的单向导电性：若电源极性接反，反向并联的二极管导通近乎短路，大电流烧断熔丝切断供电，A 对。B、C 的击穿吸收、D 热失控都不是该保护原理。记：反并二极管=防反接的\"熔丝开关\"。"},{"id":"MC2-0974","category":"4.1.4","categoryName":"电台安装调试","type":"MC2","selectCount":2,"question":"有些收发信机会在13.8V 直流电源插座附近安装一个标有数字的复位按钮。其作用是什 么？","options":{"A":"当设备过流时切断电源","B":"当电源极性接反时切断电源","C":"如果工作温度超过数字所注的温度值则切断电源","D":"如果工作电压超过数字所注的伏特数则切断电源"},"answer":"AB","explanation":"复位按钮保护的两种情况：设备过流时（A）和电源极性接反时（B）切断电源，需复位。C 温度、D 电压不是按钮标注数字的含义（数字是过流保护电流值）。记：过流和反接都跳，按复位钮恢复。"},{"id":"MC1-1298","category":"4.6.1","categoryName":"常用测试仪器","type":"MC1","selectCount":1,"question":"用万用表的直流电压档测量正负对称的方波电压（占空比为1:1）。所得读数为：","options":{"A":"零值","B":"该电压的最大值","C":"该电压最大值的1/2","D":"该电压最大值的2 倍"},"answer":"A","explanation":"万用表直流电压档测得的是信号平均值。正负对称的 1:1 方波正半周和负半周面积相等，平均值为零，A 对。直流档不测峰值。记：直流档=平均档，对称方波正负抵消得零。"},{"id":"MC1-1299","category":"4.6.1","categoryName":"常用测试仪器","type":"MC1","selectCount":1,"question":"如果用磁电式万用表的交流电压档测量正负对称的方波电压（占空比为1:1），其指针所 示的电压读数：","options":{"A":"大于该电压的峰值","B":"为该电压的峰值","C":"为该电压的峰-峰值","D":"为该电压的平均值"},"answer":"A","explanation":"磁电式表交流档'测平均值、按正弦刻度'。对称方波整流后平均值等于峰值Vp，再按正弦1.11系数换算，读数约1.11Vp，故大于峰值。记忆：方波读数能超峰值，B/C/D是按正弦波想的。"},{"id":"MC1-1300","category":"4.6.1","categoryName":"常用测试仪器","type":"MC1","selectCount":1,"question":"用指针式万用表的直流电压档测量最小值为0 的方波电压（占空比为1:1），得到的读数 是该电压的：","options":{"A":"峰值的1/2，亦为有效值","B":"零值","C":"峰值","D":"峰-峰值"},"answer":"A","explanation":"直流电压档测的是平均值。0到Vp、占空比1:1的方波，平均电压恰好是峰值的一半，指针停在Vp/2。记忆点：单向方波直流档读数=峰值÷2，其余选项都不是该方波均值的对应。"},{"id":"MC1-1301","category":"4.6.1","categoryName":"常用测试仪器","type":"MC1","selectCount":1,"question":"用万用表的电阻档测量一个电路。最开始，电表指示电路的阻值很小。但是随着测量时 间的延长，测量值却变得越来越大。这是因为：","options":{"A":"这个电路两端可能存在一个很大的电容","B":"万用表出了故障","C":"这个电路两端可能存在一个很大的电感","D":"这个电路中存在一个周期性的交流电压"},"answer":"A","explanation":"电阻档输出电流给电路充电：刚接上电容像短路、电流大、读数小，随充电电流减小、等效电阻读数变大。'越测越大'正是大电容充电的典型现象，其余选项都解释不了。"},{"id":"MC2-1302","category":"4.6.1","categoryName":"常用测试仪器","type":"MC2","selectCount":2,"question":"测量一个电解电容器是否完好应当使用：","options":{"A":"指针式万用表的电阻档","B":"数字万用表的电容测试档（如果仪表具备该功能）","C":"任意一种万用表的电流档","D":"蓄电池充电器并配合进行短路放电实验"},"answer":"AB","explanation":"指针表电阻档可看充放电摆动判断电容好坏，数字表电容档可直接读数，AB都对。电流档测电容会打表，充电器短路放电实验危险又测不出好坏，C/D排除。"},{"id":"MC1-1303","category":"4.6.1","categoryName":"常用测试仪器","type":"MC1","selectCount":1,"question":"用指针式万用电表的电阻档测量一个常用元件，表笔第一次连接时表针挥动了一下，但 很快回到零点。断开表笔重新连接，表针却不再有任何指示。正确的推论是：","options":{"A":"该元件可能是一个电解电容器","B":"该元件肯定是一支损坏了的电阻","C":"万用表的准确度肯定有问题","D":"万用表的电池肯定电量不足了"},"answer":"A","explanation":"电解电容首次接表笔时充电电流使表针挥动，充满后电流为零、表针回零；再测时无充电电流，表针不再指示。'只动一次'正是电解电容的典型表现。"},{"id":"MC1-1304","category":"4.6.1","categoryName":"常用测试仪器","type":"MC1","selectCount":1,"question":"指针式万用表的电压档有个“欧姆/伏（每伏欧姆）”指标。越大的每伏欧姆数越说明：","options":{"A":"测量电压时电表对电路工作状态的影响小","B":"测量电压时电表对电路工作状态的影响大
