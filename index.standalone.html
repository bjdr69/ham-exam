通话时可以实际占用的频率为：","options":{"A":"21.125-21.45MHz，除去21.1495-21.1505","B":"21.125-21.45MHz","C":"21-21.45MHz","D":"21-21.35MHz"},"answer":"A","explanation":"21MHz波段USB话务占用21.125-21.45MHz，但须避开信标21.150±500Hz（即21.1495-21.1505）。从21.0起也错。记：21MHz话务21.125起，信标绕行。"},{"id":"MC1-0202","category":"1.7.1","categoryName":"电磁兼容","type":"MC1","selectCount":1,"question":"短波业余电台在24MHz 频段进行USB 通话时可以实际占用的频率为：","options":{"A":"24.9305-24.99MHz","B":"24.928-24.988MHz","C":"24.890-24.98MHz","D":"24.9205-24.99MHz"},"answer":"A","explanation":"24MHz波段USB话务实际占用24.9305-24.99MHz，低端24.89-24.9305留给CW/RTTY，干扰项边界错。记：24MHz话务24.9305起，贴着信标24.930。"},{"id":"MC1-0203","category":"1.7.1","categoryName":"电磁兼容","type":"MC1","selectCount":1,"question":"短波业余电台在29MHz 频段进行USB 通话时可以实际占用的频率为：","options":{"A":"28.3-29.3MHz","B":"28-29.7MHz","C":"28.250-29.7MHz","D":"28.2-29.6MHz"},"answer":"A","explanation":"10米波段USB话务实际占用28.3-29.3MHz，28.0-28.3留给CW/RTTY和信标，29.3以上留给FM。记：10米USB在28.3-29.3。"},{"id":"MC1-0204","category":"1.7.1","categoryName":"电磁兼容","type":"MC1","selectCount":1,"question":"短波业余电台在29MHz 频段进行FM 通话时可以实际占用的频率为：","options":{"A":"29.51-29.7MHz","B":"29.3-29.7MHz","C":"28.3-29.510MHz z","D":"28-29.7MHz"},"answer":"A","explanation":"10米波段FM话务实际占用29.51-29.7MHz，29.3-29.51是FM中继输入区，28.3-29.3是SSB区。记：10米FM在高端的29.51-29.7MHz。"},{"id":"MC1-0205","category":"1.7.1","categoryName":"电磁兼容","type":"MC1","selectCount":1,"question":"VHF 业余无线电台在144MHz 频段进行本地联络时应避免占用的频率为：","options":{"A":"144-144.035MHz 和145.8-146MHz","B":"144.035-145.8MHz","C":"144.050-144.053MHz 和145.100-145.750MHz","D":"144.035-144.053MHz 和145.550-145.750MHz"},"answer":"A","explanation":"144MHz本地联络应避开144-144.035MHz（空间研究下行）和145.8-146MHz（业余卫星下行）。144.035-145.8才可本地通联。记：2米避让两端头和尾。"},{"id":"MC1-0206","category":"1.7.1","categoryName":"电磁兼容","type":"MC1","selectCount":1,"question":"UHF 业余无线电台在430MHz 频段进行本地联络时应避免占用的频率为：","options":{"A":"431.9-432.240MHz 和435-438MHz","B":"430-431.9MHz 和432.240-435MHz","C":"431-432MHz 和438-440MHz","D":"430-431.2MHz 和435-436MHz"},"answer":"A","explanation":"430MHz本地联络应避开431.9-432.240MHz（空间研究等）和435-438MHz（业余卫星上行），其余可通联。记：0.7米避让431.9-432.24和435-438。"},{"id":"MC1-0207","category":"1.7.2","categoryName":"无线电干扰防护","type":"MC1","selectCount":1,"question":"分配给业余业务的某频段的频率下限为F1，业余电台实际可以工作的发信频率应为：","options":{"A":"F1+信号下边带的频率宽度","B":"F1","C":"F1-信号下边带的频率宽度","D":"F1-2×信号下边带的频率宽度"},"answer":"A","explanation":"频段下限F1处，信号下边带不能低于F1，所以实际发信频率应为F1+下边带宽度。取F1或更低都会越界。记：贴下限发，载波抬高一个下边带。"},{"id":"MC1-0208","category":"1.7.2","categoryName":"无线电干扰防护","type":"MC1","selectCount":1,"question":"分配给业余业务的某频段的频率上限为F2，业余电台实际可以工作的发信频率应为：","options":{"A":"F2-信号上边带的频率宽度","B":"F2","C":"F2+信号上边带的频率宽度","D":"F2-2×信号上边带的频率宽度"},"answer":"A","explanation":"频段上限F2处，信号上边带不能高于F2，所以实际发信频率应为F2-上边带宽度。取F2或更高都越界。记：贴上限发，载波压低一个上边带。"},{"id":"MC1-0209","category":"1.7.2","categoryName":"无线电干扰防护","type":"MC1","selectCount":1,"question":"ITU 对于5 至30MHz 短波频段的态度是：","options":{"A":"鼓励各主管部门在可行时，使用任何其他可能的通信手段，从而防止对远距离无线电通 信的有害干扰","B":"在保证优先满足本地通信的前提下，允许远距离通信适当使用这一段频率","C":"同样鼓励本地和远距离通信尽量使用该段频率，提高这一段频谱的使用率","D":"鼓励在这些频段建立大功率中继站，以提高本地通信的覆盖效果"},"answer":"A","explanation":"ITU鼓励短波频段尽量改用其他通信手段，以减小远距离通信的有害干扰。“保证本地优先”“鼓励多用”都与规则精神相反。记：HF干扰面大，能少用就少用。"},{"id":"MC1-0210","category":"1.7.2","categoryName":"无线电干扰防护","type":"MC1","selectCount":1,"question":"国际电联规定的确定发射电台辐射功率的原则为：","options":{"A":"发射电台只应辐射为保证满意服务所必要的功率","B":"发射电台应辐射尽量大的功率以提供尽量好的信号质量","C":"HF 频段发射电台应辐射尽量大的功率，VHF 频段发射电台应辐射尽量小的功率","D":"VHF/UHF 频段发射电台应辐射尽量大的功率，HF 频段发射电台应辐射尽量小的功率"},"answer":"A","explanation":"确定发射功率的原则：只辐射为保证满意服务所必要的功率，够用就好。盲目加大功率只会制造干扰，HF与VHF规则相同。记：功率够用就好。"},{"id":"MC1-0211","category":"1.7.2","categoryName":"无线电干扰防护","type":"MC1","selectCount":1,"question":"某俱乐部约定了一个成员业余电台之间交流技术的网络频率，当遇有其他业余电台按通 信惯例要求参加通信时，处理原则应为：","options":{"A":"无条件欢迎加入，因为任何业余电台都对业余无线电频率享有平等使用权","B":"要求其他业余电台在任何时间都不得使用俱乐部自行约定的专用通信频率","C":"要求其他业余电台在俱乐部成员结束网络通信后再使用该频率","D":"由俱乐部网络控制台自行决定其他业余电台是否可以加入通联"},"answer":"A","explanation":"业余频率是公共资源，任何业余电台享有平等使用权，对方按惯例要求加入应无条件欢迎。“不得使用”“结束后再用”都违背频率公有原则。记：频率天下为公，来者不拒。"},{"id":"MC1-0212","category":"1.7.2","categoryName":"无线电干扰防护","type":"MC1","selectCount":1,"question":"ITU《无线电规则》禁止所有电台发射下列种类的电波：","options":{"A":"阻尼波","B":"调幅波","C":"调频波","D":"调相波"},"answer":"A","explanation":"ITU《无线电规则》禁止所有电台发射阻尼波（火花放电产生的衰减振荡）。调幅、调频、调相是正规调制方式不禁止。记：禁的是火花时代的阻尼波。"},{"id":"MC4-0213","category":"1.7.2","categoryName":"无线电干扰防护","type":"MC4","selectCount":4,"question":"下列哪些违法行为将由无线电管理机构依照《中华人民共和国无线电管理条例》的规定 处理：","options":{"A":"违法使用业余无线电台干扰无线电业务正常进行的","B":"向境外组织或者个人提供涉及国家安全的境内电波参数资料","C":"擅自编制、使用业余无线电台呼号的","D":"故意收发业余无线电台执照载明事项之外的无线电信号，传播、公布或者利用无意接收 的信息的"},"answer":"ABCD","explanation":"干扰业务正常进行、向境外提供涉密电波参数、擅自编制呼号、故意收发执照外信号，四项均为法规列明由无线电管理机构处理的违法行为，全选ABCD。"},{"id":"MC2-0214","category":"1.7.2","categoryName":"无线电干扰防护","type":"MC2","selectCount":2,"question":"业余无线电台使用业余业务频率使用原则：","options":{"A":"无需取得无线电频率使用许可","B":"免收无线电频率占用费","C":"需取得无线电频率使用许可","D":"需收取无线电频率占用费"},"answer":"AB","explanation":"业余业务使用业余频率无需取得无线电频率使用许可，且免收频率占用费，是国家的鼓励政策。CD说反了。记：业余用频“免许可、免费”。"},{"id":"MC1-0215","category":"1.7.2","categoryName":"无线电干扰防护","type":"MC1","selectCount":1,"question":"我国《无线电频率划分规定》划分给业余业务使用的最低频段为135.7-137.8kHz，属于 无线电频谱的下列频段（波段）：","options":{"A":"低频（长波）","B":"甚低频（甚长波）","C":"特低频（特长波）","D":"超低频（超长波）"},"answer":"A","explanation":"135.7-137.8kHz在30-300kHz内，属低频（长波）LF。甚低频VLF是3-30kHz，特低频、超低频更低。记：业余最低段135kHz=长波LF。"},{"id":"MC1-0216","category":"1.7.2","categoryName":"无线电干扰防护","type":"MC1","selectCount":1,"question":"我国《无线电频率划分规定》划分给业余业务使用的最低频段为135.7-137.8kHz，属于 无线电频谱的下列频段（波段）：","options":{"A":"LF","B":"VLF","C":"ULF","D":"SLF"},"answer":"A","explanation":"135.7-137.8kHz属LF（低频）。VLF甚低频3-30kHz、ULF特低频、SLF超低频都比LF低。记：业余最低段135kHz的英文缩写是LF。"},{"id":"MC1-0217","category":"1.7.2","categoryName":"无线电干扰防护","type":"MC1","selectCount":1,"question":"我国《无线电频率划分规定》划分给业余业务使用的1,800kHz-2,000kHz 属于无线电频 谱的下列频段（波段）：","options":{"A":"中频（中波）","B":"甚高频（米波）","C":"低频（长波）","D":"高频（短波）"},"answer":"A","explanation":"1800-2000kHz在300kHz-3MHz内，属中频（中波）MF。VHF甚高频是30-300MHz，LF低频是30-300kHz。记：160米1.8MHz=中波MF。"},{"id":"MC1-0218","category":"1.7.2","categoryName":"无线电干扰防护","type":"MC1","selectCount":1,"question":"我国《无线电频率划分规定》划分给业余业务使用的1,800kHz-2,000kHz 属于无线电频 谱的下列频段（波段）：","options":{"A":"MF","B":"HF","C":"VHF","D":"LF"},"answer":"A","explanation":"1800-2000kHz属MF（中频/中波）。HF高频是3-30MHz，VHF甚高频30-300MHz，LF低频30-300kHz。记：1.8MHz的缩写是MF。"},{"id":"MC1-0219","category":"1.7.2","categoryName":"无线电干扰防护","type":"MC1","selectCount":1,"question":"我国《无线电频率划分规定》划分给业余业务使用的28MHz-29.7MHz 属于无线电频谱 的下列频段（波段）：","options":{"A":"高频（短波）","B":"中频（中波）","C":"甚高频（米波）","D":"低频（长波）"},"answer":"A","explanation":"28-29.7MHz在3-30MHz内，属高频（短波）HF。中频MF是300kHz-3MHz，甚高频VHF是30MHz以上。记：10米28MHz=短波HF。"},{"id":"MC1-0220","category":"1.7.2","categoryName":"无线电干扰防护","type":"MC1","selectCount":1,"question":"我国《无线电频率划分规定》划分给业余业务使用的28MHz-29.7MHz 属于无线电频谱 的下列频段（波段）：","options":{"A":"HF","B":"MF","C":"VHF","D":"LF"},"answer":"A","explanation":"28-29.7MHz属HF（高频/短波）。MF中频、VHF甚高频、LF低频都不是。记：28MHz的缩写是HF，高频短波。"},{"id":"MC1-0221","category":"1.7.2","categoryName":"无线电干扰防护","type":"MC1","selectCount":1,"question":"我国《无线电频率划分规定》划分给业余业务使用的50MHz-54MHz 属于无线电频谱的 下列频段（波段）：","options":{"A":"甚高频（米波）","B":"高频（短波）","C":"超高频（厘米波）","D":"特高频（分米波）"},"answer":"A","explanation":"50-54MHz在30-300MHz内，属甚高频（米波）VHF。HF高频是3-30MHz，UHF超高频是300MHz-3GHz。记：6米50MHz=VHF米波。"},{"id":"MC1-0222","category":"1.7.2","categoryName":"无线电干扰防护","type":"MC1","selectCount":1,"question":"我国《无线电频率划分规定》划分给业余业务使用的50MHz-54MHz 属于无线电频谱的 下列频段（波段）：","options":{"A":"VHF","B":"HF","C":"SHF","D":"UHF"},"answer":"A","explanation":"50-54MHz 属30-300MHz 的甚高频（VHF），俗称6 米波段。HF 短波只到30MHz，UHF 在300MHz 以上。记：「30 兆起VHF」。选A。"},{"id":"MC1-0223","category":"1.7.2","categoryName":"无线电干扰防护","type":"MC1","selectCount":1,"question":"我国《无线电频率划分规定》划分给业余业务使用的最接近无线宽带WiFi 频率的频段为 2,300-2,450MHz，属于无线电频谱的下列频段（波段）：","options":{"A":"特高频（分米波）","B":"甚高频（米波）","C":"高频（短波）","D":"超高频（厘米波）"},"answer":"A","explanation":"2300-2450MHz 处于300-3000MHz 特高频（UHF，分米波）段，WiFi 2.4GHz 也在此。VHF 在1GHz 以下。记：「2.4G 属UHF 分米波」。选A。"},{"id":"MC1-0224","category":"1.7.2","categoryName":"无线电干扰防护","type":"MC1","selectCount":1,"question":"430-440MHz 业余频段与公众对讲机的工作频率最为接近。如果业余无线电爱好者希望 通过改变业余电台的配置，将之“扩频”并与公众对讲机持有者通信，则需注意：","options":{"A":"业余电台不能与公众对讲机通信","B":"将业余电台设置到公众对讲机的频率，以不大于业余电台执照核定的发射功率与之通信","C":"将业余电台设置到公众对讲机的频率，以不大于0.5W 的发射功率与之通信","D":"将业余电台设置到公众对讲机的频率，但只能进行由业余电台到公众对讲机的单向发信"},"answer":"A","explanation":"公众对讲机属免执照的公众通信业务，与业余业务是两种不同业务，法律禁止互通，扩频通信同样违法，再小功率也不可。记：「公众对讲机不是业余电台」。选A。"},{"id":"MC1-0225","category":"1.7.2","categoryName":"无线电干扰防护","type":"MC1","selectCount":1,"question":"我国《无线电频率划分规定》划分给业余业务使用的最接近Wi-Fi 局域网频率的频段为 2,300-2,450MHz，属于无线电频谱的下列频段（波段）：","options":{"A":"UHF","B":"VHF","C":"HF","D":"SHF"},"answer":"A","explanation":"2300-2450MHz 处于300-3000MHz 的UHF（特高频）范围，即2.4GHz WiFi。VHF 是30-300MHz 米波，SHF 在3GHz 以上。记：「UHF 管到3G」。选A。"},{"id":"MC1-0226","category":"1.7.2","categoryName":"无线电干扰防护","type":"MC1","selectCount":1,"question":"我国《无线电频率划分规定》划分给业余业务使用的最接近C 波段卫星电视广播频率的 频段是5.650-5.850GHz，属于无线电频谱的下列频段（波段）：","options":{"A":"超高频（厘米波）","B":"特高频（分米波）","C":"极高频（毫米波）","D":"甚高频（米波）"},"answer":"A","explanation":"5.65-5.85GHz 处于3-30GHz 超高频（SHF，厘米波）段，C 波段卫星电视正用此段。UHF 分米波在3GHz 以下。记：「3-30G 是SHF 厘米波」。选A。"},{"id":"MC1-0227","category":"1.7.2","categoryName":"无线电干扰防护","type":"MC1","selectCount":1,"question":"我国《无线电频率划分规定》划分给业余业务使用的最接近C 波段卫星电视广播频率的 频段是5.650-5.850GHz，属于无线电频谱的下列频段（波段）：","options":{"A":"SHF","B":"UHF","C":"EHF","D":"VHF"},"answer":"A","explanation":"5.65-5.85GHz 落在3-30GHz 的SHF（超高频厘米波）段。UHF 分米波在3GHz 以下，EHF 毫米波在30GHz 以上。记：「SHF=3-30GHz，C 波段归SHF」。选A。"},{"id":"MC1-0228","category":"1.7.2","categoryName":"无线电干扰防护","type":"MC1","selectCount":1,"question":"我国《无线电频率划分规定》划分给业余业务使用的最接近Ku 波段卫星电视广播频率的 频段10-10.5GHz，属于无线电频谱的下列频段（波段）：","options":{"A":"超高频（厘米波）","B":"特高频（分米波）","C":"极高频（毫米波）","D":"甚高频（米波）"},"answer":"A","explanation":"10-10.5GHz 处于3-30GHz 超高频（SHF，厘米波）段，Ku 波段卫星广播正用此段。分米波在3GHz 以下，毫米波在30GHz 以上。记：「10G 波长3 厘米」。选A。"},{"id":"MC1-0229","category":"1.7.2","categoryName":"无线电干扰防护","type":"MC1","selectCount":1,"question":"我国《无线电频率划分规定》划分给业余业务使用的最接近Ku 波段卫星电视广播频率的 频段10-10.5GHz，属于无线电频谱的下列频段（波段）：","options":{"A":"SHF","B":"UHF","C":"EHF","D":"VHF"},"answer":"A","explanation":"10-10.5GHz 落在3-30GHz 的SHF（超高频厘米波）段。UHF 分米波低于3GHz，EHF 毫米波高于30GHz。记：「SHF 管3-30G，Ku 波段归SHF」。选A。"},{"id":"MC1-0230","category":"1.7.2","categoryName":"无线电干扰防护","type":"MC1","selectCount":1,"question":"我国《无线电频率划分规定》划分给业余业务使用的最高频段为241GHz-250GHz，属 于无线电频谱的下列频段（波段）：","options":{"A":"极高频（毫米波）","B":"超高频（厘米波）","C":"至高频（丝米波或亚毫米波）","D":"特高频（分米波）"},"answer":"A","explanation":"241-250GHz 处于30-300GHz 极高频（EHF，毫米波）段，是业余最高频段。厘米波在3-30GHz，分米波在3GHz 以下。记：「EHF 30G 起是毫米波」。选A。"},{"id":"MC1-0231","category":"1.7.2","categoryName":"无线电干扰防护","type":"MC1","selectCount":1,"question":"我国《无线电频率划分规定》划分给业余业务使用的最高频段为241GHz-250GHz，属 于无线电频谱的下列频段（波段）：","options":{"A":"EHF","B":"SHF","C":"THF","D":"UHF"},"answer":"A","explanation":"241-250GHz 落在30-300GHz 的极高频EHF（毫米波）段。SHF 厘米波在3-30GHz，UHF 更低。记：「241G 属EHF 毫米波」。选A。"},{"id":"MC1-0232","category":"2.1.1","categoryName":"电路基本概念","type":"MC1","selectCount":1,"question":"为在世界范围内划分无线电频率，国际电信联盟《无线电规则》规定了如下区域划分：","options":{"A":"将世界划分为3 个区域，中国位于第3 区","B":"将世界划分为40 个区域，中国位于第24、25 区","C":"将世界划分为89 个区域，中国位于第33、42、43、44、45、50 区","D":"将世界划分为17 个区域，中国位于第8 区"},"answer":"A","explanation":"ITU《无线电规则》将全球划为3 个管理区：一区欧洲及俄蒙一带，二区南北美洲，三区亚洲其余部分和大洋洲，中国在三区。记：「欧一美二亚太三」。选A。"},{"id":"MC1-0233","category":"2.1.1","categoryName":"电路基本概念","type":"MC1","selectCount":1,"question":"在业余无线电管理实践中，我们常会用到把全球分为3 个无线电管理区域的划分办法。 制定该方法的国际机构及其公布的文件为：","options":{"A":"国际电信联盟（ITU），《无线电规则》","B":"美国业余无线电转信联盟（ARRL），《业余无线电手册》","C":"国际业余无线电联盟（IARU），《IARU 新闻》","D":"美国《CQ》杂志，《WAZ 奖状规则》"},"answer":"A","explanation":"全球划为3 个无线电管理区由国际电信联盟（ITU）《无线电规则》规定。ARRL 是美国业余组织，IARU 是国际业余联盟，都不负责区域划分。记：「区域划分看ITU」。选A。"},{"id":"MC1-0234","category":"2.1.1","categoryName":"电路基本概念","type":"MC1","selectCount":1,"question":"ITU 的区域划分有一套详尽规则。若概要描述则大致为：","options":{"A":"欧洲、俄罗斯亚洲部分、蒙古及部分西北亚国家为一区，南北美洲为二区，亚洲（除俄 罗斯、蒙古和部分西北亚洲国家）和大洋洲为三区","B":"欧洲、俄罗斯亚洲部分、蒙古及部分西北亚国家为一区，亚洲（除俄罗斯、蒙古和部分 西北亚洲国家）和大洋洲为二区，南北美洲为三区，","C":"南北美洲为一区 Portable Delta Lima Five Charlie Mike Papa","C":"Kilo Three Tango Romeo Xray Portable Victor Echo Six","D":"Juliett Alfa Two India Golf Yankee"},"answer":"A","explanation":"BS7H 拼读：B=Bravo、S=Sierra、7=Seven、H=Hotel。注意字母S 念Sierra。干扰项是别的呼号。记：「S 念Sierra」。选A。"},{"id":"MC1-0252","category":"2.1.5","categoryName":"交流电路","type":"MC1","selectCount":1,"question":"需要拼出呼号、术语和必要的文字时，业余无线电爱好者普遍使用ITU 语音字母表中规 定的字母拼读法。呼号JA2IGY 可以拼读为：","options":{"A":"Juliett Alfa Two India Golf Yankee","B":"Three Delta Alfa Zero Foxtrot Zulu Portable Delta Lima Five Charlie Mike Papa","C":"Kilo Three Tango Romeo Xray Portable Victor Echo Six","D":"Bravo Sierra Seven Hotel"},"answer":"A","explanation":"JA2IGY 拼读：J=Juliett、A=Alfa、2=Two、I=India、G=Golf、Y=Yankee。注意J 是Juliett。干扰项是别的呼号。选A。"},{"id":"MC1-0253","category":"2.1.5","categoryName":"交流电路","type":"MC1","selectCount":1,"question":"需要拼出呼号、术语和必要的文字时，业余无线电爱好者普遍使用ITU 语音字母表中规 定的字母拼读法。呼号K3TRX/VE6 可以拼读为：","options":{"A":"Kilo Three Tango Romeo Xray Portable Victor Echo Six","B":"Three Delta Alfa Zero Foxtrot Zulu Portable Delta Lima Five Charlie Mike Papa","C":"Juliett Alfa Two India Golf Yankee","D":"Bravo Sierra Seven Hotel"},"answer":"A","explanation":"K3TRX/VE6 拼读：Kilo Three Tango Romeo Xray，斜杠读Portable，再读Victor Echo Six。记：「斜杠=Portable 移动台」。选A。"},{"id":"MC1-0254","category":"2.1.5","categoryName":"交流电路","type":"MC1","selectCount":1,"question":"需要拼出呼号、术语和必要的文字时，业余无线电爱好者普遍使用ITU 语音字母表中规 定的字母拼读法。呼号3DA0FZ/DL5CMP 可以拼读为：","options":{"A":"Three Delta Alfa Zero Foxtrot Zulu Portable Delta Lima Five Charlie Mike Papa","B":"Kilo Three Tango Romeo Xray Portable Victor Echo Six","C":"Juliett Alfa Two India Golf Yankee","D":"Bravo Sierra Seven Hotel"},"answer":"A","explanation":"3DA0FZ/DL5CMP 拼读为 Three Delta Alfa Zero Foxtrot Zulu Portable Delta Lima Five Charlie Mike Papa。选A。"},{"id":"MC1-0259","category":"2.2.1","categoryName":"半导体器件","type":"MC1","selectCount":1,"question":"如果一部业余电台在呼叫CQ，他的意思是：","options":{"A":"非特指地呼叫任何一部国内和国外业余电台","B":"呼叫国内业余电台","C":"呼叫国外业余电台","D":"倾向于呼叫DX 电台，国内电台最好别回应"},"answer":"A","explanation":"CQ 是「seek you」（找你）的简语，指非特指地呼叫任何一部国内外业余电台，不限定范围也不偏向DX。记：「CQ=广泛呼叫，谁都可答」。选A。"},{"id":"MC1-0260","category":"2.2.1","categoryName":"半导体器件","type":"MC1","selectCount":1,"question":"一部业余电台如何发起CQ 呼叫？","options":{"A":"呼叫CQ 并报出己方呼号。清晰起见，可重复一两次CQ 并对呼号进行字母拼读","B":"呼叫“有朋友在频率上吗？”，然后报出自己的呼号。清晰起见，可对呼号进行字母拼读","C":"说“CQ”三次，再说“请过来”一次。清晰起见，可对CQ 进行字母拼读","D":"说“CQ”三次，再说“standing by”一次。清晰起见，可对CQ 进行字母拼读"},"answer":"A","explanation":"发起CQ 应呼叫CQ 并报出己方呼号，如「CQ CQ CQ，this is 己方呼号」，清晰时可重复并字母拼读。其余说法不符合规范。记：「发CQ 报自己呼号」。选A。"},{"id":"MC1-0261","category":"2.2.1","categoryName":"半导体器件","type":"MC1","selectCount":1,"question":"如何回答一个CQ 呼叫？","options":{"A":"报出对方的呼号并报出自己的呼号。清晰起见，可重复关键内容或进行字母拼读","B":"报出自己的呼号并报出对方的呼号。清晰起见，可重复关键内容或进行字母拼读","C":"说“CQ”三次再报出对方的呼号三次。清晰起见，可重复关键内容或进行字母拼读","D":"先给出信号报告再报出自己的呼号。清晰起见，可重复关键内容或进行字母拼读"},"answer":"A","explanation":"回答CQ 应先报对方的呼号再报自己的，如「BH1ZZZ，this is BG1XXX」，让对方知道在叫他。记：「先对方呼号，再自己呼号」。选A。"},{"id":"MC1-0262","category":"2.2.1","categoryName":"半导体器件","type":"MC1","selectCount":1,"question":"业余电台操作员小强呼叫另一业余电台并希望与操作员小明通话的方法是：","options":{"A":"报出对方的呼号并报出自己的呼号。建立通信后即可提出与小明通话","B":"报出自己的呼号并报出对方的呼号。建立联络后即可提出与小明通话","C":"说“CQ 小明”三次再报出自己的呼号。清晰起见，可对呼号进行字母拼读","D":"说“CQ 小明”三次再报出“我是小强”。清晰起见，可对CQ 进行字母拼读"},"answer":"A","explanation":"呼叫具体电台应先报对方呼号并报自己呼号，建立联络后再提出与操作员小明通话。CQ 是广泛呼叫，不能点名。记：「先报呼号建立联络，再提需求」。选A。"},{"id":"MC1-0263","category":"2.2.1","categoryName":"半导体器件","type":"MC1","selectCount":1,"question":"业余电台建立通信后，双方应首先交换的必要信息是：","options":{"A":"信号报告","B":"操作员名字","C":"操作地点","D":"设备、设施情况"},"answer":"A","explanation":"建立通信后双方应首先交换信号报告，借此了解传播与信号质量。名字、地点、设备情况都在其后。记：「开局先交换信号报告」。选A。"},{"id":"MC1-0264","category":"2.2.1","categoryName":"半导体器件","type":"MC1","selectCount":1,"question":"为什么业余电台建立通信后总是立即交换信号报告？","options":{"A":"双方需要此报告来了解传播情况，安排最适合的操作","B":"这是最基本的报务要求，不必去问，只管去执行就好","C":"双方需要此报告来校准发射功率","D":"决定是否放弃联络，因为低于S5 的信号与奖状无缘"},"answer":"A","explanation":"交换信号报告是为了解传播情况、评估信号质量，从而安排最合适的操作。与校准功率、奖状无关。记：「信号报告=传播情况温度计」。选A。"},{"id":"MC1-0265","category":"2.2.1","categoryName":"半导体器件","type":"MC1","selectCount":1,"question":"在现代业余无线电通信中，信号报告均采用“RST 格式”。缩语RST 中的字母R 代表：","options":{"A":"信号的可辩度","B":"信号的强度","C":"信号的纯净度","D":"Q 简语QRK"},"answer":"A","explanation":"RST 中R=Readability 即可辩度（听清听不清），S 是强度，T 是音调。选可辩度。记：「R 辩度、S 强度、T 音调」。选A。"},{"id":"MC1-0266","category":"2.2.1","categoryName":"半导体器件","type":"MC1","selectCount":1,"question":"小明和小强进行CW 和FM 联络，双方的收信机均指示信号强度为“5”。通报时，双方 评价听抄顺畅，没有变调等信号缺陷；通话时，双方认为声音易于辩识，没有明显影响听抄 的失真。此时，双方应当为CW 和FM 通联给出信号报告：","options":{"A":"559 和55","B":"55 和559","C":"不必关心信号强度表的指示，给出599 和59 才是最好的","D":"不必关心信号强度表的指示，给出59 和599 才是最好的"},"answer":"A","explanation":"CW 用完整RST（可辩度-强度-音调），音调良好给9，故为559；FM 无音调项只用RS，故为55。记：「CW 三数尾带9，FM 两数不带9」。选A。"},{"id":"MC1-0267","category":"2.2.2","categoryName":"放大电路","type":"MC1","selectCount":1,"question":"业余电台在发起呼叫前应先守听。但是，我们有时会因听不到通信中的某一方而误认为 频率空闲。此时呼叫“CQ”有可能干扰他人联络。为尽量避免这种情况，我们可以：","options":{"A":"询问“有人使用频率吗？”，确认没有应答再发起呼叫","B":"询问“有吗？有吗？请过来。”，确认没有应答再发起呼叫","C":"先启动呼叫再进行通信，等听到确实有电台在工作再让出频率不迟","D":"先启动呼叫再进行通信，只要没有其他电台要求QSY 就持续使用"},"answer":"A","explanation":"听不到一方会误判频率空闲，为免干扰他人，应先问「有人使用频率吗？」，确认无人应答再发起呼叫。记：「先问再发，确认空闲」。选A。"},{"id":"MC1-0268","category":"2.2.2","categoryName":"放大电路","type":"MC1","selectCount":1,"question":"BH1ZZZ 希望加入两个电台相互之间的联络。正确的方法是：","options":{"A":"在一方刚刚停止讲话时迅速发出“插入”或“break”。如得到回应，再说明“BH1ZZZ 请求插入”。待对方正式邀请后，开始正式对话","B":"在一方正在讲话时短暂插入一次“break”，向正在收听的一方发出插入请求","C":"短暂发射一次“插入”或“break”。如对方无反应，可以加大功率反复尝试","D":"如果双方都是自己熟悉的业余电台操作员，直接讲进去便是，不必拘泥礼节"},"answer":"A","explanation":"加入对话应在对方刚停止讲话的停顿时短促发「break/插入」，获回应并受邀后再正式加入。讲话中插入、加大功率硬闯都不对。记：「停顿时插入，获邀再开口」。选A。"},{"id":"MC1-0269","category":"2.2.2","categoryName":"放大电路","type":"MC1","selectCount":1,"question":"如果在联络中听到有个遇险的电台要求插入，你该怎么做？","options":{"A":"立即与该台确认险情并了解其需要什么帮助","B":"立即联系或找人协助联系当地熟悉紧急情况下通信联络的爱好者或爱好者团队","C":"立即变更工作频率","D":"立即停止发射活动"},"answer":"A","explanation":"听到遇险电台要求插入，应立即与其确认险情并了解需要什么帮助，遇险优先。不是让出频率或停止发射。记：「遇险最优先，先问需求」。选A。"},{"id":"MC1-0270","category":"2.2.2","categoryName":"放大电路","type":"MC1","selectCount":1,"question":"在请求插入两个电台间的对话之时，一个值得借鉴的经验是：","options":{"A":"思考自己的加入是否会影响原通信双方的交谈乐趣","B":"确认自己的信号质量可以得到原通信双方的共同赞赏","C":"确定自己的操作等级与原通信双方的大体相当","D":"确信自己有比原通信双方更具吸引力的谈话内容"},"answer":"A","explanation":"请求插入前应换位思考，斟酌自己的加入是否会影响原通信双方的交谈乐趣。信号好坏、等级高低都不是插入理由。记：「插入前先想会不会打扰」。选A。"},{"id":"MC1-0271","category":"2.2.2","categoryName":"放大电路","type":"MC1","selectCount":1,"question":"若发现有业余电台的发射操作技巧不够规范，但还不至于造成严重的干扰和影响，正确 的做法是：","options":{"A":"通过电话、邮件等方式提出善意的改进建议","B":"立即在频率上当面加以指出和纠正","C":"立即报告无线电管理机构进行干涉","D":"立即报告当地业余无线电协会，由其总部电台到频率上进行纠察"},"answer":"A","explanation":"对发射技巧不规范但不严重的电台，应通过电话、邮件私下提出善意改进建议。频率上当面指责或上报都过重。记：「私下善意提醒，不在频率上指责」。选A。"},{"id":"MC1-0272","category":"2.2.2","categoryName":"放大电路","type":"MC1","selectCount":1,"question":"业余电台通信受到违法电台或者不明电台的严重干扰。正确的做法是：","options":{"A":"不予理睬，收集有关信息并向无线电管理机构举报","B":"在频率上向其宣传无线电管理法，要求其停止干扰","C":"立即报告无线电管理机构进行干涉","D":"用大功率信号对其进行压制"},"answer":"A","explanation":"正确做法是不予理睬、收集信息并向无线电管理机构举报，与违法台在频率上纠缠既无执法权也无意义，大功率压制本身就是违规。B、D都是自己动手，方向错了。记：不打嘴仗、不用蛮力，收集证据交管理机关。"},{"id":"MC1-0273","category":"2.2.2","categoryName":"放大电路","type":"MC1","selectCount":1,"question":"如果与几十千米以外的某业余电台有很多重要的技术问题和个人情况要交流，应该选用 下列通信方式：","options":{"A":"电话或者互联网","B":"利用当地的业余中继台","C":"利用HF 频段业余电台","D":"利用天线足够高的VHF/UHF 频段业余电台"},"answer":"A","explanation":"业余电台不得用于传送个人事务与私密信息，谈大量技术细节和个人情况应改用电话或互联网。中继台、HF、VHF都属业余业务，都不适合长时间私聊。记住：要长篇私聊，下台用电话或网络。"},{"id":"MC1-0274","category":"2.2.3","categoryName":"振荡电路","type":"MC1","selectCount":1,"question":"法规和国际业余无线电惯例要求业余电台日志应记载的必要内容是：","options":{"A":"通信时间、通信频率、通信模式、对方呼号、双方信号报告","B":"通信对方姓名、对方所在国家或城市、通信模式、双方信号报告","C":"通信时间、通信频率、双方收发信设备和天线、对方台址","D":"通信时间、通信模式、对方信号报告、对方台址、对方天气"},"answer":"A","explanation":"日志必要内容是：通信时间、频率、模式、对方呼号和双方信号报告。B多了姓名、国家，C、D还把设备、台址、天气等非必要项列进来，都不符合要求。记口诀：时、频、模、呼、报五要素。"},{"id":"MC1-0275","category":"2.2.3","categoryName":"振荡电路","type":"MC1","selectCount":1,"question":"法规和国际业余无线电惯例要求业余电台日志应记载的必要内容是：","options":{"A":"DATE、TIME、FREQ、MODE、CALL（对方）、RST（双方）","B":"DATE、FREQ、QTH（对方）、RIG（对方）、RST（双方）、WX（对方）","C":"DATE、TIME、MODE、CALL（对方）、QTH（对方）、RST（双方）","D":"CALL（通信对方）、TIME、FREQ、RIG（对方）、RST（双方）、PWR（双方）"},"answer":"A","explanation":"对应英文缩写：DATE时间、TIME时刻、FREQ频率、MODE模式、CALL对方呼号、RST双方信号报告，六项齐了才完整。C缺FREQ，B、D多了QTH台址、RIG设备、WX天气等非必需项。记：六要素一个不少。"},{"id":"MC4-0276","category":"2.2.3","categoryName":"振荡电路","type":"MC4","selectCount":4,"question":"业余无线电台交换QSL 卡具有多重意义，包括：","options":{"A":"确认本地、国内，甚至世界范围内的无线电联络","B":"掌握包括自制发射机在内的本台设备的运作表现","C":"申请奖状，证明自己在通信、技术等领域的努力","D":"纯粹收集，欣赏，展示来自世界各地的QSL 卡片"},"answer":"ABCD","explanation":"QSL卡既能确认联络，又能检验本台设备表现，还是申请奖状证明努力的凭证，也兼具收藏欣赏的乐趣，四项都是真实意义，全选。记忆：QSL卡一举多得——证通联、测设备、换奖状、做收藏。"},{"id":"MC4-0277","category":"2.2.3","categoryName":"振荡电路","type":"MC4","selectCount":4,"question":"QSL 卡片应至少涵盖哪些内容：","options":{"A":"联络双方的电台呼号","B":"双方信号报告和联络时间","C":"操作方式及联络频率","D":"操作员签章、本台通信地址"},"answer":"ABCD","explanation":"QSL卡至少要能证明一次完整通联：双方呼号、信号报告和联络时间、操作方式与频率、操作员签章及本台通信地址，四项缺一不可，全选。记：卡片就是一张能核对日志的“通联凭证”。"},{"id":"MC1-0278","category":"2.2.3","categoryName":"振荡电路","type":"MC1","selectCount":1,"question":"关于QSL 卡片的用法，以下说法正确的是：","options":{"A":"如果所交换的QSL 卡片并非用作通联或收听证明，则应在通信方式一栏填写“现场交流” 或“Eyeball QSO”等字样。不应赠送空白卡片","B":"业余无线电爱好者的空白QSL 卡片可以用作照片或名片，适合赠送，交换或散发","C":"火腿都是互相的。虽然对方没有联络自己，但是也可以发去确认联络的QSL 卡片","D":"如果在联络中没有听清对方呼号，或在日志中漏填或打错了对方呼号，则在寄发QSL 卡 片时可在对方呼号一栏填写对方操作员的名字"},"answer":"A","explanation":"A正确：不作通联或收听证明的卡片应如实注明“现场交流/Eyeball QSO”，空白卡不能乱送。B把空白卡当名片、C虚构联络寄确认卡、D用名字代替呼号，都不规范。记：卡片如实填，不送空白卡。"},{"id":"MC1-0279","category":"2.2.3","categoryName":"振荡电路","type":"MC1","selectCount":1,"question":"收到国外寄来的QSL 卡片时，如果信封中夹带有一张或多张IRC，则应：","options":{"A":"尽快检查电台日志，确认联络的真实性，向对方地址直接寄出自己的QSL 卡片","B":"不必确认联络的真实性，只要尽快向对方地址直接寄出自己的卡片即可","C":"尽快检查电台日志，确认联络的真实性，向国内QSL 卡片管理局寄出自己的卡片","D":"不必理会。操作类别越低越不必理会。低级别业余电台的QSL 卡片通常不具价值"},"answer":"A","explanation":"夹带IRC（国际回信券）是对方预付了回邮资，盼你回卡。正确做法：先查日志确认这次联络真实，再直接向对方地址寄出QSL卡。B不核实就回卡，C往国内管理局寄，都不对。记：先对日志，再直接回卡。"},{"id":"MC1-0280","category":"2.2.3","categoryName":"振荡电路","type":"MC1","selectCount":1,"question":"填写和邮寄QSL 卡片的正确做法是：","options":{"A":"迫切需要对方回寄卡片时，应直接向对方地址邮寄卡片并附加SASE","B":"填写错误时应划去或使用涂改液覆盖错误内容并加以改正","C":"自己的邮寄地址与电台的发射地点不同时，应在QTH 栏目内填明详细邮寄地址","D":"通过卡片管理局寄出卡片并希望对方回卡时，应在卡片上注明PSE QSL DIRECT"},"answer":"A","explanation":"A正确：盼对方回卡时应附上SASE（写清自己地址、贴好邮票的回邮信封）。B涂改不正规应换新卡，C邮寄地址不能填进QTH栏目，D走管理局不该写DIRECT（直寄）。记：要回卡附SASE，卡片保持干净。"},{"id":"MC1-0281","category":"2.2.3","categoryName":"振荡电路","type":"MC1","selectCount":1,"question":"交换QSL 卡片时，我们时有遇见一类特殊的无线电爱好者，他们仅向我们寄发收听卡片。 而我们在确认卡片所载内容之后会立即回卡以示敬意。这类爱好者是：","options":{"A":"短波收听者（SWL）","B":"广播爱好者","C":"DIY 爱好者","D":"业余无线电监测员"},"answer":"A","explanation":"只收听、不发射，靠寄SWL收听卡与电台确认联络的爱好者叫SWL（短波收听者）。广播爱好者、DIY爱好者、监测员都不是特指这种寄卡确认的群体。记：SWL=Short Wave Listener，只听不发。"},{"id":"MC1-0282","category":"2.2.4","categoryName":"电源电路","type":"MC1","selectCount":1,"question":"通过中继台进行通联时，我们应事先设好电台的接收和发射频差，以便顺利应对上行或 下行频率上的各种操作，避免边联络边设置，忙中出错。144 和430MHz 频段业余中继台 的上下行频差分别为：","options":{"A":"0.6MHz，5MHz","B":"12.5kHz，25kHz","C":"4MHz，10MHz","D":"2MHz，5MHz"},"answer":"A","explanation":"我国144MHz频段业余中继台上下行频差0.6MHz，430MHz频段为5MHz。B的12.5/25kHz是信道间隔而非频差，C、D数值不对。记口诀：两米段0.6、七十厘米段5。"},{"id":"MC1-0283","category":"2.2.4","categoryName":"电源电路","type":"MC1","selectCount":1,"question":"如果通过中继台呼叫一部业余电台，你应当：","options":{"A":"呼叫对方的呼号并报出自己的呼号","B":"呼叫“break, break”，然后说出对方呼号二至三次","C":"呼叫“CQ”三次，然后说出自己的呼号三次","D":"等待，直到你要呼叫的电台通过中继台呼叫CQ"},"answer":"A","explanation":"通过中继台呼叫特定电台，应直接呼叫对方呼号并报出自己的呼号，无需喊CQ。B的“break break”是插话用语，C喊CQ是呼叫不特定台，都不合适。记：呼号对呼号，直呼其名。"},{"id":"MC1-0284","category":"2.2.4","categoryName":"电源电路","type":"MC1","selectCount":1,"question":"业余中继台的使用原则是：","options":{"A":"除必要的简短联络外，业余中继台的上行和下行频率应保持空闲，以备随时响应突发灾 害等紧急情况下的呼叫","B":"应使中继台尽量处于接近饱和的忙碌状态，提高使用效率","C":"鼓励业余无线电民间组织（协会）通过中继台向当地会员发布通知","D":"鼓励青少年学生通过中继台交流解题方法和学习心得"},"answer":"A","explanation":"中继台应保持空闲以备紧急呼叫，除必要简短联络外不长期占用。B追求“饱和忙碌”、C发通知、D交流学习，都不符合应急优先原则。记：中继是应急通道，平时留白。"},{"id":"MC1-0306","category":"2.3.1","categoryName":"数字电路基础","type":"MC1","selectCount":1,"question":"业余电台在发起呼叫前应先守听一段时间，然后再询问“有人使用频率吗？”，确认没有 应答方可发起呼叫。下列英语短句中不能正确表达这一询问的是：","options":{"A":"Calling you, Roger？","B":"Is this frequency in use？","C":"Is anyone at this frequency？","D":"Anybody here？"},"answer":"A","explanation":"题目问“不能”正确表达“频率有人用吗”的句子。“Calling you, Roger？”是“呼叫你，收到吗”，与询问占用无关；B、C、D都是标准守听问话。记：这题选错的那句——Calling you 是在呼叫对方。"},{"id":"MC1-0307","category":"2.3.1","categoryName":"数字电路基础","type":"MC1","selectCount":1,"question":"业余电台BH1ZZZ 用FM 或SSB 话音发起CQ 呼叫的方法为：","options":{"A":"CQ CQ CQ，这里是BH1ZZZ，Bravo Hotel One Zulu Zulu Zulu，BH1ZZZ 呼叫CQ， 听到请回答","B":"CQ CQ CQ，请您继续","C":"CQ CQ CQ，我是1ZZZ，请过来","D":"CQ CQ CQ；CQ CQ CQ；CQ CQ CQ，我是BH1ZZZ，您请讲"},"answer":"A","explanation":"FM/SSB话音CQ呼叫要报全呼号并用报读法拼读（Bravo Hotel One Zulu Zulu Zulu），再说“呼叫CQ，听到请回答”。B、C、D要么呼号不完整，要么缺拼读或用语不规范。记：CQ三连+全呼号拼读+standby。"},{"id":"MC1-0308","category":"2.3.1","categoryName":"数字电路基础","type":"MC1","selectCount":1,"question":"业余电台BH1ZZZ 用话音发起CQ 呼叫的方法为：","options":{"A":"CQ CQ CQ, this is BH1ZZZ, Bravo Hotel One Zulu Zulu Zulu, BH1ZZZ calling CQ and standing by","B":"CQ CQ, calling CQ. Go ahead","C":"CQ CQ, calling CQ, this is One Zulu Zulu Zulu. Come on","D":"CQ CQ CQ, CQ CQ CQ, CQ CQ CQ, this is BH1ZZZ. Back to you"},"answer":"A","explanation":"英文CQ呼叫同样要完整：CQ三遍+报呼号+用国际报读法拼读呼号+calling CQ and standing by。B缺呼号，C省略BH1前缀，D的“Back to you”不合呼叫习惯。记：呼号必须完整拼读。"},{"id":"MC1-0309","category":"2.3.1","categoryName":"数字电路基础","type":"MC1","selectCount":1,"question":"业余电台BH1ZZZ 用话音呼叫BH8YYY 的方法为：","options":{"A":"BH8YYY，BH8YYY，BH8YYY，这里是BH1ZZZ，Bravo Hotel One Zulu Zulu Zulu， BH1ZZZ 呼叫，听到请回答","B":"BH8YYY，我是BH1ZZZ，我是BH1ZZZ，我是BH1ZZZ，您继续","C":"BH8YYY，我是1ZZZ，请过来","D":"8YYY，BH1ZZZ，听到讲"},"answer":"A","explanation":"呼叫特定台BH8YYY，应先报对方呼号（通常三遍），再报自己完整呼号并拼读，说“BH1ZZZ呼叫，听到请回答”。B、C、D没报全对方呼号或缺拼读。记：先对方后自己，呼号报全。"},{"id":"MC1-0310","category":"2.3.1","categoryName":"数字电路基础","type":"MC1","selectCount":1,"question":"业余电台BH1ZZZ 用话音呼叫BH8YYY 的方法为：","options":{"A":"BH8YYY, BH8YYY, BH8YYY, this is BH1ZZZ, Bravo Hotel One Zulu Zulu Zulu, BH1ZZZ calling you and standing by","B":"BH8YYY, Bravo Hotel Eight Yankee Yankee Yankee, BH8YYY, go ahead","C":"BH8YYY, this is One Zulu Zulu Zulu, come on","D":"8YYY, this is BH1ZZZ, over over"},"answer":"A","explanation":"英文呼叫特定台：先对方呼号三遍，再自报呼号并拼读，说BH1ZZZ calling you and standing by。B缺自己的呼号，C省略BH1前缀，D的8YYY不完整。记：对方三遍+自己全号拼读+standing by。"},{"id":"MC1-0311","category":"2.3.1","categoryName":"数字电路基础","type":"MC1","selectCount":1,"question":"建立话音通信后，操作员小明打算给对方电台BH1ZZZ “57”的信号报告。他可以这样 讲：","options":{"A":"BH1ZZZ，你的信号57。是否抄收？","B":"BH1ZZZ，我给你57 的信号可以吗？","C":"57，57，拷贝了吗？","D":"57，57，这里是BH1ZZZ，听到请回答"},"answer":"A","explanation":"报信号报告应称呼对方呼号，说明“你的信号57，是否抄收”，让对方知道是给他的报告。B在“商量”报告等级，C、D没说清给谁报，都不规范。记：呼号+读数+是否抄收一气呵成。"},{"id":"MC1-0312","category":"2.3.1","categoryName":"数字电路基础","type":"MC1","selectCount":1,"question":"建立话音通信后，操作员小明打算给对方电台BH1ZZZ “57”的信号报告。他可以这样 讲：","options":{"A":"BH1ZZZ, you are 57, QSL?","B":"BH1ZZZ, may I rate you 57?","C":"Hey, 57, QSL?","D":"Hey 57，this is BH1ZZZ. Roger?"},"answer":"A","explanation":"“you are 57”表示“你的信号是57”，QSL?问“抄收了吗”，完整自然。B的“may I rate you 57”是“我能给你评57吗”，不地道；C、D没说清对象。记：You are 57, QSL? 一句到位。"},{"id":"MC1-0313","category":"2.3.1","categoryName":"数字电路基础","type":"MC1","selectCount":1,"question":"建立话音通信后，小明打算介绍自己是在成都操作的。他可以这样讲：","options":{"A":"我的QTH 是成都","B":"我QRT 在成都","C":"我在成都QRO","D":"我在成都QRV"},"answer":"A","explanation":"介绍自己所在地点用QTH（位置），“我的QTH是成都”正确。QRT是关机，QRO是加大功率，QRV是准备好了，都不表示位置。记：QTH=Where are you，报位置用它。"},{"id":"MC1-0314","category":"2.3.1","categoryName":"数字电路基础","type":"MC1","selectCount":1,"question":"建立话音通信后，小明打算介绍自己是在成都操作的。他可以这样讲：","options":{"A":"My QTH is Chengdu","B":"I QRT in Chengdu","C":"I run QRO in Chengdu","D":"I am QRV at Chengdu"},"answer":"A","explanation":"同样，“My QTH is Chengdu”是标准表述。QRT是关机（close down），QRO是加大功率，QRV是准备就绪，都不能介绍位置。记：说位置只用QTH，其它Q简语都不是。"},{"id":"MC1-0315","category":"2.3.1","categoryName":"数字电路基础","type":"MC1","selectCount":1,"question":"收听业余无线电爱好者的SSB 通联时，我们有时会听到“Cheerio.”、“Ciao ciao.”或 “Do svidaniya.”一类的短句。其含义是：","options":{"A":"不同国家或地区的爱好者互致美好祝愿并表达再见之意","B":"一些英语词汇","C":"一些非英语词汇","D":"从一种语言至另一种语言的转写"},"answer":"A","explanation":"Cheerio（英语）、Ciao ciao（意大利语）、Do svidaniya（俄语）都是“再见”，是各国爱好者互致祝愿的道别语。B、C、D只停留在“外语词”字面，没说到祝愿与再见的核心。记：听到外语道别=对方说“再见，祝顺利”。"},{"id":"MC1-0343","category":"2.4.1","categoryName":"调制方式","type":"MC1","selectCount":1,"question":"QRP 操作时如果对方反映信号不好，我们可能会追问是否需要增加功率。此时可发送：","options":{"A":"QRO？","B":"QSO？","C":"QRP？","D":"QRS？"},"answer":"A","explanation":"对方嫌信号弱，问“要不要加大功率”应发QRO？。QSO是联络、QRP是降功率、QRS是放慢速度，都与加大功率无关。记：O=Output大，QRO加大、QRP减小。"},{"id":"MC1-0344","category":"2.4.1","categoryName":"调制方式","type":"MC1","selectCount":1,"question":"通联时，如认为QRP 操作足以保证可靠联络，则可与对方协商降低功率。短句为：","options":{"A":"QRP？","B":"May I try QRO for you？","C":"QRU？","D":"May I try QRT for you？"},"answer":"A","explanation":"认为小功率够用，与对方商量降功率应发QRP？（要我降功率吗？）。B的QRO方向反了，C的QRU是“你有事吗”，D的QRT是关机。记：Q简语加问号就是“可以吗”，QRP?=降功率行吗？"},{"id":"MC1-0345","category":"2.4.1","categoryName":"调制方式","type":"MC1","selectCount":1,"question":"业余电台以低于5 瓦的功率开展通信研究或追逐奖状时，常在呼号之后附加操作属性 “QRP”。例如：BI9XYZ/QRP。Q 简语“QRP”表示：","options":{"A":"我已降低发射功率","B":"我已降低发射功率至5W","C":"我是新手，请发慢一些，照顾一下","D":"我在挑战小功率通信极限，请高速发过来"},"answer":"A","explanation":"Q简语QRP=降低发射功率，并不特指5W。B“降至5W”是操作惯例而非简语本义，C“发慢些”是QRS，D意思相反。记：QRP就是“小功率”，5W是约定俗成的说法。"},{"id":"MC1-0346","category":"2.4.1","categoryName":"调制方式","type":"MC1","selectCount":1,"question":"通联时，如果希望对方加快发报速度，我们可以发送：","options":{"A":"PSE QRQ","B":"PSE QRS","C":"PSE QRT","D":"PSE QTR"},"answer":"A","explanation":"求对方加快发报速度用PSE QRQ（请发快些）。QRS是放慢，QRT是关机，QTR是报时间。记：QRQ里的RQ像“快”，QRS里的S像Slow，一快一慢别搞反。"},{"id":"MC1-0347","category":"2.4.1","categoryName":"调制方式","type":"MC1","selectCount":1,"question":"通联时，如果对方要求加快发报速度，我们可以通过反问来确认。此时可以发送：","options":{"A":"QRQ？","B":"QRS？","C":"QRT？","D":"QTR？"},"answer":"A","explanation":"对方要求加快，反问确认“要我发快些吗”用QRQ？。QRS?是“要我放慢吗”，方向相反。记：原简语加问号即反问，别人催快就回QRQ？"},{"id":"MC1-0348","category":"2.4.1","categoryName":"调制方式","type":"MC1","selectCount":1,"question":"通联时，如果希望对方放慢发报速度，我们可以发送：","options":{"A":"PSE QRS","B":"PSE QRQ","C":"PSE QSY","D":"PSE QSL"},"answer":"A","explanation":"希望对方放慢发报速度用PSE QRS（请发慢些）。QRQ是加快，QSY是换频率，QSL是确认抄收。记：S=Slow（慢），QRS放慢、QRQ加快。"},{"id":"MC1-0349","category":"2.4.1","categoryName":"调制方式","type":"MC1","selectCount":1,"question":"通联时，如果对方要求放慢发报速度，我们可以通过反问来确认。此时可以发送：","options":{"A":"QRS？","B":"QRQ？","C":"QSY？","D":"QSL？"},"answer":"A","explanation":"对方要求放慢，反问确认“要我放慢吗”用QRS？。QRQ?是“要我加快吗”，方向相反。记：跟“加快”那题对称——别人说慢就回QRS？"},{"id":"MC1-0350","category":"2.4.1","categoryName":"调制方式","type":"MC1","selectCount":1,"question":"结束当天的通联活动时，业余电台常会发送Q 简语“QRT”。其含义为：","options":{"A":"我要关闭收发信机了，再见","B":"我要变更发射频率至nnnn 千赫（或兆赫）","C":"我不再呼叫了，尚未联络的请用email 约起来","D":"我要变更操作方式了，有要联络的请尽快叫过来"},"answer":"A","explanation":"QRT=停止发射、关闭电台，即“我要关机了，再见”。B改频率是QSY，C、D的说法都不是Q简语本义。记：T=Terminate（终止），QRT结束通联关机。"},{"id":"MC1-0351","category":"2.4.1","categoryName":"调制方式","type":"MC1","selectCount":1,"question":"在结束联络之前，我们可以询问对方是否还有消息要传达。此时可以发送：","options":{"A":"QRU？","B":"QRL？","C":"QRB？","D":"QRQ？"},"answer":"A","explanation":"结束前问对方“还有消息要说吗”用QRU？。QRL是问频率有人用，QRB是距离，QRQ是加快，都不对。记：U=You（你），QRU问你还有事吗。"},{"id":"MC1-0352","category":"2.4.1","categoryName":"调制方式","type":"MC1","selectCount":1,"question":"结束联络时，我们可以告诉对方这里已无事。此时可以发送：","options":{"A":"QRU","B":"QRL","C":"QRM","D":"QRN"},"answer":"A","explanation":"告诉对方“我这里没事了”用QRU。QRL是“频率正忙”，QRM是他人干扰，QRN是大气噪声。记：QRU一问一答都是“还有事吗/没事了”。"},{"id":"MC1-0353","category":"2.4.1","categoryName":"调制方式","type":"MC1","selectCount":1,"question":"通联时，如希望相约对方参加某个业余无线电活动（如，“木兰围场-通联中国之省”）， 可使用短句：","options":{"A":"QRV IN WAPC?","B":"QSY TO WAPC?","C":"QSO WID WAPC?","D":"QRT OVER WAPC?"},"answer":"A","explanation":"邀对方参加活动用QRV IN WAPC?（准备参加WAPC比赛吗？）。QSY是换频率、QSO是联络、QRT是关机，都不达意。记：QRV=ready，QRV in活动=问“参不参加”。"},{"id":"MC1-0354","category":"2.4.1","categoryName":"调制方式","type":"MC1","selectCount":1,"question":"Q 简语“QRV”的含义是：","options":{"A":"我准备好收信了","B":"我正忙于（与某台）联络","C":"我有消息要发给你","D":"我要减小发射功率"},"answer":"A","explanation":"QRV=我已准备好，可以收信。B“正忙于联络”是QRX（或QRL），C“有消息要发”是QTC，D“减小功率”是QRP。记：V=Ready，QRV就绪待命。"},{"id":"MC1-0355","category":"2.4.1","categoryName":"调制方式","type":"MC1","selectCount":1,"question":"进行呼叫时，如果没有听清对方呼号，可使用如下短句请求对方重发：","options":{"A":"QRZ？","B":"QRU？","C":"QSY？","D":"QSA？"},"answer":"A","explanation":"没听清对方呼号，请求对方重发用QRZ？（谁在呼叫我？）。QRU问有无消息，QSY换频率，QSA是信号强度。记：Z=Who（谁），QRZ=谁在叫我。"},{"id":"MC1-0356","category":"2.4.1","categoryName":"调制方式","type":"MC1","selectCount":1,"question":"Q 简语“QRZ”的含义为：","options":{"A":"呼叫你的电台是...；做疑问句时则为：谁在呼叫我？","B":"我准备好了","C":"我正忙于（与某台）联络","D":"我要减小发射功率"},"answer":"A","explanation":"QRZ表示“呼叫你的电台是...”，作疑问句意为“谁在呼叫我？”。B“准备好了”是QRV，C“忙于联络”是QRX，D“减小功率”是QRP。记：Z=谁，QRZ问“谁找我”。"},{"id":"MC1-0357","category":"2.4.1","categoryName":"调制方式","type":"MC1","selectCount":1,"question":"阅读我国早期业余无线电文献，我们可能发现一种用Q 简语和5 个强度等级来表示的信 号报告。该Q 简语是：","options":{"A":"QSA","B":"QSB","C":"QSD","D":"QSK"},"answer":"A","explanation":"早期国内用QSA加5个强度等级（QSA1~5）表示信号强度。QSB是衰落，QSD是键控缺陷，QSK是插入工作，都不是强度。记：A=Amplitude（幅度），QSA报信号强弱。"},{"id":"MC1-0358","category":"2.4.1","categoryName":"调制方式","type":"MC1","selectCount":1,"question":"通联时，如需了解自己的信号是否衰落，可使用短句：","options":{"A":"QSB？","B":"QSD？","C":"QRB？","D":"QSP？"},"answer":"A","explanation":"想知道自己信号是否在衰落，用QSB？（我的信号衰落了吗？）。QSD是键控缺陷，QRB是距离，QSP是转报。记：B像“波动”，QSB信号忽强忽弱。"},{"id":"MC1-0359","category":"2.4.1","categoryName":"调制方式","type":"MC1","selectCount":1,"question":"Q 简语“QSB”的含义为：","options":{"A":"你的信号正在衰落","B":"你的电台存在键控缺陷（交流声、键击声、接触不良或发报手法不佳等）","C":"请重复上一条消息","D":"发报时，我能够在电码的间隙中听到电台的插入"},"answer":"A","explanation":"QSB=你的信号正在衰落。B“键控缺陷”是QSD，C“请重复上条”是QSM，D“间隙插入”是QSK。记：S+B连读像fading，听到QSB就是信号忽大忽小。"},{"id":"MC1-0360","category":"2.4.1","categoryName":"调制方式","type":"MC1","selectCount":1,"question":"小强和小明练习CW。若小强问“我发报的手法有毛病吗？”，他可以发：","options":{"A":"QSD？","B":"QSB？","C":"QSV？","D":"QRM？"},"answer":"A","explanation":"问自己发报手法有没有毛病，用QSD？（我的键控有缺陷吗？）。QSB是衰落，QSV是发一串V，QRM是干扰。记：D=Defective（有缺陷），QSD问手法键控毛病。"},{"id":"MC1-0361","category":"2.4.1","categoryName":"调制方式","type":"MC1","selectCount":1,"question":"小强与小明练习CW。小明认为小强刚才发字母“Y”时手法不好。他可以拍发：","options":{"A":"QSD AT Y","B":"QRH AT Y","C":"QSU AT Y","D":"QSS AT Y"},"answer":"A","explanation":"指出对方发字母Y时手法不好，用QSD AT Y（在字母Y处键控有毛病）。QRH是频率漂移，QSU是在某频率上发，QSS是告知频率。记：QSD+AT+字母，精确指出毛病位置。"},{"id":"MC1-0362","category":"2.4.1","categoryName":"调制方式","type":"MC1","selectCount":1,"question":"小强与小明练习CW。小明认为小强发报时有砰然的键击声。他可以拍发：","options":{"A":"QSD PSE CK","B":"QRI PSE CK","C":"QRH PSE CK","D":"TVI PSE CK"},"answer":"A","explanation":"键击声属键控缺陷，请对方检查用QSD PSE CK（键控有毛病请检查）。QRI是音调质量，QRH是频率漂移，TVI是电视干扰。记：有“砰”的键击声就QSD PSE CK，请对方查发报。"},{"id":"MC1-0363","category":"2.4.1","categoryName":"调制方式","type":"MC1","selectCount":1,"question":"Q 简语“QSK”的含义为：","options":{"A":"发报时，我能够在电码的间隙中听到电台的插入","B":"你的信号正在衰落","C":"你的电台存在键控缺陷（交流声、键击声、接触不良或发报手法不佳等）","D":"请重复上一条消息"},"answer":"A","explanation":"QSK 意为“我能在发报间隙插入听到你的信号”，即断续工作（break-in）。B 说的是 QSB（信号衰落），C 是键控缺陷。记忆：QSK 的 K 联想“敲键间能听”，QSK=可插入打断。"},{"id":"MC1-0364","category":"2.4.1","categoryName":"调制方式","type":"MC1","selectCount":1,"question":"通联时，如需对方电台确认收妥自己发出的消息，可使用短句：","options":{"A":"QSL？","B":"QRZ？","C":"QSP？","D":"QRO？"},"answer":"A","explanation":"QSL？是“你能否确认抄收我的消息？”的询问，QSL 后加问号表疑问。QRZ？是“谁在呼叫我”，QSP 是转信，QRO 是加大功率。记忆：QSL 带问号=“收到了吗？”。"},{"id":"MC1-0365","category":"2.4.1","categoryName":"调制方式","type":"MC1","selectCount":1,"question":"Q 简语“QSL”的含义为：","options":{"A":"我确认抄收了你所发送的消息","B":"我要寄一张QSL 卡片给你","C":"我刚刚错过了你的消息，请再发一遍","D":"你应当寄一张QSL 卡片给我"},"answer":"A","explanation":"QSL 表示“我确认抄收了你发送的消息”，即确认收妥。注意别被“寄 QSL 卡片”带偏——卡片叫 QSL card，但 QSL 简语本身指确认抄收。记忆：QSL=确认抄收，卡片是它的延伸。"},{"id":"MC1-0366","category":"2.4.1","categoryName":"调制方式","type":"MC1","selectCount":1,"question":"Q 简语“QSO”的含义为：","options":{"A":"我能够直接或通过他台转信通联（某个电台）；常指业余电台间的当前联络","B":"我可以直接或通过卡片管理局寄发QSL；常指业余电台交换QSL 卡片的操作","C":"我可以将你的消息转信至某个电台；常指业余电台帮助他台中转消息的操作","D":"我没有需要发送的消息了；常见于业余电台即将结束联络并互致再见之时"},"answer":"A","explanation":"QSO 指“我能直接或经他台转信通联”，即业余电台间的当前联络。B 说的是交换卡片，C 是转信（QSP）。记忆：QSO 是“通联本身”，QSP 才是“替人转”。"},{"id":"MC1-0367","category":"2.4.1","categoryName":"调制方式","type":"MC1","selectCount":1,"question":"通联时，如需了解对方电台可否帮助转信至“xxx 电台”，可使用短句：","options":{"A":"QSP ×××？","B":"QRD ×××？","C":"QSX ×××？","D":"QRV ×××？"},"answer":"A","explanation":"QSP？问“你能帮我把消息转给 xxx 台吗？”，即请求转信。QRV 是“我已准备就绪”，QSX 是“守听某频”。记忆：P 联想 Pass（传递），QSP=转信；QRD 非标准简语。"},{"id":"MC1-0368","category":"2.4.1","categoryName":"调制方式","type":"MC1","selectCount":1,"question":"Q 简语“QSP”的含义为：","options":{"A":"我可以将你的消息转信至某个电台；常指业余电台帮助他台中转消息的操作","B":"我可以直接或通过卡片管理局寄发QSL；常指业余电台交换QSL 卡片的操作","C":"我能够直接或通过他台转信通联（某个电台）；常指业余电台间的当前联络","D":"我没有需要发送的消息了；常见于业余电台即将结束联络并互致再见之时"},"answer":"A","explanation":"QSP 表示“我可以把你的消息转给某个电台”，即帮助他台中转消息。QSO 是通联，QSL 是确认抄收/卡片。记忆：QSP 的 P 联想 Pass（转交），专指替别人转发消息。"},{"id":"MC1-0369","category":"2.4.1","categoryName":"调制方式","type":"MC1","selectCount":1,"question":"通联时，小明希望小强帮忙守听7074 千赫的FT8 操作，他可以发：","options":{"A":"QSX MY FT8 ON 7074 KHZ？","B":"QSY MY FT8 ON 7074 KHZ？","C":"QSL MY FT8 ON 7074 KHZ？","D":"QRU MY FT8 ON 7074 KHZ？"},"answer":"A","explanation":"QSX？询问对方“是否在 7074 千赫守听 FT8”，请对方守听某频率。QSY 是改频，QSL 是确认，QRU 是“我无话可说”。记忆：X 像交叉点，QSX=守在某个频率点上。"},{"id":"MC1-0370","category":"2.4.1","categoryName":"调制方式","type":"MC1","selectCount":1,"question":"通联时，小强告诉小明，他正在7074 千赫守听FT8 联络，他可以发送：","options":{"A":"QSX FT8 ON 7074 KHZ","B":"QSY FT8 ON 7074 KHZ","C":"QSL FT8 ON 7074 KHZ","D":"QRU FT8 ON 7074 KHZ"},"answer":"A","explanation":"小强告知自己“正在 7074 千赫守听 FT8”，仍用 QSX（守听）。QSY 是改频、QSL 是确认、QRU 是“无事可发”，均不合语境。记忆：守听一律 QSX，换频才 QSY。"},{"id":"MC1-0371","category":"2.4.1","categoryName":"调制方式","type":"MC1","selectCount":1,"question":"通联时，如需协商对方改频至nnnn 千赫（或兆赫），可使用短句：","options":{"A":"QSY nnnn KHZ（或MHZ）？","B":"QRY nnnn KHZ（或MHZ）？","C":"QSV nnnn KHZ（或MHZ）？","D":"QRV nnnn KHZ（或MHZ）？"},"answer":"A","explanation":"QSY nnnn KHZ？意为“我们改频到 nnnn 千赫好吗？”，协商换频。QRV 是“我准备好了”，QSV 是“发送一串 V 供测试”。记忆：S=Shift（换挡），QSY=换频率。"},{"id":"MC1-0372","category":"2.4.1","categoryName":"调制方式","type":"MC1","selectCount":1,"question":"Q 简语“QSY”的含义为：","options":{"A":"我要改变发射频率至...千赫（或兆赫）","B":"我要关闭收发信机了，再见","C":"我不再呼叫了，尚未联络的请用email 约起来","D":"我要变更操作方式了，有要联络的请尽快叫过来"},"answer":"A","explanation":"QSY 的含义是“我要改变发射频率至……千赫/兆赫”，即换频。与 QSX 相对：QSY 改频率、QSX 固定守听。记忆：SY 联想 Shift Your（挪一挪频率），QSY=换频。"},{"id":"MC1-0373","category":"2.4.1","categoryName":"调制方式","type":"MC1","selectCount":1,"question":"通联时，如需了解对方电台的位置，可使用短句：","options":{"A":"QTH？","B":"QRA？","C":"QSP？","D":"QSA？"},"answer":"A","explanation":"QTH？询问对方的位置（QTH）。QRA 是问电台名称，QSP 是转信，QSA 是问信号强度。记忆：TH 联想“th（处所）”，QTH=地址/位置。"},{"id":"MC1-0374","category":"2.4.2","categoryName":"发射与接收","type":"MC1","selectCount":1,"question":"业余无线电爱好者在结束当前联络并互致美好祝愿时经常使用缩语：","options":{"A":"73","B":"59","C":"599","D":"99"},"answer":"A","explanation":"“73”意为“最诚挚的祝愿”，结束联络时互致美好祝愿用。59/599 是信号报告，99 不是标准用法。记忆：73 是“再见+祝福”，通联结尾必发 73。"},{"id":"MC1-0375","category":"2.4.2","categoryName":"发射与接收","type":"MC1","selectCount":1,"question":"如在CW 或其他方式的文字通联中须询问对方的QSL 卡片邮寄地址，我们可以发送：","options":{"A":"“UR ADR？”或“UR ADDR？”","B":"MY ADDR？","C":"PSE ADR MY QSL INFO","D":"PSE QSL TO UR ADDR"},"answer":"A","explanation":"“UR ADR？”即“你的地址是什么？”，用于询问对方 QSL 地址。B 问的是“我的地址”，C/D 是请对方处理 QSL，不合语境。记忆：UR=your，ADR=address，问对方地址。"},{"id":"MC1-0376","category":"2.4.2","categoryName":"发射与接收","type":"MC1","selectCount":1,"question":"如需对方重复上次的操作，比如重报呼号或信号报告，我们可使用缩语：","options":{"A":"AGN","B":"AGC","C":"ABT","D":"ABV"},"answer":"A","explanation":"AGN = again（再次），请对方重报呼号或信号报告。ABT=about、ABV=above，AGC 是自动增益控制。记忆：AGN 读起来像 again，就是“请再说一遍”。"},{"id":"MC1-0377","category":"2.4.2","categoryName":"发射与接收","type":"MC1","selectCount":1,"question":"业余无线电通信缩语“AHR”的意思是：","options":{"A":"另一个","B":"天线","C":"这里","D":"地址"},"answer":"A","explanation":"AHR = another（另一个）。ANT 是天线，HR 才是“这里”，ADDR 是地址。记忆：AHR 是“另一个”，别和 HR（这里，here）混淆。"},{"id":"MC1-0378","category":"2.4.2","categoryName":"发射与接收","type":"MC1","selectCount":1,"question":"“业余无线电测向”的缩语是：","options":{"A":"ARDF","B":"ATU","C":"ADDR","D":"ANT"},"answer":"A","explanation":"ARDF = 业余无线电测向（猎狐）。ATU 是天调，ANT 是天线，ADDR 是地址。记忆：DF=Direction Finding（测向），A=Amateur（业余）。"},{"id":"MC1-0379","category":"2.4.2","categoryName":"发射与接收","type":"MC1","selectCount":1,"question":"在CW 联络中交换QSL 信息时，我们可能用到“邮政信箱”这个术语。其缩语是：","options":{"A":"“BOX”或“P O BOX”","B":"BOX OF MAIL","C":"BURO","D":"QTH"},"answer":"A","explanation":"“BOX”或“P O BOX”即邮政信箱（Post Office Box）。BURO 是卡片管理局，QTH 是位置。记忆：信箱就是 BOX（盒子），邮局信箱写 P O BOX。"},{"id":"MC1-0380","category":"2.4.2","categoryName":"发射与接收","type":"MC1","selectCount":1,"question":"“QSL 卡片管理局”的缩语是：","options":{"A":"BURO","B":"BOX","C":"ROUTER","D":"SWITCH"},"answer":"A","explanation":"BURO = QSL 卡片管理局（bureau），负责集中转寄 QSL 卡片。BOX 是信箱，ROUTER/SWITCH 是网络设备。记忆：BURO 是“卡片邮局”，不搞邮寄就把卡片寄 BURO。"},{"id":"MC1-0381","category":"2.4.2","categoryName":"发射与接收","type":"MC1","selectCount":1,"question":"在CW 通联中，我们有时会抄到缩语“CK”，意思是：","options":{"A":"检查","B":"钟表","C":"报到","D":"祝贺"},"answer":"A","explanation":"CK = check（检查/校对），如“CK UR RST”意为核对你的信号报告。记忆：CK 是 check 的简化写法，抄到开头就译“检查”。"},{"id":"MC1-0382","category":"2.4.2","categoryName":"发射与接收","type":"MC1","selectCount":1,"question":"业余电台发起呼叫时会使用缩语：","options":{"A":"CQ","B":"CU AGN","C":"TU","D":"Seek QSOs with you, Roger?"},"answer":"A","explanation":"CQ 意为“呼叫所有电台”，是发起一般呼叫的用语。CU AGN 是“再见再会”，TU 是“谢谢你”。记忆：CQ 是“广而呼之”，任何呼叫守则都要先发 CQ。"},{"id":"MC1-0383","category":"2.4.2","categoryName":"发射与接收","type":"MC1","selectCount":1,"question":"形容某个信号来自远地时，爱好者们经常使用缩语：","options":{"A":"DX","B":"DE","C":"DR","D":"DSW"},"answer":"A","explanation":"DX 指远地（distant）电台或远距离通联，DX 远征、DX 比赛都是它。DE 是“来自/从”（分隔符），DR 是“亲爱的”。记忆：DX=远方，X 表示“未知的远方”，通联远方台叫 DX。"},{"id":"MC1-0384","category":"2.4.2","categoryName":"发射与接收","type":"MC1","selectCount":1,"question":"在CW 通联中，我们有时会抄到缩语“ES”，意思是：","options":{"A":"和","B":"是","C":"从","D":"请等待"},"answer":"A","explanation":"ES = and（和），CW 中常用。B 的“是”对应 R 或 RPT，C 的“从”是 FM，D 是 QRL/QRX。记忆：ES 就是连接词“和”，如 RST ES QTH 即“信号报告和位置”。"},{"id":"MC1-0385","category":"2.4.2","categoryName":"发射与接收","type":"MC1","selectCount":1,"question":"在CW 通联中，我们有时会抄到缩语“FB”，意思是：","options":{"A":"太棒了，业务精湛","B":"我的反馈如下","C":"保险丝熔断了","D":"从正反两方面说"},"answer":"A","explanation":"FB = fine business，意为“太好了、很出色”，表示赞赏。别直译成“反馈”或“保险丝”。记忆：FB=Fine Business（干得漂亮），抄到就是“真棒”。"},{"id":"MC1-0386","category":"2.4.2","categoryName":"发射与接收","type":"MC1","selectCount":1,"question":"在CW 通联中，我们有时会抄到缩语“FER”，意思是：","options":{"A":"为了，对于","B":"好的，精细的","C":"二月","D":"猎狐"},"answer":"A","explanation":"FER = for（为了/对于），CW 中把 for 简拼成 FER。记忆：FER 就是 for 的口语化简拼，抄到就译“为了”。"},{"id":"MC1-0387","category":"2.4.2","categoryName":"发射与接收","type":"MC1","selectCount":1,"question":"术语“频率”的缩语是：","options":{"A":"FREQ","B":"FER","C":"TUNE","D":"FIND"},"answer":"A","explanation":"FREQ = frequency（频率）的缩写。FER 是“为了”，TUNE 是调谐，FIND 是寻找。记忆：FREQ 直取 frequency 前四个字母，就是“频率”。"},{"id":"MC1-0388","category":"2.4.2","categoryName":"发射与接收","type":"MC1","selectCount":1,"question":"建立CW 联络后，我们经常值交换信号报告之机向对方表示问候。“下午好”的缩语是：","options":{"A":"GA","B":"GE","C":"GN","D":"GM"},"answer":"A","explanation":"“下午好”= GA（Good Afternoon）。GE 是晚上好、GM 是早晨好、GN 是晚安。记忆：按白天到黑夜记：GM（晨）→GA（午）→GE（晚）→GN（夜）。"},{"id":"MC1-0389","category":"2.4.2","categoryName":"发射与接收","type":"MC1","selectCount":1,"question":"建立CW 联络后，我们经常值交换信号报告之机向对方表示问候。“晚上好”的缩语是：","options":{"A":"GE","B":"GM","C":"GN","D":"GA"},"answer":"A","explanation":"“晚上好”= GE（Good Evening）。GM 是早晨好、GN 是晚安、GA 是下午好。记忆：Evening 取 E，GE=晚上好，别和 GN（晚安，Night）混淆。"},{"id":"MC1-0390","category":"2.4.2","categoryName":"发射与接收","type":"MC1","selectCount":1,"question":"业余无线电爱好者在结束当前联络并祝愿对方好运好成绩时经常使用缩语：","options":{"A":"GL","B":"GB","C":"TU","D":"73"},"answer":"A","explanation":"GL = Good Luck（祝好运、好成绩），结束联络祝愿对方时用。GB 是再见（Good Bye），TU 是谢谢，73 是诚挚祝福。记忆：GL=Good Luck，祝对方好运。"},{"id":"MC1-0391","category":"2.4.2","categoryName":"发射与接收","type":"MC1","selectCount":1,"question":"业余无线电通信缩语“GLD”的意思是：","options":{"A":"高兴","B":"好运气","C":"再见","D":"地线，地面"},"answer":"A","explanation":"GLD = glad（高兴）。GL 才是“好运气”，73/GB 是告别祝福，GND 是地线。记忆：GLD 取 glad 前三个字母=高兴，别和 GL（好运）混。"},{"id":"MC1-0392","category":"2.4.2","categoryName":"发射与接收","type":"MC1","selectCount":1,"question":"建立CW 联络后，我们经常值交换信号报告之机向对方表示问候。“早晨好”的缩语是：","options":{"A":"GM","B":"GA","C":"GL","D":"GB"},"answer":"A","explanation":"“早晨好”= GM（Good Morning）。GA 是下午好、GL 是祝好运、GB 是再见。记忆：Morning 取 M，GM=早晨好。"},{"id":"MC1-0393","category":"2.4.2","categoryName":"发射与接收","type":"MC1","selectCount":1,"question":"有时，我们通联的DX 电台仍使用“GMT”来表示时间。该时间的含义是：","options":{"A":"格林尼治时间","B":"GPS 管理区段时间","C":"国际原子时","D":"罗兰C 时间"},"answer":"A","explanation":"GMT = 格林尼治时间（Greenwich Mean Time），DX 电台常用来标注通联时间。记忆：G 联想 Greenwich 格林尼治，GMT 是通联日志常用的世界时。"},{"id":"MC1-0394","category":"2.4.2","categoryName":"发射与接收","type":"MC1","selectCount":1,"question":"业余无线电通信缩语“GN”的意思是：","options":{"A":"晚安","B":"早晨好","C":"好运气","D":"高兴"},"answer":"A","explanation":"GN = Good Night（晚安）。GM 是早晨好，GL 是好运气，GLD 是高兴。记忆：Night 取 N，GN=晚安，与 GE（晚上好）区分开。"},{"id":"MC1-0395","category":"2.4.2","categoryName":"发射与接收","type":"MC1","selectCount":1,"question":"业余无线电通信缩语“GND”的意思是：","options":{"A":"地面、接地","B":"格林尼治时间","C":"好运气","D":"高兴"},"answer":"A","explanation":"GND = ground（地面/接地），天线和电路里 GND 指地线/地网。记忆：GND 取 ground 前三个字母，见到就译“地”。"},{"id":"MC1-0396","category":"2.4.2","categoryName":"发射与接收","type":"MC1","selectCount":1,"question":"每年的12 月下旬，我们常会在CW 联络中听到缩语“HNY”，意思是：","options":{"A":"新年快乐","B":"幸福","C":"希望","D":"圣诞快乐"},"answer":"A","explanation":"HNY = Happy New Year（新年快乐），12 月下旬新年临近时 CW 里常见。记忆：HNY=Happy New Year 的首字母，逢年末抄到就是“新年好”。"},{"id":"MC1-0397","category":"2.4.2","categoryName":"发射与接收","type":"MC1","selectCount":1,"question":"在CW 通联中，我们有时会抄到缩语“HPE”，意思是：","options":{"A":"希望去做某件事","B":"醉心于某件事","C":"是“抄收”的意思","D":"是“这里”的意思"},"answer":"A","explanation":"HPE = hope（希望去做某件事），如 HPE CU 意为“希望再会”。记忆：HPE 是 hope 的简写，祝愿句常用 HPE 开头。"},{"id":"MC1-0398","category":"2.4.2","categoryName":"发射与接收","type":"MC1","selectCount":1,"question":"在CW 通联中，我们有时会抄到缩语“HPY”或“HPI”，意思是：","options":{"A":"幸福","B":"希望","C":"抄收","D":"这里"},"answer":"A","explanation":"HPY 或 HPI = happy（幸福/快乐）。HPE 才是“希望”，UR 是“你的/抄收”，HR 是“这里”。记忆：HPY=Happy（快乐）、HPE=Hope（希望），H 字头别混。"},{"id":"MC1-0399","category":"2.4.2","categoryName":"发射与接收","type":"MC1","selectCount":1,"question":"“快速收发报”的缩语是：","options":{"A":"HST","B":"RTTY","C":"CW","D":"RST"},"answer":"A","explanation":"HST = High Speed Telegraphy（快速收发报）。RTTY 是电传、CW 是等幅报、RST 是信号报告。记忆：HST=High Speed（高速）+Telegraphy（电报）。"},{"id":"MC1-0400","category":"2.4.2","categoryName":"发射与接收","type":"MC1","selectCount":1,"question":"业余电台完成当前发送并守听任意电台时应使用缩语：","options":{"A":"K","B":"GA","C":"PSE","D":"Come on"},"answer":"A","explanation":"K 意为“完毕，请（任意）电台继续”，交出送话权并守听任意电台。GA 是“开始吧/下午好”，PSE 是“请”。记忆：K 像把 Key（键/麦克风）交出去，谁都接话。"},{"id":"MC1-0401","category":"2.4.2","categoryName":"发射与接收","type":"MC1","selectCount":1,"question":"业余电台完成当前发送并守听通联中的对方电台时可使用缩语：","options":{"A":"KN","B":"PSE","C":"Please call one by one","D":"CU"},"answer":"A","explanation":"KN 意为“完毕，请通联中的对方电台继续”，只允许该对方台回答。K 是任意台可接，KN 限定对方台。记忆：KN 的 N=Named（指定的），KN=只给指定台。"},{"id":"MC1-0402","category":"2.4.2","categoryName":"发射与接收","type":"MC1","selectCount":1,"question":"在CW 通联中表达“非常感谢”之意时我们发送：","options":{"A":"“MNY TNX”或“MNI TNX”","B":"TNX TOO MUCH","C":"VY TNX","D":"I AM GRATEFUL FER UR TNX"},"answer":"A","explanation":"“MNY TNX”或“MNI TNX”= Many thanks（非常感谢），CW 中常见的致谢语。记忆：MNY/MNI 是 many 的简拼，TNX=thanks，合起来“多谢多谢”。"},{"id":"MC1-0403","category":"2.4.2","categoryName":"发射与接收","type":"MC1","selectCount":1,"question":"业余无线电通信缩语“NW”的意思是：","options":{"A":"现在","B":"不工作","C":"新的","D":"你和我"},"answer":"A","explanation":"NW = now（现在），如 NW TU 意为“现在（先）谢谢”。记忆：NW 是 now 去掉元音字母，抄到就译“现在”。"},{"id":"MC1-0404","category":"2.4.2","categoryName":"发射与接收","type":"MC1","selectCount":1,"question":"通联时，我们有时称对方电台的操作员为“old man”。这是将对方比作亲密无间的队友， 因此为“老朋友”、“老伙计”之意且无关年龄。这个称呼的缩语是：","options":{"A":"OM","B":"OB","C":"OC","D":"OT"},"answer":"A","explanation":"OM = old man（老朋友/老伙计），把对方比作亲密队友，与年龄无关。记忆：old man 缩成 OM，是 CW 里对同好的亲切称呼。"},{"id":"MC1-0405","category":"2.4.2","categoryName":"发射与接收","type":"MC1","selectCount":1,"question":"“操作员”的缩语是：","options":{"A":"OP","B":"OOP","C":"OM","D":"OHM"},"answer":"A","explanation":"OP = operator（操作员），指操控电台的人。OM 是老伙计，OHM 是欧姆（电阻单位）。记忆：OP=Operator（操作者），通联记录里写 OP 即操作员。"},{"id":"MC1-0406","category":"2.4.2","categoryName":"发射与接收","type":"MC1","selectCount":1,"question":"在CW 日常通联中，适当使用带“请”字的祈使句可以活跃通联气氛。“请”的缩语是：","options":{"A":"PSE、PLS","B":"PSK、ASK","C":"PX、PWM","D":"PWR、PTT"},"answer":"A","explanation":"PSE和PLS都是please（请）的缩写，PSE最常见、PLS更口语化。PSK/ASK是数字调制，PX、PWM、PTT、PWR都与“请”无关。记忆：“请人帮忙说please，缩成PSE或PLS”。"},{"id":"MC1-0407","category":"2.4.2","categoryName":"发射与接收","type":"MC1","selectCount":1,"question":"与“QSL”类似，如果完全抄收了对方所发的消息，我们常以起始语“Roger”开启新的 会话。这可向对方主动传达确认之意。“Roger”的缩语是：","options":{"A":"R","B":"RX","C":"RIG","D":"RFI"},"answer":"A","explanation":"R就是Roger（明白、已抄收）的缩写，CW里一个R表示对方内容已完全抄收。RX是接收机、RIG是设备、RFI是射频干扰。记忆：“R=Received，一个R表示抄收无误”。"},{"id":"MC1-0408","category":"2.4.2","categoryName":"发射与接收","type":"MC1","selectCount":1,"question":"业余无线电业务中，“SAE”的含义为：","options":{"A":"写好收信人地址的信封","B":"信封","C":"请尽快寄出QSL 卡片","D":"请勿通过卡片管理局交换QSL 卡片"},"answer":"A","explanation":"SAE=Self-Addressed Envelope，即“写好收信人（自己）地址的回邮信封”，方便对方直接回寄。B只说信封、C是请速寄卡片。记忆：SAE的E是Envelope，自写地址的信封。"},{"id":"MC1-0409","category":"2.4.2","categoryName":"发射与接收","type":"MC1","selectCount":1,"question":"业余无线电爱好者寄送QSL 卡片时常会提及缩语“SASE”，其含义为：","options":{"A":"写好收信人地址并贴好邮票（或附有邮资）的信封","B":"国际邮资券","C":"请尽快寄出QSL 卡片","D":"请勿通过卡片管理局交换QSL 卡片"},"answer":"A","explanation":"SASE比SAE多一个S（Stamped），即“写好地址并贴好邮票（或附邮资）的回邮信封”。B是国际回信券、C是请速寄卡片、D是禁走卡片局。记忆：SASE=SAE+邮票，贴了票的回邮信封。"},{"id":"MC1-0410","category":"2.4.2","categoryName":"发射与接收","type":"MC1","selectCount":1,"question":"在通联中，如需更正刚才发错的内容，我们通常以“抱歉”开启会话，缩语为：","options":{"A":"SRI","B":"SNR","C":"STN","D":"SMS"},"answer":"A","explanation":"SRI就是sorry（抱歉）的缩写，CW里发错内容先发SRI更正。SNR是信噪比、STN是电台、SMS是短消息。记忆：“SRI=SORRY，道歉开口先说SRI”。"},{"id":"MC1-0411","category":"2.4.2","categoryName":"发射与接收","type":"MC1","selectCount":1,"question":"“温度”的缩语是：","options":{"A":"TEMP","B":"TMPO","C":"TUNE","D":"WX"},"answer":"A","explanation":"TEMP是temperature（温度）的缩写，报告气温用TEMP。TMPO、TUNE不是温度词，WX是天气（weather）。记忆：“温度Temperature，缩成TEMP”。"},{"id":"MC1-0412","category":"2.4.2","categoryName":"发射与接收","type":"MC1","selectCount":1,"question":"“谢谢”的缩语是：","options":{"A":"TNX、TKS","B":"SRI、SAE","C":"CU、GB","D":"TVI、RFI"},"answer":"A","explanation":"TNX=Thanks、TKS是Thanks的异体，都是“谢谢”。SRI是抱歉、SAE是信封、CU是再见、TVI/RFI是电视/射频干扰。记忆：“TNX是谢，SRI是歉”。"},{"id":"MC1-0413","category":"2.4.2","categoryName":"发射与接收","type":"MC1","selectCount":1,"question":"“谢谢你”的缩语是：","options":{"A":"TU","B":"ATU","C":"TX","D":"ATT"},"answer":"A","explanation":"TU=Thank You（谢谢你）的缩写，比TNX更完整正式。ATU是天调（天线调谐器）、TX是发射机、ATT是衰减器。记忆：“TU=Thank You首字母，谢谢就发TU”。"},{"id":"MC1-0414","category":"2.4.2","categoryName":"发射与接收","type":"MC1","selectCount":1,"question":"“你的”或者“你是”可用缩语表示为：","options":{"A":"UR","B":"TU","C":"FB","D":"US"},"answer":"A","explanation":"UR=Your或You are，读音恰似“you are”，表示“你的/你是”。TU是谢谢你、FB是很好（fine business）、US指美国。记忆：“UR念you are，你的你就是UR”。"},{"id":"MC1-0415","category":"2.4.2","categoryName":"发射与接收","type":"MC1","selectCount":1,"question":"在CW 通联中，我们有时会抄到缩语“WL”，意思是：","options":{"A":"将要","B":"超级棒","C":"物理","D":"滑铁卢"},"answer":"A","explanation":"WL=will（将要），CW里用来预告“我将要做什么”，如WL QSY=准备换频。记忆：“will将要，缩成WL”。"},{"id":"MC1-0416","category":"2.4.2","categoryName":"发射与接收","type":"MC1","selectCount":1,"question":"收听CW 或SSB 联络，我们有时会听到缩语“XYL”。其含义是：","options":{"A":"妻子","B":"晶体","C":"女士","D":"发信机"},"answer":"A","explanation":"XYL=ex-YL，字面“曾经的年轻女士”，指已为人妻，即“妻子”。YL才指年轻女士。记忆：“YL是姑娘，加了X变成妻子XYL”。"},{"id":"MC1-0417","category":"2.4.2","categoryName":"发射与接收","type":"MC1","selectCount":1,"question":"有一类业余无线电操作员享有称呼“YL”。而有些业余无线电竞赛也为这些人士制定了专 享的规则。缩语“YL”的含义是：","options":{"A":"女士","B":"好运","C":"你的","D":"领导"},"answer":"A","explanation":"YL=Young Lady，指年轻女士、女性业余无线电操作员，竞赛常设YL专享组别。GL=Good Luck是好运、UR是你的。记忆：“YL=Young Lady，年轻女士YL”。"},{"id":"MC1-0418","category":"2.4.2","categoryName":"发射与接收","type":"MC1","selectCount":1,"question":"术语“单元”通常指天线振子。其缩语是：","options":{"A":"EL、ELE 或ELS","B":"YAGI","C":"ANT","D":"UNIT"},"answer":"A","explanation":"EL=Element（振子/单元）的缩写，ELE、ELS是常见变体，八木的每个振子就是一个单元。YAGI是整副八木、ANT是天线、UNIT是单位。记忆：“EL=Element=单元振子”。"},{"id":"MC1-0419","category":"2.4.2","categoryName":"发射与接收","type":"MC1","selectCount":1,"question":"在业余无线电通联中探讨天线时，缩写DP 代表：","options":{"A":"偶极天线","B":"长线天线","C":"定向天线","D":"垂直天线"},"answer":"A","explanation":"DP=Dipole（偶极天线），两臂等长的半波对称天线，最常见的基础天线。长线是LW、定向是BEAM、垂直是VER。记忆：“DP=偶极，像一根拉开的扁担”。"},{"id":"MC1-0420","category":"2.4.2","categoryName":"发射与接收","type":"MC1","selectCount":1,"question":"在业余无线电通联中探讨天线时，缩写GP 代表：","options":{"A":"垂直接地天线","B":"对数周期天线","C":"偶极天线","D":"定向天线"},"answer":"A","explanation":"GP=Ground Plane（垂直接地天线），一根垂直振子加底部地网。LPDA是对数周期、DP是偶极、BEAM是定向。记忆：“GP有地网（Ground Plane），站地上的垂直天线”。"},{"id":"MC1-0421","category":"2.4.2","categoryName":"发射与接收","type":"MC1","selectCount":1,"question":"在业余无线电通联中探讨天线时，缩写VER 代表：","options":{"A":"垂直天线","B":"垂直接地天线","C":"定向天线","D":"偶极天线"},"answer":"A","explanation":"VER=Vertical，垂直天线的缩写。注意区分：VER泛指垂直天线，GP特指带地网的垂直接地天线。记忆：“Vertical垂直，VER就代表垂直天线”。"},{"id":"MC1-0422","category":"2.4.2","categoryName":"发射与接收","type":"MC1","selectCount":1,"question":"在业余无线电通联中探讨天线时，缩写LW 代表：","options":{"A":"长线天线","B":"偶极天线","C":"定向天线","D":"垂直天线"},"answer":"A","explanation":"LW=Long Wire（长线天线），一根远长于工作波长的导线。偶极是DP、定向是BEAM、垂直是VER。记忆：“Long Wire长线，缩成LW”。"},{"id":"MC1-0423","category":"2.4.2","categoryName":"发射与接收","type":"MC1","selectCount":1,"question":"在业余无线电通联中探讨天线时，缩写YAGI 代表：","options":{"A":"八木天线","B":"定向天线","C":"偶极天线","D":"垂直天线"},"answer":"A","explanation":"YAGI是八木-宇田天线的简称，由有源振子、引向器、反射器组成，是高增益定向天线。记忆：“YAGI=八木天线，以发明者姓氏命名”。"},{"id":"MC1-0424","category":"2.4.2","categoryName":"发射与接收","type":"MC1","selectCount":1,"question":"在业余无线电通联中探讨天线时，缩写BEAM 代表：","options":{"A":"定向天线","B":"八木天线","C":"偶极天线","D":"垂直天线"},"answer":"A","explanation":"BEAM本意“波束”，业余圈泛指定向天线（有方向增益的天线）。YAGI是八木专名、DP是偶极、VER是垂直。记忆：“BEAM有波束有方向，即定向天线”。"},{"id":"MC1-0425","category":"2.5.1","categoryName":"天线参数","type":"MC1","selectCount":1,"question":"发射类别（class of emission）是指用标准符号标示的某发射的一组特性，例如主载波调 制方式，调制信号，被发送信息的类型以及其他适用的信号特性。表示CW 报的发射类别 是：","options":{"A":"A1A","B":"J3E","C":"F2B","D":"G2B"},"answer":"A","explanation":"A1A中：A=双边带调幅（载波通断键控）、1=单路数字信息、A=电报。CW正是载波通断的莫尔斯报，故为A1A。J3E是SSB话、F2B是调频数据。记忆：“CW莫尔斯=A1A”。"},{"id":"MC1-0426","category":"2.5.1","categoryName":"天线参数","type":"MC1","selectCount":1,"question":"发射类别（class of emission）是指用标准符号标示的某发射的一组特性，例如主载波调 制方式，调制信号，被发送信息的类型以及其他适用的信号特性。表示单边带话的发射类别 是：","options":{"A":"J3E","B":"A1A","C":"F2B","D":"G2B"},"answer":"A","explanation":"J3E中：J=单边带抑制载波、3=单路模拟信息、E=电话（语音），正是SSB话。A1A是CW、F2B是调频数据、G2B是减载波边带数据。记忆：“SSB话=J3E，J就是单边带”。"},{"id":"MC1-0427","category":"2.5.1","categoryName":"天线参数","type":"MC1","selectCount":1,"question":"发射类别（class of emission）是指用标准符号标示的某发射的一组特性，例如主载波调 制方式，调制信号，被发送信息的类型以及其他适用的信号特性。表示用单边带话传输的 SSTV 信号的发射类别是：","options":{"A":"F3F","B":"J3E","C":"F2B","D":"F3E"},"answer":"A","explanation":"SSTV是慢扫描电视，属电视（图像）类信号，发射类别第三位取F（电视）。本题给定F3F：F=调频、3=单路模拟、F=电视图像。记忆：“SSTV看图像，第三位就是F”。"},{"id":"MC1-0428","category":"2.5.1","categoryName":"天线参数","type":"MC1","selectCount":1,"question":"发射类别（class of emission）是指用标准符号标示的某发射的一组特性，例如主载波调 制方式，调制信号，被发送信息的类型以及其他适用的信号特性。表示调频话的发射类别是：","options":{"A":"F3E","B":"F3F","C":"J3E","D":"F2B"},"answer":"A","explanation":"F3E中：F=调频、3=单路模拟信息、E=电话（语音），正是调频话。F3F是调频电视、J3E是SSB话、F2B是调频数据。记忆：“FM话=F3E，结尾E是语音”。"},{"id":"MC1-0429","category":"2.5.1","categoryName":"天线参数","type":"MC1","selectCount":1,"question":"发射类别是指用标准符号标示的某发射的一组特性，例如主载波调制方式，调制信号， 被发送信息的类型以及其他适用的信号特性。表示用调频话传输的SSTV 信号的发射类别是：","options":{"A":"F3F","B":"F2B","C":"J3E","D":"F3E"},"answer":"A","explanation":"调频话传输的SSTV取F3F：F=调频、3=单路模拟、F=电视（图像）。SSTV属电视类所以第三位是F。F3E是调频话、J3E是SSB话。记忆：“SSTV是图像，FM走F3F”。"},{"id":"MC1-0430","category":"2.5.1","categoryName":"天线参数","type":"MC1","selectCount":1,"question":"发射类别是指用标准符号标示的某发射的一组特性，例如主载波调制方式，调制信号， 被发送信息的类型以及其他适用的信号特性。表示调频ATV 信号的发射类别是：","options":{"A":"F3F","B":"F2B","C":"F3E","D":"J3E"},"answer":"A","explanation":"ATV是业余电视，调频ATV取F3F：F=调频、3=单路模拟、F=电视图像。F2B是数据、F3E是调频话、J3E是SSB话。记忆：“ATV是电视，第三位也是F”。"},{"id":"MC1-0431","category":"2.5.1","categoryName":"天线参数","type":"MC1","selectCount":1,"question":"带外发射是指：","options":{"A":"由于调制过程而产生的、刚超出必要带宽的一个或多个频率的发射，但杂散发射除外","B":"由于调制过程而产生的、刚超出占用带宽的一个或多个频率的发射，但杂散发射除外","C":"由于调制过程而产生的、刚超出参考带宽的一个或多个频率的发射，但杂散发射除外","D":"由于调制过程而产生的、刚超出固定带宽的一个或多个频率的发射，但杂散发射除外"},"answer":"A","explanation":"带外发射指调制过程中产生的、刚超出“必要带宽”的发射，且杂散发射除外。占用、参考、固定带宽都不对。记忆：“带外=刚出必要带宽，杂散不算”。"},{"id":"MC1-0432","category":"2.5.1","categoryName":"天线参数","type":"MC1","selectCount":1,"question":"业余无线电通信中三种最基本调制的缩写是AM、FM 和PM。它们的中文名称是：","options":{"A":"幅度调制（调幅）、频率调制（调频）、相位调制（调相）","B":"幅度调制（调幅）、频率调制（调频）、脉宽调制（调脉宽）","C":"频率调制（调频）、脉码调制（调脉码）、幅度调制（调幅）","D":"幅度调制（调幅）、频率调制（调频）、电码调制（莫尔斯）"},"answer":"A","explanation":"AM=幅度调制（调幅）、FM=频率调制（调频）、PM=相位调制（调相）。PM不是脉宽调制（PWM），也不是脉码调制或莫尔斯。记忆：“AM调幅、FM调频、PM调相”。"},{"id":"MC1-0433","category":"2.5.1","categoryName":"天线参数","type":"MC1","selectCount":1,"question":"以下哪种调制方式被广泛应用于VHF 或UHF 本地通联？","options":{"A":"FM","B":"SSB","C":"PSK","D":"AM"},"answer":"A","explanation":"VHF/UHF本地通联广泛用FM：抗幅度噪声、音质好、适合中继台转发。SSB窄带多用于远距弱信号，PSK是数字模式。记忆：“本地中继用FM，音质好又皮实”。"},{"id":"MC1-0434","category":"2.5.1","categoryName":"天线参数","type":"MC1","selectCount":1,"question":"以下哪种调制方式被广泛应用于长距离和弱信号情况下的VHF 或UHF 话音通联？","options":{"A":"SSB","B":"AM","C":"FM","D":"PM"},"answer":"A","explanation":"长距离、弱信号的话音通联用SSB：带宽窄、信噪比高，弱信号下比FM可懂度好，FM在弱信号时噪声骤增。记忆：“弱信号找SSB，窄带攒信号”。"},{"id":"MC1-0435","category":"2.5.1","categoryName":"天线参数","type":"MC1","selectCount":1,"question":"以下哪种调制方式被广泛应用于HF 话音通联？","options":{"A":"SSB","B":"AM","C":"FM","D":"PM"},"answer":"A","explanation":"HF（短波）话音通联广泛用SSB：HF频带宝贵，SSB既省带宽又能传远。AM效率低、FM带宽太大。记忆：“短波远距离，SSB是主角”。"},{"id":"MC1-0436","category":"2.5.1","categoryName":"天线参数","type":"MC1","selectCount":1,"question":"与FM 相比，SSB 方式的优点是什么？","options":{"A":"发射带宽较FM 方式窄","B":"同频电台彼此互不干扰","C":"对天电干扰免疫","D":"对主载波的频率误差不敏感"},"answer":"A","explanation":"SSB相对FM的最大优点是发射带宽窄（约2-3kHz，FM需12.5-25kHz），省频带、弱信号可懂度也好。强台压弱台是FM的捕获效应，不是SSB。记忆：“SSB窄、FM宽，窄就是优势”。"},{"id":"MC1-0437","category":"2.5.1","categoryName":"天线参数","type":"MC1","selectCount":1,"question":"相比SSB 方式，FM 的主要缺点是什么？","options":{"A":"无法同时守听多个信号","B":"抵抗脉冲干扰的能力差","C":"对主载波的频率误差很敏感","D":"含有恒定不变的载波分量，发射功率利用不充分"},"answer":"A","explanation":"FM有捕获效应：同频强信号压制弱信号，无法同时守听多个电台，这是它相对SSB的主要缺点。含恒定载波是AM的缺点，FM对幅度干扰不敏感。记忆：“FM逮住一个，听不到第二个”。"},{"id":"MC1-0438","category":"2.5.1","categoryName":"天线参数","type":"MC1","selectCount":1,"question":"在VHF 和UHF 频段进行SSB 通联通常选用哪个边带？","options":{"A":"上边带","B":"下边带","C":"抑制边带","D":"残留边带"},"answer":"A","explanation":"VHF/UHF频段SSB通联习惯用上边带（USB）。记忆：“VHF/UHF用USB”，与HF低频段用LSB相反，高频段一律USB。"},{"id":"MC1-0439","category":"2.5.1","categoryName":"天线参数","type":"MC1","selectCount":1,"question":"在14MHz 及以上HF 频段进行语音通信通常选用哪个边带？","options":{"A":"上边带","B":"下边带","C":"抑制边带","D":"残留边带"},"answer":"A","explanation":"14MHz及以上HF频段语音通联用上边带（USB）。记忆：“14MHz以上全用USB”，以10.1MHz为界，以上USB、以下LSB。"},{"id":"MC1-0440","category":"2.5.1","categoryName":"天线参数","type":"MC1","selectCount":1,"question":"在7MHz 及以下频段进行语音通信通常选用哪个边带？","options":{"A":"下边带","B":"上边带","C":"抑制边带","D":"残留边带"},"answer":"A","explanation":"7MHz及以下频段语音通联用下边带（LSB）。记忆：“10.1MHz是分界，以下LSB、以上USB”，7MHz属低频段故用LSB。"},{"id":"MC1-0441","category":"2.5.1","categoryName":"天线参数","type":"MC1","selectCount":1,"question":"为什么业余电台在10.1MHz 以下频段使用下边带进行话音通联，而在10.1MHz 以上频 段却使用上边带？","options":{"A":"这是各国业余无线电爱好者普遍接受并沿用至今的一种通联习惯","B":"10.1MHz 以下频段更利于下边带的传播","C":"10.1MHz 以上频段更利于上边带的传播","D":"因为在接收机中设置一个10.1MHz 的BFO 可以同时收听上边带和下边带"},"answer":"A","explanation":"这是各国业余无线电爱好者普遍接受并沿用至今的通联习惯，与传播好坏无关。BFO同时收上下边带是接收机细节，也不是原因。记忆：“10.1MHz为界，低段LSB高段USB，约定俗成”。"},{"id":"MC1-0442","category":"2.5.1","categoryName":"天线参数","type":"MC1","selectCount":1,"question":"发起SSB 呼叫时，你与周边电台的频率间隔应至少为：","options":{"A":"2-3kHz","B":"150-500Hz","C":"15-50Hz","D":"大约6kHz"},"answer":"A","explanation":"SSB话带宽约2-3kHz，呼叫时应与邻近电台间隔至少2-3kHz，避免串扰。150-500Hz是CW的间隔，15-50Hz太密。记忆：“SSB间隔2-3k，跟着带宽走”。"},{"id":"MC1-0443","category":"2.5.1","categoryName":"天线参数","type":"MC1","selectCount":1,"question":"下列哪种调制方式可以纳入调幅（AM）的范畴？","options":{"A":"单边带调制（SSB）","B":"线性调频（Chirp）","C":"直序扩频（DSSS）","D":"相移键控（PSK）"},"answer":"A","explanation":"单边带调制（SSB）本质是去掉载波和一个边带的调幅（AM），属AM范畴。Chirp/DSSS/PSK分别是线性调频、直序扩频、相移键控。记忆：“SSB是精简版的AM”。"},{"id":"MC1-0444","category":"2.5.1","categoryName":"天线参数","type":"MC1","selectCount":1,"question":"在业余无线电业务中，有种通信方式的缩写是CW。其含义为：","options":{"A":"等幅电报","B":"莫尔斯编码","C":"幅度键控","D":"频移键控"},"answer":"A","explanation":"CW=Continuous Wave（连续波），业余圈特指等幅电报（莫尔斯报），用载波通断发报。莫尔斯编码只是编码方式，不等于CW本身。记忆：“CW=等幅报，嘀嘀嗒嗒莫尔斯”。"},{"id":"MC1-0445","category":"2.5.1","categoryName":"天线参数","type":"MC1","selectCount":1,"question":"以下哪种调制方式拥有最窄的发射带宽？","options":{"A":"CW","B":"单边带话","C":"调频话","D":"ATV"},"answer":"A","explanation":"CW只发通断的载波，带宽最窄（仅几百Hz）；SSB话约3kHz、调频话几十kHz、ATV更宽。记忆：“最省带宽的是CW，一条缝就能传”。"},{"id":"MC1-0446","category":"2.5.1","categoryName":"天线参数","type":"MC1","selectCount":1,"question":"业余电台一般不用调频话方式进行莫尔斯电码通联。这是因为：","options":{"A":"调频话信道带宽超过传输莫尔斯电码的必要带宽，不符合我国《无线电频率划分规定》 “电 台的技术特性”一章关于“把带宽保持在技术状态和该项业务的性质所允许的最低值上” 的要求","B":"调频话方式不能传输莫尔斯电码","C":"调频话方式传输莫尔斯电码可靠性差","D":"调频话方式传输莫尔斯电码时速度受限制"},"answer":"A","explanation":"调频话信道带宽远超莫尔斯码的必要带宽（仅几百Hz），违背我国频率划分规定“把带宽保持在最低值”的要求。CW本身能传莫尔斯，故B/C/D都不对。记忆：“莫尔斯用窄带CW，杀鸡不用牛刀”。"},{"id":"MC1-0447","category":"2.5.1","categoryName":"天线参数","type":"MC1","selectCount":1,"question":"无论是FM 还是SSB 调制，向发射机的话筒输入端施加10 倍于规定输入电压的音频信 号，最可能的结果是：","options":{"A":"信号失真。大量的谐波和互调产物还可能促使发射带宽增加，通信质量下降","B":"通信距离有效延长了，信号听起来也更加饱满","C":"通信距离有效延长了，只是信号听上去失真了","D":"发射功率超过额定值，发射机的末级射频功率器件会因此烧毁"},"answer":"A","explanation":"音频信号过大使发射机过驱动削波，产生失真，谐波和互调产物增多、带宽变宽，通信质量反而下降。放大不会延长距离，也不至于烧掉末级功放。记忆：“喊得太响只会失真，不会传更远”。"},{"id":"MC3-0512","category":"2.6.3","categoryName":"馈线与匹配","type":"MC3","selectCount":3,"question":"Yaesu System Fusion 简称YSF，是数字语音和数据传输相互融合的一种通信方式，特 点是：","options":{"A":"该方式为业余无线电通信广为采用","B":"具备通过中继台转发进行通信的能力","C":"调制方式为C4FM","D":"使用时分多址技术增加带宽的利用率"},"answer":"ABC","explanation":"YSF是八重洲的数字模式：采用C4FM调制，具备通过中继台转发通信的能力。它不用时分多址（TDMA）——那是DMR的特点，故排除D选ABC。记忆：“YSF=八重洲C4FM，不玩TDMA”。"},{"id":"MC4-0513","category":"2.6.3","categoryName":"馈线与匹配","type":"MC4","selectCount":4,"question":"Icom D-STAR System 提供了一种数据通信方式，特点是：","options":{"A":"是业余无线电通信广为采用的一种数字语音和数据传输方式","B":"可以通过中继台扩展D-STAR 用户的通信范围","C":"该方式允许用户通过互联网和D-STAR 热点与其他用户通信","D":"D-STAR 支持全球卫星定位和位置报告功能"},"answer":"ABCD","explanation":"D-STAR是ICOM主推的数字语音+数据制式，A到D都是其真实特点：支持语音数据、可经中继扩展、可经互联网和热点互联、支持GPS位置报告，故全选。记忆：\"D-STAR全都要，一个不少\"。"},{"id":"MC3-0514","category":"2.6.3","categoryName":"馈线与匹配","type":"MC3","selectCount":3,"question":"FreeDV 是一种数字语音方式。其特点是：","options":{"A":"为爱好者提供一种传输带宽较窄，完全适合HF 的数字语音方式","B":"为爱好者提供探索数字通信原理和语音处理技术的可能性","C":"在遵循开源许可协议的前提下可用来研发自己的业余无线电装备","D":"使用FM 手持或车载电台进行FreeDV 通信时音色尤为优美"},"answer":"ABC","explanation":"FreeDV是开源HF窄带数字语音：带宽窄适合HF、可探索数字通信原理、开源许可下可研发自己的设备，ABC对。D错：FM手持台跑FreeDV音色并不优美。记忆：\"FreeDV=自由开放，窄带战HF\"。"},{"id":"MC4-0515","category":"2.6.4","categoryName":"驻波比","type":"MC4","selectCount":4,"question":"数字业余电视（DATV）是将数字音视频压缩编码实验用于实时图像通信的一种方式。通 过卫星转发器进行DATV 联络时，爱好者们普遍选用DVB-S2 协议，调制方式可以是：","options":{"A":"QPSK","B":"8PSK","C":"16APSK","D":"32APSK"},"answer":"ABCD","explanation":"DVB-S2标准支持QPSK、8PSK、16APSK、32APSK四种调制，从低到高频谱效率递增、对信号质量要求也递增，均可用于DATV。记忆：\"2→8→16→32，阶数越高吃得越讲究\"。"},{"id":"MC1-0516","category":"2.6.4","categoryName":"驻波比","type":"MC1","selectCount":1,"question":"使用DRM 协议进行数字慢扫描电视（DSSTV）通信时，爱好者总是倾向于通过单边带 而非调频话方式来传输在音频范围内生成的DSSTV 基带。主要原因是：","options":{"A":"单边带方式完整保留DSSTV 的基带特性，利于衰落信道中的差错控制","B":"使用调频话传输DSSTV 增添门限效应，因此也增加了信号的发射带宽","C":"使用调频话传输DSSTV 虽然可以改善画质，但是无法提高伴音的音质","D":"使用调频话传输DSSTV 虽然可以改善伴音的音质，但是无法提高画质"},"answer":"A","explanation":"DSSTV基带在音频范围内，SSB能窄带完整保留其基带波形，衰落信道中利于差错控制；FM门限效应会破坏基带且带宽更宽。记忆：\"SSB是窄带直通车，FM路宽却会吞信号\"。"},{"id":"MC1-0565","category":"3.1.1","categoryName":"电波传播方式","type":"MC1","selectCount":1,"question":"什么是收发信机？","options":{"A":"一种组合了接收机和发射机的无线电通信设备","B":"一种将收到的信号再行转发的设备","C":"一种将收到的信息解码，纠错并转发的设备","D":"一种将数字话音转换为模拟话音并转发的设备"},"answer":"A","explanation":"收发信机=Transceiver，即组合了接收机和发射机的设备。B是转发器、C是数据纠错转发器、D是话音转换转发器，都不含\"既能收又能发\"的本义。记忆：\"收发一体叫收发信机\"。"},{"id":"MC2-0566","category":"3.1.1","categoryName":"电波传播方式","type":"MC2","selectCount":2,"question":"一个可以工作的无线电接收系统至少包含哪些部件？","options":{"A":"接收天线","B":"解调器","C":"电位器","D":"电源"},"answer":"AB","explanation":"接收系统核心两件套：接收天线（把电磁波变为电信号）+解调器（从载波中解出信息）。电位器只调音量、电源只供电，都不是接收的必需部件。记忆：\"天线收进来，解调解出来\"。"},{"id":"MC3-0567","category":"3.1.1","categoryName":"电波传播方式","type":"MC3","selectCount":3,"question":"一个可以工作的无线电发射系统至少包含哪些部件？","options":{"A":"射频振荡器","B":"调制器","C":"发射天线","D":"防雷器"},"answer":"ABC","explanation":"发射系统必需三件：射频振荡器产生载波、调制器把信息装上载波、发射天线辐射出去。防雷器只是安全保护附件，不是发射必需。记忆：\"振荡—调制—发射，三件套缺一不可\"。"},{"id":"MC1-0568","category":"3.1.1","categoryName":"电波传播方式","type":"MC1","selectCount":1,"question":"为什么业余无线电收发信机所用的直流电源线要尽量短，尽量粗？","options":{"A":"减小发信时电源线上的压降","B":"分流机箱外表面的射频电流","C":"防止收发信机意外滑落摔坏","D":"厂商销售电源线的一种策略"},"answer":"A","explanation":"导线越长越细，电阻越大，发射时大电流在线上的压降就越明显，导致电台供电不足。所以电源线要短而粗以减小压降。记忆：\"线短又粗，压降低，发射才足力\"。"},{"id":"MC1-0569","category":"3.1.1","categoryName":"电波传播方式","type":"MC1","selectCount":1,"question":"单工操作（simplex operation）是指：在一条电信通路的两个方向上交替进行传输的一 种工作方式。下列通信采用单工操作方式：","options":{"A":"两台由PTT 键转换收发状态的业余对讲机之间的通信","B":"两台有线电话座机之间的通信","C":"两台公众移动电话终端（手机）之间的通信","D":"一台业余中继台与一台由PTT 键转换收发状态的业余对讲机之间的通信"},"answer":"A","explanation":"单工=两个方向交替传输。两台PTT对讲机一方发一方收，正是单工。D中继+对讲机是半双工，手机通话是双工。记忆：\"按PTT轮着说，就是单工\"。"},{"id":"MC1-0570","category":"3.1.1","categoryName":"电波传播方式","type":"MC1","selectCount":1,"question":"双工操作（duplex operation）是指：一条电信通路的两个方向能同时进行传输的工作方 式。下列通信采用双工操作方式：","options":{"A":"由一台连续工作的430MHz 接收机和一台144MHz 发信机组成的地面业余电台与业余卫 星之间的通信","B":"两台具有QSK 功能的业余CW 收发信之间的通信","C":"一台业余中继台与一台由PTT 键转换收发状态的业余对讲机之间的通信","D":"两台由PTT 键转换收发状态的业余对讲机之间的通信"},"answer":"A","explanation":"双工=两个方向同时传输。业余卫星通信中地面台430MHz连续收、144MHz同时发，双向并行，是双工。QSK的CW、中继+PTT对讲、对讲机对讲都不是。记忆：\"卫星上下行两条路同时走=双工\"。"},{"id":"MC1-0571","category":"3.1.1","categoryName":"电波传播方式","type":"MC1","selectCount":1,"question":"半双工操作（semi-duplex operation）是指：电路的一端用单工操作，另一端用双工操 作的一种工作方式。下列通信采用半双工操作方式：","options":{"A":"一台业余中继台与一台由PTT 键转换收发状态的业余对讲机之间的通信","B":"两台具有QSK 功能的业余CW 收发信之间的通信","C":"两台由PTT 键转换收发状态的业余对讲机之间的通信","D":"两台公众移动电话终端（手机）之间的通信"},"answer":"A","explanation":"半双工=一端单工一端双工。中继台始终连续发射（双工端），对讲机按PTT切换收发（单工端），正合定义。记忆：\"中继永远在发，你这边按着PTT，正好一半一半\"。"},{"id":"MC1-0572","category":"3.1.1","categoryName":"电波传播方式","type":"MC1","selectCount":1,"question":"收发信机中的PTT 是指什么信号？","options":{"A":"按键发射，有信号（一般为对地接通）时发射机由等待转为发射","B":"发信语音压缩，对音频输入电平进行检测并反馈控制，以提升语音包络幅度较小的部分","C":"收信机前置放大器，在接收微弱信号时接入（此时某些技术指标可能低于额定值）","D":"自动天线调谐，对天线电路的电压驻波比进行检测并进行自动补偿，以维持最小驻波比"},"answer":"A","explanation":"PTT=Push To Talk（按键发射），按键信号（多为对地接通）使发射机由待机转为发射。B语音压缩、C前置放大、D自动天调都不是PTT。记忆：\"PTT就是按住讲话的开关\"。"},{"id":"MC1-0573","category":"3.1.1","categoryName":"电波传播方式","type":"MC1","selectCount":1,"question":"收发信机面板上或设置菜单中的符号SQL 代表什么功能？","options":{"A":"静噪控制，用来调整静噪阈值的大小","B":"发信语音压缩，对音频输入电平进行检测并反馈控制，以提升语音包络幅度较小的部分","C":"收信机前置放大器，在接收微弱信号时接入（此时某些技术指标可能低于额定值）","D":"自动天线调谐，对天线电路的电压驻波比进行检测并进行自动补偿，以维持最小驻波比"},"answer":"A","explanation":"SQL=Squelch（静噪），调整静噪阈值，信号弱于阈值就自动关闭音频。B语音压缩、C前置放大、D自动天调。记忆：\"SQL=静噪，阈值调高噪声就闭嘴\"。"},{"id":"MC1-0574","category":"3.1.1","categoryName":"电波传播方式","type":"MC1","selectCount":1,"question":"收发信机设置静噪功能的目的是什么？","options":{"A":"在没有信号的情况下关闭音频输出，避免播放刺耳的噪声","B":"滤除所收信号中的噪声，使对方的话音变得清晰","C":"滤除发信方的环境噪声，使发出的话音更为清晰","D":"自动控制收信机的增益，避免信号过强时发生阻塞或失真"},"answer":"A","explanation":"静噪的用途是没信号时关闭音频输出，避免扬声器放出刺耳的底噪。B/C都是\"滤除信号中的噪声\"，静噪管不了；D是AGC的功能。记忆：\"静噪只负责没信号时闭嘴\"。"},{"id":"MC1-0575","category":"3.1.1","categoryName":"电波传播方式","type":"MC1","selectCount":1,"question":"需要聆听非常微弱的FM 信号时应如何设置收发信机的静噪？","options":{"A":"关闭静噪或将阈值设为0，使接收机的音频输出不受限制","B":"尽可能调高接收机的音量","C":"关闭VOX 功能","D":"调节VOX，使之处于最灵敏的状态"},"answer":"A","explanation":"微弱FM信号可能低于静噪阈值而被关断，所以要关闭静噪或将阈值设为0，让音频不受限制。调大音量并不能让被静噪关掉的声音出来。记忆：\"想听弱信号，先把门卫静噪撤了\"。"},{"id":"MC1-0576","category":"3.1.1","categoryName":"电波传播方式","type":"MC1","selectCount":1,"question":"用带有静噪功能的FM 收发信机接收FM 话音，我们有时会在发射方松开PTT 的时候听 到一种比较短促的“嘶”或“喀拉”的噪声拖尾。这是因为：","options":{"A":"此类电路根据接收机鉴频输出的高音频噪声的大小来判断信号消失与否，并据此控制音 频输出。这种检测需要一定的时间才能完成，这导致短暂泄漏刺耳的噪声","B":"该噪声是发射台话筒的PTT 键接点跳动所致，发射到接收端时还可能带有“叮”的声音","C":"该噪声是发射台的一种有目的所为，例如是用作结束发射的标志，有时是“嘟”的声音","D":"这是由接收机的自动增益电路的时间常数造成"},"answer":"A","explanation":"FM静噪靠检测鉴频器输出的高音频噪声大小判断信号有无，检测需要时间，所以松PTT瞬间会漏出一截噪声。不是接点跳动、不是有意发出、也非AGC所致。记忆：\"静噪反应慢半拍，漏出一段嘶声\"。"},{"id":"MC1-0577","category":"3.1.1","categoryName":"电波传播方式","type":"MC1","selectCount":1,"question":"收发信机面板上或设置菜单中的符号VOL 代表什么功能？","options":{"A":"音量控制，用来调整接收机放出的声音大小","B":"发信语音压缩，对音频输入电平进行检测并反馈控制，以提升语音包络幅度较小的部分","C":"收信机前置放大器，在接收微弱信号时接入（此时某些技术指标可能低于额定值）","D":"自动天线调谐，对天线电路的电压驻波比进行检测并进行自动补偿，以维持最小驻波比"},"answer":"A","explanation":"VOL=Volume（音量），调节接收机放出的声音大小。B语音压缩、C前置放大、D自动天调。记忆：\"VOL就是音量，想大就拧大\"。"},{"id":"MC1-0578","category":"3.1.1","categoryName":"电波传播方式","type":"MC1","selectCount":1,"question":"收发信机面板上或设置菜单中的符号VOX 代表什么功能？","options":{"A":"发信机声控，接入后将根据对话筒有无语音输入的判别自动控制收发转换","B":"自动天线调谐，对天线电路的电压驻波比进行检测并进行自动补偿，以维持最小驻波比","C":"发信自动电平控制，对射频输出电平进行检测并反馈控制，以维持其在适当限度之内","D":"发信语音压缩，对音频输入电平进行检测并反馈控制，以提升语音包络幅度较小的部分"},"answer":"A","explanation":"VOX=Voice Operated Switch（声控），检测到话筒有语音就自动切换发射，实现免提。B天调、C发信自动电平控制、D语音压缩均不是。记忆：\"VOX一开口就发，声控开关\"。"},{"id":"MC1-0579","category":"3.1.1","categoryName":"电波传播方式","type":"MC1","selectCount":1,"question":"既然收发信机已经具备PTT 功能，那为什么有些机型还要提供VOX？","options":{"A":"双手忙于其他工作时，VOX 的“免提”特点有助于通联","B":"VOX 用于连接蓝牙耳机，提供操作的便捷性","C":"VOX 对话音提供更多加工处理，可有效降低发射带宽","D":"VOX 对话音提供更多加工处理，可使声音更易于辩识"},"answer":"A","explanation":"VOX的意义在免提：双手忙于其他工作时（抄收、写卡片、扶天线），说话即自动发射，无需按PTT。B/C/D的蓝牙、降带宽、语音加工都非其本意。记忆：\"PTT用手、VOX用嘴\"。"},{"id":"MC1-0580","category":"3.1.1","categoryName":"电波传播方式","type":"MC1","selectCount":1,"question":"某些对讲机具有发送CTCSS 码的功能。缩写CTCSS 指的是：","options":{"A":"亚音调静噪，即从67-250.3Hz 的38 个亚音调频率中选取一个作为选通信号，代表38 种状态之一，接收机没有收到特定的选通信号时自动关闭音频输出","B":"双音多频编码，由8 个音调频率中的两个频率组合成的控制信号，代表16 种状态之一， 用于遥控和传输数字等简单字符","C":"数字设备识别码，即在松开PTT 按键时自动发送一串代表设备代号的二进制数据","D":"自动静噪，即在接收机没有收到信号时自动关闭音频输出"},"answer":"A","explanation":"CTCSS=亚音调静噪，从67-250.3Hz的38个亚音频中选一个做口令，收不到就自动关音频。B是DTMF双音多频、C是设备识别码、D是普通自动静噪。记忆：\"CTCSS低频暗号，对上才放行\"。"},{"id":"MC1-0581","category":"3.1.1","categoryName":"电波传播方式","type":"MC1","selectCount":1,"question":"某些对讲机具有发送DTMF 码的功能。缩写DTMF 指的是：","options":{"A":"双音多频编码，由8 个音调频率中的两个频率组合成的控制信号，代表16 种状态之一， 用于遥控和传输数字等简单字符","B":"亚音调静噪，即从67-250.3Hz 的38 个亚音调频率中选取一个作为选通信号，代表38 种状态之一，接收机没有收到特定的选通信号时自动关闭音频输出","C":"数字设备识别码，即在松开PTT 按键时自动发送一串代表设备代号的二进制数据","D":"自动静噪，即在接收机没有收到信号时自动关闭音频输出"},"answer":"A","explanation":"DTMF=双音多频，8个音调取两个组合成16种信号，用于遥控和传输数字等字符。A是CTCSS、C是数字识别码、D是自动静噪。记忆：\"DTMF就是电话拨号嘟嘟，8选2=16\"。"},{"id":"MC2-0582","category":"3.1.1","categoryName":"电波传播方式","type":"MC2","selectCount":2,"question":"亚音和数字亚音静噪技术都是在调频发射机所发射的语音信号上附加一个人耳不易察觉 的低频信号并用来选通接收机的静噪。它们所对应的收发信机设置菜单项有：","options":{"A":"CTCSS","B":"DCS","C":"DTMF","D":"SQL"},"answer":"AB","explanation":"CTCSS是模拟亚音、DCS是数字亚音，都附加低频选通信号控制静噪。DTMF是双音多频遥控信号、SQL是普通静噪，均非亚音。记忆：\"CTCSS模拟、DCS数字，亚音两兄弟\"。"},{"id":"MC1-0583","category":"3.1.1","categoryName":"电波传播方式","type":"MC1","selectCount":1,"question":"有些调频接收机的参数设置菜单有NFM 和WFM 两种选择。它们的含义是：","options":{"A":"NFM 为窄带调频方式，适用于信道带宽25kHz/12.5kHz 的通信信号；WFM 为宽带调频 方式，适用于接收信道带宽180kHz 左右的广播信号","B":"NFM 代表数字化语音方式，WFM 代表模拟语音方式","C":"NFM 为调频通信本地方式（较低灵敏度），WFM 为调频通信远程方式（最高灵敏度）","D":"NFM 为单频率守候方式，WFM 为双频率守候方式"},"answer":"A","explanation":"NFM=窄带调频，用于25kHz/12.5kHz信道的通信；WFM=宽带调频，用于180kHz左右的广播信号。B/C/D把窄宽说成数字/模拟、本地/远程均错。记忆：\"NFM窄窄通信、WFM宽宽广播\"。"},{"id":"MC1-0584","category":"3.1.1","categoryName":"电波传播方式","type":"MC1","selectCount":1,"question":"在一些VHF/UHF 业余无线电调频手持对讲机或车载电台的设置菜单中有“全频偏”和“半 频偏”的选项。其意义是：","options":{"A":"代表与25kHz 或者12.5kHz 标称发射带宽相对应的5kHz 或2.5kHz 调制频偏","B":"同一频段内，全频偏方式下发射机的频率漂移显然是比半频偏的大一倍","C":"全频偏方式适用于收发异频的中继台通信；半频偏方式适用于同频直接联络","D":"全频偏方式压缩5kHz 范围内的话音；半频偏方式只压缩低于2.5kHz 的声音"},"answer":"A","explanation":"全/半频偏指最大频偏：25kHz标称带宽配5kHz频偏，12.5kHz配2.5kHz，对应\"全\"与\"半\"。不是频率漂移、不是中继/直联区别，也非压缩话音。记忆：\"25k配5k、12.5k配2.5k\"。"},{"id":"MC3-0585","category":"3.1.1","categoryName":"电波传播方式","type":"MC3","selectCount":3,"question":"如果对方报告你的调频电台发射的信号听起来失真严重，可辨度差，原因可能包括：","options":{"A":"电台的电源电压不足，可以检查供电电压或更换电池模块再试","B":"电台所处的位置多径衰落严重，可以挪动几步或变更频率再试","C":"电台的发射频率不准。如确认这种情况，需修好设备之后再试","D":"电台天线承载射频功率的能力不足，需更换高级天线之后再试"},"answer":"ABC","explanation":"电源电压不足会使发射失真、多径衰落会致接收解调失真、发射频率不准会降低可辨度，ABC都可能。D天线承载功率能力与话音可辨度无关。记忆：\"电压、多径、频偏，逐项排查\"。"},{"id":"MC1-0586","category":"3.1.1","categoryName":"电波传播方式","type":"MC1","selectCount":1,"question":"如需快速切换至你常用的某个频率，应当如何设置你的电台？","options":{"A":"将该频率作为一个频道存储到电台中","B":"打开哑音静噪功能","C":"关闭哑音静噪功能","D":"使用快速扫描功能来切换到那个频率"},"answer":"A","explanation":"把常用频率存入电台频道，一键即可快速切换。哑音静噪与换频无关，快速扫描是搜寻信号而非直达某频。记忆：\"常用频率存起来，一键直达\"。"},{"id":"MC1-0587","category":"3.1.1","categoryName":"电波传播方式","type":"MC1","selectCount":1,"question":"车载电台的直流电源负极应当接在哪里？","options":{"A":"接到电池的负极或发动机的接地带上","B":"接在天线座上","C":"可以连在汽车的任意金属部件上","D":"连在固定住电台的挂置架上"},"answer":"A","explanation":"车载电台电源负极应接电池负极或发动机接地带，形成可靠低阻回路。乱接天线座、随意金属部件或挂架可能引入噪声或接触不良。记忆：\"负极找电池负极或发动机地，别乱搭铁\"。"},{"id":"MC1-0588","category":"3.1.1","categoryName":"电波传播方式","type":"MC1","selectCount":1,"question":"有时，装在汽车上的移动电台可能放出随引擎转速而变的尖利啸声，其来源于：","options":{"A":"发电机","B":"火花塞","C":"电动油泵","D":"ABS 控制器"},"answer":"A","explanation":"随引擎转速变化的尖利啸声来自发电机（交流纹波干扰，转速越高频率越高）。火花塞是\"嗒嗒\"脉冲声而非连续变调啸叫。记忆：\"发电机呜呜随转速，火花塞嗒嗒是脉冲\"。"},{"id":"MC1-0589","category":"3.1.1","categoryName":"电波传播方式","type":"MC1","selectCount":1,"question":"如果别的业余电台报告说你的手持电台发射的FM 信号的频偏过大，你应当怎么做？","options":{"A":"尝试切换至NFM 档位进行通联。如已使用NFM，则试着讲话时离话筒远一点儿","B":"更换一块新电池再试","C":"调至发射功率更大的档位","D":"使用更大的声音对着话筒讲话以触发系统中隐藏的但是非常好用的语音限幅功能"},"answer":"A","explanation":"频偏过大是音频电平过高或模式带宽不匹配所致。切NFM窄带可压低频偏，或离话筒远些减小音频电平。换电池、加功率、更大声喊反而更糟。记忆：\"频偏大就窄带+离话筒远，别喊\"。"},{"id":"MC1-0590","category":"3.1.1","categoryName":"电波传播方式","type":"MC1","selectCount":1,"question":"如果其他电台报告说你的发射干扰了相邻频率的通信。你应当做的是：","options":{"A":"检查发射机的频率指示是否准确、发射机的杂散发射指标是否合格","B":"换用另一种调制模式试试看","C":"将这种情况通知你的设备制造商","D":"立即增加发射功率"},"answer":"A","explanation":"干扰邻频多是发射频率不准或杂散辐射超标，应先检查频率指示准确性和杂散指标。换调制模式、通知厂家、加功率都不对症。记忆：\"邻频被扰先查频率准不准、杂散多不多\"。"},{"id":"MC1-0591","category":"3.1.1","categoryName":"电波传播方式","type":"MC1","selectCount":1,"question":"如果其他电台报告说你在2 米波段的信号本来很强，但是突然就变弱甚至难以辨别了， 你应当怎么做？","options":{"A":"稍稍移动一下自己的位置。电波传播的多径效应会时而引起信号衰落或解调失真","B":"打开发射机的亚音静噪功能","C":"请对方电台检查一下静噪设置","D":"将你电台中的锂电池换成镍氢的"},"answer":"A","explanation":"VHF/UHF移动中信号突变常因多径效应：直达波与反射波相位相消造成衰落，挪动几步即可改善。亚音、对方静噪、换电池都无济于事。记忆：\"信号跳水别慌，挪两步躲开相消\"。"},{"id":"MC1-0598","category":"3.1.3","categoryName":"电离层传播","type":"MC1","selectCount":1,"question":"如果进行SSB 或CW 通联时周边环境嘈杂，哪种设备可以替代电台上的扬声器，改善话 音抄收？","options":{"A":"耳机","B":"低通滤波器","C":"视频显示器","D":"吊杆胖话筒"},"answer":"A","explanation":"嘈杂环境中抄收SSB/CW，戴上耳机紧贴耳朵、隔绝环境噪声最有效。低通滤波器、显示器、话筒都不是替代扬声器收听的设备。记忆：\"环境吵就戴耳机，给耳朵关门\"。"},{"id":"MC1-0599","category":"3.1.3","categoryName":"电离层传播","type":"MC1","selectCount":1,"question":"全功能小型收发信机的面板上常有缩写为“NB”和“SQL”的功能，它们有什么不同？","options":{"A":"NB 为“抑噪”，切除高于平均信号的大幅度突发脉冲噪声；SQL 为“静噪”，信噪比达不 到一定水平时自动关闭音频输出","B":"NB 和SQL 都是指“抑噪”，收不到有用信号时自动关断背景噪声","C":"NB 和SQL 都是指“静噪”，切除高于平均信号的大幅度突发脉冲噪声","D":"NB 和SQL 都是指“静噪”，收不到带有预期的特定控制信号时自动关断音频输出"},"answer":"A","explanation":"NB=抑噪，切除高于平均信号的大幅突发脉冲噪声；SQL=静噪，信噪比不足时自动关音频。一个是打脉冲，一个是关底噪。记忆：\"NB打雷（脉冲），SQL关门（静噪）\"。"},{"id":"MC1-0600","category":"3.1.3","categoryName":"电离层传播","type":"MC1","selectCount":1,"question":"某些车辆的火花塞辐射脉冲干扰。这可能导致收信机的AGC 过早起控，使正在接收的 SSB 或CW 信号受到压制，进而影响听抄。遇到这种情况，你应当如何设置你的电台？","options":{"A":"打开电台的抑噪（NB）功能","B":"降低静噪（SQL）阀值","C":"将频率稍稍调偏一点儿","D":"反复调节电台的RIT 旋钮"},"answer":"A","explanation":"火花塞脉冲干扰会误触发AGC、压制SSB/CW信号，应打开NB抑噪切除脉冲。降静噪阈值、调偏频率、调RIT都切不掉脉冲。记忆：\"点火脉冲来干扰，NB出马消噪\"。"},{"id":"MC1-0601","category":"3.1.3","categoryName":"电离层传播","type":"MC1","selectCount":1,"question":"全功能小型收发信机面板上的“MODE”代表什么功能：","options":{"A":"用来切换工作方式，比如FM、LSB、USB 和CW 等","B":"用来切换静噪方式，比如CTCSS 和DCS 等","C":"用来切换接收机的工作方式，比如射频直采和低中频超外差等","D":"用来切换监听方式，比如单耳音频、双耳音频和CW 立体声等"},"answer":"A","explanation":"MODE=工作方式，用于切换FM、LSB、USB、CW等模式。B静噪方式、C接收机架构、D监听方式都不是MODE的本义。记忆：\"MODE就是模式，FM/LSB/USB/CW随便切\"。"},{"id":"MC1-0602","category":"3.1.3","categoryName":"电离层传播","type":"MC1","selectCount":1,"question":"收发信机面板上的符号ATT 代表什么功能？","options":{"A":"收信机输入衰减器，在接收大信号时接入，使信号不致过大而使前级电路过载","B":"自动天线调谐，对天线电路的电压驻波比进行检测并进行自动补偿，以维持最小驻波比","C":"发信自动电平控制，对射频输出电平进行检测并反馈控制，以维持其在适当限度之内","D":"发信自动音量控制，对音频输入电平进行检测并反馈控制，以维持其在适当限度之内"},"answer":"A","explanation":"ATT=输入衰减器，接收大信号时接入，防止前级电路过载。B自动天调、C发信自动电平控制、D发信音量控制均不是。记忆：\"ATT=衰减，大信号进门先减负\"。"},{"id":"MC1-0603","category":"3.1.3","categoryName":"电离层传播","type":"MC1","selectCount":1,"question":"收发信机面板上的符号AGC 代表什么功能？","options":{"A":"收信机自动增益控制，对中频级信号电平进行检测并反馈控制，防止电路过载","B":"收信自动音量控制，对音频输出电平进行检测并反馈控制，以维持其在适当限度之内","C":"自动天线调谐，对天线电路的电压驻波比进行检测并进行自动补偿，以维持最小驻波比","D":"发信自动电平控制，对射频输出电平进行检测并反馈控制，以维持其在适当限度之内"},"answer":"A","explanation":"AGC=自动增益控制，检测中频信号电平并反馈调节增益，防止电路过载失真。B音量控制、C天调、D发信电平控制都不是。记忆：\"AGC=收信自动调音量，防过载\"。"},{"id":"MC1-0604","category":"3.1.3","categoryName":"电离层传播","type":"MC1","selectCount":1,"question":"既然全功能收信机具有AGC 功能，那为什么好多机型还要装设衰减（ATT）开关？","options":{"A":"特强带外信号可以阻塞接收机的前级电路，致使器件非线性工作，产生失真和互调。此 时需在接收机的前端电路之前加入衰减器，并用开关控制其切入与否","B":"通常，增益控制旋钮的控制范围不够宽，加入ATT 开关可以拓展增益控制范围","C":"如果遭遇特强带内干扰，那么打开ATT 就可防止过大的音量损坏扬声器或耳机了","D":"这可以防止本台发射机的强信号损坏本台的接收机电路"},"answer":"A","explanation":"AGC只能管带内强弱，而特强带外信号会阻塞前级、产生非线性失真和互调，须在接收最前端加ATT衰减器并用开关控制。记忆：\"AGC管带内，ATT挡带外，两道防线\"。"},{"id":"MC2-0605","category":"3.1.3","categoryName":"电离层传播","type":"MC2","selectCount":2,"question":"关于接收机的“过载”现象，以下描述正确的是：","options":{"A":"输入信号过于强大以至机内电路饱和阻塞，严重时会损坏接收机前端电路的元器件","B":"启用接收机的ATT 功能可消除或缓解过载","C":"接收机消耗的电流过大，致使电源出现过载现象。情况严重时供电装置会烧毁","D":"减小接收机的喇叭音量，可缓解过载现象"},"answer":"AB","explanation":"接收机过载指输入信号过强致电路饱和阻塞，严重可损坏前端元件；启用ATT可消除或缓解，AB对。C是电源过载、D是音量问题，与接收机过载无关。记忆：\"过载=信号太猛，ATT来救场\"。"},{"id":"MC1-0606","category":"3.1.3","categoryName":"电离层传播","type":"MC1","selectCount":1,"question":"应关闭接收机AGC 功能的情况是：","options":{"A":"有用微弱信号和强干扰同时出现时","B":"接收微弱信号时","C":"接收特强信号时","D":"有用强信号中夹杂着微弱干扰"},"answer":"A","explanation":"当有用微弱信号与强干扰同现时，AGC会跟随强信号压低增益，把弱信号也压没了，此时应关闭AGC手动控制。其余情况AGC都该保持工作。记忆：\"强弱并存弱受欺，关AGC手动调\"。"},{"id":"MC1-0607","category":"3.1.3","categoryName":"电离层传播","type":"MC1","selectCount":1,"question":"应选择较短的AGC 时间常数的情况是：","options":{"A":"接收FM/FSK/PSK 等包络幅度恒定的信号","B":"接收SSB 和AM 等正常信号的包络幅度不断变化的信号","C":"将接收机应用于“比幅度法规”测向时","D":"有用微弱信号和强干扰同时出现时"},"answer":"A","explanation":"FM/FSK/PSK包络恒定，用短AGC时间常数可快速响应突变。SSB/AM包络随话音变化，短常数会导致增益起伏\"抽风\"。记忆：\"包络恒定用短档，反应快\"。"},{"id":"MC1-0608","category":"3.1.3","categoryName":"电离层传播","type":"MC1","selectCount":1,"question":"应选择较长的AGC 时间常数的情况是：","options":{"A":"接收SSB 和AM 等正常信号的包络幅度不断变化的信号","B":"接收FM/FSK/PSK 等包络幅度恒定的信号遇到变化很快的传播衰落时","C":"将接收机应用于“比幅度法规”测向时","D":"有用微弱信号和强干扰同时出现时"},"answer":"A","explanation":"SSB/AM包络随话音起伏，需长AGC时间常数让增益平稳，避免随音节\"抽风\"。FM等恒定包络信号才适合短档。记忆：\"话音起伏用长档，稳字当头\"。"},{"id":"MC1-0609","category":"3.1.3","categoryName":"电离层传播","type":"MC1","selectCount":1,"question":"多数小型全功能收发信机的面板上都可以看到符号PRE，其代表什么功能？","options":{"A":"收信机前置放大器，在接收微弱信号时接入（此时某些技术指标可能低于额定值）","B":"自动天线调谐，对天线电路的电压驻波比进行检测并进行自动补偿，以维持最小驻波比","C":"发信自动电平控制，对射频输出电平进行检测并反馈控制，以维持其在适当限度之内","D":"发信语音压缩，对音频输入电平进行检测并反馈控制，以提升语音包络幅度较小的部分"},"answer":"A","explanation":"PRE=前置放大器，接收微弱信号时接入以提升灵敏度，但噪声等技术指标可能变差。B天调、C发信电平控制、D语音压缩都不是。记忆：\"PRE=前放，弱信号请它助阵\"。"},{"id":"MC1-0610","category":"3.1.3","categoryName":"电离层传播","type":"MC1","selectCount":1,"question":"收发信机面板上的符号ALC 代表什么功能？","options":{"A":"发信自动电平控制，对射频输出电平进行检测并反馈控制，以维持其在适当限度之内","B":"发信自动音量控制，对音频输入电平进行检测并反馈控制，以维持其在适当限度之内","C":"自动天线调谐，对天线电路的电压驻波比进行检测并进行自动补偿，以维持最小驻波比","D":"自动频率控制，对发射频率的漂移进行检测并反馈控制，以维持准确的工作频率"},"answer":"A","explanation":"ALC全称“发信自动电平控制”，检测射频输出电平并反馈，把发射功率维持在适当限度。它管的是“功率”而非音量、天线或频率。B是音量、C是自动天调、D是自动频率都不对。记：ALC管“电平”，AT管“天调”，AF管“频率”。"},{"id":"MC1-0611","category":"3.1.3","categoryName":"电离层传播","type":"MC1","selectCount":1,"question":"在单边带发信机中，发信自动电平控制（ALC）的主要作用是：","options":{"A":"防止过驱动导致调制失真或引发电路故障","B":"改善发信机的频率稳定度","C":"自动实现天线电路的阻抗匹配","D":"防止话筒过于灵敏带来背景噪声"},"answer":"A","explanation":"单边带话务时ALC像“限幅保险”：输入信号过大时自动压低增益，防止过驱动把波形削顶，产生调制失真甚至损坏末级。它不改善频率稳定度（B）、不做阻抗匹配（C）、也不管话筒噪声（D）。记：ALC防“过”，说话太响自动收一点。"},{"id":"MC1-0612","category":"3.1.3","categoryName":"电离层传播","type":"MC1","selectCount":1,"question":"业余电台进行单边带话音通信时，如果对方反映虽然己方的讲话基本可辨，但是在话音 的间隙中夹杂嘈杂的背景噪声。这时应当：","options":{"A":"调低发射机的话筒增益。如果发射机带有语音压缩处理功能，则应尝试调低控制深度","B":"调低发射机的射频输出功率","C":"调整发射机的天线匹配电路","D":"调整发射机的ALC 控制深度"},"answer":"A","explanation":"话音间隙里的嘈杂底噪，多是
