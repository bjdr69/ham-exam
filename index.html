<script>
// --- State ---
let questions = [];
let categories = [];
let state = { answered: {}, wrong: {}, score: 0, seqIndex: 0, catProgress: {} };
let exam = { questions: [], index: 0, score: 0, results: [], mode: '', category: '', selected: new Set() };

// --- Storage ---
const STORAGE_KEY = 'ham_exam_state';
function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (s) state = { answered: {}, wrong: {}, score: 0, seqIndex: 0, catProgress: {}, ...s };
  } catch(e) {}
}
function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

// --- Weighted Pick ---
// 抽题加权：优先出「从未练习过」的新题；练过的按距上次练习的时间恢复权重（隔越久权重越高）；
// 错题额外加成。抽样用「随机数^(1/权重)」键排序，等价于加权不放回抽样，O(n log n)。
const PICK = {
  NEW: 5,          // 新题（从未做过）权重
  RECENT_DAYS: 7,  // 时间衰减基数：做过的题每过 7 天权重 +1
  RECENT_MAX: 4,   // 时间衰减上限：练过的题权重最高恢复到 1+4=5
  WRONG_BONUS: 2   // 错题额外倍数
};
function pickWeight(pool, count, weightFn) {
  if (count >= pool.length) return pool.slice();
  return pool
    .map(q => ({ q, key: Math.pow(Math.random(), 1 / weightFn(q)) }))
    .sort((a, b) => b.key - a.key)
    .slice(0, count)
    .map(x => x.q);
}
function weightForPick(q) {
  const a = state.answered[q.id];
  if (!a) return PICK.NEW; // 新题：最高权重
  const ageDays = (Date.now() - (a.time || 0)) / 864e5;
  const recency = 1 + Math.min(ageDays / PICK.RECENT_DAYS, PICK.RECENT_MAX);
  return recency * (state.wrong[q.id] ? PICK.WRONG_BONUS : 1);
}

// --- Init ---
// 内嵌数据兜底：单文件版（index.standalone.html）会把题库直接写进页面，
// 保证无网络 / Service Worker 失效时应用仍能启动。
const EMBEDDED = (typeof window.__HAM_EMBEDDED__ !== 'undefined' && window.__HAM_EMBEDDED__)
  ? window.__HAM_EMBEDDED__ : null;

// 首次启动：尝试从网络拉最新题库，4 秒内无响应则放弃，
// 回退到内嵌数据，保证界面绝不卡在加载。
const BOOT_TIMEOUT = 4000;
function bootData() {
  return new Promise((resolve, reject) => {
    const timer = setTimeout(() => reject(new Error('网络超时')), BOOT_TIMEOUT);
    fetch('data/questions.json')
      .then(r => r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)))
      .then(data => {
        if (!Array.isArray(data) || data.length === 0) throw new Error('题库为空');
        clearTimeout(timer);
        resolve(true);
      })
      .catch(err => { clearTimeout(timer); reject(err); });
  });
}
async function init() {
  // 内嵌数据已在页面里，网络只是"尝鲜"，永远不阻塞使用
  if (EMBEDDED) {
    questions = EMBEDDED.questions || [];
    categories = EMBEDDED.categories || [];
    try { await bootData(); } catch (e) { /* 网络不可用，已用内嵌数据 */ }
    return;
  }
  // 无内嵌数据（在线版）：必须靠网络，但也加超时，失败显示提示而非永久卡住
  try {
    const [qRes, cRes] = await Promise.race([
      Promise.all([fetch('data/questions.json'), fetch('data/categories.json')]),
      new Promise((_, reject) => setTimeout(() => reject(new Error('网络超时')), BOOT_TIMEOUT))
    ]);
    if (qRes.ok && cRes.ok) {
      const q = await qRes.json();
      const c = await cRes.json();
      if (Array.isArray(q) && q.length > 0) { questions = q; categories = c; return; }
    }
    throw new Error('题库拉取失败');
  } catch (e) {
    console.warn('[HAM] 题库加载失败:', e && e.message);
  }
}
function finishBoot() {
  if (questions.length === 0) {
    document.getElementById('totalCount').textContent = '加载失败';
    document.getElementById('statScore').textContent = '!';
    return;
  }
  loadState();
  updateHomeStats();
  initTheme();
}


// --- Theme ---
// 三态：无 data-theme = 跟随系统；'light'/'dark' = 用户显式选择（持久化，可被系统媒体查询兜底）
function currentDark() {
  const t = document.documentElement.dataset.theme;
  return t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
}
function applyTheme(mode) {
  const root = document.documentElement;
  if (mode) root.dataset.theme = mode; else delete root.dataset.theme;
  root.style.setProperty('color-scheme', mode || 'light dark');
  const toggle = document.getElementById('themeToggle');
  if (toggle) toggle.textContent = currentDark() ? '🌙' : '☀️';
}
function initTheme() { applyTheme(localStorage.getItem('ham_theme') || null); }
document.getElementById('themeToggle').onclick = function() {
  const next = currentDark() ? 'light' : 'dark';
  localStorage.setItem('ham_theme', next);
  applyTheme(next);
};

// --- Navigation ---
function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function goHome() { updateHomeStats(); showPage('pageHome'); }

// --- Home Stats ---
function updateHomeStats() {
  const answered = Object.keys(state.answered).length;
  const wrong = Object.keys(state.wrong).length;
  document.getElementById('totalCount').textContent = questions.length;
  document.getElementById('statAnswered').textContent = answered;
  document.getElementById('statCorrect').textContent = answered - wrong;
  document.getElementById('statWrong').textContent = wrong;
  document.getElementById('statScore').textContent = state.score;
  document.getElementById('wrongCount').textContent = wrong;
}

// --- Exam: Sequential ---
function startSequential() {
  const start = state.seqIndex;
  const end = Math.min(start + 25, questions.length);
  if (start >= questions.length) { alert('已做完所有题目！'); return; }
  exam = { questions: questions.slice(start, end), index: 0, score: 0, results: [], mode: 'sequential', category: '' };
  showExam();
}

// --- Exam: Random ---
function startRandom(cat) {
  let pool = cat ? questions.filter(q => q.category === cat) : [...questions];
  if (pool.length === 0) return;

  // Weighted: new questions first, wrong/recent get recency + wrong bonus
  const picked = pickWeight(pool, Math.min(25, pool.length), weightForPick);

  exam = { questions: picked, index: 0, score: 0, results: [], mode: cat ? 'category' : 'random', category: cat || '' };
  showExam();
}

// --- Exam: Wrong Practice ---
function startWrongPractice() {
  const wrongIds = Object.keys(state.wrong);
  if (wrongIds.length === 0) return;
  const pool = questions.filter(q => wrongIds.includes(q.id));
  const picked = pickWeight(pool, Math.min(25, pool.length), weightForPick);
  exam = { questions: picked, index: 0, score: 0, results: [], mode: 'wrong', category: '' };
  showExam();
}

// --- Exam: Multi-select Practice (MC2/MC3/MC4) ---
function startMulti() {
  const multi = questions.filter(q => q.selectCount > 1);
  if (multi.length === 0) return;
  const picked = pickWeight(multi, Math.min(25, multi.length), weightForPick);
  exam = { questions: picked, index: 0, score: 0, results: [], mode: 'multi', category: '' };
  showExam();
}

// --- Show Exam ---
function showExam() {
  showPage('pageExam');
  renderQuestion();
}

function renderQuestion() {
  const q = exam.questions[exam.index];
  if (!q) { showResult(); return; }

  const total = exam.questions.length;
  const idx = exam.index + 1;
  document.getElementById('examProgress').textContent = `${idx}/${total}`;
  document.getElementById('examScore').textContent = `${exam.score}分`;
  document.getElementById('examFill').style.width = `${(idx / total) * 100}%`;
  document.getElementById('questionText').innerHTML = q.question;
  document.getElementById('questionMeta').innerHTML =
    `${q.categoryName}` + (q.selectCount > 1 ? `<span class="multi-hint">多选</span>` : '');

  const container = document.getElementById('optionsContainer');
  container.innerHTML = '';
  container.dataset.submitted = '';
  const exp = document.getElementById('examExplanation');
  if (exp) { exp.style.display = 'none'; exp.innerHTML = ''; }
  const letters = ['A', 'B', 'C', 'D'];
  exam.selected = new Set();

  letters.forEach(letter => {
    const opt = document.createElement('div');
    opt.className = 'option';
    opt.dataset.letter = letter;
    opt.innerHTML = `<div class="letter">${letter}</div><div class="text">${q.options[letter]}</div>`;
    opt.onclick = () => handleOptionClick(opt, letter, q);
    container.appendChild(opt);
  });

  // Multi-select: show submit button
  const actions = document.getElementById('examActions');
  if (q.selectCount > 1) {
    const btn = document.createElement('button');
    btn.className = 'btn btn-primary';
    btn.id = 'submitBtn';
    btn.disabled = true;
    btn.textContent = '确认提交';
    btn.onclick = () => doSubmitMulti(exam.selected, q);
    actions.innerHTML = '';
    actions.appendChild(btn);
  } else {
    actions.innerHTML = '';
  }
}

function handleOptionClick(opt, letter, q) {
  // If already submitted, ignore
  if (opt.closest('.options').dataset.submitted) return;

  if (q.selectCount === 1) {
    // Single select: immediate submit
    submitSingle(letter, q);
    return;
  }

  // Multi-select: toggle
  if (exam.selected.has(letter)) {
    exam.selected.delete(letter);
    opt.classList.remove('selected');
  } else {
    exam.selected.add(letter);
    opt.classList.add('selected');
  }

  const btn = document.getElementById('submitBtn');
  if (btn) btn.disabled = exam.selected.size === 0;
}

function showExplanation(q) {
  const exp = document.getElementById('examExplanation');
  if (!exp) return;
  if (q && q.explanation) {
    exp.innerHTML = `<span class="exp-label">答案解释</span>${q.explanation}`;
    exp.style.display = 'block';
  } else {
    exp.style.display = 'none';
  }
}

function submitSingle(letter, q) {
  const correct = letter === q.answer;
  const container = document.getElementById('optionsContainer');
  container.dataset.submitted = '1';

  container.querySelectorAll('.option').forEach(opt => {
    const l = opt.dataset.letter;
    opt.onclick = null;
    if (l === q.answer) opt.classList.add(correct ? 'correct' : 'show-correct');
    if (l === letter && !correct) opt.classList.add('wrong');
  });

  recordAnswer(q, correct);
  showExplanation(q);
  showNextButton();
}

function doSubmitMulti(selected, q) {
  const userAnswer = [...selected].sort().join('');
  const correct = userAnswer === q.answer;
  const container = document.getElementById('optionsContainer');
  container.dataset.submitted = '1';

  container.querySelectorAll('.option').forEach(opt => {
    const l = opt.dataset.letter;
    opt.onclick = null;
    if (q.answer.includes(l)) opt.classList.add(correct ? 'correct' : 'show-correct');
    if (selected.has(l) && !q.answer.includes(l)) opt.classList.add('wrong');
  });

  recordAnswer(q, correct);
  showExplanation(q);
  showNextButton();
}

// --- Record Answer ---
function recordAnswer(q, correct) {
  exam.results.push({ id: q.id, correct });

  if (correct) {
    exam.score++;
    state.score++;
    // Remove from wrong book if present
    delete state.wrong[q.id];
  } else {
    // Add to wrong book
    state.wrong[q.id] = { category: q.category, time: Date.now() };
  }
  state.answered[q.id] = { correct, time: Date.now() };
  saveState();
}

function showNextButton() {
  const actions = document.getElementById('examActions');
  const isLast = exam.index >= exam.questions.length - 1;
  actions.innerHTML = `<button class="btn btn-primary" onclick="nextQuestion()">${isLast ? '查看结果' : '下一题 ›'}</button>`;
}

function nextQuestion() {
  exam.index++;
  renderQuestion();
}

// --- Result ---
function showResult() {
  // Update seq index
  if (exam.mode === 'sequential') {
    state.seqIndex = Math.min(state.seqIndex + exam.questions.length, questions.length);
    saveState();
  }

  const total = exam.results.length;
  const correct = exam.results.filter(r => r.correct).length;
  const rate = total > 0 ? Math.round((correct / total) * 100) : 0;
  const pass = rate >= 70;

  document.getElementById('resultScore').textContent = `${correct}/${total}`;
  document.getElementById('resultScore').className = `result-score ${pass ? 'pass' : 'fail'}`;
  document.getElementById('resultDetail').textContent = `正确率 ${rate}% · ${pass ? '通过！' : '继续加油'}`;

  const list = document.getElementById('resultList');
  list.innerHTML = '';
  exam.results.forEach((r, i) => {
    const q = exam.questions[i];
    const item = document.createElement('div');
    item.className = 'result-item';
    item.innerHTML = `<span class="icon ${r.correct ? 'ok' : 'fail'}">${r.correct ? '✓' : '✗'}</span>
      <span style="flex:1">${q.question.slice(0, 40)}${q.question.length > 40 ? '…' : ''}</span>
      <span style="color:var(--text2);font-size:0.75rem">${q.id}</span>`;
    item.onclick = () => showQuestionDetail(q, r.correct);
    list.appendChild(item);
  });

  // Next button text
  const nextBtn = document.getElementById('resultNextBtn');
  if (exam.mode === 'sequential') {
    nextBtn.textContent = state.seqIndex >= questions.length ? '已完成全部' : '继续下一组';
    nextBtn.disabled = state.seqIndex >= questions.length;
  } else if (exam.mode === 'wrong') {
    nextBtn.textContent = Object.keys(state.wrong).length > 0 ? '继续错题练习' : '错题已清空';
    nextBtn.disabled = Object.keys(state.wrong).length === 0;
  } else if (exam.mode === 'multi') {
    nextBtn.textContent = '再来一组多选';
  } else {
    nextBtn.textContent = '再来一组';
  }

  showPage('pageResult');
}

function nextGroup() {
  if (exam.mode === 'sequential') startSequential();
  else if (exam.mode === 'wrong') startWrongPractice();
  else if (exam.mode === 'category') startRandom(exam.category);
  else if (exam.mode === 'multi') startMulti();
  else startRandom();
}

function showQuestionDetail(q, correct) {
  const letters = ['A','B','C','D'];
  const lines = [q.question, ''];
  letters.forEach(l => {
    const marker = q.answer.includes(l) ? '✓' : ' ';
    lines.push(`${marker} ${l}. ${q.options[l]}`);
  });
  if (q.explanation) {
    lines.push('', `—— 答案解释 ——`, q.explanation);
  }
  alert(lines.join('\n'));
}

// --- Exit Exam ---
function exitExam() {
  if (mock && mock.active) {
    if (!confirm('模拟考试进行中，退出将作废本次成绩，确定退出？')) return;
    mock.active = false;
    stopMockTimer();
    goHome();
    return;
  }
  if (exam.results.length > 0 && exam.index < exam.questions.length) {
    if (!confirm('答题未完成，确定退出？')) return;
  }
  goHome();
}

// --- Mock Exam (模拟考试) ---
// 组卷：32 单选 + 8 多选，按分类轮转抽题保证各分类都有机会被选中；
// 单向推进不可回翻：单选点击即锁定并自动跳下一题，多选须「确认本题」；
// 左下角 20 分钟倒计时（墙钟，防后台节流），到点自动交卷，未答按错题计；
// 多选答案集合须与官方答案完全一致才得分（错一个判 0）；
// 全程不触碰练习进度/错题本/积分（recordAnswer 旁路），错题仅在成绩单上由用户逐题或一键选择加入。
const MOCK = {
  SINGLE: 32, MULTI: 8, PASS: 30,
  DURATION_MS: 20 * 60 * 1000,
  ADVANCE_MS: 350
};
let mock = null;            // { questions, answers[], index, endTime, timerId, active, timedOut, outcome }
let mockSelected = new Set();

function shuffleArr(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// 分类轮转抽样：每个分类各出 1 题，不足再开第二轮，直到抽满 count
function pickSpread(pool, count) {
  const queues = {};
  pool.forEach(q => { (queues[q.category] = queues[q.category] || []).push(q); });
  Object.keys(queues).forEach(c => { queues[c] = shuffleArr(queues[c]); });
  const cats = Object.keys(queues).sort();
  const out = [];
  let progressed = true;
  while (out.length < count && progressed) {
    progressed = false;
    cats.forEach(c => {
      if (out.length < count && queues[c].length) { out.push(queues[c].shift()); progressed = true; }
    });
  }
  return out.slice(0, count);
}

function startMockExam() {
  if (mock && mock.active) { mock.active = false; stopMockTimer(); }
  const singles = questions.filter(q => (q.selectCount || 1) === 1);
  const multis = questions.filter(q => (q.selectCount || 1) > 1);
  if (singles.length < MOCK.SINGLE || multis.length < MOCK.MULTI) {
    alert('题库题目不足，无法组成模拟卷');
    return;
  }
  const qs = shuffleArr(pickSpread(singles, MOCK.SINGLE).concat(pickSpread(multis, MOCK.MULTI)));
  mock = {
    questions: qs,
    answers: new Array(qs.length).fill(null),
    index: 0,
    endTime: Date.now() + MOCK.DURATION_MS,
    timerId: null,
    active: true,
    timedOut: false,
    outcome: null
  };
  document.body.classList.add('mock-on');
  tickMockTimer();
  mock.timerId = setInterval(tickMockTimer, 500);
  renderMockQuestion();
  showPage('pageExam');
}

function tickMockTimer() {
  if (!mock || !mock.active) return;
  const el = document.getElementById('mockTimer');
  const remain = mock.endTime - Date.now();
  if (remain <= 0) {
    el.textContent = '⏱ 00:00';
    mock.timedOut = true;
    finishMockExam();
    return;
  }
  const s = Math.ceil(remain / 1000);
  el.textContent = '⏱ ' + String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
  el.classList.toggle('danger', s <= 60);
  el.style.display = 'flex';
}

function stopMockTimer() {
  if (mock && mock.timerId) { clearInterval(mock.timerId); mock.timerId = null; }
  const el = document.getElementById('mockTimer');
  el.style.display = 'none';
  el.classList.remove('danger');
  document.body.classList.remove('mock-on');
}

function renderMockQuestion() {
  const q = mock.questions[mock.index];
  const total = mock.questions.length;
  document.getElementById('examProgress').textContent = `${mock.index + 1} / ${total}`;
  document.getElementById('examScore').textContent = '模拟考试';
  document.getElementById('examFill').style.width = `${((mock.index + 1) / total) * 100}%`;
  document.getElementById('questionText').innerHTML = q.question;
  document.getElementById('questionMeta').innerHTML =
    `${q.categoryName}` + (q.selectCount > 1 ? `<span class="multi-hint">多选</span>` : '');
  const exp = document.getElementById('examExplanation');
  if (exp) { exp.style.display = 'none'; exp.innerHTML = ''; }

  const container = document.getElementById('optionsContainer');
  container.innerHTML = '';
  container.dataset.submitted = '';
  mockSelected = new Set();
  ['A', 'B', 'C', 'D'].forEach(letter => {
    const opt = document.createElement('div');
    opt.className = 'option';
    opt.dataset.letter = letter;
    opt.innerHTML = `<div class="letter">${letter}</div><div class="text">${q.options[letter]}</div>`;
    opt.onclick = () => mockOptionClick(opt, letter, q);
    container.appendChild(opt);
  });

  const actions = document.getElementById('examActions');
  actions.innerHTML = '';
  if (q.selectCount > 1) {
    const btn = document.createElement('button');
    btn.className = 'btn btn-primary';
    btn.disabled = true;
    btn.textContent = '确认本题';
    btn.onclick = () => confirmMockMulti(q);
    actions.appendChild(btn);
  }
}

function lockMockOptions() {
  const container = document.getElementById('optionsContainer');
  container.dataset.submitted = '1';
  container.querySelectorAll('.option').forEach(o => { o.onclick = null; });
}

function mockAdvance() {
  if (!mock || !mock.active) return;
  if (mock.index >= mock.questions.length - 1) { finishMockExam(); return; }
  mock.index++;
  renderMockQuestion();
}

function mockOptionClick(opt, letter, q) {
  if (!mock || !mock.active) return;
  if (opt.closest('.options').dataset.submitted) return;

  if (q.selectCount === 1) {
    // 单选：点选即锁定，自动跳下一题（不可回翻）
    opt.classList.add('selected');
    lockMockOptions();
    mock.answers[mock.index] = letter;
    setTimeout(mockAdvance, MOCK.ADVANCE_MS);
    return;
  }
  // 多选：勾选/取消，须「确认本题」才锁定
  if (mockSelected.has(letter)) {
    mockSelected.delete(letter);
    opt.classList.remove('selected');
  } else {
    mockSelected.add(letter);
    opt.classList.add('selected');
  }
  const btn = document.getElementById('examActions').querySelector('.btn');
  if (btn) btn.disabled = mockSelected.size === 0;
}

function confirmMockMulti(q) {
  if (!mock || !mock.active) return;
  const container = document.getElementById('optionsContainer');
  if (container.dataset.submitted || mockSelected.size === 0) return;
  lockMockOptions();
  const btn = document.getElementById('examActions').querySelector('.btn');
  if (btn) btn.disabled = true;
  mock.answers[mock.index] = [...mockSelected].sort().join('');
  setTimeout(mockAdvance, MOCK.ADVANCE_MS);
}

function finishMockExam() {
  if (!mock || !mock.active) return;
  mock.active = false;
  stopMockTimer();
  const results = mock.questions.map((q, i) => {
    const ans = mock.answers[i] || '';
    // 多选为集合精确匹配：userAnswer 已排序拼接，与 q.answer（升序字母）全等才得分
    return { q, no: i + 1, ans, correct: ans === q.answer };
  });
  const okCount = results.filter(r => r.correct).length;
  const wrongList = results.filter(r => !r.correct);
  const timedOut = mock.timedOut;
  mock.outcome = { results, okCount, wrongList, timedOut };
  renderMockResult();
  showPage('pageMockResult');

  const pass = okCount >= MOCK.PASS;
  document.getElementById('mockModalTitle').textContent = timedOut ? '⏰ 时间到，已自动交卷' : '📝 考试结束';
  document.getElementById('mockModalSummary').innerHTML =
    `答对 <b style="color:${pass ? 'var(--correct)' : 'var(--wrong)'}">${okCount}</b> / ${results.length} 题<br>` +
    `<b>${pass ? '✅ 合格（合格线 ' + MOCK.PASS + ' 题）' : '❌ 不合格（合格线 ' + MOCK.PASS + ' 题）'}</b>`;
  document.getElementById('mockResultModal').classList.add('active');
}

function closeMockModal() {
  document.getElementById('mockResultModal').classList.remove('active');
}

function renderMockResult() {
  const { results, okCount, wrongList, timedOut } = mock.outcome;
  const pass = okCount >= MOCK.PASS;
  const scoreEl = document.getElementById('mockResultScore');
  scoreEl.textContent = `${okCount}/${results.length}`;
  scoreEl.className = `result-score ${pass ? 'pass' : 'fail'}`;
  const badge = document.getElementById('mockResultBadge');
  badge.textContent = pass ? '合格' : '不合格';
  badge.style.color = pass ? 'var(--correct)' : 'var(--wrong)';
  const answeredCount = results.filter(r => r.ans !== '').length;
  document.getElementById('mockResultDetail').textContent =
    `合格线 ${MOCK.PASS} 题 · ${timedOut ? '超时自动交卷（已答 ' + answeredCount + ' 题）' : '全部作答完成'}`;

  // 错题本加入入口（用户可选，考中绝不自动记录）
  const acts = document.getElementById('mockWrongActions');
  acts.innerHTML = '';
  if (wrongList.length > 0) {
    const addedAll = wrongList.every(r => !!state.wrong[r.q.id]);
    const allBtn = document.createElement('button');
    allBtn.className = `btn ${addedAll ? 'btn-accent' : 'btn-outline'}`;
    allBtn.textContent = addedAll ? '✓ 错题已全部加入错题本' : '全部错题加入错题本';
    allBtn.onclick = () => {
      wrongList.forEach(r => { state.wrong[r.q.id] = { category: r.q.category, time: Date.now() }; });
      saveState();
      renderMockResult();
    };
    acts.appendChild(allBtn);
  }

  const list = document.getElementById('mockWrongList');
  list.innerHTML = '';
  const head = document.createElement('div');
  head.style.cssText = 'font-size:0.8rem;color:var(--text2);margin:10px 0 4px';
  head.textContent = wrongList.length
    ? `错题编号（${wrongList.length} 题）· 点击查看详情，右侧按钮选择是否加入错题本`
    : '全部答对，没有错题 🎉';
  list.appendChild(head);

  wrongList.forEach(r => {
    const inBook = !!state.wrong[r.q.id];
    const item = document.createElement('div');
    item.className = 'result-item';
    item.innerHTML = `<span class="icon fail">✗</span>
      <span class="mock-wrong-main">第${r.no}题 · ${r.q.id}${r.q.selectCount > 1 ? '（多选）' : ''}<br>
      <span style="font-size:0.75rem;color:var(--text2)">${r.q.question.slice(0, 36)}${r.q.question.length > 36 ? '…' : ''}</span></span>`;
    item.onclick = () => showQuestionDetail(r.q, false);
    const addBtn = document.createElement('button');
    addBtn.className = `btn ${inBook ? 'btn-accent' : 'btn-outline'} mock-add-btn`;
    addBtn.textContent = inBook ? '✓ 已加入' : '加入';
    addBtn.onclick = (e) => {
      if (e && e.stopPropagation) e.stopPropagation();
      if (state.wrong[r.q.id]) delete state.wrong[r.q.id];
      else state.wrong[r.q.id] = { category: r.q.category, time: Date.now() };
      saveState();
      renderMockResult();
    };
    item.appendChild(addBtn);
    list.appendChild(item);
  });
}

// --- Boot ---
// Register Service Worker for offline / PWA
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(err => {
      console.error('SW registration failed:', err);
    });
  });
}
init().then(finishBoot);
</script>
</body>
</html>
